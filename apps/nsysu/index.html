網域都是 ccTLD）— 錯",true]],"x":[[["兩個字母的頂級網域都保留給國家及地區代碼使用，通用網域至少三個字母（.com、.info）。像 .eu（歐盟）雖然不是國家，也是 ISO 保留的代碼，IANA 一樣把它歸類為 ccTLD。",false]]]},{"h":[["D. '.com' domain is derived from the word company（.com 來自 company 這個字）— 錯",true]],"x":[[["來自 commercial（商業），原本是給商業機構用的；.org 來自 organization、.net 來自 network。",false]]]}],"videos":["https://www.youtube.com/watch?v=GYFCQJvKcgY","https://www.youtube.com/watch?v=0ikVa1k8j1Y"]},"cs:114 填1":{"answer":[["這題的正確答案是 ",false],["x + n(5J + I)",true],["（也可以寫成 x + 5nJ + nI）。",false]],"items":[[["題目",true],["：（填充）假設 X[0, 0] 代表一個 5 列（row）7 行（column）二維陣列的第 1 列第 1 行元素。如果陣列以",false],["行優先（column-major）",true],["順序從記憶體位址 x 開始存放，每個元素占 n 個記憶體單位，計算元素 X[I, J] 起始位址的位址多項式（address polynomial）是 ______。",false]],[["核心觀念",true],["：記憶體是一長條一維的格子，二維陣列要「攤平」存放。",false],["列優先（row-major）",true],["一列一列存（C 語言就是這樣）；",false],["行優先（column-major）",true],["一行一行存（Fortran、MATLAB）。算位址的方法都一樣：先算 X[I, J] 前面總共有幾個元素，乘上每個元素的大小，再加上起始位址。",false]]],"opts_title":"參考答案（行優先 vs. 列優先）","opts":[{"h":[["行優先（column-major）：x + n(5J + I)— 本題答案",true]],"x":[[["陣列有 5 列，所以",false],["每一行有 5 個元素",true],["。要到 X[I, J]：先跳過前面完整的 J 行（5J 個元素），再往下數 I 個，前面共有 5J + I 個元素，每個占 n 格。",false]],[["驗算：X[0, 0] → x；X[1, 0]（同一行的下一個）→ x + n；X[0, 1]（第二行的第一個）→ x + 5n，中間隔了第一行的 5 個元素；最後一個 X[4, 6] → x + n(30 + 4) = x + 34n，全部 35 個元素，最後一個在第 34 個位置，正確。",false]]]},{"h":[["對照：列優先（row-major）：x + n(7I + J)",true]],"x":[[["每一列有 7 個元素：先跳過 I 整列，再往右 J 個。考試先看清楚是哪一種順序；乘的數字是「每一行（或列）有幾個元素」，不是行數或列數本身，很容易寫反。",false]]]}],"videos":["https://www.youtube.com/watch?v=MJZd6uPi88E"]},"cs:114 填2":{"answer":[["這題的正確答案是 ",false],["interrupt-driven I/O",true],["（中斷驅動 I/O）。",false]],"items":[[["題目",true],["：（填充）在 ______ 這種讓 CPU 與 I/O 裝置同步運作的方法中，由 I/O 裝置在準備好傳輸資料時通知 CPU。",false]],[["核心觀念",true],["：I/O 裝置（鍵盤、硬碟、印表機）比 CPU 慢很多，兩者要協調「什麼時候可以傳資料」，常見三種方法。題目的關鍵字是「",false],["由裝置通知 CPU",true],["」：CPU 發出 I/O 指令後就去做別的事，裝置準備好時主動發出",false],["中斷（interrupt）",true],["訊號，CPU 暫停手上的工作去處理，所以是中斷驅動 I/O。",false]]],"opts_title":"參考答案（三種 I/O 同步方法比較）","opts":[{"h":[["Programmed I/O（程式控制 I/O，輪詢 polling）— 不是",true]],"x":[[["CPU 主動、反覆去問裝置「好了沒」，在裝置準備好之前什麼事都不能做，CPU 時間浪費在等待上。",false]]]},{"h":[["Interrupt-driven I/O（中斷驅動 I/O）— 本題答案",true]],"x":[[["裝置主動通知 CPU，CPU 不必一直等，可以同時處理其他工作；代價是每次中斷都要保存和恢復 CPU 的執行狀態。",false]]]},{"h":[["DMA（Direct Memory Access，直接記憶體存取）— 不是",true]],"x":[[["由 DMA 控制器直接在裝置和記憶體之間搬一整批資料，搬完才中斷 CPU 一次，適合硬碟這種大量資料傳輸，CPU 參與最少。",false]]]}],"videos":["https://www.youtube.com/watch?v=jRkJctITvzs"]},"cs:114 填3":{"answer":[["這題的正確答案是 ",false],["the scheduler",true],["（排程器）。",false]],"items":[[["題目",true],["：（填充）在作業系統中，______ 負責把項目從行程表（process table）中移除。",false]],[["核心觀念",true],["：作業系統用",false],["行程表（process table）",true],["記錄目前系統中所有的行程，每個行程一筆，記著優先權、狀態（ready／waiting）、在記憶體的位置、暫停時的暫存器內容等（每一筆就是行程控制區塊 PCB）。以 Brookshear《Computer Science: An Overview》（計概常用的原文書）的分工：",false],["排程器（scheduler）",true],["管理這個行程池，有新程式要執行時在行程表新增一筆，行程執行完畢時把它移除；",false],["分派器（dispatcher）",true],["則負責把 CPU 時間分給 ready 的行程、進行行程切換。",false]],[["延伸陷阱",true],["：分派器也跟行程有關，但它只管「現在讓誰用 CPU」，不負責新增或移除行程表的項目。有些課本把這個角色叫 job scheduler（長期排程器）或 process manager，意思相同。學校沒有公布答案。",false]],[["同主題考古題",true],["：113-9 process 排程、114 問5 waiting vs ready。",false]]],"opts_title":"參考答案（排程器 vs. 分派器）","opts":[{"h":[["Scheduler（排程器）— 本題答案",true]],"x":[[["管理行程池：新增行程到行程表、行程結束時從行程表移除，並記錄每個行程的狀態。",false]]]},{"h":[["Dispatcher（分派器）— 容易混淆",true]],"x":[[["執行排程的結果：從 ready 的行程中挑一個給 CPU 執行一個時間片（time slice），時間到就透過中斷進行行程切換（context switch）。",false]]]}],"videos":["https://www.youtube.com/watch?v=4s2MKuVYKV8","https://www.youtube.com/watch?v=yZMv5tKL-Q8"]},"cs:114 填4":{"answer":[["這題的正確答案是 ",false],["sign-and-magnitude",true],["（符號大小表示法）。",false]],"items":[[["題目",true],["：（填充）在 IEEE 標準浮點數格式中，實數的符號（sign）與尾數（mantissa）合起來，是以 ______ 表示法存成整數。",false]],[["核心觀念",true],["：IEEE 754 浮點數分三段：",false],["符號位元 S",true],["（0 正、1 負）、",false],["指數 E",true],["、",false],["尾數 M",true],["（小數部分）。以 32 位元單精度為例是 1 + 8 + 23 位元，值 = (−1)^S × 1.M × 2^(E − 127)。符號和尾數分開存：一個位元表示正負，其他位元存數值的大小，這正是",false],["符號大小表示法（sign-and-magnitude）",true],["，所以正數和負數只差在符號位元，尾數完全一樣。",false]],[["逐步追蹤",true],["：+5.75 和 −5.75：5.75 = 101.11₂ = 1.0111 × 2²。符號：正是 0、負是 1；指數：2 + 127 = 129 = 10000001；尾數：0111 後面補 0。兩個數只有最左邊的符號位元不同，就是符號大小表示法的特徵。",false]],[["同主題考古題",true],["：109-37 IEEE 32 位元浮點數、112-17 1 補數與 2 補數。",false]]],"opts_title":"參考答案（每一段用什麼表示法）","opts":[{"h":[["符號＋尾數：sign-and-magnitude（符號大小）— 本題答案",true]],"x":[[["一個位元表示正負，其餘位元存大小；正負數的尾數相同。",false]]]},{"h":[["指數：excess（超額／偏移）表示法",true]],"x":[[["實際指數加上偏移量再存，單精度加 127、倍精度加 1023，讓指數可以直接當無號整數比大小。",false]]]},{"h":[["容易填錯：two's complement（2 補數）",true]],"x":[[["2 補數是電腦存「整數」最常用的方式，但 IEEE 浮點數的符號與尾數不是用 2 補數。",false]]]}],"videos":["https://www.youtube.com/watch?v=PZRI1IfStY0","https://www.youtube.com/watch?v=RuKkePyo9zk"]},"cs:114 問5":{"answer":[["這題的正確答案是 ",false],["ready 的行程只差 CPU，隨時可以執行；waiting 的行程在等某個事件（例如 I/O 完成），就算給它 CPU 也不能執行",true],["。",false]],"items":[[["題目",true],["：（問答，8 分）說明「等待（waiting）中的行程」和「就緒（ready）中的行程」有什麼不同。",false]],[["核心觀念",true],["：行程（process）在生命週期中會在幾個狀態間移動，常見的五狀態模型：新建（new）、就緒（ready）、執行（running）、等待（waiting，也叫 blocked）、結束（terminated）。ready 和 waiting 都「還沒在執行」，差別在於",false],["它在等什麼",true],["：ready 在等 CPU，waiting 在等 CPU 以外的事件。",false]],[["狀態轉換",true],["（作答時可以畫圖）：ready → running（排程後分派到 CPU）；running → ready（時間片用完，或被更高優先權的行程搶走）；running → waiting（要求 I/O，或等待某個資源、訊號）；waiting → ready（等待的事件完成）。waiting 不會直接回到 running，事件完成後要先回 ready 排隊。",false]],[["同主題考古題",true],["：113-9 process 排程、114 填3 行程表。",false]]],"opts_title":"參考答案","opts":[{"h":[["Ready（就緒）",true]],"x":[[["行程所需的資源都備齊了，只缺 CPU；放在就緒佇列（ready queue）裡等排程，一拿到 CPU 就能立刻執行。例如時間片用完被換下來的行程。",false]]]},{"h":[["Waiting／Blocked（等待）",true]],"x":[[["行程在等某個事件發生，例如讀取磁碟完成、使用者輸入、取得某個資源或訊號；在事件完成前，即使 CPU 空著也不能執行。事件完成後移到 ready，而不是直接執行。",false]]]},{"h":[["英文作答範例",true]],"x":[[["A ready process has everything it needs except the CPU; it waits in the ready queue and can run as soon as it is dispatched. A waiting (blocked) process cannot continue even if the CPU is free, because it is waiting for an event such as the completion of an I/O operation. When that event occurs, the process moves to the ready state, not directly to the running state.",false]]]}],"videos":["https://www.youtube.com/watch?v=jZ_6PXoaoxo"]},"cs:114 問6":{"answer":[["這題的正確答案是 ",false],["把前序陣列遞迴切成「根、左子樹、右子樹」，切到只剩一個元素時，那個節點就是葉節點，印出來",true],["（參考程式見下方）。",false]],"items":[[["題目",true],["：（問答，20 分）用 C 語言寫一個遞迴函數，給定一棵二元樹的前序走訪（pre-order traversal），印出所有葉節點（leaf node）。例如題目的樹：根 793，左子 279、右子 922，279 的左子 137、右子 547；輸入 [793, 279, 137, 547, 922]，輸出 137, 547, 922。",false]],[["核心觀念",true],["：",false],["葉節點",true],["是沒有任何子節點的節點。",false],["前序走訪",true],["的順序是「根 → 左子樹 → 右子樹」，所以陣列第一個元素一定是根。但只有前序還不能決定一棵一般的二元樹（例如 [1, 2, 3] 可能是 2、3 分別在左右，也可能是一條直線，葉節點就不同）。仔細看題目的例子：左邊都比根小、右邊都比根大，它是一棵",false],["二元搜尋樹（BST）",true],["。有了 BST 的性質，前序陣列就能切開：根後面「連續比根小」的那一段是左子樹，剩下的是右子樹。",false]],[["逐步追蹤",true],["：[793, 279, 137, 547, 922]：根 793，比它小的 279、137、547 是左子樹，922 是右子樹。左子樹 [279, 137, 547]：根 279，137 是左子樹、547 是右子樹。[137] 只剩一個元素 → 葉節點，印出 137；[547] → 印出 547；右子樹 [922] → 印出 922。結果 137, 547, 922。",false]],[["延伸陷阱",true],["：作答時要寫出「假設這是一棵二元搜尋樹」，因為一般二元樹光靠前序無法判斷哪些是葉節點，閱卷時會看你有沒有注意到這點。這個切法在樹歪成一直線時最慢，是 O(n²)。",false]],[["同主題考古題",true],["：113-5 由中序＋後序求前序、112-6 BST 中序走訪、110-40 BST 後序走訪、106 問3 樹的後序走訪。",false]]],"opts_title":"參考答案（C 程式）","opts":[{"h":[["遞迴函數 printLeaves",true]],"x":[[["```\n#include <stdio.h>\n\n/* pre[lo..hi] 是一棵二元搜尋樹的前序走訪 */\nvoid printLeaves(int pre[], int lo, int hi) {\n    if (lo > hi) return;               /* 空的子樹：什麼都不做 */\n    if (lo == hi) {                    /* 只剩一個節點：它就是葉節點 */\n        printf(\"%d \", pre[lo]);\n        return;\n    }\n    int root = pre[lo];\n    int i = lo + 1;\n    while (i <= hi && pre[i] < root)   /* 找右子樹的起點 */\n        i++;\n    printLeaves(pre, lo + 1, i - 1);   /* 左子樹：比根小的那一段 */\n    printLeaves(pre, i, hi);           /* 右子樹：剩下的部分 */\n}\n\nint main(void) {\n    int pre[] = {793, 279, 137, 547, 922};\n    int n = sizeof(pre) / sizeof(pre[0]);\n    printLeaves(pre, 0, n - 1);        /* 印出 137 547 922 */\n    return 0;\n}",false]]]},{"h":[["程式重點",true]],"x":[[["終止條件有兩個：區間是空的（lo > hi）就直接返回；區間只剩一個元素（lo == hi），代表這個節點沒有子節點，就是葉節點，印出它。",false]],[["其他情況：第一個元素是根，往後找到第一個比根大的位置 i，左子樹是 lo+1 到 i−1、右子樹是 i 到 hi；先遞迴左邊再遞迴右邊，所以葉節點會由左到右印出。只有一邊子樹的節點不會被印出，因為它的區間長度大於 1。",false]],[["如果要印成「137, 547, 922」這種逗號格式，可以多用一個全域變數記錄是不是第一個輸出，第一個之後的每個數字前面先印逗號。",false]]]}],"videos":["https://www.youtube.com/watch?v=9sw8RRsBw6s","https://www.youtube.com/watch?v=OXy4pLq_XZs"]},"cs:113-2":{"answer":[["這題的正確答案是 ",false],["A. UDP builds up reliable connections.",true]],"items":[[["題目",true],["：下列關於網路協定的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：傳輸層有兩個主角。",false],["TCP",true],["：連線導向、可靠（三向交握建立連線、確認 ACK、遺失重傳、依序送達、流量與壅塞控制），適合不能掉資料的應用：網頁（HTTP）、檔案傳輸（FTP）、電子郵件（SMTP）。",false],["UDP",true],["：非連線導向、不保證送達，沒有交握也不重傳，但速度快、負擔小，適合量小或要即時的應用：DNS 查詢、線上影音、遊戲、網路電話。",false]],[["同主題考古題",true],["：115-3 TCP 三向交握、108-10 TCP、109-39 TCP/IP 模型。",false]]],"opts_title":"各選項解析（TCP 可靠、UDP 快）","opts":[{"h":[["A. UDP builds up reliable connections（UDP 建立可靠的連線）— 錯誤（正確答案）",true]],"x":[[["UDP 既不建立連線、也不可靠：直接把資料包（datagram）丟出去，掉了不管、亂序也不排。要可靠就用 TCP，或由應用程式自己處理。",false]]]},{"h":[["B. DNS queries are transmitted through UDP（DNS 查詢透過 UDP 傳送）— 正確",true]],"x":[[["一般 DNS 查詢用 UDP port 53，一問一答、封包很小，不值得先花時間交握。回應太大，或 DNS 伺服器之間同步整個區域資料（zone transfer）時才改用 TCP。",false]]]},{"h":[["C. HTTP requests and responses are transmitted through TCP protocol（HTTP 請求與回應透過 TCP 傳送）— 正確",true]],"x":[[["HTTP/1.1、HTTP/2 都跑在 TCP 上（port 80，HTTPS 是 443）。補充：最新的 HTTP/3 改用建在 UDP 上的 QUIC，但考題一般以 TCP 為準。",false]]]},{"h":[["D. FTP responses are transmitted through TCP protocol（FTP 回應透過 TCP 傳送）— 正確",true]],"x":[[["FTP 用兩條 TCP 連線：port 21 傳指令與回應（控制連線），port 20（或另外協商的 port）傳檔案資料。",false]]]}],"videos":["https://www.youtube.com/watch?v=uwoD5YsGACg"]},"cs:113-3":{"answer":[["這題的正確答案是 ",false],["D. An IP camera is an IoT device and safer than a personal computer.",true]],"items":[[["題目",true],["：下列關於物聯網（Internet of Things, IoT）的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：物聯網是讓日常物品（家電、感測器、穿戴裝置、攝影機）具備連網能力，可以收集資料、遠端控制。IoT 裝置通常運算資源少、出廠用預設密碼、很少更新韌體，所以",false],["比電腦更容易被入侵",true],["；2016 年的 Mirai 殭屍網路，就是靠大量被入侵的網路攝影機和路由器發動 DDoS 攻擊。",false]],[["延伸陷阱",true],["：A 的「部署在內部網路」也有討論空間：實務上建議把 IoT 裝置放在",false],["獨立的網段",true],["（例如訪客網路、VLAN），不要直接暴露在網際網路上，也不要和存放重要資料的電腦放在同一個網段。但相比之下 D 明顯錯誤，所以選 D。",false]],[["同主題考古題",true],["：112-13 IoT。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. For security purpose, IoT devices should be deployed in internal network（為了安全，IoT 裝置應部署在內部網路）— 大致正確",true]],"x":[[["意思是不要讓 IoT 裝置直接面對網際網路，放在防火牆後面的內部網路比較安全；更好的做法是內部再切出 IoT 專用的網段。",false]]]},{"h":[["B. All IoT devices have connectivity（所有 IoT 裝置都有連網能力）— 正確",true]],"x":[[["連網就是 IoT 的定義（Internet of Things），不能連網的只是一般電器。",false]]]},{"h":[["C. Bluetooth earphones are IoT devices（藍牙耳機是 IoT 裝置）— 正確（廣義來說）",true]],"x":[[["藍牙耳機透過藍牙與手機連線、可以更新韌體、回傳電量等資料，屬於廣義的物聯網穿戴裝置。",false]]]},{"h":[["D. An IP camera is an IoT device and safer than a personal computer（網路攝影機是 IoT 裝置，而且比個人電腦安全）— 錯誤（正確答案）",true]],"x":[[["前半句對、後半句錯。網路攝影機常用預設帳號密碼、韌體很少更新、沒有防毒軟體，是駭客最愛的目標（例如 Mirai），通常比有安全更新與防護軟體的個人電腦更不安全。",false]]]}],"videos":["https://www.youtube.com/watch?v=SvFyd8DpRkw","https://www.youtube.com/watch?v=-M74HobvzGA"]},"cs:113-4":{"answer":[["這題的正確答案是 ",false],["C. 802.11 does not run on ISM radio band.",true]],"items":[[["題目",true],["：下列關於無線網路的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：Wi-Fi（IEEE 802.11）使用免執照的 ",false],["ISM 頻段",true],["（Industrial, Scientific and Medical，工業、科學、醫療用頻段）2.4 GHz，以及 5 GHz（Wi-Fi 6E 再加上 6 GHz）。無線電波傳送時無法同時收聽，所以不能像有線乙太網路用 CSMA/CD 偵測碰撞，而是用 ",false],["CSMA/CA",true],["（碰撞避免）：傳送前先聽、再隨機等待，必要時用 RTS/CTS 先預約通道。無線網路特有兩個問題：",false],["隱藏節點",true],["與",false],["暴露節點",true],["。",false]],[["同主題考古題",true],["：113-19 CSMA/CD、111-24 Wi-Fi 6E 頻段、110-14 Wi-Fi。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Wireless networks have the exposed node problem（無線網路有暴露節點問題）— 正確",true]],"x":[[["B 正在傳給 A，C 聽到 B 的訊號，以為通道忙碌而不敢傳給 D；其實 C 傳給 D 根本不會干擾 A，結果白白浪費了傳送機會。",false]]]},{"h":[["B. Wireless networks have the hidden node problem（無線網路有隱藏節點問題）— 正確",true]],"x":[[["A 和 C 都在基地台 B 的範圍內，但彼此聽不到；兩邊都以為通道空閒而同時傳給 B，在 B 那裡碰撞。解法是 RTS/CTS：先發 RTS 請求，B 回覆 CTS 讓周圍所有人聽到，聽到 CTS 的節點就先暫停。",false]]]},{"h":[["C. 802.11 does not run on ISM radio band（802.11 不使用 ISM 頻段）— 錯誤（正確答案）",true]],"x":[[["802.11b/g/n 用的 2.4 GHz 就是 ISM 頻段（微波爐、藍牙也用這個頻段，所以會互相干擾）。",false]]]},{"h":[["D. 802.11 uses the multiple access with collision avoidance algorithm to transmit data（802.11 用碰撞避免的多重存取演算法傳送資料）— 正確",true]],"x":[[["就是 CSMA/CA。無線網路偵測不到碰撞，只好事前避免：通道空閒後還要再等一段隨機時間才傳，收到資料的一方要回 ACK，沒收到 ACK 就當作失敗重傳。",false]]]}],"videos":["https://www.youtube.com/watch?v=liw7bGj-1IM","https://www.youtube.com/watch?v=iKn0GzF5-IU"]},"cs:113-5":{"answer":[["這題的正確答案是 ",false],["D. DOGOOBOK",true],["（但 C. DOOGOBOK 也符合題目條件，這題有瑕疵，詳見下方）。",false]],"items":[[["題目",true],["：一棵二元樹的每個節點存一個字元。如果它的中序走訪是 GOODBOOK、後序走訪是 GOOOBKOD，它的前序走訪是什麼？",false]],[["核心觀念",true],["：",false],["後序",true],["的最後一個是根；在",false],["中序",true],["裡找到根，左邊是左子樹、右邊是右子樹；再依左右子樹的節點數，把後序切成左、右兩段，對每一段重複同樣的步驟。",false]],[["逐步追蹤",true],["：① 後序最後是 D → 根是 D。中序 GOO | D | BOOK，左子樹 3 個、右子樹 4 個；後序切成 GOO | OBKO | D。② 右子樹：中序 BOOK、後序 OBKO，根是 O。如果根是 BOOK 的第一個 O，左子樹只有 B，但後序左段的第一個字是 O，對不上；所以根是第二個 O：左子樹中序 BO、後序 OB（根 B，右子是 O），右子樹是 K。右子樹的前序 = O B O K。③ 左子樹：中序 GOO、後序 GOO，根是 O，但「哪一個 O 是根」有兩種可能，兩種都對得上。",false]],[["延伸陷阱",true],["：左子樹的兩種可能：(a) 根 O 的左子是 G、右子是 O，前序 O G O → 整棵前序 ",false],["DOGOOBOK",true],["（選項 D）；(b) 根 O 只有左子 O，那個 O 的左子是 G，前序 O O G → 整棵前序 ",false],["DOOGOBOK",true],["（選項 C）。兩棵樹的中序、後序都完全符合題目，所以題目其實有兩個答案，原因是樹中有重複的字母。出題者畫的應該是比較平衡的 (a)，作答時選 D；遇到有重複字母的題目，要記得檢查是否有不同的切法。",false]],[["同主題考古題",true],["：114 問6 由前序找葉節點、112-6 BST 中序走訪、110-40 BST 後序走訪、106 問3 樹的後序走訪。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. DOGBOOOK — 錯",true]],"x":[[["右子樹的前序寫成 BOOK，代表右子樹的根是 B；但右子樹後序 OBKO 的最後一個是 O，根應該是 O。",false]]]},{"h":[["B. DOGOBOOK — 錯",true]],"x":[[["左子樹 OGO 正確，但右子樹寫成 BOOK，和 A 犯同樣的錯。",false]]]},{"h":[["C. DOOGOBOK — 也符合條件",true]],"x":[[["對應左子樹是 O → O → G 一路往左的那棵樹，中序 GOO、後序 GOO 都對得上。",false]]]},{"h":[["D. DOGOOBOK — 對（出題者最可能的答案）",true]],"x":[[["根 D；左子樹 O（左 G、右 O）；右子樹 O（左 B，B 的右子是 O；右 K）。",false]]]}],"videos":["https://www.youtube.com/watch?v=rY9ejIY9Osw"]},"cs:113-6":{"answer":[["這題的正確答案是 ",false],["C. In the average cases, delete in a hash table is O(N).",true]],"items":[[["題目",true],["：下列關於雜湊表（hash table）的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：雜湊表用",false],["雜湊函數",true],["把鍵（key）直接算成陣列的位置（例如 key mod 表格大小），不用一個一個找，所以",false],["搜尋、插入、刪除平均都是 O(1)",true],["。不同的鍵算出同一個位置叫",false],["碰撞（collision）",true],["，用鏈結法（同一格掛一條串列）或開放定址法（往後找空格）處理。碰撞很多時會退化，最差情況（全部擠在同一格）是 O(N)。",false]],[["同主題考古題",true],["：113-13 時間複雜度、115-9 Big-O。",false]]],"opts_title":"各選項解析（平均 O(1)，最差 O(N)）","opts":[{"h":[["A. In the average cases, search in a hash table is O(1)（平均情況下，搜尋是 O(1)）— 正確",true]],"x":[[["算一次雜湊值就直接到那一格找，與資料量無關。",false]]]},{"h":[["B. In the average cases, insert in a hash table is O(1)（平均情況下，插入是 O(1)）— 正確",true]],"x":[[["算出位置後直接放進去（或掛到那一格串列的開頭）。",false]]]},{"h":[["C. In the average cases, delete in a hash table is O(N)（平均情況下，刪除是 O(N)）— 錯誤（正確答案）",true]],"x":[[["刪除和搜尋一樣，先算雜湊值找到那一格再移除，平均也是 O(1)。O(N) 是碰撞嚴重時的最差情況。",false]]]},{"h":[["D. An imperfect hash function may result in many collisions（不完美的雜湊函數可能造成很多碰撞）— 正確",true]],"x":[[["好的雜湊函數要讓鍵平均分散；如果分布不均（例如只看鍵的第一個字母），很多鍵擠在同一格，效能就退化成接近 O(N)。",false]]]}],"videos":["https://www.youtube.com/watch?v=MfhjkfocRR0","https://www.youtube.com/watch?v=eUbSeqLMyHg"]},"cs:113-7":{"answer":[["這題的正確答案是 ",false],["C. ARP assigns a host an IP address dynamically.",true]],"items":[[["題目",true],["：下列關於 ARP 的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：",false],["ARP（位址解析協定）",true],["是「已知 IP、查 MAC」：主機廣播詢問「誰是 192.168.1.1？」，對方回覆自己的 MAC 位址，主機把這組對應暫存在 ",false],["ARP 快取（ARP cache）",true],["一段時間，下次就不用再問。",false],["動態分配 IP 的是 DHCP",true],["，不是 ARP，這題就是考兩者的混淆。",false]],[["延伸陷阱",true],["：B 說 ARP 在 OSI 的網路層，有些課本把 ARP 歸在網路層，也有人說它在第二層和第三層之間；不論哪種說法，C 都明顯錯誤，所以選 C。",false]],[["同主題考古題",true],["：115-2、112-10 ARP；115-20 DHCP（真正負責分配 IP 的）。",false]]],"opts_title":"各選項解析（ARP 查 MAC，DHCP 發 IP）","opts":[{"h":[["A. ARP is used to build up a mapping table of IP addresses to MAC addresses（ARP 用來建立 IP 對 MAC 的對應表）— 正確",true]],"x":[[["查到的結果存在 ARP 表（ARP 快取）裡，在 Windows 可以用 arp -a 看到。",false]]]},{"h":[["B. ARP is a network protocol at the network layer of the OSI model（ARP 是 OSI 網路層的協定）— 大致正確",true]],"x":[[["它服務網路層（替 IP 找出下一站的 MAC），很多課本把它歸在網路層。",false]]]},{"h":[["C. ARP assigns a host an IP address dynamically（ARP 動態分配 IP 給主機）— 錯誤（正確答案）",true]],"x":[[["這是 DHCP 的工作。ARP 只做 IP → MAC 的查詢，不分配任何位址。",false]]]},{"h":[["D. An ARP cache is a collection of ARP entries that are created when an IP address is resolved to a MAC address（ARP 快取是解析 IP 為 MAC 時建立的項目集合）— 正確",true]],"x":[[["每次解析成功就新增一筆，一段時間沒用會自動過期刪除，避免對應關係改變後還用舊資料。",false]]]}],"videos":["https://www.youtube.com/watch?v=cn8Zxh9bPio","https://www.youtube.com/watch?v=e6-TaH5bkjo"]},"cs:113-8":{"answer":[["這題的正確答案是 ",false],["D. Web browsing is safe and will not get infected by malware.",true]],"items":[[["題目",true],["：下列關於惡意程式（malware）的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：惡意程式包括病毒（virus，附在檔案上、靠人執行而傳播）、蠕蟲（worm，自己透過網路複製傳播）、木馬（trojan，偽裝成正常程式）、勒索軟體（ransomware）等。感染途徑很多：USB 隨身碟、電子郵件附件、惡意文件，甚至只是瀏覽網頁。D 用「safe」「will not」這種絕對的說法，在資安題通常就是錯的。",false]],[["同主題考古題",true],["：108-2 惡意程式、109-35 網路攻擊。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. A computer might be infected without connecting to a network（電腦沒有連網也可能被感染）— 正確",true]],"x":[[["例如插入有病毒的 USB 隨身碟或光碟。著名的 Stuxnet 就是透過 USB 感染了沒有連網的核設施電腦。",false]]]},{"h":[["B. PDF files may contain malware（PDF 檔可能含有惡意程式）— 正確",true]],"x":[[["PDF 可以內嵌 JavaScript 和其他檔案，攻擊者利用 PDF 閱讀器的漏洞，一打開檔案就執行惡意程式碼，常見於釣魚郵件的附件。",false]]]},{"h":[["C. Image files may include malware（圖片檔可能包含惡意程式）— 正確",true]],"x":[[["攻擊者可以把惡意資料藏在圖片裡，利用看圖程式或函式庫處理圖片時的漏洞（例如緩衝區溢位）執行程式碼；也有把程式藏在圖片中的隱寫術（steganography）。",false]]]},{"h":[["D. Web browsing is safe and will not get infected by malware（瀏覽網頁很安全，不會感染惡意程式）— 錯誤（正確答案）",true]],"x":[[["有一種攻擊叫「路過式下載（drive-by download）」：只是打開被植入惡意程式碼的網頁，就利用瀏覽器或外掛的漏洞自動下載、執行惡意程式；還有藏在廣告裡的惡意廣告（malvertising）。所以瀏覽器和系統要隨時更新。",false]]]}],"videos":["https://www.youtube.com/watch?v=n8mbzU0X2nQ","https://www.youtube.com/watch?v=8FNPm2ekt_U"]},"cs:113-9":{"answer":[["這題的正確答案是 ",false],["B. Round-robin scheduling has the shortest waiting time.",true]],"items":[[["題目",true],["：下列關於行程排程（process scheduling）的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：常見的 CPU 排程法：",false],["FIFO／FCFS",true],["（先到先服務，不可搶奪）；",false],["SJF",true],["（最短工作優先，平均等待時間最短，但要先知道執行時間，長工作可能一直等不到）；",false],["Round-robin（RR，輪流）",true],["：每個行程輪流使用一段固定的時間片（time quantum），用完就排到佇列後面。RR 的優點是",false],["回應時間短、公平",true],["，但平均等待時間通常不是最短的。",false]],[["逐步追蹤",true],["（例子）：三個行程同時到達，執行時間 P1 = 24、P2 = 3、P3 = 3。FCFS（依 P1、P2、P3）：等待時間 0、24、27，平均 17。SJF（P2、P3、P1）：等待時間 6、0、3，平均 3。RR（時間片 4）：P1 等 6、P2 等 4、P3 等 7，平均約 5.67。平均等待時間最短的是 SJF，不是 RR。",false]],[["同主題考古題",true],["：114 問5 waiting vs ready、114 填3 排程器。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. FIFO scheduling may result long waiting time（FIFO 排程可能造成很長的等待時間）— 正確",true]],"x":[[["一個很長的行程排在前面，後面的短行程全部要等它跑完，叫護航效應（convoy effect），如上面例子平均要等 17。",false]]]},{"h":[["B. Round-robin scheduling has the shortest waiting time（Round-robin 的等待時間最短）— 錯誤（正確答案）",true]],"x":[[["可以證明平均等待時間最短的是 SJF。RR 的強項是回應時間（response time）短，每個行程很快就能輪到一次，不是等待時間最短。",false]]]},{"h":[["C. A very large time quantum in round-robin scheduling results in FIFO scheduling（RR 的時間片很大時會變成 FIFO）— 正確",true]],"x":[[["時間片大到每個行程都能一次跑完，就不會被中途換下，等於依到達順序執行。反過來，時間片太小則行程切換（context switch）太頻繁，浪費 CPU。",false]]]},{"h":[["D. Round-robin scheduling is suitable for interactive systems as it has short response time（RR 回應時間短，適合互動式系統）— 正確",true]],"x":[[["分時系統、多人同時操作的系統，使用者希望每次操作都很快有反應，RR 讓每個行程定時都能分到 CPU。",false]]]}],"videos":["https://www.youtube.com/watch?v=4r4SW5QrbeU"]},"cs:113-10":{"answer":[["這題的正確答案是 ",false],["A. 2i",true],["（陣列從索引 1 開始存根節點時）。",false]],"items":[[["題目",true],["：如果用陣列表示二元樹，用什麼公式可以找到節點 i 的左子節點？",false]],[["核心觀念",true],["：把二元樹依「一層一層、由左到右」的順序放進陣列（完整二元樹最適合，堆積 heap 就是這樣存）。",false],["根放在索引 1",true],[" 時：節點 i 的左子是 ",false],["2i",true],["、右子是 ",false],["2i + 1",true],["、父節點是 ",false],["⌊i / 2⌋",true],["。如果",false],["根放在索引 0",true],["（C 語言陣列從 0 開始），公式變成左子 2i + 1、右子 2i + 2、父節點 ⌊(i − 1) / 2⌋。",false]],[["延伸陷阱",true],["：題目沒說從 0 還是 1 開始，所以 A 和 B 各自在一種慣例下成立。資料結構課本最常用的是根從 1 開始（公式最簡潔），出題者應該是想考 2i，所以選 A；作答時最好把「假設根在索引 1」寫出來。學校沒有公布答案。",false]],[["同主題考古題",true],["：111-13 完全二元樹高度、107-14 二元樹節點數。",false]]],"opts_title":"各選項解析（先看根在索引 0 還是 1）","opts":[{"h":[["A. 2i — 對（根在索引 1 時；正確答案）",true]],"x":[[["例如根是 1，左子 2、右子 3；節點 2 的左子 4、右子 5；節點 3 的左子 6、右子 7，剛好一層一層排滿。",false]]]},{"h":[["B. 2i + 1 — 根在索引 1 時是「右子」；根在索引 0 時才是左子",true]],"x":[[["根是 0 時：左子 1、右子 2；節點 1 的左子 3、右子 4。考試要看清楚題目用哪一種。",false]]]},{"h":[["C. 2i − 1 — 錯",true]],"x":[[["沒有這種慣例。以根在 1 為例，節點 2 的左子會算成 3，但 3 是根的右子。",false]]]},{"h":[["D. None of the above — 錯",true]],"x":[[["在常見的慣例下，A（或 B）就是正確公式。",false]]]}],"videos":["https://www.youtube.com/watch?v=HkSvFBrRY1g"]},"cs:113-11":{"answer":[["這題的正確答案是 ",false],["A、C",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）恆真式（tautology）是永遠為真的複合命題。下列哪（幾）個是恆真式？",false]],[["核心觀念",true],["：判斷恆真式最穩的方法是列真值表，檢查所有情況是否都為真；也可以用等價式化簡。關鍵公式：",false],["p → q 等價於 ¬p ∨ q",true],["（只有「前真後假」時才是假）。所以想找反例，只要找讓「→ 前面為真、後面為假」的情況。",false]],[["逐步追蹤",true],["：A：(p ∧ q) → q，前面為真代表 p、q 都真，後面的 q 一定真，找不到反例 → 恆真。B：q → (p ∧ q)，取 q = 真、p = 假，前真後假 → 假，不是恆真。C：p ∨ (p → q) = p ∨ ¬p ∨ q，其中 p ∨ ¬p 永遠為真 → 恆真。D：q ∨ (p → q) = q ∨ ¬p ∨ q = ¬p ∨ q，取 p = 真、q = 假 → 假，不是恆真。",false]],[["同主題考古題",true],["：113-12 邏輯推論、109-5 述詞邏輯翻譯。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. (p ∧ q) → q — 恆真（正確答案）",true]],"x":[[["「p 而且 q」成立時，q 當然成立。這也是 113-12 C 選項「簡化律」的根據。",false]]]},{"h":[["B. q → (p ∧ q) — 不是",true]],"x":[[["只知道 q 成立，不能推出 p 也成立；反例是 p = 假、q = 真。",false]]]},{"h":[["C. p ∨ (p → q) — 恆真（正確答案）",true]],"x":[[["化簡後含有 p ∨ ¬p（排中律），不管 p 是真是假，整句都為真。",false]]]},{"h":[["D. q ∨ (p → q) — 不是",true]],"x":[[["化簡後等於 p → q 本身，p = 真、q = 假時為假。",false]]]}],"videos":["https://www.youtube.com/watch?v=tmIVCiA911w","https://www.youtube.com/watch?v=Mv-I3epqzcQ"]},"cs:113-12":{"answer":[["這題的正確答案是 ",false],["A、B、C、D",true],["（複選，四個都是 sound）。",false]],"items":[[["題目",true],["：（複選）邏輯推論是從一組述詞邏輯語句（知識庫 KB）產生新的、邏輯上必然成立的語句。如果推論規則產生的每個語句都必然可由 KB 推得，這個規則就是",false],["健全的（sound）",true],["；也就是說，只要前提為真，結論就一定為真。下列哪（幾）個規則是 sound？",false]],[["核心觀念",true],["：檢查方法：把「前提 → 結論」寫成一個條件式，如果它是恆真式（113-11 的概念），這個規則就是 sound。四個選項都是命題邏輯的標準推論規則：肯定前件（modus ponens）、合取引入、簡化（合取消去）、雙重否定消去。",false]],[["同主題考古題",true],["：113-11 恆真式、109-5 述詞邏輯翻譯。",false]]],"opts_title":"各選項解析（四個都是標準推論規則）","opts":[{"h":[["A. Premise: p, p → q；conclusion: q — sound（正確答案）",true]],"x":[[["肯定前件（modus ponens）",true],["：「如果下雨，地就會濕」而且「下雨了」，所以「地濕了」。這是最常用的推論規則。",false]]]},{"h":[["B. Premise: p, q；conclusion: p ∧ q — sound（正確答案）",true]],"x":[[["合取引入（conjunction）",true],["：p 為真、q 也為真，「p 而且 q」當然為真。",false]]]},{"h":[["C. Premise: p ∧ q；conclusion: p — sound（正確答案）",true]],"x":[[["簡化律（simplification）",true],["：「p 而且 q」為真，其中的 p 一定為真（對應 113-11 的 A）。",false]]]},{"h":[["D. Premise: ¬¬p；conclusion: p — sound（正確答案）",true]],"x":[[["雙重否定消去",true],["：「不是『不是 p』」就是 p。例如「他不是沒來」等於「他來了」。",false]]]}],"videos":["https://www.youtube.com/watch?v=XmHWZPWeQ9o","https://www.youtube.com/watch?v=5rVA0AaJ9dE"]},"cs:113-13":{"answer":[["這題的正確答案是 ",false],["A、C、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列關於時間複雜度的敘述，哪（幾）項正確？",false]],[["核心觀念",true],["：",false],["鏈結串列",true],["不能像陣列一樣直接跳到第 k 個，搜尋只能從頭一個一個找，平均、最差都是 O(N)；但如果已經拿到要插入位置的節點，插入只要改幾個指標，是 O(1)。",false],["二元搜尋樹（BST）",true],["每往下一層就排除一半，樹平衡時高度約 log N，搜尋是 O(log N)；但如果依序插入 1、2、3、4⋯⋯，樹會歪成一條直線，退化成鏈結串列，最差是 O(N)。",false]],[["延伸陷阱",true],["：B 的爭議在「插入」包不包含先找位置。常見的時間複雜度表把鏈結串列的插入、刪除列為 O(1)（只算改指標的動作），出題者應該是依這個標準，所以 B 不選；如果插入前要先搜尋位置（例如插入到排序好的串列），整體才是 O(N)。學校沒有公布答案。",false]],[["同主題考古題",true],["：113-6 雜湊表、115-9 Big-O、111-8 二分搜尋複雜度、112-30 鏈結串列 vs 陣列。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. The average time complexity of search in a double-linked list is O(N)（雙向鏈結串列搜尋的平均時間複雜度是 O(N)）— 正確（正確答案）",true]],"x":[[["平均要看 N/2 個節點，忽略常數就是 O(N)。雙向只是可以往前、往後走，仍然不能跳著找。",false]]]},{"h":[["B. The worst time complexity of insertion in a double-linked list is O(N)（雙向鏈結串列插入的最差時間複雜度是 O(N)）— 不選",true]],"x":[[["插入本身只要調整前後節點的 prev、next 指標，最差也是 O(1)；O(N) 是加上搜尋位置的時間。",false]]]},{"h":[["C. The average time complexity of search in a binary search tree is O(logN)（BST 搜尋的平均時間複雜度是 O(log N)）— 正確（正確答案）",true]],"x":[[["每比較一次就往左或往右，排除一半的節點，比較次數約等於樹高 log₂N。",false]]]},{"h":[["D. The worst time complexity of search in a binary search tree is O(N)（BST 搜尋的最差時間複雜度是 O(N)）— 正確（正確答案）",true]],"x":[[["歪斜樹（skewed tree）時每層只有一個節點，要一路比到底；AVL 樹、紅黑樹等平衡樹就是為了避免這種情況，保證最差也是 O(log N)。",false]]]}],"videos":["https://www.youtube.com/watch?v=-lpJhqKl6eo","https://www.youtube.com/watch?v=g2o22C3CRfU"]},"cs:113-14":{"answer":[["這題的正確答案是 ",false],["A、B、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）根據下面的 C 程式，哪（幾）個執行結果是正確的？",false]],[["題組程式在做什麼",true],["：這是",false],["判斷質數",true],["的程式（P 代表 prime 質數，N 代表不是質數）。n ≤ 1 直接判定 N；否則從 i = 2 試到 √n，只要有一個 i 能整除 n（n % i == 0），c 就加 1 並跳出迴圈；最後 c 還是 0（沒有任何因數）就是質數 P，否則是 N。",false]],[["核心觀念",true],["：為什麼只要試到 √n？如果 n = a × b 且 a ≤ b，那 a 一定 ≤ √n，所以 n 若有因數，在 2～√n 之間一定找得到一個。另外 sqrt() 要 #include <math.h>（題目只給 main 的部分）。",false]],[["逐步追蹤",true],["：8：√8 ≈ 2.83，i = 2 時 8 % 2 = 0 → c = 1 → N。7：√7 ≈ 2.65，只試 i = 2，7 % 2 = 1 → c = 0 → P。15：√15 ≈ 3.87，i = 2 不整除，i = 3 時 15 % 3 = 0 → c = 1 → ",false],["N",true],["。17：√17 ≈ 4.12，試 2、3、4 都不整除 → P。",false]],[["同主題考古題",true],["：108-20 C 程式求值、108-31 C 條件運算子。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 輸入 8，輸出 The number belongs to N — 正確（正確答案）",true]],"x":[[["8 = 2 × 4，不是質數。",false]]]},{"h":[["B. 輸入 7，輸出 The number belongs to P — 正確（正確答案）",true]],"x":[[["7 只有 1 和 7 兩個因數，是質數。",false]]]},{"h":[["C. 輸入 15，輸出 The number belongs to P — 錯",true]],"x":[[["15 = 3 × 5，迴圈在 i = 3 時找到因數，應該輸出 N。",false]]]},{"h":[["D. 輸入 17，輸出 The number belongs to P — 正確（正確答案）",true]],"x":[[["17 是質數，2～4 都無法整除。",false]]]}],"videos":["https://www.youtube.com/watch?v=kxRA0dBqYW4"]},"cs:113-15":{"answer":[["這題的正確答案是 ",false],["A、B、C",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）Mike 練習遞迴，寫了下面這段印出反轉字串的程式，空格 A～D 哪（幾）個填法是正確的？",false]],[["題組程式在做什麼",true],["：reverse(str, index, n) 每次先把 str[index] 存在區域變數 temp，再遞迴處理下一個字元，等遞迴回來才 printf 印出 temp。越後面的字元越晚存、越早印，所以印出來的順序剛好相反。",false]],[["核心觀念",true],["：遞迴三要素：",false],["終止條件",true],["（A：index == n 就返回）、",false],["縮小問題",true],["（C：index + 1）、",false],["回程時處理",true],["（printf 寫在遞迴呼叫之後，所以是「回來時」才印）。",false]],[["逐步追蹤",true],["：以字串 \"ab\" 為例（n = sizeof = 3，含結尾的 '\\0'）：reverse(0) 存 'a' → reverse(1) 存 'b' → reverse(2) 存 '\\0' → reverse(3) 遇到 index == n 返回 → 印 '\\0' → 印 'b' → 印 'a'。題目的字串 \"MIS@NSYSU is the best\" 有 21 個字元，n = 22，最後印出 tseb eht si USYSN@SIM（最前面還會先印一個看不見的 '\\0'）。",false]],[["延伸陷阱",true],["：① 選項 A 原卷寫成大寫的 If，但 C 的關鍵字是小寫 if，大寫無法編譯，應是排版時被自動改成大寫，依題意算正確。② 因為 sizeof 會算到結尾的 '\\0'，比較好的寫法是終止條件用 str[index] == '\\0'，或 n 改用 strlen(a)。",false]],[["同主題考古題",true],["：113-17 河內塔、107 問1 C 遞迴 reverse(n)、111-26、110-27 遞迴。",false]]],"opts_title":"各選項解析（填入空格）","opts":[{"h":[["A. if (index == n) return;（填入空格 A）— 正確（正確答案）",true]],"x":[[["終止條件：走到字串尾端就停止遞迴；沒有這行會無限遞迴、讀到陣列外面。",false]]]},{"h":[["B. temp = str[index];（填入空格 B）— 正確（正確答案）",true]],"x":[[["在遞迴呼叫之前先記住目前的字元。每一層的 temp 都是各自獨立的區域變數，回程時各自印出。",false]]]},{"h":[["C. reverse(str, index + 1, n);（填入空格 C）— 正確（正確答案）",true]],"x":[[["處理下一個字元，index 每次加 1，最後一定會等於 n 而停止。",false]]]},{"h":[["D. reverse(a, n, 0);（填入空格 D）— 錯",true]],"x":[[["參數順序錯了：函數定義是 reverse(char *str, int index, int n)，應該寫 reverse(a, 0, n)，從第 0 個字元開始。寫成 reverse(a, n, 0) 時 index = 22、n = 0，index 只會越來越大、永遠不會等於 n，一直讀到陣列外面，程式崩潰。",false]]]}],"videos":["https://www.youtube.com/watch?v=iWQ5rGWmkXw"]},"cs:113-16":{"answer":[["這題的正確答案是 ",false],["礦工不斷改變 nonce 計算區塊的雜湊值，直到找到小於目標值的雜湊；最先找到的人廣播區塊，其他節點驗證後接上鏈，挖到的人獲得獎勵",true],["。",false]],"items":[[["題目",true],["：（問答，10 分）請說明區塊鏈技術中「工作量證明（Proof of Work, PoW）」共識機制的運作程序。",false]],[["核心觀念",true],["：區塊鏈是沒有中央管理者的分散式帳本，大家要對「下一個區塊由誰寫、內容是什麼」達成共識。PoW 的想法是：",false],["誰先完成一道很難算、但很容易驗證的題目，誰就有權寫下一個區塊",true],["。這道題就是找一個數字 nonce，讓區塊的雜湊值（比特幣用 SHA-256）小於某個目標值（看起來就是開頭有很多個 0）。雜湊值無法預測，只能一個一個試，所以要花大量運算（這就是「挖礦」），但別人驗證只要算一次。",false]],[["延伸陷阱",true],["：PoW 非常耗電；以太坊在 2022 年已改用",false],["權益證明（Proof of Stake, PoS）",true],["，由抵押代幣的人輪流驗證，不必比算力。如果題目問「為什麼難以竄改」：改了一個舊區塊，它的雜湊值就變了，後面所有區塊都要重新挖，除非攻擊者掌握超過一半的算力（51% 攻擊），否則追不上誠實的節點。",false]],[["同主題考古題",true],["：112-3 公有鏈共識機制、111-25 區塊鏈。",false]]],"opts_title":"參考答案（PoW 的步驟）","opts":[{"h":[["① 收集交易",true]],"x":[[["使用者發出的交易廣播到網路上，礦工把尚未確認的交易收集起來組成候選區塊；區塊標頭包含前一個區塊的雜湊值、交易的 Merkle root、時間戳記和 nonce。",false]]]},{"h":[["② 挖礦（找 nonce）",true]],"x":[[["礦工不斷改變 nonce、計算區塊標頭的雜湊值，直到雜湊值小於網路規定的目標值（難度）。",false]]]},{"h":[["③ 廣播與驗證",true]],"x":[[["最先找到的礦工把區塊廣播出去；其他節點只要算一次雜湊就能確認答案正確，並檢查區塊內的交易是否合法（例如有沒有重複花費）。",false]]]},{"h":[["④ 上鏈與獎勵",true]],"x":[[["驗證通過後，大家把這個區塊接到自己的鏈上，開始挖下一個區塊；挖到的礦工得到區塊獎勵和交易手續費。",false]]]},{"h":[["⑤ 分岔與難度調整",true]],"x":[[["兩個礦工同時挖到時會暫時分岔，大家以累積工作量最多（最長）的鏈為準；系統也會定期調整難度，讓出塊時間大致固定（比特幣約 10 分鐘一個區塊）。",false]]]},{"h":[["英文作答範例",true]],"x":[[["In Proof of Work, miners collect pending transactions into a candidate block and repeatedly change a nonce, hashing the block header until the hash is below the network's target value. The first miner to find such a nonce broadcasts the block; other nodes verify it with a single hash computation and check its transactions, then append it to their chains and start mining the next block. The winning miner receives the block reward and the transaction fees. If the chain forks, nodes follow the chain with the most accumulated work, and the difficulty is adjusted periodically to keep the block time stable.",false]]]}],"videos":["https://www.youtube.com/watch?v=bBC-nXj3Ng4","https://www.youtube.com/watch?v=SSo_EIwHSd4"]},"cs:113-17":{"answer":[["這題的正確答案是 ",false],["把上面 n − 1 個盤子從 A 移到 B → 把最大的第 n 個從 A 移到 C → 再把 n − 1 個從 B 移到 C；n == 1 時直接移動",true],["（參考程式見下方）。",false]],"items":[[["題目",true],["：（問答，20 分）請用 C 語言寫出河內塔的遞迴函數 void hanoi(int n, char A, char B, char C)。假設塔 A 上有 n 個盤子，編號 1 到 n（1 最小、在最上面），要把所有盤子從塔 A 移到塔 C。",false]],[["核心觀念",true],["：河內塔的規則：一次只能移一個盤子，大盤子不能放在小盤子上。遞迴的想法是「假設我已經會搬 n − 1 個」：要把 n 個從 A 搬到 C，就先把上面 n − 1 個借 C 暫放到 B，再把最底下最大的盤子搬到 C，最後把 B 上的 n − 1 個借 A 搬到 C。搬 n − 1 個又可以用同樣方法拆成 n − 2 個⋯⋯直到只剩 1 個，直接搬。",false]],[["逐步追蹤",true],["：n = 3：1 A→C、2 A→B、1 C→B、3 A→C、1 B→A、2 B→C、1 A→C，共 7 步。移動次數 T(n) = 2T(n − 1) + 1、T(1) = 1，所以 T(n) = 2ⁿ − 1，時間複雜度 O(2ⁿ)。",false]],[["同主題考古題",true],["：113-15 遞迴反轉字串、106-3 遞迴耗記憶體、111-26、110-27 遞迴。",false]]],"opts_title":"參考答案（C 程式）","opts":[{"h":[["遞迴函數 hanoi",true]],"x":[[["```\n#include <stdio.h>\n\n/* 把 n 個盤子從 A 移到 C，B 當暫存 */\nvoid hanoi(int n, char A, char B, char C) {\n    if (n == 1) {                                     /* 終止條件：只剩一個盤子 */\n        printf(\"Move disk 1 from %c to %c\\n\", A, C);\n        return;\n    }\n    hanoi(n - 1, A, C, B);                            /* 1. 上面 n-1 個：A → B（借 C） */\n    printf(\"Move disk %d from %c to %c\\n\", n, A, C);  /* 2. 最大的第 n 個：A → C */\n    hanoi(n - 1, B, A, C);                            /* 3. n-1 個：B → C（借 A） */\n}\n\nint main(void) {\n    hanoi(3, 'A', 'B', 'C');                          /* 印出 7 步 */\n    return 0;\n}",false]]]},{"h":[["程式重點",true]],"x":[[["參數的意思是「從第 2 個參數搬到第 4 個參數，第 3 個參數當暫存」。遞迴呼叫時只要調換參數順序：hanoi(n - 1, A, C, B) 就是把 n − 1 個從 A 搬到 B（借 C）。",false]],[["n == 1 的終止條件也可以寫成 n == 0 時直接 return（什麼都不搬），程式更短，結果一樣。",false]]]}],"videos":["https://www.youtube.com/watch?v=rf6uf3jNjbo","https://www.youtube.com/watch?v=8lhxIOAfDss"]},"cs:113-18":{"answer":[["這題的正確答案是 ",false],["TTL（Time To Live，存活時間）限制封包最多能經過幾個路由器：每經過一個路由器減 1，減到 0 就丟棄，避免封包在路由迴圈中無限繞行",true],["。",false]],"items":[[["題目",true],["：（問答，10 分）IP 協定中 TTL 欄位的功能是什麼？",false]],[["核心觀念",true],["：IPv4 標頭裡有一個 8 位元的 ",false],["TTL",true],[" 欄位。傳送端設定初始值（例如 Windows 預設 128、Linux 預設 64），封包每經過一個路由器，路由器就把 TTL 減 1；減到 0 時，路由器丟棄封包，並回傳一個 ICMP「Time Exceeded（逾時）」訊息給來源端。叫「存活時間」是因為最初設計以秒為單位，實務上變成「最多經過幾站（hop）」，所以 IPv6 直接改名為 ",false],["Hop Limit",true],["。",false]],[["延伸陷阱",true],["：常用工具 ",false],["traceroute",true],["（Windows 是 tracert）就是利用 TTL：依序送出 TTL = 1、2、3⋯⋯ 的封包，每一站的路由器把 TTL 減到 0 時會回傳 ICMP 訊息，就能知道沿路經過了哪些路由器。ping 的回應裡也看得到 TTL。",false]],[["同主題考古題",true],["：107-10 TTL。",false]]],"opts_title":"參考答案","opts":[{"h":[["主要功能：防止封包無限繞行",true]],"x":[[["路由表設定錯誤時可能形成迴圈（A 傳給 B、B 又傳回 A），沒有 TTL 的話封包會永遠繞下去、塞爆網路；有了 TTL，封包最多經過一定數量的路由器就會被丟棄。",false]]]},{"h":[["附帶用途：限制範圍與網路診斷",true]],"x":[[["可以用小的 TTL 讓封包只在附近傳送；traceroute 利用 TTL 找出路徑上的每一個路由器。",false]]]},{"h":[["英文作答範例",true]],"x":[[["The TTL (Time To Live) field limits the lifetime of an IP packet. The sender sets an initial value, and every router that forwards the packet decrements it by one. When the TTL reaches zero, the router discards the packet and sends an ICMP Time Exceeded message back to the source. This prevents packets from circulating forever in routing loops. Tools such as traceroute also use the TTL to discover the routers along a path.",false]]]}],"videos":["https://www.youtube.com/watch?v=fo2gRWogDGc","https://www.youtube.com/watch?v=DxBoQgPCNsU"]},"cs:113-19":{"answer":[["這題的正確答案是 ",false],["先聽通道（carrier sense）→ 空閒才傳送 → 傳送時持續偵測碰撞 → 發生碰撞就停止並送出 jam 訊號 → 隨機等待（二進位指數退避）後重試",true],["。",false]],"items":[[["題目",true],["：（問答，10 分）請說明乙太網路使用的 CSMA/CD 方法的運作程序。",false]],[["核心觀念",true],["：",false],["CSMA/CD = Carrier Sense Multiple Access with Collision Detection（載波感測多重存取／碰撞偵測）",true],["。早期乙太網路的電腦都接在同一條共用的線上（匯流排或集線器 hub），同一時間只能有一台在傳，兩台同時傳就會",false],["碰撞（collision）",true],["，訊號混在一起變成無效。CSMA/CD 就是「先聽再說、邊說邊聽、撞了就停、等一下再試」。",false]],[["延伸陷阱",true],["：為了確保傳送端在送完之前一定偵測得到碰撞，乙太網路規定訊框最小 64 bytes。現在的乙太網路多用交換器（switch）加全雙工（full-duplex），每條線只連一台設備、可以同時收發，不會再碰撞，CSMA/CD 實際上已經用不到；無線網路則因為無法邊傳邊聽，改用 CSMA/CA（見 113-4）。",false]],[["同主題考古題",true],["：113-4 無線網路（CSMA/CA）。",false]]],"opts_title":"參考答案（CSMA/CD 的步驟）","opts":[{"h":[["① 載波感測（Carrier Sense）",true]],"x":[[["要傳送前先監聽線路，如果有人正在傳（通道忙碌），就等到通道空閒。",false]]]},{"h":[["② 傳送並偵測碰撞（Collision Detection）",true]],"x":[[["通道空閒就開始傳送，傳送的同時持續監聽線路上的訊號，比對是不是和自己送出的一樣。",false]]]},{"h":[["③ 發生碰撞：停止並送出 jam 訊號",true]],"x":[[["偵測到碰撞就立刻停止傳送，並送出一段 jam（干擾）訊號，讓線上所有電腦都知道發生了碰撞。",false]]]},{"h":[["④ 二進位指數退避（Binary Exponential Backoff）",true]],"x":[[["每台碰撞的電腦隨機等待一段時間再回到步驟 ①：第 k 次碰撞後，從 0 到 2ᵏ − 1 中隨機選一個數 r，等待 r 個時槽（slot time，10 Mbps 時是 51.2 微秒）。碰撞越多次，等待範圍越大（k 最大到 10）；連續 16 次都失敗就放棄並回報錯誤。",false]]]},{"h":[["英文作答範例",true]],"x":[[["In CSMA/CD, a station first listens to the medium (carrier sense) and waits until it is idle. It then transmits while continuing to monitor the medium (collision detection). If a collision is detected, the station stops transmitting and sends a jam signal so that all stations know a collision has occurred. Each station then waits a random backoff time chosen by the binary exponential backoff algorithm before trying again, and it gives up after 16 failed attempts.",false]]]}],"videos":["https://www.youtube.com/watch?v=iKn0GzF5-IU"]},"cs:112-1":{"answer":[["這題的正確答案是 ",false],["B. forwarding table",true],["。",false]],"items":[[["題目",true],["：網路交換器（switch）使用一種 ______，和路由器的路由表非常相似。",false]],[["核心觀念",true],["：交換器在資料鏈結層運作，靠",false],["轉送表（forwarding table，也叫 MAC 位址表、CAM 表）",true],["決定訊框要從哪個連接埠送出。它是自己「學」出來的：每收到一個訊框，就把「來源 MAC 位址 ↔ 進來的連接埠」記下來；要轉送時查目的 MAC 位址，查得到就只送往那個埠，查不到就送往所有其他埠（flooding）。路由表則是路由器依 IP 位址決定下一站，兩者都是「查表決定往哪送」，所以很像。",false]],[["同主題考古題",true],["：114-9 轉送 IP 封包的設備、114-12 Ethernet 靠 MAC。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. hash table（雜湊表）— 錯",true]],"x":[[["雜湊表是一種資料結構（交換器內部可能用雜湊來加速查表），但這張表的名稱不是 hash table。",false]]]},{"h":[["B. forwarding table（轉送表）— 對（正確答案）",true]],"x":[[["記錄 MAC 位址與連接埠的對應，交換器依它轉送訊框。",false]]]},{"h":[["C. contingency table（列聯表）— 錯",true]],"x":[[["統計學用來整理兩個類別變數次數的表格，跟網路無關。",false]]]},{"h":[["D. reversing table — 錯",true]],"x":[[["沒有這種網路名詞。",false]]]}],"videos":["https://www.youtube.com/watch?v=sdYDLip2ANI"]},"cs:112-2":{"answer":[["這題的正確答案是 ",false],["D. disguising information by using mathematical rules.",true]],"items":[[["題目",true],["：加密（encryption）是什麼樣的過程？",false]],[["核心觀念",true],["：加密是用數學演算法加上金鑰，把看得懂的",false],["明文（plaintext）",true],["變成看不懂的",false],["密文（ciphertext）",true],["，只有擁有正確金鑰的人才能解密還原，目的是",false],["保密",true],["。要分清楚：偵測錯誤是同位元、CRC、檢查碼的工作；用安全線路傳送是實體保護，不是加密本身。",false]],[["同主題考古題",true],["：114-10 公開金鑰、111-23 對稱式加密、108-4 密碼學。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. transmission of information over secure lines to prevent illegal access（透過安全線路傳送資訊以防止非法存取）— 錯",true]],"x":[[["那是靠實體線路保護；加密的重點是「就算資料在不安全的線路上被攔截，別人也看不懂」。",false]]]},{"h":[["B. detecting errors in messages by using mathematical rules（用數學規則偵測訊息錯誤）— 錯",true]],"x":[[["這是錯誤偵測（例如同位元檢查、CRC），目的是發現傳輸錯誤，不是保密。",false]]]},{"h":[["C. preventing errors in messages by using logical rules（用邏輯規則防止訊息錯誤）— 錯",true]],"x":[[["也是在講資料正確性，跟加密無關。",false]]]},{"h":[["D. disguising information by using mathematical rules（用數學規則把資訊偽裝起來）— 對（正確答案）",true]],"x":[[["例如 AES、RSA 都是用數學運算把明文變成密文。",false]]]}],"videos":["https://www.youtube.com/watch?v=4tFHUXqiAV8"]},"cs:112-3":{"answer":[["這題的正確答案是 ",false],["D. proof of work",true],["。",false]],"items":[[["題目",true],["：公有鏈（public blockchain）通常用 ______ 作為驗證交易的共識機制。",false]],[["核心觀念",true],["：公有鏈任何人都能加入，參與者彼此不認識也不互信，需要一套規則決定「下一個區塊由誰寫」。比特幣用的",false],["工作量證明（Proof of Work, PoW）",true],["是最經典的共識機制：礦工比賽計算雜湊值，先算出符合難度的人取得記帳權（詳見 113-16）。另一種常見的是權益證明（Proof of Stake），以太坊 2022 年後改用它。",false]],[["同主題考古題",true],["：113-16 PoW 程序、111-25 區塊鏈。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. proof of concept（概念驗證）— 錯",true]],"x":[[["指做一個雛形證明想法可行，是專案管理用語，不是共識機制。",false]]]},{"h":[["B. proof of payment（付款證明）— 錯",true]],"x":[[["收據之類的付款憑證，不是區塊鏈共識機制。",false]]]},{"h":[["C. proof of reserve（儲備證明）— 錯",true]],"x":[[["交易所用來證明自己真的持有客戶資產的審計方式，不是用來驗證交易的共識機制。",false]]]},{"h":[["D. proof of work（工作量證明）— 對（正確答案）",true]],"x":[[["比特幣等公有鏈使用，靠大量運算讓竄改紀錄的成本高到不划算。",false]]]}],"videos":["https://www.youtube.com/watch?v=bBC-nXj3Ng4","https://www.youtube.com/watch?v=M3EFi_POhps"]},"cs:112-4":{"answer":[["這題的正確答案是 ",false],["B. Non-fungible token.",true]],"items":[[["題目",true],["：NFT 是什麼的縮寫？",false]],[["核心觀念",true],["：",false],["NFT = Non-Fungible Token（非同質化代幣）",true],["。「同質化（fungible）」是指可以互相替換：你的一元和我的一元完全等值，比特幣也一樣。NFT 則是記錄在區塊鏈上、每一個都獨一無二、有自己編號的代幣，常用來代表數位藝術品、收藏品、遊戲道具的所有權。要注意：擁有 NFT 不等於擁有作品的著作權，原始檔案通常也不在鏈上。",false]],[["同主題考古題",true],["：112-3 公有鏈共識機制、111-25 區塊鏈。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Non-functional token — 錯",true]],"x":[[["functional（功能的）是拼湊的混淆字。",false]]]},{"h":[["B. Non-fungible token（非同質化代幣）— 對（正確答案）",true]],"x":[[["每個代幣都不能互換，所以能證明某個數位物品的唯一所有權。",false]]]},{"h":[["C. New frequency technology — 錯",true]],"x":[[["拼湊的名詞。",false]]]},{"h":[["D. Nano-finance technology — 錯",true]],"x":[[["拼湊的名詞。",false]]]}],"videos":["https://www.youtube.com/watch?v=4dkl5O9LOKg"]},"cs:112-5":{"answer":[["這題的正確答案是 ",false],["A. The class's name.",true]],"items":[[["題目",true],["：在 UML 中，表示類別的長方形最上面那一格放的是什麼？",false]],[["核心觀念",true],["：UML 類別圖（class diagram）用一個分成三格的長方形表示一個類別：",false],["上格是類別名稱",true],["、",false],["中格是屬性（attributes，資料成員）",true],["、",false],["下格是操作（operations，方法／行為）",true],["。屬性和方法前面可以加 + public、− private、# protected 表示存取權限，例如 −name: string、+getName(): string。只有類別名稱是必填的。",false]],[["同主題考古題",true],["：114-3 C++ 物件導向、115-10 多型、111-22 物件導向原則。",false]]],"opts_title":"各選項解析（上名稱、中屬性、下方法）","opts":[{"h":[["A. The class's name（類別名稱）— 對（正確答案）",true]],"x":[[["最上格，例如 Student。",false]]]},{"h":[["B. The class's attributes（類別的屬性）— 錯",true]],"x":[[["放在中間那一格，例如 −id: int、−name: string。",false]]]},{"h":[["C. The class's behaviors（類別的行為）— 錯",true]],"x":[[["行為就是方法（operations），放在最下面那一格，例如 +enroll(course)。",false]]]},{"h":[["D. All of the above — 錯",true]],"x":[[["三種資訊分別放在三格，不是都在上格。",false]]]}],"videos":["https://www.youtube.com/watch?v=UI6lqHOVHic"]},"cs:112-6":{"answer":[["這題的正確答案是 ",false],["C. 24537981",true],["。",false]],"items":[[["題目",true],["：下面這棵「二元搜尋樹」的中序走訪（inorder traversal）是哪一個？（樹：根 7；左子 5、右子 8；5 的左子 4、右子 3；4 的左子 2；8 的左子 9、右子 1）",false]],[["核心觀念",true],["：",false],["中序",true],["是「左子樹 → 根 → 右子樹」；前序是「根 → 左 → 右」；後序是「左 → 右 → 根」。",false]],[["逐步追蹤",true],["：根 7 的左子樹（根 5）：先走 4 的子樹 → 2、4；再 5；再右子 3 → 2 4 5 3。接著根 7。最後右子樹（根 8）：9、8、1。合起來是 2 4 5 3 7 9 8 1。",false]],[["延伸陷阱",true],["：題目說這是二元搜尋樹，但它其實不符合 BST 的規則（3 在 5 的右邊卻比 5 小、9 在 8 的左邊卻比 8 大）。如果真的是 BST，中序走訪會由小到大排好；這裡不是，所以別被「BST 中序一定排序」騙去選 D。中序走訪的定義和樹是不是 BST 無關，照著走就是 C。另外 A 是後序、B 是前序，出題者故意放了三種走訪。",false]],[["同主題考古題",true],["：113-5 由中序＋後序求前序、114 問6 由前序找葉節點、110-40 BST 後序走訪、106 問3。",false]]],"opts_title":"各選項解析（三個選項剛好是三種走訪）","opts":[{"h":[["A. 24359187 — 錯（這是後序）",true]],"x":[[["左 → 右 → 根：2 4 3 5 ／ 9 1 8 ／ 7。",false]]]},{"h":[["B. 75423891 — 錯（這是前序）",true]],"x":[[["根 → 左 → 右：7 ／ 5 4 2 3 ／ 8 9 1。",false]]]},{"h":[["C. 24537981 — 對（中序，正確答案）",true]],"x":[[["左 → 根 → 右：2 4 5 3 ／ 7 ／ 9 8 1。",false]]]},{"h":[["D. None of the above — 錯",true]],"x":[[["C 就是正確的中序走訪。",false]]]}],"videos":["https://www.youtube.com/watch?v=OXy4pLq_XZs"]},"cs:112-7":{"answer":[["這題的正確答案是 ",false],["C. 10.0.17.128",true],["。",false]],"items":[[["題目",true],["：IP 位址 10.0.17.130、子網路遮罩 255.255.255.192，子網路號碼（subnet number）是多少？",false]],[["核心觀念",true],["：子網路號碼 = IP 位址和子網路遮罩",false],["逐位元做 AND",true],["。遮罩是 255 的段直接保留、是 0 的段變 0，只有中間那段要換成二進位計算。",false]],[["逐步追蹤",true],["：前三段遮罩都是 255 → 保留 10.0.17。第四段：130 = 10000010，192 = 11000000，AND 後 = 10000000 = 128。所以子網路號碼是 10.0.17.128。快速算法：192 代表每個子網路大小是 256 − 192 = 64，子網路從 0、64、128、192 開始，130 落在 128～191 這一塊。",false]],[["同主題考古題",true],["：115-19 子網路遮罩、108-7 網路遮罩、111-12 網路號碼、106-5 子網路號碼。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 10.0.0.0 — 錯",true]],"x":[[["這是把遮罩當成 255.0.0.0（/8）時的網路號碼。",false]]]},{"h":[["B. 10.0.17.0 — 錯",true]],"x":[[["這是遮罩 255.255.255.0（/24）時的答案，忽略了第四段的 192。",false]]]},{"h":[["C. 10.0.17.128 — 對（正確答案）",true]],"x":[[["這個子網路涵蓋 10.0.17.128～10.0.17.191，可用主機 .129～.190，.191 是廣播位址。",false]]]},{"h":[["D. 10.0.17.192 — 錯",true]],"x":[[["把遮罩的 192 直接當成答案；10.0.17.192 是下一個子網路的號碼。",false]]]}],"videos":["https://www.youtube.com/watch?v=s_Ntt6eTn94"]},"cs:112-8":{"answer":[["這題的正確答案是 ",false],["C. linking phase.",true]],"items":[[["題目",true],["：當程式設計師使用一個「實作和介面放在不同檔案」的類別時，該類別的實作程式碼是在哪個階段和使用者的程式碼合併的？",false]],[["核心觀念",true],["：C／C++ 把程式變成執行檔的流程：",false],["前置處理",true],["（處理 #include、#define）→ ",false],["編譯（compile）",true],["：每個原始檔各自翻成目的檔（.o／.obj），這時只需要知道類別的介面（標頭檔 .h 裡的宣告）→ ",false],["連結（link）",true],["：連結器把各個目的檔和函式庫合併，把「呼叫了某函數」和「那個函數真正的程式碼」接起來，產生執行檔 → ",false],["載入、執行",true],["。所以類別的實作是在連結階段才併進來的。",false]],[["同主題考古題",true],["：112-24 直譯式語言、106-10 編譯步驟、106-1 直譯器。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. programming phase（撰寫程式階段）— 錯",true]],"x":[[["寫程式時只 #include 標頭檔（介面），實作程式碼還在另一個檔案裡。",false]]]},{"h":[["B. compiling phase（編譯階段）— 錯",true]],"x":[[["編譯時每個原始檔是分開翻譯的，使用者的程式只知道函數的宣告，還沒有拿到實作。",false]]]},{"h":[["C. linking phase（連結階段）— 對（正確答案）",true]],"x":[[["連結器把使用者的目的檔和類別實作的目的檔（或函式庫）合併，解決彼此的函數參照。",false]]]},{"h":[["D. executing phase（執行階段）— 錯",true]],"x":[[["靜態連結時執行檔早已包含所有程式碼。（動態連結函式庫 DLL／.so 是在載入或執行時才連結，但題目說的是一般的連結階段。）",false]]]}],"videos":["https://www.youtube.com/watch?v=oXk87NRTL1Y"]},"cs:112-9":{"answer":[["這題的正確答案是 ",false],["D. port number",true],["。",false]],"items":[[["題目",true],["：TCP/IP 依靠 ______ 來決定訊息應該交給哪一個應用程式。",false]],[["核心觀念",true],["：一台電腦同時跑很多網路程式（瀏覽器、郵件、遊戲），IP 位址只能把資料送到「哪一台電腦」，傳輸層（TCP／UDP）再用",false],["埠號（port number）",true],["決定交給「哪一個程式」。埠號 16 位元（0～65535），0～1023 是知名埠：HTTP 80、HTTPS 443、SSH 22、DNS 53、SMTP 25。IP 位址 + 埠號合起來叫 socket，可以唯一識別一條連線的端點。",false]],[["同主題考古題",true],["：114-12 乙太網路靠 MAC（同一組選項，考的是不同層）、106-6 來源 port。",false]]],"opts_title":"各選項解析（哪一層用什麼位址）","opts":[{"h":[["A. MAC address — 錯",true]],"x":[[["資料鏈結層，決定區域網路內交給哪一台裝置。",false]]]},{"h":[["B. SSID — 錯",true]],"x":[[["Wi-Fi 網路的名稱，用來選擇要連哪個無線網路。",false]]]},{"h":[["C. IP address — 錯",true]],"x":[[["網路層，決定送到網際網路上的哪一台主機，不能區分主機上的程式。",false]]]},{"h":[["D. port number（埠號）— 對（正確答案）",true]],"x":[[["傳輸層，決定交給主機上的哪一個應用程式。",false]]]}],"videos":["https://www.youtube.com/watch?v=VZeF0jPHJdM"]},"cs:112-10":{"answer":[["這題的正確答案是 ",false],["A. ARP",true],["。",false]],"items":[[["題目",true],["：______ 用來把 IP 位址解析成資料鏈結層位址（MAC 位址）。",false]],[["核心觀念",true],["：",false],["ARP（Address Resolution Protocol）",true],["：已知 IP、要找 MAC 時，廣播詢問「誰是這個 IP？」，對方回覆自己的 MAC，結果存進 ARP 快取（詳見 113-7）。容易混淆的 DNS 是把「網域名稱」轉成 IP，方向和層級都不同。",false]],[["同主題考古題",true],["：115-2、113-7 ARP。",false]]],"opts_title":"各選項解析（各種「轉換」）","opts":[{"h":[["A. ARP — 對（正確答案）",true]],"x":[[["IP 位址 → MAC 位址。",false]]]},{"h":[["B. DNS — 錯",true]],"x":[[["網域名稱 → IP 位址，例如 www.nsysu.edu.tw → 140.117.x.x。",false]]]},{"h":[["C. HTTP — 錯",true]],"x":[[["傳送網頁的應用層協定，不做位址轉換。",false]]]},{"h":[["D. NAT — 錯",true]],"x":[[["私有 IP ↔ 公有 IP 的轉換（見 114-1），不是轉成 MAC。",false]]]}],"videos":["https://www.youtube.com/watch?v=cn8Zxh9bPio"]},"cs:112-11":{"answer":[["這題的正確答案是 ",false],["B. System calls can only be executed under kernel mode.",true]],"items":[[["題目",true],["：下列關於系統呼叫（system call）的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：CPU 有兩種模式（",false],["雙模式 dual mode",true],["）：",false],["使用者模式",true],["跑一般程式，不能直接碰硬體；",false],["核心模式",true],["跑作業系統，可以執行特權指令。一般程式需要讀檔、印東西、開網路連線時，就發出",false],["系統呼叫",true],["，透過 trap 切換到核心模式，由作業系統代為執行，做完再切回使用者模式。所以系統呼叫是「使用者模式的程式向作業系統請求服務的介面」。",false]],[["延伸陷阱",true],["：B 的爭議在於「執行」指誰：系統呼叫的服務程式確實在核心模式下執行，但系統呼叫本來就是讓使用者模式的程式發出的，說它「只能在核心模式下執行」就否定了它的用途，所以判斷 B 是錯誤敘述。C 說雙模式是為了防止惡意程式攻擊，比較精確的說法是「保護作業系統不被出錯或惡意的使用者程式破壞」，算大致正確。學校沒有公布答案。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. System calls are an interface for accessing computer resources（系統呼叫是存取電腦資源的介面）— 正確",true]],"x":[[["程式要用檔案、記憶體、裝置、網路，都要透過系統呼叫向作業系統請求，例如 open()、read()、write()、fork()。",false]]]},{"h":[["B. System calls can only be executed under kernel mode（系統呼叫只能在核心模式下執行）— 錯誤（正確答案）",true]],"x":[[["系統呼叫是由使用者模式的程式發出的；發出時 CPU 才切換到核心模式處理。如果只有核心模式能用，一般程式就沒辦法請作業系統幫忙了。",false]]]},{"h":[["C. The dual mode is to protect systems from malware attacks（雙模式是為了保護系統不受惡意程式攻擊）— 大致正確",true]],"x":[[["雙模式讓使用者程式不能直接執行特權指令、亂改記憶體或硬體設定，可以保護作業系統不被有錯誤或惡意的程式破壞。",false]]]},{"h":[["D. All input or output functions in a program must get through system calls（程式中所有輸入輸出都必須經過系統呼叫）— 正確",true]],"x":[[["I/O 指令是特權指令，使用者程式不能直接做；像 printf()、scanf() 這些函式庫函數，底層最後都會呼叫 write()、read() 等系統呼叫。",false]]]}],"videos":["https://www.youtube.com/watch?v=fLS99zJDHOc"]},"cs:112-12":{"answer":[["這題的正確答案是 ",false],["D. NoSQL databases use key-value to access data. Therefore, a table can be indexed by the key.",true]],"items":[[["題目",true],["：下列關於資料庫的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：",false],["關聯式資料庫",true],["用表格存資料，每個表格有主鍵（primary key）唯一識別每一列，大家都用 SQL 查詢（各家產品有些方言差異，但核心語法相同）。",false],["NoSQL",true],[" 不是只有一種，主要分四類：",false],["鍵值（key-value，如 Redis）",true],["、",false],["文件（document，如 MongoDB）",true],["、",false],["寬欄（wide-column，如 Cassandra）",true],["、",false],["圖形（graph，如 Neo4j）",true],["。D 把 NoSQL 都當成鍵值資料庫，是以偏概全。",false]],[["延伸陷阱",true],["：A、B、C 嚴格來說也有例外（各家 SQL 方言不同、實務上可以建立沒有主鍵的表、有些 NoSQL 提供類 SQL 的查詢語言），但都是一般教科書認定的正確敘述；D 的錯誤最明顯。學校沒有公布答案。",false]],[["同主題考古題",true],["：115-7 NoSQL vs 關聯式、110-38 NoSQL 種類、112-18 ACID。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. All relational databases use the same query language to access databases（所有關聯式資料庫都用同一種查詢語言）— 正確",true]],"x":[[["都用 SQL（MySQL、Oracle、SQL Server、PostgreSQL），只是各有擴充語法。",false]]]},{"h":[["B. In relational databases, every table is indexed by a key（關聯式資料庫每個表格都以鍵來索引）— 正確",true]],"x":[[["關聯式模型要求每個關聯（表格）都有能唯一識別每一列的鍵（主鍵），資料庫通常也會自動替主鍵建立索引。",false]]]},{"h":[["C. SQL is not used for accessing NoSQL databases（SQL 不用來存取 NoSQL 資料庫）— 正確",true]],"x":[[["NoSQL 通常有自己的存取方式，例如 MongoDB 用 JSON 格式的查詢、Redis 用 GET／SET 指令。",false]]]},{"h":[["D. NoSQL databases use key-value to access data. Therefore, a table can be indexed by the key（NoSQL 都用鍵值存取資料，所以表格可以用鍵來索引）— 錯誤（正確答案）",true]],"x":[[["鍵值只是 NoSQL 的其中一類；文件、寬欄、圖形資料庫的存取方式都不同，而且很多 NoSQL 根本沒有「表格」的概念。",false]]]}],"videos":["https://www.youtube.com/watch?v=mMdZEAKtntA","https://www.youtube.com/watch?v=Q5aTUc7c4jg"]},"cs:112-13":{"answer":[["這題的正確答案是 ",false],["B. IoT devices can be accessed through WLAN, but not WAN.",true]],"items":[[["題目",true],["：下列關於物聯網（IoT）的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：IoT 裝置就是有連網能力的物品。它們可以透過區域網路（WLAN、藍牙、Zigbee）連線，也可以透過廣域網路（WAN，也就是網際網路）讓你在外面用手機 App 遠端控制家裡的冷氣、看監視器。正因為能從網際網路連進來，才會被攻擊（D）。",false]],[["同主題考古題",true],["：113-3 IoT（藍牙耳機、網路攝影機）。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. An IoT device refers to an object that has network access（IoT 裝置是指具有網路存取能力的物品）— 正確",true]],"x":[[["連網就是 IoT 的定義。",false]]]},{"h":[["B. IoT devices can be accessed through WLAN, but not WAN（IoT 裝置只能透過無線區域網路存取，不能透過廣域網路）— 錯誤（正確答案）",true]],"x":[[["很多 IoT 裝置都設計成能從外部網路存取，例如出門在外用手機開家裡的燈、看網路攝影機的畫面。",false]]]},{"h":[["C. Bluetooth earphones are IoT devices（藍牙耳機是 IoT 裝置）— 正確",true]],"x":[[["和 113-3 的說法相同，以廣義來說屬於物聯網穿戴裝置。",false]]]},{"h":[["D. If an IoT device connects to the internet, it might be compromised by attackers（IoT 裝置連上網際網路就可能被攻擊者入侵）— 正確",true]],"x":[[["例如預設密碼沒改的網路攝影機被 Mirai 殭屍網路入侵。",false]]]}],"videos":["https://www.youtube.com/watch?v=SvFyd8DpRkw"]},"cs:112-14":{"answer":[["這題的正確答案是 ",false],["B. 7",true],["。",false]],"items":[[["題目",true],["：系統有 3 個實體頁框（frame），一開始都是空的。參考字串為 a b c d b a f b a c b a c，使用 LRU 頁替換演算法會產生幾次分頁錯誤（page fault）？",false]],[["核心觀念",true],["：",false],["LRU（Least Recently Used，最近最少使用）",true],["：要替換時，選「最久沒被用到」的那一頁換掉。每次存取時，只要頁面在頁框裡就是命中（hit），並把它更新成「最近剛用過」；不在就是分頁錯誤。前 3 次一定是錯誤（頁框是空的）。",false]],[["逐步追蹤",true],["：a 錯〔a〕、b 錯〔a b〕、c 錯〔a b c〕；d 錯，最久沒用的是 a → 〔b c d〕；b 命中；a 錯，最久沒用的是 c → 〔d b a〕；f 錯，最久沒用的是 d → 〔b a f〕；b 命中、a 命中；c 錯，最久沒用的是 f → 〔b a c〕；b、a、c 都命中。分頁錯誤共 7 次（a、b、c、d、a、f、c）。",false]],[["同主題考古題",true],["：115-5 page fault、108-8 LRU 分頁、110-11 最佳頁替換次數。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 6 — 錯",true]],"x":[[["可能漏算了一開始填滿頁框的 3 次，或把某次替換算成命中。",false]]]},{"h":[["B. 7 — 對（正確答案）",true]],"x":[[["3 次填滿空頁框 + 4 次替換（d 換 a、a 換 c、f 換 d、c 換 f）。",false]]]},{"h":[["C. 8 — 錯",true]],"x":[[["如果用 FIFO（先進先出）會得到不同的結果，作答時要確認題目指定的演算法。",false]]]},{"h":[["D. 9 — 錯",true]],"x":[[["比正確答案多，可能把被更新過的頁面當成最久沒用的。",false]]]}],"videos":["https://www.youtube.com/watch?v=4wVp97-uqr0"]},"cs:112-15":{"answer":[["這題的正確答案是 ",false],["D. The best case of divide-and-conquer takes 1 comparison.",true]],"items":[[["題目",true],["：N 枚硬幣中有一枚比較輕的假幣，可以用循序搜尋或各個擊破（divide-and-conquer）找出來。下列敘述何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：",false],["循序搜尋",true],["：拿硬幣兩兩上天平比，哪邊輕就是假幣；運氣好第一次就找到（1 次），運氣差要比到最後，約 N/2 次 → O(N)。",false],["各個擊破",true],["：把硬幣分成兩堆（或三堆）放上天平，假幣一定在比較輕的那堆，每秤一次就排除一半，一直分到剩一枚為止，需要約 log₂N 次 → O(log N)。",false]],[["延伸陷阱",true],["：各個擊破的特點是每次都要一路分到底，不管假幣在哪裡，秤的次數都差不多是 log₂N，沒有「第一次就找到」的好運氣（除非只有 2、3 枚硬幣）。所以最佳情況要 1 次是循序搜尋的特性，不是各個擊破的。",false]],[["同主題考古題",true],["：115-9 Big-O、113-13 時間複雜度、111-8 二分搜尋複雜度。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. The time complexity of the divide-and-conquer is O(logN)（各個擊破的時間複雜度是 O(log N)）— 正確",true]],"x":[[["每次排除一半，比較次數約 log₂N。",false]]]},{"h":[["B. The time complexity of the sequential search is O(N)（循序搜尋的時間複雜度是 O(N)）— 正確",true]],"x":[[["最差要比到最後一組。",false]]]},{"h":[["C. The best case of sequential search takes 1 comparison（循序搜尋最佳情況只要比 1 次）— 正確",true]],"x":[[["假幣剛好在第一組，第一次秤就看出哪邊輕。",false]]]},{"h":[["D. The best case of divide-and-conquer takes 1 comparison（各個擊破最佳情況只要比 1 次）— 錯誤（正確答案）",true]],"x":[[["每秤一次只能把範圍縮小一半，要一直分到剩一枚才知道是哪一枚，最佳情況也要約 log₂N 次。",false]]]}],"videos":["https://www.youtube.com/watch?v=QVDz0Z6dhas"]},"cs:112-16":{"answer":[["這題的正確答案是 ",false],["C. In the client-server model, a client makes a request and the server sends back the response, so a web server cannot be attacked by a web user.",true]],"items":[[["題目",true],["：下列敘述何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：網頁採用",false],["主從式架構（client-server）",true],["：瀏覽器（用戶端）送出請求，網頁伺服器回傳回應。「只是送請求」並不代表安全：攻擊者可以在請求裡夾帶惡意內容攻擊伺服器，例如 ",false],["SQL 注入（SQL injection）",true],["、跨站腳本（XSS）、大量請求癱瘓伺服器的 DDoS。反過來，使用者瀏覽網頁也可能被攻擊（B，見 113-8 路過式下載）。",false]],[["同主題考古題",true],["：113-8 惡意程式、110-16 DDoS、109-35 網路攻擊。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Users use the client-server model to access web servers（使用者用主從式架構存取網頁伺服器）— 正確",true]],"x":[[["瀏覽器是用戶端，網站是伺服器。",false]]]},{"h":[["B. Users can be attacked by web browsing（使用者瀏覽網頁可能被攻擊）— 正確",true]],"x":[[["例如路過式下載、釣魚網站、惡意腳本。",false]]]},{"h":[["C. ... so a web server cannot be attacked by a web user（所以網頁伺服器不會被網頁使用者攻擊）— 錯誤（正確答案）",true]],"x":[[["例如在登入表單輸入 ' OR '1'='1 這類字串，如果伺服器沒有檢查就直接拼進 SQL 查詢，就可能繞過登入或竊取資料庫內容（SQL 注入）。",false]]]},{"h":[["D. The username/password is a common user authentication mechanism for users to access a web server（帳號密碼是常見的使用者驗證機制）— 正確",true]],"x":[[["最常見的驗證方式；更安全的做法是再加上兩步驟驗證（見 109-28）。",false]]]}],"videos":["https://www.youtube.com/watch?v=ciNHn38EyRc"]},"cs:112-17":{"answer":[["這題的正確答案是 ",false],["A. Given a k-bit register, the range of signed integers that can be represented by 2's complement is between -(2^(k-1)-1) and (2^(k-1)-1).",true]],"items":[[["題目",true],["：1 補數與 2 補數都用來表示有號整數。下列敘述何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：",false],["1 補數",true],["：負數 = 正數每個位元反轉。",false],["2 補數",true],["：負數 = 反轉後再加 1。k 位元的範圍：1 補數是 −(2^(k−1) − 1) ～ 2^(k−1) − 1，有 +0 和 −0 兩個零；",false],["2 補數是 −2^(k−1) ～ 2^(k−1) − 1",true],["，只有一個零，所以負數多一個。以 8 位元為例：2 補數是 −128～127，1 補數是 −127～127。",false]],[["同主題考古題",true],["：111-3 −5 的 8 位元 2 補數、110-12 2 補數加法、114 填4 IEEE 浮點數。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 2 補數的範圍是 −(2^(k−1) − 1) 到 2^(k−1) − 1 — 錯誤（正確答案）",true]],"x":[[["這是 1 補數（或符號大小表示法）的範圍。2 補數的最小值是 −2^(k−1)，例如 4 位元的 1000 = −8，範圍是 −8～7。",false]]]},{"h":[["B. In 2's complement, 110010 represents −14（2 補數 110010 代表 −14）— 正確",true]],"x":[[["最高位元是 1 → 負數。求大小：反轉 001101，加 1 得 001110 = 14，所以是 −14。",false]]]},{"h":[["C. 求 2 補數：把數字反轉，再在最低位元（LSB）加 1 — 正確",true]],"x":[[["例如 5 = 0101 → 反轉 1010 → 加 1 = 1011，就是 4 位元的 −5。",false]]]},{"h":[["D. In 1's complement, 1111 represents 0, while in 2's complement, 1111 represents −1（1 補數 1111 代表 0，2 補數 1111 代表 −1）— 正確",true]],"x":[[["1 補數的 1111 是 0000 反轉來的，代表 −0；2 補數的 1111 反轉 0000 再加 1 = 0001，所以是 −1。",false]]]}],"videos":["https://www.youtube.com/watch?v=4qH4unVtJkE"]},"cs:112-18":{"answer":[["這題的正確答案是 ",false],["C. RDMS use locks to ensure that at any time only one user changes the data.",true]],"items":[[["題目",true],["：銀行等許多應用用關聯式資料庫管理系統（RDBMS）處理使用者資料，RDBMS 滿足 ACID 特性。下列關於關聯式資料庫的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：",false],["ACID",true],["：",false],["原子性（Atomicity）",true],["交易中的動作全部完成或全部不做；",false],["一致性（Consistency）",true],["交易前後資料都符合規則（例如轉帳前後總金額不變）；",false],["隔離性（Isolation）",true],["同時進行的交易互不干擾；",false],["持久性（Durability）",true],["交易完成後結果永久保存。隔離性常用",false],["鎖（lock）",true],["實現，但鎖的範圍可以小到單一資料列，不同使用者可以同時修改不同的資料。",false]],[["延伸陷阱",true],["：D 的「all the time」嚴格說有爭議（交易進行到一半時可能暫時不一致，只是別人看不到），但一般教科書把一致性說成「資料庫永遠維持在一致的狀態」，出題者應該認為 D 正確；C 的「任何時候只有一個使用者能改資料」錯得最明顯。學校沒有公布答案。",false]],[["同主題考古題",true],["：112-12 資料庫、115-7 NoSQL vs 關聯式、110-36 3NF。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Atomicity property guarantees that each transaction is treated as a single operation（原子性保證每筆交易被當成單一操作）— 正確",true]],"x":[[["轉帳的「扣款」和「入帳」要嘛都成功，要嘛都失敗，不會只做一半。",false]]]},{"h":[["B. Entity-Relation models contain two major elements: entity and relationship（ER 模型有兩個主要元素：實體與關係）— 正確",true]],"x":[[["實體（例如學生、課程）和關係（例如修課），另外還有描述它們的屬性。",false]]]},{"h":[["C. RDMS use locks to ensure that at any time only one user changes the data（RDBMS 用鎖確保任何時候只有一個使用者修改資料）— 錯誤（正確答案）",true]],"x":[[["鎖只鎖住「正在被修改的那筆資料」，避免兩人同時改同一筆造成錯誤；其他使用者仍然可以同時修改別的資料。如果整個資料庫一次只能一個人改，銀行系統根本撐不住。",false]]]},{"h":[["D. Consistency property ensures that the data is in a consistent state all the time（一致性確保資料一直處於一致狀態）— 大致正確",true]],"x":[[["交易只能讓資料庫從一個合法狀態變成另一個合法狀態，違反規則的交易會被取消。",false]]]}],"videos":["https://www.youtube.com/watch?v=pomxJOFVcQs"]},"cs:112-19":{"answer":[["這題的正確答案是 ",false],["D. Cloud computing is often used for big data analysis so that a large amount of data can be stored and processed in a single machine.",true]],"items":[[["題目",true],["：下列關於雲端運算的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：雲端運算是透過網路，按需求租用遠端的運算資源。三種服務模式：",false],["IaaS（基礎設施即服務）",true],["租虛擬機器、儲存、網路，自己裝作業系統和軟體（例如 AWS EC2）；",false],["PaaS（平台即服務）",true],["提供開發與執行環境，只要上傳程式（例如 Google App Engine）；",false],["SaaS（軟體即服務）",true],["直接用軟體（例如 Gmail、Google 文件）。雲端本質上是",false],["分散式運算",true],["：大量資料分散存在很多台機器、一起平行處理（例如 Hadoop、Spark）。",false]],[["同主題考古題",true],["：112-26 虛擬化、110-34 雲端／霧／邊緣運算、109-6 Spark。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. There are three types of cloud computing: IaaS, PaaS, and SaaS（雲端有 IaaS、PaaS、SaaS 三種）— 正確",true]],"x":[[["這是 NIST 定義的三種服務模式。",false]]]},{"h":[["B. IaaS mainly provides virtual machines with the given hardware specs you need（IaaS 主要提供你指定規格的虛擬機器）— 正確",true]],"x":[[["例如選 4 核心 CPU、16 GB 記憶體的虛擬機器，按使用時間計費。",false]]]},{"h":[["C. Cloud computing is a type of distributed computing that requires high-speed networks（雲端運算是需要高速網路的分散式運算）— 正確",true]],"x":[[["資源分散在資料中心的大量機器上，使用者也要透過網路存取。",false]]]},{"h":[["D. ... a large amount of data can be stored and processed in a single machine（大量資料可以存放並處理在單一機器上）— 錯誤（正確答案）",true]],"x":[[["大數據正是因為一台機器存不下、算不完，才要用雲端把資料和運算分散到成百上千台機器。",false]]]}],"videos":["https://www.youtube.com/watch?v=3V67iunYN1I"]},"cs:112-20":{"answer":[["這題的正確答案是 ",false],["A",true],["（curNode->prev->next = curNode->next; curNode->next->prev = curNode->prev;）。",false]],"items":[[["題目",true],["：下面的程式宣告了一個雙向鏈結串列。假設節點 curNode 不是第一個也不是最後一個節點，哪一段程式可以刪除 curNode？",false]],[["選項（在原卷第 4 頁）",true],["：A. curNode->prev->next = curNode->next; curNode->next->prev = curNode->prev;　B. curNode->prev->next = curNode->prev; curNode->next->prev = curNode->next;　C. curNode->next->next = curNode->next; curNode->prev->prev = curNode->prev;　D. curNode->next = curNode->prev->next; curNode->prev = curNode->next->prev;",false]],[["核心觀念",true],["：雙向鏈結串列每個節點有 prev（指向前一個）和 next（指向後一個）。刪除中間的節點 B（A ⇄ B ⇄ C），要讓 A 和 C 直接相連，跳過 B：",false],["A 的 next 改指 C",true],["、",false],["C 的 prev 改指 A",true],["。用 curNode 表示：A 是 curNode->prev、C 是 curNode->next。改完之後再 free(curNode) 釋放記憶體。",false]],[["同主題考古題",true],["：113-13 鏈結串列時間複雜度、112-30 鏈結串列 vs 陣列。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A — 對（正確答案）",true]],"x":[[["前一個節點的 next 指向後一個節點、後一個節點的 prev 指向前一個節點，curNode 就被跳過了。",false]]]},{"h":[["B — 錯",true]],"x":[[["前一個節點的 next 指向「自己的前一個」、後一個節點的 prev 指向「自己的後一個」，串列整個亂掉。",false]]]},{"h":[["C — 錯",true]],"x":[[["改的是後一個的 next 和前一個的 prev，完全沒動到跟 curNode 相連的那兩個指標，curNode 還在串列裡，而且後面的節點會指向自己。",false]]]},{"h":[["D — 錯",true]],"x":[[["改的是 curNode 自己的指標（而且算出來還是指向自己），前後節點仍然指著 curNode，沒有真的刪掉。",false]]]}],"videos":["https://www.youtube.com/watch?v=7yNUXcOcHwE","https://www.youtube.com/watch?v=njTh_OwMljA"]},"cs:112-21":{"answer":[["這題的正確答案是 ",false],["A、B、C、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列哪（幾）個屬於監督式學習（supervised learning）？",false]],[["核心觀念",true],["：",false],["監督式學習",true],["：訓練資料有標準答案（標籤 label），模型學習「輸入 → 答案」的對應，用在分類、迴歸，例如垃圾郵件分類、房價預測。",false],["非監督式學習",true],["：資料沒有標籤，讓模型自己找結構，例如分群（clustering）、降維。",false],["強化學習",true],["則是靠獎勵試誤（見 114-7）。判斷方法：訓練時需不需要事先標好答案。",false]],[["同主題考古題",true],["：114-8 SVM、114-7 強化學習、112-23 CNN。",false]]],"opts_title":"各選項解析（訓練資料有沒有標籤）","opts":[{"h":[["A. Support vector machine（支援向量機）— 監督式（正確答案）",true]],"x":[[["用標好類別的資料找出分隔超平面（見 114-8）。",false]]]},{"h":[["B. Naïve Bayes classifier（單純貝氏分類器）— 監督式（正確答案）",true]],"x":[[["用標好類別的資料計算機率，假設特徵彼此獨立，常用於垃圾郵件過濾。",false]]]},{"h":[["C. K-nearest neighbors（K 最近鄰）— 監督式（正確答案）",true]],"x":[[["新資料看離它最近的 K 筆「已知類別」的資料，多數決決定類別；要有標籤才能投票。",false]]]},{"h":[["D. Convolutional neural networks（卷積神經網路）— 監督式（正確答案）",true]],"x":[[["CNN 是一種網路架構，最典型的用法是用大量標好類別的圖片訓練影像分類，屬於監督式學習。",false]]]},{"h":[["E. K-means clustering（K 平均分群）— 非監督式",true]],"x":[[["資料沒有標籤，演算法自己把資料分成 K 群（例如依消費行為把顧客分群）。注意不要和 KNN 搞混：名字都有 K，但 KNN 是分類（監督式），K-means 是分群（非監督式）。",false]]]}],"videos":["https://www.youtube.com/watch?v=W01tIRP_Rqs"]},"cs:112-23":{"answer":[["這題的正確答案是 ",false],["B、C、E",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列哪（幾）個是以卷積神經網路（CNN）為基礎的？",false]],[["核心觀念",true],["：",false],["卷積神經網路（CNN）",true],["用卷積層（小濾鏡在圖片上滑動，擷取邊緣、紋理等特徵）和池化層，專門處理影像。ImageNet 影像辨識競賽（ILSVRC）催生了一系列有名的 CNN 架構：AlexNet（2012）、VGG、",false],["GoogLeNet",true],["（2014 冠軍，又稱 ",false],["Inception",true],[" v1，特色是同時用多種大小的濾鏡）、",false],["ResNet",true],["（2015 冠軍，用殘差連接讓網路可以疊到上百層）。陷阱是 ImageNet 和 WordNet 名字很像網路架構，但它們是資料集和詞彙資料庫。",false]],[["同主題考古題",true],["：112-21 監督式學習、111-28 深度學習、115-14 LLM 架構。",false]]],"opts_title":"各選項解析（看它是模型還是資料）","opts":[{"h":[["A. WordNet — 不是",true]],"x":[[["普林斯頓大學建立的英文詞彙資料庫，把同義詞分組並標出上下位關係，常用於自然語言處理，不是神經網路。",false]]]},{"h":[["B. ResNet — 是（正確答案）",true]],"x":[[["殘差網路（Residual Network），用跳接（skip connection）解決網路太深難以訓練的問題。",false]]]},{"h":[["C. Inception — 是（正確答案）",true]],"x":[[["Google 提出的 CNN 架構，Inception 模組同時用 1×1、3×3、5×5 等不同大小的卷積再合併；Inception v1 就是 GoogLeNet。",false]]]},{"h":[["D. ImageNet — 不是",true]],"x":[[["一個超過一千萬張、標好類別的大型影像資料集（類別架構還是依 WordNet 建立的），是用來訓練和比賽的資料，不是模型。",false]]]},{"h":[["E. GoogLeNet — 是（正確答案）",true]],"x":[[["2014 年 ImageNet 競賽冠軍，22 層的 CNN（名字的 LeNet 是向早期 CNN 經典 LeNet 致敬）。",false]]]}],"videos":["https://www.youtube.com/watch?v=KuXjwB4LzSA"]},"cs:112-24":{"answer":[["這題的正確答案是 ",false],["A、B、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列哪（幾）種程式語言是由直譯器（interpreter）執行的？",false]],[["核心觀念",true],["：",false],["編譯式（compiled）",true],["：執行前先用編譯器把整個程式翻成機器碼，產生執行檔，之後直接執行，速度快，例如 C、C++。",false],["直譯式（interpreted）",true],["：由直譯器邊讀邊翻譯邊執行，不必先產生執行檔，方便測試修改，但通常比較慢，例如 Python、R、MATLAB、JavaScript。組合語言則是用",false],["組譯器（assembler）",true],["一對一翻成機器碼。",false]],[["延伸陷阱",true],["：Python 實際上會先編譯成位元組碼（bytecode）再由虛擬機器執行，Java 也類似，所以分界不是絕對的；但考試一般把 Python 歸為直譯式。",false]],[["同主題考古題",true],["：112-8 連結階段、106-1 直譯器、106-10 編譯步驟。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Python — 直譯（正確答案）",true]],"x":[[["在互動模式輸入一行就執行一行，是最典型的直譯式語言。",false]]]},{"h":[["B. Matlab — 直譯（正確答案）",true]],"x":[[["在命令視窗輸入指令馬上得到結果，由 MATLAB 環境直譯執行。",false]]]},{"h":[["C. C — 編譯",true]],"x":[[["用 gcc 等編譯器編譯、連結成執行檔後才執行（見 112-8）。",false]]]},{"h":[["D. R — 直譯（正確答案）",true]],"x":[[["統計分析語言，在 R 主控台或 RStudio 中逐行直譯執行。",false]]]},{"h":[["E. Assembly（組合語言）— 組譯",true]],"x":[[["由組譯器把助憶碼（例如 MOV、ADD）翻成機器碼，不是由直譯器執行。",false]]]}],"videos":["https://www.youtube.com/watch?v=zn86PlkH8Zg"]},"cs:112-25":{"answer":[["這題的正確答案是 ",false],["B、C、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列哪（幾）種機制曾被用來實現差分隱私（differential privacy）？",false]],[["核心觀念",true],["：",false],["差分隱私",true],["的想法是：查詢統計結果時加入精心設計的",false],["隨機雜訊",true],["，讓「資料庫裡有沒有某一個人」幾乎不影響輸出結果，攻擊者就無法從結果反推個人資料（可以防禦 115-17 的成員推論攻擊）。隱私程度用參數 ε 控制，ε 越小雜訊越大、越保護隱私。三種經典機制：",false],["Laplace 機制",true],["（加拉普拉斯分布的雜訊，用於數值查詢）、",false],["Gaussian 機制",true],["（加常態分布的雜訊）、",false],["Exponential 機制",true],["（用於選出最佳選項等非數值輸出）。美國 2020 年人口普查和 Apple、Google 收集使用資料都用了差分隱私。",false]],[["同主題考古題",true],["：115-17 Agent 攻擊（成員推論、模型反演）。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Linear mechanism — 不是",true]],"x":[[["沒有這個標準機制，是混淆選項。",false]]]},{"h":[["B. Laplace mechanism（拉普拉斯機制）— 是（正確答案）",true]],"x":[[["最基本的差分隱私機制：查詢結果加上 Laplace 分布的雜訊，雜訊大小依查詢的敏感度和 ε 決定。",false]]]},{"h":[["C. Exponential mechanism（指數機制）— 是（正確答案）",true]],"x":[[["輸出不是數字時使用，例如「選出最受歡迎的商品」：分數越高的選項被選中的機率越大，但仍帶有隨機性。",false]]]},{"h":[["D. Gaussian mechanism（高斯機制）— 是（正確答案）",true]],"x":[[["加常態分布的雜訊，實現稍微寬鬆的 (ε, δ) 差分隱私，常用於機器學習訓練（例如 DP-SGD）。",false]]]},{"h":[["E. Triangular mechanism — 不是",true]],"x":[[["不是常見的差分隱私機制，是混淆選項。",false]]]}],"videos":["https://www.youtube.com/watch?v=pT19VwBAqKA"]},"cs:112-26":{"answer":[["這題的正確答案是 ",false],["A、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列哪（幾）項敘述正確？",false]],[["核心觀念",true],["：",false],["虛擬化（virtualization）",true],["是用軟體（虛擬機器監視器 hypervisor，例如 VMware、Hyper-V、KVM）把一台實體電腦的 CPU、記憶體、儲存、網路切分成多台",false],["虛擬機器（VM）",true],["，每台 VM 可以跑不同的作業系統，彼此隔離。好處是提高硬體使用率、方便備份搬移（快照、即時遷移），而且一台 VM 當機不會影響其他 VM；代價是多了一層轉換，效能會有一點損耗。",false]],[["延伸陷阱",true],["：D「保護機器不受系統當機影響」要從隔離來理解：某台 VM 的作業系統當機，實體機和其他 VM 照常運作，還能用快照快速還原，所以判斷為正確；但如果是實體機或 hypervisor 本身故障，上面所有 VM 都會受影響。學校沒有公布答案。",false]],[["同主題考古題",true],["：112-19 雲端運算、110-34 雲端／霧／邊緣運算。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 透過虛擬化，一台實體機器可以變成多台不同作業系統的機器 — 正確（正確答案）",true]],"x":[[["例如一台伺服器上同時跑 Windows Server 和 Linux 的虛擬機器。",false]]]},{"h":[["B. Virtualization can make programs run faster（虛擬化可以讓程式跑得更快）— 錯",true]],"x":[[["多了一層虛擬化轉換，程式通常會稍微變慢；虛擬化的目的是提高資源使用率和管理彈性，不是加速。",false]]]},{"h":[["C. 虛擬化可以虛擬 RAM 和 CPU，但不能虛擬網路 — 錯",true]],"x":[[["網路也能虛擬化：虛擬網卡、虛擬交換器、VLAN、軟體定義網路（SDN）都是。",false]]]},{"h":[["D. Virtualization can protect machines from system crashes（虛擬化可以保護機器不受系統當機影響）— 正確（正確答案）",true]],"x":[[["VM 之間互相隔離，一台當機不會拖垮其他台；還可以用快照還原到當機前的狀態。",false]]]}],"videos":["https://www.youtube.com/watch?v=FZR0rG3HKIk"]},"cs:112-27":{"answer":[["這題的正確答案是 ",false],["A、B",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列關於演算法的敘述，哪（幾）項正確？",false]],[["核心觀念",true],["：",false],["演算法",true],["是解決問題的一組明確、有限的步驟，不限於電腦（食譜、組裝說明書也是演算法）。表示演算法的方式有：自然語言、",false],["流程圖（flowchart）",true],["（用圖形符號和箭頭表示流程，直觀）、",false],["虛擬碼（pseudocode）",true],["（用接近程式語言的文字描述，容易轉成程式），以及程式語言本身。",false]],[["延伸陷阱",true],["：D 說虛擬碼比流程圖精確。兩者都是表示演算法的工具，精確程度取決於寫得多詳細，沒有誰天生比較精確：流程圖畫得仔細一樣精確，虛擬碼寫得粗略也不精確。所以判斷 D 不正確。學校沒有公布答案。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. A flowchart is a way of presenting an algorithm（流程圖是呈現演算法的一種方式）— 正確（正確答案）",true]],"x":[[["用橢圓（開始／結束）、長方形（處理）、菱形（判斷）和箭頭表示步驟與流程。",false]]]},{"h":[["B. An algorithm is used to describe a problem solution（演算法用來描述問題的解法）— 正確（正確答案）",true]],"x":[[["演算法就是「解題步驟」，寫成程式後電腦才能執行。",false]]]},{"h":[["C. Algorithms can be only used for computer programming（演算法只能用於電腦程式設計）— 錯",true]],"x":[[["生活中的食譜、做菜步驟、計算稅金的流程都是演算法。",false]]]},{"h":[["D. Pseudocode describes more precisely than a flowchart（虛擬碼描述得比流程圖精確）— 不選",true]],"x":[[["兩者只是表達方式不同（文字 vs. 圖形），精確度看寫的人怎麼寫，不是表示法本身決定的。",false]]]}],"videos":["https://www.youtube.com/watch?v=TxnQRSvnTBA"]},"cs:112-28":{"answer":[["這題的正確答案是 ",false],["A、B、C、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）一個有 N 個頂點、M 條邊的有向加權圖 G(V, E)，用相鄰矩陣表示。下列哪（幾）項敘述正確？",false]],[["核心觀念",true],["：最短路徑問題的經典演算法：",false],["Dijkstra 演算法",true],["（單一起點到所有終點）是",false],["貪婪演算法",true],["：每次從尚未確定的頂點中，選目前距離最小的那個確定下來，再更新它鄰居的距離；用相鄰矩陣實作是 O(N²)。",false],["Floyd-Warshall 演算法",true],["（所有起點到所有終點）用動態規劃，三層迴圈，O(N³)。Dijkstra 的前提是",false],["邊的權重不能是負的",true],["。",false]],[["延伸陷阱",true],["：① A、C 成立的前提是權重非負（一般道路距離、時間都是），有負權重時貪婪法會出錯，要改用 Bellman-Ford。② D：從單一起點到所有點的最短路徑，每個點只要記住「從哪個點過來」（前一個頂點），合起來就是一棵以起點為根的",false],["最短路徑樹",true],["，所以是樹狀結構。學校沒有公布答案。",false]],[["同主題考古題",true],["：110-13 BFS／DFS、111-1 DFS 用的資料結構。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 貪婪演算法可以找到單一起點到單一終點的最佳路徑 — 正確（正確答案）",true]],"x":[[["跑 Dijkstra 到終點被確定為止即可（權重非負時）。",false]]]},{"h":[["B. 找出所有起點到所有終點的最佳路徑需要 O(N³) — 正確（正確答案）",true]],"x":[[["Floyd-Warshall：對每個中繼點 k，檢查每對 (i, j) 經過 k 會不會更短，N × N × N 次。",false]]]},{"h":[["C. 貪婪演算法可以找到單一起點到所有終點的最佳路徑 — 正確（正確答案）",true]],"x":[[["這正是 Dijkstra 演算法做的事。",false]]]},{"h":[["D. 單一起點到所有終點的解一定是樹狀結構 — 正確（正確答案）",true]],"x":[[["每個頂點只有一個「前一站」，沒有迴圈，形成以起點為根的最短路徑樹。",false]]]}],"videos":["https://www.youtube.com/watch?v=GazC3A4OQTE","https://www.youtube.com/watch?v=oNI0rf2P9gE"]},"cs:112-29":{"answer":[["這題的正確答案是 ",false],["C、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列關於排序的敘述，哪（幾）項正確？",false]],[["核心觀念",true],["：常見排序法比較：",false],["快速排序（quick sort）",true],["平均 O(n log n)、最差 O(n²)（每次選到最大或最小值當基準，例如資料已經排好）；",false],["合併排序（merge sort）",true],["最差也是 O(n log n)，但合併時需要 O(n) 的額外空間；",false],["插入排序（insertion sort）",true],["O(n²)，只需 O(1) 額外空間，而且是",false],["穩定排序",true],["（相同的值排序後保持原本的先後順序）。",false]],[["同主題考古題",true],["：109-26 排序法複雜度、106-9 quicksort 平均、109-12 氣泡排序、113-13 BST 時間複雜度。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 快速排序是各個擊破演算法，所以最差時間複雜度是 O(n log n) — 錯",true]],"x":[[["快速排序確實是各個擊破，但最差情況（基準每次都選到極端值，切成 0 和 n−1 兩堆）是 O(n²)；O(n log n) 是平均情況。",false]]]},{"h":[["B. 合併排序比插入排序快（O(n log n)），而且用的空間和插入排序一樣多 — 錯",true]],"x":[[["時間的部分對，空間錯：合併排序需要 O(n) 的暫存陣列，插入排序只需要 O(1)。",false]]]},{"h":[["C. 二元搜尋樹查詢很快，但時間複雜度取決於樹的結構 — 正確（正確答案）",true]],"x":[[["平衡時 O(log n)，歪成一直線時退化成 O(n)（見 113-13）。",false]]]},{"h":[["D. Insertion sort is a steady sort（插入排序是穩定排序）— 正確（正確答案）",true]],"x":[[["題目的 steady 指 stable。插入排序遇到相等的值不會互相交換，所以原本的先後順序保持不變。",false]]]}],"videos":["https://www.youtube.com/watch?v=kPRA0W1kECg","https://www.youtube.com/watch?v=qBsIuGKR3O0"]},"cs:112-30":{"answer":[["這題的正確答案是 ",false],["A、B、C、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）一筆資料占 D bytes，整數占 2 bytes，指標占 4 bytes。N 是佇列（queue）預期最多的資料筆數，n 是實際存放的筆數。佇列可以用陣列或鏈結串列實作，下列哪（幾）項正確？",false]],[["核心觀念",true],["：",false],["陣列實作",true],["：一開始就要配置 N 格，空間 = D × N，再加上記錄頭尾位置的 front、rear 兩個整數（2 + 2 = 4 bytes），總共 ",false],["DN + 4",true],["，不管實際存幾筆都一樣。",false],["鏈結串列實作",true],["：每個節點 = 資料 D + 指向下一個的指標 4，存 n 筆是 n(D + 4)，再加上 front、rear 兩個指標（4 + 4 = 8 bytes），總共 ",false],["n(D + 4) + 8",true],["，用多少配多少。",false]],[["逐步追蹤",true],["：B：存 N 筆時，串列 = N(D + 4) + 8 = DN + 4N + 8，比陣列多 (DN + 4N + 8) − (DN + 4) = ",false],["4N + 4",true],[" ✓。C：一筆資料兩個整數 → D = 4。陣列 = 4N + 4；串列存 N/2 筆 = (N/2)(4 + 4) + 8 = 4N + 8。4N + 4 < 4N + 8，陣列比較省 ✓。",false]],[["同主題考古題",true],["：112-20 雙向鏈結串列、113-13 鏈結串列時間複雜度。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Array implementation takes D×N+4 bytes（陣列實作占 D×N + 4 bytes）— 正確（正確答案）",true]],"x":[[["N 格資料加上 front、rear 兩個 2-byte 整數。",false]]]},{"h":[["B. 存 N 筆時，鏈結串列比陣列多占 4N + 4 bytes — 正確（正確答案）",true]],"x":[[["每個節點多一個 4-byte 指標（共 4N），頭尾指標比頭尾整數多 4 bytes。",false]]]},{"h":[["C. 如果 n = N/2 且一筆資料存兩個整數，陣列實作比較省空間 — 正確（正確答案）",true]],"x":[[["資料很小（4 bytes）時，指標的額外負擔和資料一樣大，串列就算只存一半，也還比陣列多 4 bytes。",false]]]},{"h":[["D. If N is not provided, linked list implementation is more flexible（不知道 N 時，鏈結串列比較有彈性）— 正確（正確答案）",true]],"x":[[["陣列必須事先決定大小，配太小會不夠、配太大浪費；串列可以隨時用 malloc 新增節點。",false]]]}],"videos":["https://www.youtube.com/watch?v=mQJPJC0f5Ik"]},"cs:111-1":{"answer":[["這題的正確答案是 ",false],["C. Stack",true],["。",false]],"items":[[["題目",true],["：實作深度優先搜尋（depth first search, DFS）演算法時，通常使用哪一種資料結構？",false]],[["核心觀念",true],["：",false],["DFS",true],["「一路往深處走，走不下去再退回上一個岔路」，最後走到的點最先處理，正好是",false],["堆疊（stack，後進先出 LIFO）",true],["的特性；用遞迴寫 DFS 時，系統的呼叫堆疊就扮演這個角色。",false],["BFS（廣度優先搜尋）",true],["則是「一層一層往外擴」，先發現的點先處理，用",false],["佇列（queue，先進先出 FIFO）",true],["。口訣：DFS 配 stack、BFS 配 queue。",false]],[["同主題考古題",true],["：110-13 BFS／DFS、109-27 BFS 用 queue、110-21 LIFO。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Heap（堆積）— 錯",true]],"x":[[["堆積用於優先佇列（每次取出最大或最小值），例如 Dijkstra 演算法、堆積排序。",false]]]},{"h":[["B. Queue（佇列）— 錯",true]],"x":[[["佇列是 BFS 用的。",false]]]},{"h":[["C. Stack（堆疊）— 對（正確答案）",true]],"x":[[["後進先出，讓 DFS 總是先處理最近發現的點，達到「往深處走」的效果。",false]]]},{"h":[["D. Tree（樹）— 錯",true]],"x" i-Fi 6E 新增的頻段，也是它和 Wi-Fi 6 最大的差別。",false]]]},{"h":[["E. None of the above — 錯",true]],"x":[[["A、C、D 都是。",false]]]}],"videos":["https://www.youtube.com/watch?v=7Bzc4XypgIw"]},"cs:111-25":{"answer":[["這題的正確答案是 ",false],["B、C、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列關於區塊鏈技術的敘述，哪些正確？",false]],[["核心觀念",true],["：區塊鏈是",false],["去中心化",true],["的分散式帳本：每個區塊記錄一批交易，並包含",false],["前一個區塊的雜湊值",true],["，一個接一個串成鏈；只要改動任何一個舊區塊，它的雜湊值就變了，後面的鏈全部對不上，所以很難竄改。誰來寫下一個區塊則由共識機制決定，最常見的是",false],["工作量證明（PoW）",true],["（見 113-16）。",false]],[["同主題考古題",true],["：113-16 PoW 程序、112-3 公有鏈共識機制、112-4 NFT。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Using daisy chain topology（使用菊鍊拓撲）— 錯",true]],"x":[[["菊鍊是把設備一個接一個串接的「網路／線路接法」（例如 SCSI 裝置）。區塊鏈的「鏈」是區塊之間用雜湊值連結的資料結構，參與節點之間是點對點（P2P）網路，不是菊鍊拓撲。",false]]]},{"h":[["B. A decentralized mechanism（去中心化的機制）— 正確（正確答案）",true]],"x":[[["沒有銀行等中央機構，每個節點都保存一份帳本。",false]]]},{"h":[["C. Proof of work is popularly used（普遍使用工作量證明）— 正確（正確答案）",true]],"x":[[["比特幣等主流公有鏈使用（以太坊後來改為權益證明）。",false]]]},{"h":[["D. Using cryptographic hash algorithms（使用密碼學雜湊演算法）— 正確（正確答案）",true]],"x":[[["例如 SHA-256，用來串連區塊、挖礦（PoW）和產生地址。",false]]]},{"h":[["E. None of the above — 錯",true]],"x":[[["B、C、D 都正確。",false]]]}],"videos":["https://www.youtube.com/watch?v=SSo_EIwHSd4"]},"cs:111-26":{"answer":[["這題的正確答案是 ",false],["A、B、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列關於遞迴的敘述，哪些正確？",false]],[["核心觀念",true],["：",false],["遞迴函數",true],["是會呼叫自己的函數，由兩部分組成：",false],["基本情況（base case）",true],["直接回傳答案、不再遞迴；",false],["遞迴情況",true],["把問題縮小後呼叫自己。每次呼叫都要在",false],["堆疊",true],["上配置新的框架（參數、區域變數、返回位址），所以比迴圈多了函數呼叫的負擔；如果永遠到不了基本情況，堆疊會被用光，發生",false],["堆疊溢位（stack overflow）",true],["。",false]],[["同主題考古題",true],["：111-6 遞迴程式、113-17 河內塔、106-3 遞迴耗記憶體、110-27 遞迴。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. A recursive function is a function that calls itself（遞迴函數是呼叫自己的函數）— 正確（正確答案）",true]],"x":[[["例如 factorial(n) = n * factorial(n − 1)。",false]]]},{"h":[["B. 同一問題可以用遞迴或迴圈解時，遞迴版本通常有額外的運算負擔 — 正確（正確答案）",true]],"x":[[["每次呼叫都要建立、回收堆疊框架，耗時也耗記憶體；有些遞迴（例如天真的費氏數列）還會重複計算同樣的子問題。",false]]]},{"h":[["C. One cannot use for-loops in a recursive function（遞迴函數裡不能用 for 迴圈）— 錯",true]],"x":[[["沒有這種限制，例如回溯法（排列組合、八皇后）常常在遞迴函數裡用迴圈嘗試每個選項。",false]]]},{"h":[["D. 遞迴函數永遠到不了基本情況時，會造成堆疊溢位 — 正確（正確答案）",true]],"x":[[["無限遞迴會一直配置堆疊框架，直到堆疊空間用完、程式崩潰。",false]]]},{"h":[["E. None of the above — 錯",true]],"x":[[["A、B、D 都正確。",false]]]}],"videos":["https://www.youtube.com/watch?v=rf60MejMz3E"]},"cs:111-27":{"answer":[["這題的正確答案是 ",false],["D、E",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）關聯 T(A1, A2, A3, A4, A5, A6, A7) 有下列函數相依：A1 → A3、A2 → A4、A4 → A5、{A1, A2} → {A6, A7}、A6 → A1、A7 → A2。下列哪些敘述正確？",false]],[["核心觀念",true],["：",false],["鍵（key，候選鍵）",true],["是能唯一決定所有屬性的",false],["最小",true],["屬性集合（111-30 的 C 就是這個定義）。判斷方法：算屬性集合的",false],["閉包（closure）",true],["：從集合出發，反覆套用函數相依，看最後能推出哪些屬性。閉包包含全部屬性 → 是",false],["超鍵（superkey）",true],["；再檢查拿掉任何一個屬性後就不再是超鍵 → 才是鍵。",false]],[["逐步追蹤",true],["：{A1, A2}⁺：A1 → A3、A2 → A4 → A5、{A1, A2} → A6, A7 → 全部 ✓，而 A1 或 A2 單獨都推不出全部，所以 {A1, A2} 是鍵。{A2, A6}⁺：A6 → A1，有了 A1、A2 就能推出全部 ✓，單獨 A2 或 A6 都不行，是鍵。{A3, A6, A7}：A6 → A1、A7 → A2 → 全部，是超鍵；但拿掉 A3，{A6, A7} 就已經能推出全部，所以不是最小、不算鍵。{A1, A4, A7}：A7 → A2 → 全部，但 {A1, A7} 就夠了，也不是最小。{A1, A3}：推不出 A2，不是超鍵。",false]],[["延伸陷阱",true],["：這個關聯的候選鍵共有 4 個：{A1, A2}、{A1, A7}、{A2, A6}、{A6, A7}。B、C 是超鍵但不是鍵，最容易被誤選。",false]],[["同主題考古題",true],["：111-30 關聯式資料庫、109-17 函數相依、110-36 3NF、109-18 BCNF。",false]]],"opts_title":"各選項解析（先算閉包，再看是不是最小）","opts":[{"h":[["A. (A1, A3) is a key — 錯",true]],"x":[[["{A1, A3}⁺ = {A1, A3}，推不出其他屬性。",false]]]},{"h":[["B. (A3, A6, A7) is a key — 錯（是超鍵，但不是最小）",true]],"x":[[["{A6, A7} 就能決定所有屬性，A3 是多餘的。",false]]]},{"h":[["C. (A1, A4, A7) is a key — 錯（是超鍵，但不是最小）",true]],"x":[[["{A1, A7} 就能決定所有屬性，A4 是多餘的。",false]]]},{"h":[["D. (A2, A6) is a key — 對（正確答案）",true]],"x":[[["A6 → A1，再由 {A1, A2} 推出全部；兩者缺一不可。",false]]]},{"h":[["E. (A1, A2) is a key — 對（正確答案）",true]],"x":[[["直接由 {A1, A2} → {A6, A7} 等相依推出全部；兩者缺一不可。",false]]]}],"videos":["https://www.youtube.com/watch?v=hgM-J93DaiM"]},"cs:111-28":{"answer":[["這題的正確答案是 ",false],["A、B、C",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列關於深度學習的敘述，哪些正確？",false]],[["核心觀念",true],["：",false],["深度學習",true],["是使用多層類神經網路的機器學習方法，靈感大致來自人腦神經元互相連結傳遞訊號的方式。「深度」指的是",false],["層數很多",true],["（隱藏層多），不是節點多。常見架構：",false],["CNN",true],["（卷積，擅長影像）、",false],["RNN／LSTM",true],["（循環，擅長序列資料如文字、語音、時間序列）、",false],["Transformer",true],["（現代大型語言模型的基礎，見 115-14）。",false]],[["同主題考古題",true],["：112-23 CNN、115-14 LLM 架構、110-31 深度神經網路。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. CNNs are commonly used to process images（CNN 常用來處理影像）— 正確（正確答案）",true]],"x":[[["卷積層用小濾鏡擷取影像的局部特徵（邊緣、紋理、形狀）。",false]]]},{"h":[["B. RNNs can be used to process sequential data（RNN 可以處理序列資料）— 正確（正確答案）",true]],"x":[[["RNN 有「記憶」，會把前一步的狀態傳給下一步，適合文字、語音。",false]]]},{"h":[["C. Deep learning is loosely inspired by the human brain（深度學習大致受到人腦啟發）— 正確（正確答案）",true]],"x":[[["人工神經元模仿生物神經元「接收訊號、加權加總、達到門檻就激發」的概念，但實際運作和人腦差很多，所以說 loosely。",false]]]},{"h":[["D. The \"deep\" in deep learning refers to the number of nodes（深度指的是節點數）— 錯",true]],"x":[[["deep 指網路的層數（深度）；每層有多少節點叫寬度。",false]]]},{"h":[["E. None of the above — 錯",true]],"x":[[["A、B、C 都正確。",false]]]}],"videos":["https://www.youtube.com/watch?v=aircAruvnKk"]},"cs:111-29":{"answer":[["這題的正確答案是 ",false],["C、D",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列哪些儲存媒體是非揮發性的（non-volatile）？",false]],[["核心觀念",true],["：",false],["揮發性（volatile）",true],["記憶體斷電後資料就消失，例如各種 RAM；",false],["非揮發性（non-volatile）",true],["斷電後資料還在，例如 ROM、快閃記憶體（隨身碟、SSD、手機儲存空間）、硬碟、光碟。RAM 分兩種：",false],["DRAM",true],["（動態，用電容存資料、要定期刷新，便宜、容量大，做主記憶體）和 ",false],["SRAM",true],["（靜態，用正反器、不用刷新，快但貴，做快取）；SDRAM 是與時脈同步的 DRAM（電腦的 DDR 記憶體就是）。",false]],[["同主題考古題",true],["：110-1 記憶體、111-5 儲存裝置、110-9 SSD 優點。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. SDRAM（同步動態隨機存取記憶體）— 揮發性",true]],"x":[[["DDR4、DDR5 都屬於 SDRAM，斷電資料就消失。",false]]]},{"h":[["B. DRAM（動態隨機存取記憶體）— 揮發性",true]],"x":[[["用電容儲存電荷，會漏電，連通電時都要定期刷新，斷電就消失。",false]]]},{"h":[["C. ROM（唯讀記憶體）— 非揮發性（正確答案）",true]],"x":[[["存放開機程式（BIOS／韌體），斷電仍保留。",false]]]},{"h":[["D. Flash memory（快閃記憶體）— 非揮發性（正確答案）",true]],"x":[[["隨身碟、SSD、記憶卡都是，可以電子方式抹除重寫。",false]]]},{"h":[["E. Static RAM（靜態隨機存取記憶體）— 揮發性",true]],"x":[[["不需要刷新，但斷電資料一樣會消失。",false]]]}],"videos":["https://www.youtube.com/watch?v=bzkpKhgfG4g"]},"cs:111-30":{"answer":[["這題的正確答案是 ",false],["A、B、C",true],["（複選）。",false]],"items":[[["題目",true],["：（複選）下列關於關聯式資料庫的敘述，哪些正確？",false]],[["核心觀念",true],["：",false],["正規化",true],["的層級由寬到嚴：1NF ⊃ 2NF ⊃ 3NF ⊃ BCNF ⊃ 4NF ⊃ 5NF，越後面限制越嚴格，",false],["符合高層級就一定符合低層級",true],["。各種鍵：",false],["超鍵",true],["能唯一識別每一筆資料的屬性集合；",false],["候選鍵",true],["是最小的超鍵（可以有好幾個）；",false],["主鍵",true],["是從候選鍵中挑一個；",false],["外來鍵",true],["是參照另一個表格主鍵的欄位，用來建立表格之間的關聯，本身不一定唯一。",false]],[["同主題考古題",true],["：111-27 函數相依、110-36 3NF、109-18 BCNF、106 問6 函數相依與正規化。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. If a relation is in BCNF, it also satisfies 3NF（符合 BCNF 就一定符合 3NF）— 正確（正確答案）",true]],"x":[[["BCNF 要求每個函數相依的左邊都是超鍵，比 3NF 更嚴格。",false]]]},{"h":[["B. A relation may have multiple candidate keys（一個關聯可以有多個候選鍵）— 正確（正確答案）",true]],"x":[[["例如學生表的學號和身分證字號都能唯一識別學生；111-27 也有 4 個候選鍵。",false]]]},{"h":[["C. A key is a minimal set of attributes that can uniquely identify tuples（鍵是能唯一識別資料列的最小屬性集合）— 正確（正確答案）",true]],"x":[[["這就是候選鍵的定義：唯一性 + 最小性。",false]]]},{"h":[["D. A foreign key is also a superkey（外來鍵也是超鍵）— 錯",true]],"x":[[["例如修課表的「學號」是參照學生表的外來鍵，同一個學號可以出現很多次（一個學生修很多課），在修課表裡不能唯一識別資料列，所以不是超鍵。",false]]]},{"h":[["E. If a relation is in 2NF, it also satisfies 3NF（符合 2NF 就一定符合 3NF）— 錯",true]],"x":[[["方向反了：符合 3NF 才一定符合 2NF。2NF 還可能有遞移相依（非鍵屬性決定另一個非鍵屬性），不一定符合 3NF。",false]]]}],"videos":["https://www.youtube.com/watch?v=GFQaEYEc8_8"]},"cs:110-1":{"answer":[["這題的正確答案是 ",false],["C. Dynamic RAM is faster than static RAM",true],["。",false]],"items":[[["題目",true],["：下列關於記憶體的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：RAM 分兩種：",false],["SRAM（靜態）",true],["用正反器存資料，不必刷新，",false],["速度快但貴、容量小",true],["，用來做 CPU 快取；",false],["DRAM（動態）",true], 「p 是 const 指標」→ p 不能改指向，但可以透過 p 修改值（常數指標）。",false]],[["延伸陷阱",true],["：i 本身不是 const，直接寫 i = 10 是合法的，所以嚴格來說「那個物件」還是可以被改；但題目的意思是透過 iPtr 修改，const int * 禁止這樣做，所以 D 是錯誤敘述。",false]],[["同主題考古題",true],["：107-5 const 指標、110-25 void 指標、109-7 C 指標變數。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. iPtr is a variable that stores a memory address（iPtr 是存記憶體位址的變數）— 正確",true]],"x":[[["所有指標都是存位址的變數，這裡存的是 i 的位址。",false]]]},{"h":[["B. Statement *iPtr = 10 is invalid（*iPtr = 10 是不合法的）— 正確",true]],"x":[[["iPtr 是指向 const int 的指標，透過它寫入會編譯錯誤。",false]]]},{"h":[["C. iPtr is a pointer variable that points to an object of type int（iPtr 是指向 int 物件的指標）— 正確",true]],"x":[[["指向的型態是 const int（唯讀的 int）。",false]]]},{"h":[["D. The data value of the object that iPtr points to can be modified（iPtr 指向的物件的值可以被修改）— 錯誤（正確答案）",true]],"x":[[["透過 iPtr 不能修改；想要「可以改值但不能改指向」要寫成 int * const iPtr。",false]]]}],"videos":["https://www.youtube.com/watch?v=egvGq3WSF9Y"]},"cs:110-25":{"answer":[["這題的正確答案是 ",false],["C. It will show \"A string\"",true],["。",false]],"items":[[["題目",true],["：編譯並執行下面的程式（char aStr[] = \"A string\"; void *aPtr = &aStr; printf(\"%s\\n\", ((char*) aPtr));），下列何者正確？",false]],[["核心觀念",true],["：",false],["void 指標",true],["是「沒有型態的通用指標」，可以存任何型態的位址，但不能直接解參考，要先",false],["轉型",true],["成具體型態的指標才能使用（malloc 回傳的就是 void *）。&aStr 是「整個陣列」的位址，數值上和陣列第一個字元的位址相同；轉成 char * 之後交給 %s，printf 會從這個位址開始一個字元一個字元印，直到遇到 '\\0'。",false]],[["逐步追蹤",true],["：aStr 在記憶體中是 'A' ' ' 's' 't' 'r' 'i' 'n' 'g' '\\0'。aPtr 存的是 'A' 的位址 → (char*)aPtr 也指向 'A' → %s 印出「A string」。",false]],[["同主題考古題",true],["：110-24 const 指標、109-19 C 指標、106 問4 指標運算。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. It will show compilation errors — 錯",true]],"x":[[["任何物件指標都可以指定給 void *，再轉回 char * 也合法。",false]]]},{"h":[["B. It will show run-time errors — 錯",true]],"x":[[["位址有效、字串有結尾 '\\0'，執行沒問題。",false]]]},{"h":[["C. It will show \"A string\" — 對（正確答案）",true]],"x":[[["%s 從字串開頭印到 '\\0'。",false]]]},{"h":[["D. It will show \"A\" — 錯",true]],"x":[[["要用 %c 印 *(char*)aPtr
