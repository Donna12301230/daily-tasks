<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>中山資管考古題練習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: exam-desk — a slim sticky tab bar, a paper picker rail, and the paper itself (questions above, page scan / OCR text below) */
:root {
  --bg: #eef2f3; --paper: #ffffff; --ink: #18232b; --muted: #5d6b73; --line: #d5dde0;
  --accent: #0d6d77; --accent-soft: #dcefef;
  --ok: #2e7d4f; --ok-soft: #e1f2e7; --bad: #b3263e; --bad-soft: #f8e1e5; --idk: #a86a12; --idk-soft: #f8ecd6;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11181c; --paper: #182227; --ink: #e3eaec; --muted: #9aa9b0; --line: #2c3a41;
  --accent: #5cc0c8; --accent-soft: #163a3e;
  --ok: #6fcf97; --ok-soft: #173426; --bad: #f08a9b; --bad-soft: #3a1c23; --idk: #e8b45f; --idk-soft: #3a2c14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11181c; --paper: #182227; --ink: #e3eaec; --muted: #9aa9b0; --line: #2c3a41;
  --accent: #5cc0c8; --accent-soft: #163a3e;
  --ok: #6fcf97; --ok-soft: #173426; --bad: #f08a9b; --bad-soft: #3a1c23; --idk: #e8b45f; --idk-soft: #3a2c14; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper) }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
header.top { padding-block: 22px 12px; display: grid; gap: 4px }
h1 { font-size: 1.6rem; margin: 0; letter-spacing: .02em; text-wrap: balance }
.sub { color: var(--muted); font-size: .9rem; margin: 0 }
.sync { font-size: .8rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block }
.sync.on i { background: var(--ok) }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 6px; padding-block: 8px; border-bottom: 1px solid var(--line); overflow-x: auto }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; font-weight: 500; white-space: nowrap }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--paper) }
nav.tabs a:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.stats { margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: .82rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums }
.stats b { font-weight: 600 }
.k-ok { color: var(--ok) } .k-bad { color: var(--bad) } .k-idk { color: var(--idk) }

/* year view */
.yearview { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; padding-top: 16px }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); align-self: start; max-height: calc(100vh - 80px); overflow-y: auto; display: grid; gap: 14px }
.rail h3 { font-size: .78rem; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px }
.chips button { font: 600 .82rem var(--font-mono); padding: 5px 0; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 6px; cursor: pointer; position: relative }
.chips button.cur { background: var(--accent); border-color: var(--accent); color: var(--paper) }
.chips button.tagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent) }
.chips button.cur.tagged::after { background: var(--paper) }
.legend { font-size: .76rem; color: var(--muted) }
.credit { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--line); font-size: .78rem; color: var(--muted) }
.paperhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 12px }
.paperhead h2 { margin: 0; font-size: 1.3rem }
.code { font-family: var(--font-mono); font-size: .8rem; color: var(--muted) }
.page { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; overflow: hidden }
.page.flash { box-shadow: 0 0 0 3px var(--accent) }
.pagebar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.pagebar strong { font-size: .95rem }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 .82rem var(--font-body); padding: 4px 12px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent) }
.qlist { display: grid; border-bottom: 1px solid var(--line) }
.q { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 14px; align-items: center; border-top: 1px solid var(--line) }
.q:first-child { border-top: 0 }
.q.hl { background: var(--accent-soft) }
.qid { font: 600 .86rem var(--font-mono) }
.qt { min-width: 0 }
.qt .ch { display: block; font-size: .76rem; color: var(--muted) }
.st { display: inline-flex; gap: 4px }
.st button { border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 6px; font: 500 .8rem var(--font-body); padding: 3px 9px; cursor: pointer }
.st button[data-v="ok"][aria-pressed="true"] { background: var(--ok-soft); color: var(--ok); border-color: var(--ok) }
.st button[data-v="bad"][aria-pressed="true"] { background: var(--bad-soft); color: var(--bad); border-color: var(--bad) }
.st button[data-v="idk"][aria-pressed="true"] { background: var(--idk-soft); color: var(--idk); border-color: var(--idk) }
.ans { grid-column: 2 / -1; display: grid; gap: 4px }
.ans textarea, .pnote textarea { width: 100%; min-height: 38px; resize: vertical; font: .88rem/1.5 var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px }
.ans .toggle { justify-self: start; background: none; border: 0; color: var(--accent); font: .8rem var(--font-body); cursor: pointer; padding: 0 }
.qbody { grid-column: 1 / -1; display: grid; gap: 6px; margin-top: 2px; min-width: 0 }
.crop { position: relative; overflow: hidden; width: 100%; max-width: 900px; border: 1px solid var(--line); border-radius: 6px; background: #fff }
.crop img { position: absolute; left: 0; width: 100%; max-width: none; display: block }
.minibtns { display: flex; flex-wrap: wrap; gap: 4px 14px }
.minibtns button { background: none; border: 0; color: var(--accent); font: .8rem var(--font-body); cursor: pointer; padding: 0 }
.qtx { margin: 0; padding: 10px 12px; background: var(--bg); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: .86rem/1.6 var(--font-body) }
.qwarn { font-size: .78rem; color: var(--idk) }
.hasnote { font-size: .72rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 7px; margin-left: 6px; white-space: nowrap }
.ana { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: .9rem; line-height: 1.7 }
.ana .ansl { margin: 0 0 6px; font-size: .95rem }
.ana .ansl b { color: var(--ok) }
.ana h4 { margin: 12px 0 4px; font-size: .95rem }
.ana ul { margin: 0; padding-left: 20px }
.ana ul ul { list-style: circle; color: var(--muted) }
.ana li { margin: 2px 0 }
.ana .vid { margin: 10px 0 0; display: grid; gap: 2px; font-size: .82rem }
.ana .vid a { font-family: var(--font-mono); color: var(--accent); overflow-wrap: anywhere }
.termbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 16px }
.termbar input[type="search"] { flex: 1 1 220px; font: .92rem var(--font-body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px }
.gchips { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 10px }
.gchips button, .termbar .fbtn { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 3px 11px; font: .8rem var(--font-body); cursor: pointer }
.gchips button[aria-pressed="true"], .termbar .fbtn[aria-pressed="true"] { background: var(--accent); color: var(--paper); border-color: var(--accent) }
.tgroup h2 { font-size: 1.05rem; margin: 18px 0 8px }
.term { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 10px; padding: 10px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px }
.term .star { grid-row: 1 / span 3; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--muted); cursor: pointer; font-size: .95rem }
.term .star[aria-pressed="true"] { background: var(--idk-soft); color: var(--idk); border-color: var(--idk) }
.term .en { font: 600 1rem var(--font-mono); overflow-wrap: anywhere }
.term .zh { font-weight: 500 }
.term .nt { color: var(--muted); font-size: .86rem }
.term .refs { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center }
.term .refs a { font: .74rem var(--font-mono); color: var(--accent); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; text-decoration: none }
.term .refs .none { font-size: .76rem; color: var(--muted) }
.term .refs button { background: none; border: 0; color: var(--muted); font: .76rem var(--font-body); cursor: pointer }
.ocr { margin: 0; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font: .92rem/1.75 var(--font-body) }
.scan { padding: 10px; background: var(--bg); overflow-x: auto }
.scan img { display: block; width: 100%; max-width: 900px; margin: 0 auto; border-radius: 4px; background: #fff }
.note { font-size: .78rem; color: var(--muted); padding: 6px 16px 10px; margin: 0 }
.pnote { padding: 10px 14px; display: grid; gap: 6px; border-bottom: 1px solid var(--line) }
.pnote label { font-size: .8rem; color: var(--muted) }

/* chapter view */
.chapview { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; padding-top: 18px }
.chapview section > h2 { font-size: 1.1rem; margin: 0 0 4px }
.chapview section > p { margin: 0 0 10px; color: var(--muted); font-size: .85rem }
.ck { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px }
.ck > button.head { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; text-align: left; background: none; border: 0; color: var(--ink); padding: 10px 14px; cursor: pointer; font: inherit }
.ck .nm { font-weight: 600; min-width: 0 }
.ck .src { font-size: .76rem; color: var(--muted); grid-column: 1 }
.ck .cnt { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: .8rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.bar { grid-column: 1 / -1; display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line) }
.bar span { display: block }
.bar .b-ok { background: var(--ok) } .bar .b-bad { background: var(--bad) } .bar .b-idk { background: var(--idk) }
.tag { font-size: .7rem; padding: 1px 6px; border-radius: 4px; background: var(--idk-soft); color: var(--idk); margin-left: 6px; font-weight: 500 }
.ck .rows { border-top: 1px solid var(--line) }
.row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; padding: 7px 14px; align-items: center; border-top: 1px solid var(--line); font-size: .88rem }
.row:first-child { border-top: 0 }
.row a { color: var(--accent); font-size: .8rem; white-space: nowrap }
.pill { font-size: .74rem; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--muted) }
.pill.ok { background: var(--ok-soft); color: var(--ok) } .pill.bad { background: var(--bad-soft); color: var(--bad) } .pill.idk { background: var(--idk-soft); color: var(--idk) }
.empty { color: var(--muted); padding: 24px 0 }
.wrongview { padding-top: 18px; max-width: 860px }
.wrongview h2 { font-size: 1.05rem; margin: 18px 0 6px }
.wrongview .row { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px }
.wrongview .mine { grid-column: 2 / -1; color: var(--muted); font-size: .82rem; white-space: pre-wrap }

@media (max-width: 760px) {
  .yearview { grid-template-columns: minmax(0, 1fr) }
  .rail { position: static; max-height: none }
  .chips { grid-template-columns: repeat(6, 1fr) }
  .chapview { grid-template-columns: minmax(0, 1fr) }
  .q, .row { grid-template-columns: 78px minmax(0, 1fr) }
  .q .st, .row > :last-child { grid-column: 2 }
  .stats { display: none }
}
@media (prefers-reduced-motion: no-preference) { .page.flash { transition: box-shadow .4s } }
</style>

門在開發新系統時決定採用瀑布式( waterfall)開發方法，請問以下哪些屬於瀑布\n式的主要步驟與工作 ?\n甲需求分析\n乙開發與實作\n丙部署\n丁敏捷式開發\nA. 甲乙丙\nB. 乙丙丁\nC. 丙丁甲\nD. 乙丁","r":1.4105},{"img":"img/115-mis-10.jpg","txt":"48 · 資訊系統的成功與否，往往取決於專案管理的幾個關鍵因素。請問以下哪些是資訊系統專案\n管理的主要因素 ?\n甲需求與利害關係人管理\n乙策略管理\n丙風險管理\n丁技術與品質管理\nA. 甲乙丙\nB. 乙丙丁\nC. 丙丁甲\nD. 甲乙丁\n49 · 資訊安全預防階段的資安措施分為四個層次，網路防禦層的主要資安工具包含以下哪些 ?\n甲防火牆\n乙網路區隔\n丙加密\n丁虛擬私人網路\nA. 甲乙丙\nB. 乙丙丁\nC. 丙丁甲\nD. 甲乙丁\n50. 資安工具在面對威脅時的主要保護手段之一為偵測與識別威脅來源，偵測與識別威脅的方法\n包含以下哪些 ?\n甲封鎖帳號\n乙特徵碼比對\n丙行為分析\n丁沙箱動態分析\nA. 甲乙丙\nB. 乙丙丁\nC. 丙丁甲\nD. 甲乙丁","r":1.4105}],"qs":[{"id":"115-1","k":"選","t":"ICT 對組織結構的影響","c":"m4","p":1,"crop":[0.1556,0.3144],"tx":"某公司是一家中型零組件製造商，採典型科層式結構，業務、生產與採購各自為政，訊息必\n須層層上報再下達。某次大客戶臨時修改規格，業務需以紙本表單逐級送簽轉交到生產單\n位，導致產線仍依舊版規格生產，造成退貨及顧客抱怨。為了改善問題 'A 公司導入資訊科\n技通訊( Ⅰ CT )工具，請你就資訊管理的觀點來看，此一導入最可能對組織結構產生何影響 ?\nA. 增加階層層級以強化控制\nB. 促進決策集中化\nc · 消除管理者的角色\nD. 降低資訊不對稱並支持去中心化決策"},{"id":"115-2","k":"選","t":"網路效應","c":"m3","p":1,"crop":[0.3128,0.4136],"tx":"2. 在資訊管理領域中，網路效應(Netw 。 rke cts )最常被視為 :\nA · 技術效能的自然結果\nB. 行銷活動的附帶效果\nC. 使用者數量的統計現象\nD. 資訊系統價值隨使用者增加而提升的現象"},{"id":"115-3","k":"選","t":"群眾外包適合的任務","c":"m8","p":1,"crop":[0.4121,0.5342],"tx":"3 · 從「任務一技術配 i&(Task-Technology Fit) 」觀點來看，群眾外包(Crowdsourcing)最適合用於\n哪一類任務 ?\nA. 可模組化且成果可驗證的任務\nB. 模糊且無法切割的決策任務\nC. 高度互賴、即時協調的任務\nD 涉及組織核心競爭力的任務"},{"id":"115-4","k":"選","t":"長尾理論","c":"m3","p":1,"crop":[0.5327,0.6899],"tx":"4 ,\n怪奇比莉( Bi Ⅲ eEilish )從獨立音樂平台 SoundCloucl*æ , 她的作品一開始屬於小眾，但透過網\n路和串流媒體平台，成功繞過亻專統唱片公司的把關，透過網路的傳播力量讓她的音樂迅速累\n積人氣，從小眾內容轉變為全球主流巨星。此一現象說明了長尾理論( L 。 ngtailthe 。能夠在\n數位市場中成立，最關鍵的系統層級前提條件為何 ?\nA. 產品邊際生產成本與儲存成本趨近於零\nB. 高度自動化的供應鏈管理系統\nC. 消費者偏好高度異質化\nD. 能有效降低搜尋成本並精準配對分散需求的資訊系統"},{"id":"115-5","k":"選","t":"IoT 架構分層","c":"s_cloud","p":1,"crop":[0.6883,0.9424],"tx":"某智慧工廠導入物聯網( I 。 T )系統 : 產線上的感測器即時回報溫度、震動與機器運轉狀態，資\n5.\n料透過無線網路傳回雲平台。管理者每天打開儀表板，系統會自動分析設備狀態、預測故\n障時間，並產生「調整產線排程」等決策建議，同時也可將結果自動串接到維修派工流程\n中。在此 Ⅰ 。 T 架構中，哪一層最直接支撐這些管理決策與流程整合 ?\nA. 感測器層\nB. 通訊層\nC. 資料分析與應用層\nD. 裝置識別層\n6.\n從資訊管理系統的角度來看，邊運算(Edgecomputing)的核心價值在於 :\nA. 將即時資料處理與部分決策權下放至接近資料來源的系統節點\nB. 以分散式運算取代集中式雲端架構\n透過邊緣設備大幅降低企業整體 Ⅰ T 硬體成本\nD. 將大量感測資料長期儲存在本地端以利後續分析"},{"id":"115-7","k":"選","t":"SOA","c":"m13","p":2,"crop":[0.0875,0.2537],"tx":"7. 下列關於服務導向架 *(Service-oriented architecture, SOA)的說明，哪一項的敘述是正確的 ?\nA. SOA 的核心理念在於透過標準化介面實現服務之間的鬆散耦合\nB. SOA 透過服務標準化，使企業系統整合可被視為一次性設計問題，而非持續性的治理與演\n化問題\nc. SOA 較難支援服務的重用與擴展，因而不適合大型企業系統\nD. SOA 主要適用於雲端原生( cl 。 · native )環境，對傳統企業系統的適用性有限"},{"id":"115-8","k":"選","t":"微服務","c":"m13","p":2,"crop":[0.2521,0.4019],"tx":"8. 大型電商或串流平台( 例如 :Netflix)會把「會員服務」 、 「訂單服務」 、 「推薦服務」 、 「支\n付服務」等拆成很多小服務，每個都包成一個容器部署。關於容器化技術(Containerization)架\n構的特性，下列哪一項的敘述是正確的 ?\nA. 由於資源隔離的限制，一台伺服器通常僅能支援少數幾個容器\nB. 容器化技術可在架構層面上本質性地簡化系統，因而降低對跨系統協調與治理機制的需求\nc · 容器化主要仰賴人工管理的主機作業系統，以確保應用程式在不同環境中的可攜性\nD. 容器化有助於提升應用程式在不同環境中的部署一致性"},{"id":"115-9","k":"選","t":"客戶資料探勘","c":"s_ai","p":2,"crop":[0.4004,0.5482],"tx":"9 · 金融機構累積了多年來的交易紀錄與客戶資料，每一筆顧客紀錄都包含客戶特斂、交易行\n為，並在事後標註該顧客「是否已流失」 (1 = 已流失 , 0 = 未流失 ) 。若想用這些資料來預測顧\n客未來是否會流失，最適合採用下列哪一種學習方式 ?\nA. 非監督式學習(Unsupervised learning)\nB. 監督式學習(Supervised learning)\nC. 強化學習(Reinforcement leaming)\nD. 遺傳演算法(Genetic algorithm)"},{"id":"115-10","k":"選","t":"AI 醫療影像","c":"s_ai","p":2,"crop":[0.5467,0.7152],"tx":"10. 某大型醫療機構導入 AI 系統，分析大量醫療影像( 如 Ⅹ 光、磁振造影 )以輔助疾病診斷。該系\n統在資料量持續增加時，模型預測準確率顯著提升，但醫師難以清楚理解模型做出判斷的內\n部邏輯。下列哪一項敘述最符合此情境中，系統所採用之深度學習( Deep le g )模型的核心\n特性 ?\nA. 系統主要依賴人工專家事先撰寫的診斷規則\nB. 系統在資料量有限的情況下即可維持穩定效能\nc. 系統通常採用多層神經網路以自動學習高階特徵表示\nD. 系統能清楚呈現每一個預測結果背後的決策邏輯"},{"id":"115-11","k":"選","t":"依管理層級分類系統","c":"m6","p":2,"crop":[0.7136,0.8241],"tx":"11. 關於企業資訊系統依管理層級分類，下列哪些敘述是正確的 ?\nA , 決策資源系統( DSS )主要支援結構化、例行性作業\nB. 交易處理系統( TPS )通常支援半結構化或非結構化決策\nc. 知識管理系統( KM )主要用於彙整 TPS 的資料\nD. 高階管理系統( E Ⅰ s ss )強調整合內外部資訊以支援策略決策"},{"id":"115-12","k":"選","t":"BI 假設分析","c":"m6","p":2,"crop":[0.8226,0.9436],"tx":"12. 某金融機構建置企業智慧( Business intelligence, (I)平台，面臨「如果利率上升1% , 違約率會\n如何變化」的模擬分析需求。針對上述情境，資訊部門需選擇哪一種合適的 BI 分析工具呢 ?\nA. 最適合使用視覺化儀表 *a(Dashboards / Data Visualization)\nB · 最適合使用資料探勘或機器學習技術\nc. 使用屬於 OLAP 的「 Ⅶ la 卜 if 分析」\nD. 上述工具皆無法達成"},{"id":"115-13","k":"選","t":"事件驅動架構","c":"m13","p":3,"crop":[0.137,0.2949],"tx":"13 , 某電商平台以下列方式運作 : 當顧客完成下單時，系統會發布「訂單已建立」事件，物。 ㄊ 、\n/ 丿\n金流與通知等服務各自訂閱這個事件並自動執行出貨、請款與發送訊息等動作。各服務之間\n不直接互相呼叫，而是透過事件發布與訂閱來協作。請問上述作法最符合下列哪一種系統架\n構風格 ?\nA. 服務導向架構(Service-oriented architecture, SOA)\nB. 事件導向架構(Event-driven architecture, EDA)\nC. 微服務架構(Microservices architecture)\nD. 用戶端一伺服端架構(Client-server architecture)"},{"id":"115-14","k":"選","t":"整合服務層（中介軟體）","c":"m13","p":3,"crop":[0.2934,0.4319],"tx":"14. 某企業原本採三層式架構( 前端、應用層、資料庫 ) , 後來新增一個「獨立服務 / 整合層」\n, 專\n門封裝對各種後端系統與資料庫的存取，並以標準 AP Ⅰ 對前端與外部合作夥伴提供服務\n。此\n時，整體系統架構最適合被歸類為下列何者 ?\nA. 三層式系統架構(Three-Tier Architecture)\nB 四層式系統架搆(Four-Tier Architecture)\nC. 客戶端一伺服端架構(Client-Server Architecture)\nD. 單層式架構(MonoIithic Architecture)"},{"id":"115-15","k":"選","t":"IaaS","c":"s_cloud","p":3,"crop":[0.4304,0.5689],"tx":"15 , 某新創公司不想自己買實體伺服器，只希望在需要時「向雲端業者租用虛擬機、儲存空間和\n網路資源」 , 由公司自行決定要裝哪一種作業系統與應用程式，並負責之後的維護與更新。\n這種雲端服務模式最適合被歸類為下列何者 ?\nA. 軟體即月艮務(Software as a Service, SaaS)\nB. 平台即服務(Platform as a Service, PaaS)\n0 基礎設施即月艮務(lnfrastructure a service, IaaS)\nD. 函數即服務(Function as a Service, FaaS)"},{"id":"115-16","k":"選","t":"自然語言處理","c":"s_ai","p":3,"crop":[0.5673,0.6868],"tx":"16. 在下列哪一種資訊系統應用情境中，最明確屬於自然語言處理(Naturallanguageprocessing,NL)\n的典型任務 ?\nA. 分析顧客在社群媒體與評論中的文字內容，以判斷其情緒傾向( 正向、負向、或中立 )\nB. 依據歷史股價預測未來股價走勢\nC 使用感測器資料預測機器設備何時可能故障\nD. 依據顧客過去購買紀錄推薦其他可能感興趣的商品"},{"id":"115-17","k":"選","t":"平台經營模式特點","c":"s_platform","p":3,"crop":[0.6852,0.8619],"tx":"17 · 相較於傳統企業營運模式，下列哪些屬於平台經營模式的特點 ?\n甲平台企業通常同時連結多個使用者群體，形成多邊市場結構\n乙平台企業高度依賴資料蒐集與演算法，以協調交易與提升效率\n丙相較於傳統企業，平台企業在每增加一名使用者時，邊際成本通常較高\n丁平台企業多採取輕資產策略，將實體資產與營運風險外部化\nA. 甲乙丙\nB. 乙丙丁\nC. 甲乙丁\nD. 甲乙丙丁"},{"id":"115-18","k":"選","t":"共享經濟問題","c":"s_platform","p":3,"crop":[0.8603,0.9611],"tx":"18. 下列哪些屬於目前共享經濟平台所面臨的問題及挑戰 ?\n甲平台多將勞動者定位為獨立承攬者，缺乏正式雇傭關係\n乙現行法規多以傳統產業為設計基礎，導致責任歸屬與適用性爭議\n丙共享經濟平台對既有產業造成衝擊，引發不公平競爭的質疑\n丁共享經濟平台的應用高度依賴特定產業情境，使其商業模式在跨產業擴散上受到根本性的"},{"id":"115-19","k":"選","t":"IoT 角色","c":"s_cloud","p":4,"crop":[0.2284,0.4054],"tx":"19 · 下列關於物聯網( Ⅰ 。 T )的角色，下列哪些敘述是正確的 ?\n甲若缺乏完善的資料治理與分析機制 , IoT 系統僅會產生大量但低管理價值的資料\n乙在具備高品質感測資料的前提下 , Ⅰ 。 T 導入通常能自動提升組織的決策品質\n丙 Ⅰ 。 T 與邊缘運算的結合，主要目的在於支援低延遲與即時性的決策需求\n丁相較於資訊系統架構與治理設計 , Ⅰ 。 T 系統的成功主要取決於感測器的精準度\nA. 甲丁\nB. 甲丙\nC. 甲乙丙\nD. 甲乙丙丁"},{"id":"115-20","k":"選","t":"邊緣運算","c":"s_cloud","p":4,"crop":[0.4039,0.5786],"tx":"20. 關於邊緣運算的陳述，下列哪些敘述是正確的 ?\n甲邊緣運算的導入，必然會降低組織對雲端運算的依賴\n乙在即時性要求極高的應用情境中，邊緣運算可降低延遲並提升系統反應能力\n丙邊緣運算的興起，將使資訊系統的治理由單一中心化模式轉為分散式治理\n丁邊緣運算主要是為了解決雲端運算在資料儲存成本過高的問題\nA. 乙丙\nB. 乙丁\nC. 甲丙\nD. 甲乙丙"},{"id":"115-21","k":"選","t":"強化學習","c":"s_ai","p":4,"crop":[0.577,0.7911],"tx":"21. 強化學習(Reinforcementlearnmg)在決策系統中的角色，下列哪些敘述是正確的 ?\n甲強化學習透過獎勵與回饋機制，可提升決策績效的行動策略\n乙在決策環境穩定且目標明確情境下，強化學習特別適合一次性或非重複性的決策問題\n丙由於強化學習模型需在「狀態一行動一回饋」的動態關係中學習，其決策邏輯往往較難以\n完全解釋\n丁即使在企業應用中，成熟的強化學習系統仍通常需要人類設定目標函數、限制條件與監督\n機制\nA. 甲乙\nB. 乙丙\nC. 甲丙\nD. 甲丙丁"},{"id":"115-22","k":"選","t":"DAO","c":"s_fin","p":4,"crop":[0.7895,0.9658],"tx":"22. 去中心化自治組織( DAO )利用部署在公有區塊鏈上的智慧型合約，管理一筆用於社群發展的\n資金。在一次重要的資金分配投票提案通過後，社群成員發現該筆資金的部分份額意外地被\n鎖定在合約中，無法按預期解鎖或轉移，導致專案執行受阻。從智慧型合約設計與去中心化\n治理機制的角度來看，下列哪些敘述最能合理解釋此一意料之外的結果 ?\n甲智慧型合約的程式碼本身可能存在邏輯漏洞( Bug ) , 導致在處理投票結果和資金轉移的函式\n中產生錯誤的狀態鎖定。\n乙區塊鏈的最終性( Finality )代表所有已上鏈的狀態都可以在必要時由系統管理者回滾或手動\n更正，因此資金被鎖定的問題通常可以透過管理者介入來修復。\n丙 DAO 的治理流程設計可能存在缺陷，如審核機制不嚴謹，導致通過了一個帶有惡意或錯誤"},{"id":"115-23","k":"選","t":"企業系統整合（BI 靠 ERP）","c":"m6","p":5,"crop":[0.2681,0.4623],"tx":"23 · 從企業系統整合觀點來看，下列哪些敘述是正確的 ?\n甲 BI 的分析能力高度仰賴企業資源規劃( E ) 、顧客關係管理( CRM ) 、供應鏈管理( SCM )所提\n供的資料\n乙資料治理是企業系統成功的關鍵要素\n丙系統整合往往比單一系統導入更具扌兆戰\n丁所有企業皆應同時導入所有企業系統\nA. 甲乙丙\nB. 乙丙丁\nC. 甲乙丙丁\nD. 以上皆非"},{"id":"115-24","k":"選","t":"ERP vs SCM","c":"m9","p":5,"crop":[0.4607,0.6638],"tx":"24 · 關於企業資源規劃系統( E )與供應鏈系統( SCM )的比較，下列哪些敘述是正確的 ?\n甲 SCM 的核心功能在於整合企業內部跨部門流程與資料，以建立一致的營運基礎\n乙 ERP 的設計重點在於支援跨組織之間的資訊共享與協同決策\n丙 ERP 與 SCM 在系統功能與資料層面上具高度互補性，常透過整合以支援端到端的營運流程\n丁在高度數位化與平台化的情境下 , SCM 系統可作為孩心營運平台，進而完全取代 E 的\n角色\nA. 乙丙\nB. 丙丁\nC. 甲乙丙\nD. 以上皆非"},{"id":"115-25","k":"選","t":"Data Lake","c":"s_ai","p":5,"crop":[0.6623,0.9661],"tx":"25. 一家製造業公司為推動 A Ⅰ 與進階分析，建立 DataLake , ( B )平行化 : 資訊可以在任一不同地點同時提供平行作業\n( C )長尾化 : 透過滿足大批量訂單，有效地服務大眾市場\n( D )分散化 : 企業可以同時集中與分散經營，針對不同任務協同分工\n5 · 企業可以透過防火牆( FirewaII)來防止網際網路上的危險延伸到企業內部。下列關於防火牆的\n說明，請您選出的陳述。\n( A )防火牆無法檢測資料的合法性，不合法資訊亦能傳輸至目的地\n( B )防火牆是可以檢測每個封包的資料安全，因此入侵者絕對無法破壞企業內部網路\n( C )防火牆可以解決企業內部所有的安全問題\n( D )防火牆可以防止網際網路的危險延伸到企業的內部\n6 · 供應鏈( SuppIychain )是一個由多個上中下游廠商所連結形成的一個網路，彼此透過一系列的\n活動與程序來提供產品或是服務給顧客。下列關於供應鏈的說明，請您選出正確的陳述。\n( A )供應鏈的主要活動包含採購、製造、倉儲、運輸及人力資源等五大功能模組\n( B )推式供應鏈又稱為接單後生產( BuiId to order, BTO)ü 式\n( C )拉式供應鏈為最傳統的供應鏈型態，又稱為計畫式生產模式\n( D )推拉式供應鏈的整合具備大量客製化概念，可以滿足規模經濟的好處","r":1.4122},{"img":"img/114-mis-2.jpg","txt":"7 · 顧客關係管理為企業從各種不同的角度來了解及區別顧客，以發展出適合顧客個別需要的產\n品或是服務。下列關於顧客關係管理的說明，請您選出錯誤的陳述。\n( A )相較於舊顧客，顧客關係管理的核心支援是新顧客\n( B )顧客關係管理的策略中，向上銷售是指向顧客銷售企業更新、更好或是更貴的商品\n( C )顧客關係管理可以運用資料探勘技術來提供探索性及預測性的分析\n( D )顧客關係管理所蒐集的資料來源包含銷售點( Point 。 fSaIe ) 、客服中心、顧客訪談與市場調查\n研究等\n8 · 商業智 Z(BusinessIntelligence)是指企業利用快速、即時、整合的資訊科技，來蒐集、分析企\n業內外部環境，以支援決策者的判斷。下列關於商業智慧的說明，請您選出的陳述。\n( A )商業智慧主要的資訊來源為企業外部總體環境、企業外部競爭智慧及內部的企業管理智慧\n( B )商業智慧決策可以透過線上即時分析或是資料探勘等方法進行資料分析\n( c )資料倉儲為資料超市的一部分子集合資料組合\n( D )線上即時分析主要提供單一維度的分析功能，以快速擷取所需資訊\n9 · 除了防火牆之外，網路安全的第二個重要機制為資訊的加密與解密。下列關於資訊加密系統\n的說明，請您選出的陳述。\n( A )非對稱式加密法是傳統加密法，買賣雙方同時擁有一組同樣的金鑰( Key )來加密和解密\n( B )加密是指將原始文件轉換成亂碼，必須透過解密的金鑰( Key )才能讀出原文的程序\n(C)Publickey 是公開的，可以讓業務往來的顧客或是銀行知道\n( D )非對稱式加密採用 Secretkey 必須常常更換，導致較高的管理複雜度及成本較\n10.2023 年5 月美國電動車大廠 TesIa 特斯拉發生大規模資料洩露事件，包括員工個資，以及各種\n客戶銀行數據、生產機密及客戶投訴紀錄等，被兩位員工洩露給德國媒體 HandeIsbI 。請問\n下列哪些是網路安全的服務目標呢 ?\n( A )身分認證性 : 當傳送方送出資料時，就必須能確認傳送者的身分是否為冒名\n( B )資料完整性 : 當資料送達時必須保證資料沒有被竄改\n( C )不可否認性 : 使用者已經使用或是接受某項服務時，不能否認其未使用過\n( D )授權性 : 使用者只能擷取被授權部分的資訊\n、問答申論題\n1.DonaldJo Trump 在競選美國總統期間，對區塊鏈和加密貨幣產業展現支持的態度，其當選\n美國第47 任總統後的四週內，比特幣價格上漲了約45% , 並在2024 年12 月5 日首次突破10\n萬美元大關，創下歷史新高。請您針對以下的問題進行回答 :\n(a)請說明甚麼是區塊鏈 ? (5%)有哪些特點呢 ? (5%)\n( b )在競選期間或是當選後 , D 。 naIdJo Trump 針對區塊鏈和加密貨幣提出的政策，會帶來甚\n麼樣的影響呢 ? (5%)","r":1.4122},{"img":"img/114-mis-3.jpg","txt":"2 · 社群商務係指企業透過社群網站平台進行商品或是服務買賣交易的商業活動。繼 Meta 、\nlnstagram 及 Line 等社群網站後 , Meta Platforms 旗下的 Threads 亦成為企業或是個人賣家落 n倒扣 )\n2 ·\n3 ·\n4.\n某跨國文創電商創立初期，透過簡易刊登機制、不收取上價費用，只針對成交的訂單\n收取一成手續費作為誘因，吸引設計師加入，等到有足夠數量的設計師加入後，再開\n放平台供消費者使用，請問這家跨國文創電商是使用何種策略 ?\n(A)搭便車 R*(Piggyback Strategy)\n(B)種 Æ*(Seeding Strategy)\n(C)單 ü*(Single-Side Strategy)\n(D)微型市場策 *(Micromarketing Strategy)\n電動車大廠特斯拉( Tesla )在產品設計階段，為了降低生產實體電動車的時間與財務\n成本，在虛擬與實體世界建立分身，紀錄實體數據，運用於虛擬分身測試，而後回饋\n新產品的研發。請問上述主要是在描述特斯拉運用何種技術 ?\n(A)資料採集與監控系統\n(B)人工智慧\n(C)數位孿生\n(D)雲端運算\n雙鑽石設計流程由四個階段組成，以協助企業發現服務痛點，並發展出改善或創新的\n服務流程或創新的商業邏輯，以創造顧客與企業的價值。請問階段之順序為何 ?\n(A)定義範圍今發現問題今發展潛在解決方案今交付方案\n(B)發現問題兮定義範圍兮發展潛在解決方案今交付方案\n(C)定義範圍今發展潛在解決方案發現問題今交付方案\n(D)發現問題今發展潛在解決方案今發現問題今交付方案\n(202D 指出隨著感測器、物聯網、雲端運算、行動裝置、人工智慧、\nKotler et al.\n大數據行銷等的綜效，行銷5.0 時代已來臨。請問下列何者不屬於行銷5.0 的重要\n應用 ?\n(A)協同行銷\n(B)預測行銷\n(C)場景行銷\n(D)敏捷行銷","r":1.4105},{"img":"img/113-mis-2.jpg","txt":"5 ·\n資料在網路傳輸時可能會遭遇安全威脅，因此在網路傳輸資料時需要有安全機制來保\n護被傳送的資料，以防範安全威脅。請問基本的資料安全需求包括以下何者 ?\n(A)隱密性\n(B)完整性\n(C)可辨識性\n(D)不可否認性\n6 ·\n電腦整合製造(Computer lntegrated Manufacturing, CIM)係藉由整合企業製造相關\n的系統和資料進溝通，已形成新的管理模式來改進企業的效率。 ISA 一95 所規範的 CIM\n可分為5 個層級，下列敘述何者正確 ?\n(A) Level 1 生產現場流程相關的感測與控制活動\n(B) Leve1 2 生產現場流程的監控與管理控制\n(C) Level 3 生產最終產品的工作流程 / 製程控制\n(D) LeveI 4 建立初步的工廠生產排程、投入的物料和運送，並決定生產週期\n7 ·\n企業資源規劃系統(Enterprise Resource Planning, ERP )的模組中，提供客戶詢價\n單、報價單與接單管理、出貨管理、運輸規劃等項目，是屬於下列哪一項模組之功\n月 ,\n(A)銷售與配銷管理模組\n(B)生產規劃管理模組\n(C)品質管理模組\n(D)人力資源管理模組\n8.\n大賣場使用前台銷售點( Point of Sale, POS )系統與後台管理系統，進行客戶交易結\n帳、商品盤點或營運分析等，以取代過去人工作業方式在科技應用上是一典範轉\n移，但其商業模式之價值組態與策略並無太大的改變，請問是屬於下列哪一類的創\n新 ?\n(A)移轉性創新\n(B)根本性創新\n(C)漸進性創新\n(D)破壞性創新","r":1.4105},{"img":"img/113-mis-3.jpg","txt":"共4 頁3 頁\n9 , 請問以下對於 Web 3.0 及 Web4. 0 的敘述何者有誤 ?\n(A) Web3. 0 時代主要是資訊的分享\n(B) Web3.0 應用人工智慧結合自然語言處理等技術，提供更智能服務\n(C) Web4. 0 屬於共生網路(Symbiotic Web)\n(D) Web4.0 使用者以瀏覽為主\n10 · 商業智 Æ(Business lntelligence, (I)建構流程為 : 根據不同使用者( 例如不同階\n層或部門管理者 )之資訊需求，將各種資訊系統資料庫之資料( 可能是不同來源、不\n同型態的資料 ) , 主要經過三個處理流程，有組織地建立資料倉儲( 包括資料超市與\n資料立方體 ) , 以供使用者應用適當之 BI 工具進行分析。請問下列何者是這三個流\n程之一 ?\n(A)擷取\n(B)轉換\n(C)分享\n(D)載入","r":1.4105},{"img":"img/113-mis-4.jpg","txt":"丶問答申論題\n1. 企業數位化有三個階段 : 數據數位 e":"用科技提供金融服務","n":2,"refs":[{"l":"111 申1","h":"ymis111-p1-111申1","y":111,"s":"mis"},{"l":"107 申1","h":"ymis107-p1-107申1","y":107,"s":"mis"}]},{"id":"rpa-robotic-process-automation","g":"m-new","en":"RPA (Robotic Process Automation)","zh":"機器人流程自動化","note":"用軟體機器人自動做重複的電腦作業","n":2,"refs":[{"l":"115-46","h":"ymis115-p9-115-46","y":115,"s":"mis"},{"l":"112 申3","h":"ymis112-p1-112申3","y":112,"s":"mis"}]},{"id":"web-3-0-web-4-0","g":"m-new","en":"Web 3.0 / Web 4.0","zh":"第三／第四代網路","note":"去中心化網路／共生網路（Symbiotic Web）","n":1,"refs":[{"l":"113 選9","h":"ymis113-p3-113選9","y":113,"s":"mis"}]},{"id":"service-design","g":"m-new","en":"Service design","zh":"服務設計","note":"發現問題、定義、發展、交付（雙鑽石）","n":0,"refs":[]},{"id":"mobile-payment","g":"m-new","en":"Mobile payment","zh":"行動支付","note":"用手機付款","n":1,"refs":[{"l":"105 MIS 第1頁","h":"ymis105-p1","y":105,"s":"mis"}]}],"termGroups":[{"g":"cs2","name":"計算機組織"},{"g":"cs3","name":"輸入輸出與儲存"},{"g":"cs5","name":"資料表示與邏輯"},{"g":"os","name":"作業系統"},{"g":"cs7","name":"網路基礎"},{"g":"cs8","name":"網際網路與 TCP/IP"},{"g":"cs9","name":"網路應用"},{"g":"c","name":"C 語言"},{"g":"oop","name":"物件導向與程式語言"},{"g":"ds","name":"資料結構"},{"g":"algo","name":"演算法"},{"g":"db","name":"資料庫"},{"g":"sec","name":"資訊安全"},{"g":"ai","name":"人工智慧"},{"g":"big","name":"大數據與雲端"},{"g":"new","name":"新興科技"},{"g":"m-strat","name":"MIS｜策略與數位經濟"},{"g":"m-org","name":"MIS｜組織與人"},{"g":"m-sys","name":"MIS｜企業應用系統"},{"g":"m-ec","name":"MIS｜電子商務與行銷"},{"g":"m-dev","name":"MIS｜系統開發與架構"},{"g":"m-new","name":"MIS｜數位轉型與新議題"}],"notes":{"cs:114-2":{"answer":[["這題的正確答案是 ",false],["B. Multiple threads execution",true],["。 ",false]],"items":[[["題目",true],["：下列哪（幾）項",false],["不是",true],["用來開發電腦程式中「指令層級平行度（Instruction-Level Parallelism, ILP）」的技術？ ",false]],[["核心觀念",true],["：ILP（指令層級平行度）",false],["是指在",true],["單一執行緒（Single Thread）的程式執行過程中，硬體或編譯器同時執行多條彼此沒有相依性（dependency）指令的能力。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Superscalar execution（超純量執行）— 屬於 ILP",true],[" ",false]],"x":[[["在同一個時脈週期（clock cycle）內，透過多組執行單元同時擷取（fetch）、解碼並執行多條指令，是提升 ILP 最直接的硬體架構。",false]]]},{"h":[["B. Multiple threads execution（多執行緒執行）— 不屬於 ILP（正確答案）",true],[" ",false]],"x":[[["這屬於 ",false],["TLP（Thread-Level Parallelism，執行緒層級平行度）",true],["。它是透過同時執行多個獨立的執行緒（Threads）來提升整體吞吐量，而非挖掘單一指令流內部的指令平行度。",false]]]},{"h":[["C. Out-of-order execution（亂序執行）— 屬於 ILP",true],[" ",false]],"x":[[["動態排程（Dynamic Scheduling）的核心技術。當前面的指令因為等待資料而停滯（stall）時，允許後面沒有相依性的指令先執行，藉此填補管線空檔、提高 ILP。",false]]]},{"h":[["D. Speculative execution（推測執行）— 屬於 ILP",true],[" ",false]],"x":[[["結合分支預測（Branch Prediction），在分支結果尚未確定前，先猜測路徑並預先執行該路徑上的指令（若猜錯再丟棄結果），用來突破控制相依性（Control Dependency）對 ILP 的限制。",false]]]}],"videos":["https://www.youtube.com/watch?v=EzEKGlO9w4Y","https://www.youtube.com/watch?v=4xhyXVyFMHw"]},"cs:113-1":{"answer":[["這題的正確答案是 ",false],["B. ALU",true],["。 ",false]],"items":[[["題目",true],["：CPU 透過「擷取－解碼－執行－儲存（fetch-decode-execute-store）」週期來執行指令，請問是哪一個元件負責執行（executes）指令？ ",false]],[["核心觀念",true],["：這是計算機組織中最基礎的指令週期（Instruction Cycle / Machine Cycle）與 CPU 內部元件職責分工。",false]]],"opts_title":"各選項解析（對應指令週期的四個階段）","opts":[{"h":[["A. CU（Control Unit，控制單元）— 負責 Fetch 與 Decode",true],[" ",false]],"x":[[["負責從記憶體擷取（Fetch）指令、對指令進行解碼（Decode），並發出控制訊號（Control Signals）指揮 CPU 內部其他元件如何動作，但它本身不直接做運算執行。",false]]]},{"h":[["B. ALU（Arithmetic Logic Unit，算術邏輯單元）— 負責 Execute（正確答案）",true],[" ",false]],"x":[[["CPU 真正執行運算的核心，負責所有的算術運算（加、減、乘、除）與邏輯判斷（AND、OR、NOT、比較大小）。",false]]]},{"h":[["C. IR（Instruction Register，指令暫存器）— 負責暫存指令",true],[" ",false]],"x":[[["位於 CPU 內部的暫存器，專門用來",false],["暫時存放",true],["剛從記憶體擷取出來、準備要交給 CU 解碼的「當前指令」。",false]]]},{"h":[["D. RAM（Random Access Memory，隨機存取記憶體）— 負責 Store / 儲存資料與程式",true],[" ",false]],"x":[[["屬於主記憶體（Main Memory），位於 CPU 外部，用來存放執行中的程式與運算結果（對應 Store 階段寫回記憶體的動作）。",false]]]}],"videos":["http://www.youtube.com/watch?v=Z5JC9Ve1sfI","http://www.youtube.com/watch?v=jFDMZpkUWCw","http://www.youtube.com/watch?v=4775ikl_bLY"]},"cs:112-22":{"answer":[["這題的正確答案是 ",false],["B、C、D、E",true],["（複選）。 ",false]],"items":[[["題目",true],["：（複選）下列哪（幾）個處理器系列是以 ARM 架構為基礎？ ",false]],[["核心觀念",true],["：ARM 是一種 RISC（Reduced Instruction Set Computer，精簡指令集）架構。ARM 公司本身不太賣晶片，而是把指令集或核心設計授權給其他廠商自己做晶片，主打低耗電、效能功耗比高，所以手機、平板大量採用，近年也進入筆電。傳統個人電腦用的則是 Intel／AMD 的 x86（CISC，複雜指令集）。判斷方式：看這顆晶片執行的是哪一套指令集（ISA）。",false]]],"opts_title":"各選項解析（看它執行哪一套指令集）","opts":[{"h":[["A. AMD Ryzen — 不是 ARM（屬於 x86-64）",true],[" ",false]],"x":[[["AMD 的桌機與筆電處理器，採用 Zen 微架構，執行的是 x86-64（AMD64）指令集，和 Intel Core 同屬 x86 陣營。",false]]]},{"h":[["B. Apple Silicon（M 系列、A 系列）— 是 ARM（正確答案）",true],[" ",false]],"x":[[["Apple 取得 ARM 架構授權後自己設計 CPU 核心。2020 年起 Mac 從 Intel x86 換成 M1、M2 等 Apple Silicon；iPhone 的 A 系列晶片也是 ARM。",false]]]},{"h":[["C. Qualcomm Snapdragon（高通驍龍）— 是 ARM（正確答案）",true],[" ",false]],"x":[[["高通的行動處理器系列，是 Android 手機最常見的晶片；Snapdragon X 系列也把 ARM 帶進 Windows 筆電。",false]]]},{"h":[["D. Samsung Exynos — 是 ARM（正確答案）",true],[" ",false]],"x":[[["三星自家的行動 SoC（System on Chip，系統單晶片），用在 Galaxy 手機，CPU 核心採用 ARM Cortex 設計。",false]]]},{"h":[["E. Nvidia Tegra — 是 ARM（正確答案）",true],[" ",false]],"x":[[["NVIDIA 的行動／嵌入式 SoC，CPU 是 ARM 核心，再加上 NVIDIA 自家的 GPU；任天堂 Switch 用的就是 Tegra X1。",false]]]}],"videos":["https://www.youtube.com/watch?v=odma-BqRVKQ","https://www.youtube.com/watch?v=Wd23RSc24pw"]},"cs:111-19":{"answer":[["這題的正確答案是 ",false],["E. VLIW",true],["。 ",false]],"items":[[["題目",true],["：下列哪一種指令層級平行（Instruction-Level Parallelism, ILP）技術高度仰賴編譯器最佳化，但只需要簡單的硬體？ ",false]],[["核心觀念",true],["：提高 ILP 有兩條路。一是「硬體動態排程」：程式執行時由 CPU 自己找出可以同時做的指令（亂序執行、超純量、分支預測），硬體很複雜。二是「編譯器靜態排程」：編譯時就由編譯器把彼此沒有相依性的指令排好、打包，硬體可以很簡單。VLIW 就是第二條路的代表（可以和 114-2 對照）。",false]]],"opts_title":"各選項解析（硬體排程 vs. 編譯器排程）","opts":[{"h":[["A. Out-of-order execution（亂序執行）— 靠硬體動態排程",true],[" ",false]],"x":[[["CPU 執行時動態檢查相依性，讓後面沒有相依的指令先做，需要保留站、重排序緩衝區（ROB）等複雜硬體。",false]]]},{"h":[["B. Branch prediction（分支預測）— 靠硬體預測",true],[" ",false]],"x":[[["由硬體的分支預測器依過去的執行紀錄猜測分支（if、迴圈）往哪走，先把指令送進管線，減少停頓（stall）。",false]]]},{"h":[["C. Superscalar（超純量）— 靠硬體動態發出多條指令",true],[" ",false]],"x":[[["一個時脈週期內同時發出多條指令，由硬體在執行時決定哪些可以一起做，需要多組執行單元和相依性檢查電路。",false]]]},{"h":[["D. Pipelining（管線化）— 基本的硬體技術",true],[" ",false]],"x":[[["把指令拆成擷取、解碼、執行等階段重疊進行；編譯器可以調整順序減少停頓，但主要是硬體機制。",false]]]},{"h":[["E. VLIW（Very Long Instruction Word，超長指令字）— 靠編譯器（正確答案）",true],[" ",false]],"x":[[["編譯器在編譯時就找出可以平行執行的指令，打包成一個很長的指令字，每個欄位對應一個執行單元；硬體照著執行，不需要動態排程電路，所以很簡單。缺點是平行指令不夠時要塞空指令（NOP）、程式碼變大，換一代硬體可能要重新編譯。",false]]]}],"videos":["https://www.youtube.com/watch?v=2J02Y1dr3Fo","https://www.youtube.com/watch?v=tw_RZg3H954"]}}}</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const KEYS = {};
  DATA.cs.forEach(k => KEYS["cs:" + k.c] = Object.assign({ subj: "cs" }, k));
  DATA.mis.forEach(k => KEYS["mis:" + k.c] = Object.assign({ subj: "mis" }, k));
  const SUBJ = { cs: "計算機概論", mis: "管理資訊系統" };
  const CODE = { cs: "442001", mis: "442003" };
  const ST = { ok: "會", bad: "錯", idk: "不會" };
  const paperId = p => p.s + p.y;
  const PAPERS = {};
  DATA.papers.forEach(p => PAPERS[paperId(p)] = p);
  const QINDEX = [];
  DATA.papers.forEach(p => p.qs.forEach(q => QINDEX.push({ p, q })));

  // ---------- state: { "<subj><year>": { q: { "<qid>": {s, a} }, pg: { "<n>": {s, n} } } }
  let state = {};
  const LS = "nsysu-pq-v1";
  try { state = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { state = {}; }
  let dbCol = null;
  const pending = {}, chains = {}, dirty = {};

  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
  function paperState(pid) { return state[pid] || (state[pid] = { q: {}, pg: {} }); }
  function qState(pid, qid) { const ps = state[pid]; return (ps && ps.q && ps.q[qid]) || {}; }
  function setQ(pid, qid, patch) {
    const ps = paperState(pid); ps.q = ps.q || {};
    const cur = Object.assign({}, ps.q[qid] || {}, patch);
    if (!cur.s && !cur.a) delete ps.q[qid]; else ps.q[qid] = cur;
    changed(pid);
  }
  function setPg(pid, n, patch) {
    const ps = paperState(pid); ps.pg = ps.pg || {};
    const cur = Object.assign({}, ps.pg[n] || {}, patch);
    if (!cur.s && !cur.n) delete ps.pg[n]; else ps.pg[n] = cur;
    changed(pid);
  }
  function changed(pid) {
    saveLocal(); renderStats();
    if (!dbCol) return;
    dirty[pid] = (dirty[pid] || 0) + 1;
    const mark = dirty[pid];
    clearTimeout(pending[pid]);
    pending[pid] = setTimeout(() => {
      const body = JSON.parse(JSON.stringify(state[pid] || { q: {}, pg: {} }));
      chains[pid] = (chains[pid] || Promise.resolve()).then(() => dbCol && dbCol.doc(pid).set(body)).then(() => {
        if (dirty[pid] === mark) dirty[pid] = 0;
      }).catch(err => {
        dirty[pid] = 0;
        if (err && (err.code === "invalid_argument" || err.code === "revoked" || err.code === "not_granted")) { dbCol = null; setSync(false, "無法存到帳號，先存在這個瀏覽器"); }
      });
    }, 700);
  }

  // ---------- helpers
  function el(tag, attrs, kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(c => c && n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return n;
  }
  const main = document.getElementById("main");
  function counts(list) {
    const c = { ok: 0, bad: 0, idk: 0, none: 0 };
    list.forEach(({ p, q }) => { const s = qState(paperId(p), q.id).s; c[s || "none"]++; });
    return c;
  }
  function renderStats() {
    const c = counts(QINDEX);
    const box = document.getElementById("stats"); box.textContent = "";
    box.append("已做 ", el("b", { text: String(c.ok + c.bad + c.idk) }), " / " + QINDEX.length + "　",
      el("span", { class: "k-ok", text: "會 " + c.ok }), el("span", { class: "k-bad", text: "錯 " + c.bad }), el("span", { class: "k-idk", text: "不會 " + c.idk }));
  }
  function setSync(on, text) {
    document.getElementById("sync").classList.toggle("on", on);
    document.getElementById("synctext").textContent = text;
  }
  function statusButtons(cur, onPick) {
    const box = el("span", { class: "st", role: "group", "aria-label": "作答結果" });
    ["ok", "bad", "idk"].forEach(v => {
      const b = el("button", { type: "button", "data-v": v, "aria-pressed": String(cur === v), text: ST[v] });
      b.addEventListener("click", () => {
        const next = b.getAttribute("aria-pressed") === "true" ? "" : v;
        box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === next)));
        onPick(next);
      });
      box.appendChild(b);
    });
    return box;
  }

  // ---------- year view
  let curPaper = "cs115";
  function rail() {
    const r = el("aside", { class: "rail" });
    ["cs", "mis"].forEach(s => {
      const chips = el("div", { class: "chips" });
      DATA.papers.filter(p => p.s === s).forEach(p => {
        const b = el("button", { type: "button", text: String(p.y), title: p.y + " 學年度 " + SUBJ[s] + (p.qs.length ? "（已標章節）" : "") });
        if (paperId(p) === curPaper) b.classList.add("cur");
        if (p.qs.length) b.classList.add("tagged");
        b.addEventListener("click", () => go("y" + paperId(p)));
        chips.appendChild(b);
      });
      r.appendChild(el("div", null, [el("h3", { text: SUBJ[s] }), chips]));
    });
    r.appendChild(el("p", { class: "legend", text: "有小點的年度（106–115）每題都標了章節；94–105 年可以逐頁寫筆記。" }));
    return r;
  }
  function questionRow(p, q, hl) {
    const pid = paperId(p), cur = qState(pid, q.id), key = KEYS[p.s + ":" + q.c];
    const row = el("div", { class: "q" + (hl ? " hl" : ""), id: "q-" + pid + "-" + q.id.replace(/\s/g, "") });
    const ta = el("textarea", { id: "a-" + pid + "-" + q.id.replace(/\s/g, ""), placeholder: q.k === "申" || q.k === "問" ? "寫答題架構或重點" : "我的答案、為什麼錯", rows: "2" });
    ta.value = cur.a || "";
    let t;
    ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => setQ(pid, q.id, { a: ta.value.trim() }), 500); });
    const ans = el("div", { class: "ans" });
    const tog = el("button", { type: "button", class: "toggle", text: cur.a ? "收起作答" : "寫作答／筆記" });
    ans.appendChild(tog);
    if (!cur.a) ta.hidden = true;
    tog.addEventListener("click", () => { ta.hidden = !ta.hidden; tog.textContent = ta.hidden ? "寫作答／筆記" : "收起作答"; if (!ta.hidden) ta.focus(); });
    ans.appendChild(ta);
    const pg = p.pages[q.p - 1];
    const qb = el("div", { class: "qbody" });
    qb.appendChild(cropEl(pg, q.crop || [0, 1], q.id + " 原卷"));
    if (!q.crop) qb.appendChild(el("span", { class: "qwarn", text: "這題沒能單獨切出來，上面是整頁原卷，請找第 " + q.id.replace(/^\d+[\s-]*/, "") + " 題。" }));
    const note = (DATA.notes || {})[p.s + ":" + q.id];
    const tx = el("pre", { class: "qtx", text: (q.tx || pg.txt || "") + "\n\n（電腦辨識的文字，可能有錯字，以原卷為準）" });
    tx.hidden = true;
    const mb = el("div", { class: "minibtns" });
    const bt = el("button", { type: "button", text: "看文字版" });
    bt.addEventListener("click", () => { tx.hidden = !tx.hidden; bt.textContent = tx.hidden ? "看文字版" : "收起文字"; });
    let ana = null;
    if (note) {
      ana = noteEl(note);
      ana.hidden = !(hl && note);
      const bn = el("button", { type: "button", text: ana.hidden ? "看解析" : "收起解析" });
      bn.addEventListener("click", () => { ana.hidden = !ana.hidden; bn.textContent = ana.hidden ? "看解析" : "收起解析"; });
      mb.append(bn);
    }
    mb.append(bt, tog);
    qb.append(mb);
    if (ana) qb.append(ana);
    qb.append(tx, ta);
    row.append(
      el("span", { class: "qid", text: q.id }),
      el("span", { class: "qt" }, [q.t + (q.k === "申" || q.k === "問" ? "（申論／問答）" : q.k === "填" ? "（填充）" : ""), note ? el("span", { class: "hasnote", text: "有解析" }) : null, el("span", { class: "ch", text: key ? key.name + (key.book ? "" : "・課本沒有") : "" })]),
      statusButtons(cur.s, v => setQ(pid, q.id, { s: v })),
      qb
    );
    return row;
  }
  function richEl(tag, runs) {
    const e = el(tag);
    (runs || []).forEach(([t, b]) => e.appendChild(b ? el("b", { text: t }) : document.createTextNode(t)));
    return e;
  }
  function noteEl(n) {
    const box = el("div", { class: "ana" });
    if (n.answer && n.answer.length) box.appendChild(richEl("p", n.answer)).className = "ansl";
    if (n.items && n.items.length) {
      box.appendChild(el("h4", { text: "題目翻譯與核心概念" }));
      const ul = el("ul"); n.items.forEach(r => ul.appendChild(richEl("li", r))); box.appendChild(ul);
    }
    if (n.opts && n.opts.length) {
      box.appendChild(el("h4", { text: n.opts_title || "各選項解析" }));
      const ul = el("ul");
      n.opts.forEach(o => {
        const li = richEl("li", o.h);
        if (o.x && o.x.length) { const sub = el("ul"); o.x.forEach(r => sub.appendChild(richEl("li", r))); li.appendChild(sub); }
        ul.appendChild(li);
      });
      box.appendChild(ul);
    }
    if (n.videos && n.videos.length) {
      const v = el("div", { class: "vid" }, [el("span", { text: "延伸影片：" })]);
      n.videos.forEach(u => v.appendChild(el("a", { href: u, target: "_blank", rel: "noopener", text: u })));
      box.appendChild(v);
    }
    return box;
  }
  function cropEl(pg, crop, alt) {
    const r = pg.r || 1.413, y0 = crop[0], y1 = crop[1];
    const box = el("div", { class: "crop" });
    box.style.aspectRatio = (1 / ((y1 - y0) * r)).toFixed(4);
    const img = el("img", { src: pg.img, alt: alt, loading: "lazy" });
    img.style.top = (-(y0 / (y1 - y0)) * 100).toFixed(3) + "%";
    box.appendChild(img);
    return box;
  }
  function renderYear(focus, keepScroll) {
    const p = PAPERS[curPaper];
    const pid = paperId(p);
    const body = el("div");
    body.appendChild(el("div", { class: "paperhead" }, [
      el("h2", { text: p.y + " 學年度　" + SUBJ[p.s] }),
      el("span", { class: "code", text: "科目代碼 " + CODE[p.s] + "・共 " + p.pages.length + " 頁" + (p.qs.length ? "・" + p.qs.length + " 題已標章節" : "") })
    ]));
    p.pages.forEach((pg, i) => {
      const n = i + 1;
      const card = el("section", { class: "page", id: "pg-" + pid + "-" + n });
      const seg = el("span", { class: "seg", role: "group", "aria-label": "顯示方式" });
      const bImg = el("button", { type: "button", "aria-pressed": "false", text: "整頁原卷" });
      const bText = el("button", { type: "button", "aria-pressed": "false", text: "整頁文字" });
      seg.append(bImg, bText);
      card.appendChild(el("div", { class: "pagebar" }, [el("strong", { text: "第 " + n + " 頁" }), seg]));
      const qs = p.qs.filter(q => q.p === n);
      if (qs.length) {
        const list = el("div", { class: "qlist" });
        qs.forEach(q => list.appendChild(questionRow(p, q, focus && focus.q === q.id)));
        card.appendChild(list);
      } else if (!p.qs.length) {
        const ps = (state[pid] && state[pid].pg && state[pid].pg[n]) || {};
        const ta = el("textarea", { id: "n-" + pid + "-" + n, rows: "2", placeholder: "這頁哪幾題會、哪幾題要回去讀" });
        ta.value = ps.n || "";
        let t; ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => setPg(pid, n, { n: ta.value.trim() }), 500); });
        card.appendChild(el("div", { class: "pnote" }, [
          el("div", { style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap" }, [el("label", { for: "n-" + pid + "-" + n, text: "這頁的練習筆記" }), statusButtons(ps.s, v => setPg(pid, n, { s: v }))]),
          ta]));
      }
      const pre = el("pre", { class: "ocr", text: pg.txt || "（這頁辨識不到文字，請看原卷）" });
      const note = el("p", { class: "note", text: "文字由掃描檔自動辨識，數字、符號、程式碼可能有錯，作答前請對照「原卷」。" });
      const scan = el("div", { class: "scan" });
      const show = m => {
        if (m === "img" && !scan.firstChild) scan.appendChild(el("img", { src: pg.img, alt: p.y + " 學年度" + SUBJ[p.s] + "第 " + n + " 頁原卷", loading: "lazy" }));
        scan.hidden = m !== "img"; pre.hidden = m !== "txt"; note.hidden = m !== "txt";
        bImg.setAttribute("aria-pressed", String(m === "img")); bText.setAttribute("aria-pressed", String(m === "txt"));
      };
      let mode = p.qs.length ? "none" : "img";
      bImg.addEventListener("click", () => { mode = mode === "img" && p.qs.length ? "none" : "img"; show(mode); });
      bText.addEventListener("click", () => { mode = mode === "txt" && p.qs.length ? "none" : "txt"; show(mode); });
      show(mode);
      card.append(scan, pre, note);
      body.appendChild(card);
    });
    main.textContent = "";
    main.appendChild(el("div", { class: "yearview" }, [rail(), body]));
    if (focus) {
      const target = document.getElementById("pg-" + pid + "-" + focus.page);
      if (target) {
        requestAnimationFrame(() => {
          target.scrollIntoView({ block: "start" });
          target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 1600);
        });
      }
    } else if (!keepScroll) window.scrollTo(0, 0);
  }

  // ---------- chapter view
  const open = new Set();
  function renderChapters() {
    const wrap = el("div", { class: "chapview" });
    [["cs", "計算機概論", "依每日進度的讀書順序排列：計概(一)、C 語言，最後是課本沒有、要另外補的主題。"],
     ["mis", "管理資訊系統", "對應林東清《資訊管理》第 3 版；課本太舊、沒教的新議題列在最後。"]].forEach(([s, title, desc]) => {
      const sec = el("section", null, [el("h2", { text: title }), el("p", { text: desc })]);
      DATA[s].forEach(k => {
        const items = QINDEX.filter(x => x.p.s === s && x.q.c === k.c).sort((a, b) => b.p.y - a.p.y);
        if (!items.length) return;
        const c = counts(items), total = items.length;
        const card = el("div", { class: "ck" });
        const bar = el("span", { class: "bar" });
        [["ok", "b-ok"], ["bad", "b-bad"], ["idk", "b-idk"]].forEach(([v, cl]) => { if (c[v]) bar.appendChild(el("span", { class: cl, style: "width:" + (100 * c[v] / total) + "%" })); });
        const head = el("button", { type: "button", class: "head", "aria-expanded": String(open.has(s + k.c)) }, [
          el("span", { class: "nm" }, [k.name, k.book ? null : el("span", { class: "tag", text: "課本沒有" })]),
          el("span", { class: "src", text: k.src }),
          el("span", { class: "cnt", text: (c.ok + c.bad + c.idk) + " / " + total }),
          bar]);
        card.appendChild(head);
        const rows = el("div", { class: "rows" });
        rows.hidden = !open.has(s + k.c);
        items.forEach(({ p, q }) => {
          const st = qState(paperId(p), q.id).s;
          rows.appendChild(el("div", { class: "row" }, [
            el("span", { class: "qid", text: q.id }),
            el("span", null, [q.t + " ", el("span", { class: "pill" + (st ? " " + st : ""), text: st ? ST[st] : "未做" }), (DATA.notes || {})[p.s + ":" + q.id] ? el("span", { class: "hasnote", text: "有解析" }) : null]),
            el("a", { href: "#y" + paperId(p) + "-p" + q.p + "-" + q.id.replace(/\s/g, ""), text: "看題目" })]));
        });
        head.addEventListener("click", () => {
          rows.hidden = !rows.hidden; head.setAttribute("aria-expanded", String(!rows.hidden));
          if (rows.hidden) open.delete(s + k.c); else open.add(s + k.c);
        });
        card.appendChild(rows);
        sec.appendChild(card);
      });
      wrap.appendChild(sec);
    });
    main.textContent = ""; main.appendChild(wrap);
  }

  // ---------- wrong book
  // ---------- English terms
  const tui = { q: "", g: "all", weak: false };
  function weakSet() { return ((state.terms || {}).t) || {}; }
  function toggleWeak(id) {
    state.terms = state.terms || { t: {} }; state.terms.t = state.terms.t || {};
    if (state.terms.t[id]) delete state.terms.t[id]; else state.terms.t[id] = 1;
    changed("terms");
  }
  function renderTerms() {
    const box = el("div");
    const bar = el("div", { class: "termbar" });
    const qi = el("input", { type: "search", id: "term-q", placeholder: "搜尋英文或中文，例如 deadlock、子網路", "aria-label": "搜尋術語" });
    qi.value = tui.q;
    const weakBtn = el("button", { type: "button", class: "fbtn", "aria-pressed": String(tui.weak) });
    bar.append(qi, weakBtn);
    const chips = el("div", { class: "gchips", role: "group", "aria-label": "主題" });
    const list = el("div");
    const groups = [{ g: "all", name: "全部" }, { g: "cs", name: "計概全部" }, { g: "mis", name: "MIS 全部" }].concat(DATA.termGroups);
    groups.forEach(gr => {
      const b = el("button", { type: "button", "aria-pressed": String(tui.g === gr.g), text: gr.name.replace("MIS｜", "") });
      b.addEventListener("click", () => { tui.g = gr.g; chips.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); draw(); });
      chips.appendChild(b);
    });
    function draw() {
      const weak = weakSet();
      weakBtn.textContent = "只看不熟（" + Object.keys(weak).length + "）";
      const q = tui.q.trim().toLowerCase();
      const items = DATA.terms.filter(t =>
        (tui.g === "all" || t.g === tui.g || (tui.g === "cs" && !t.g.startsWith("m-")) || (tui.g === "mis" && t.g.startsWith("m-"))) &&
        (!tui.weak || weak[t.id]) &&
        (!q || (t.en + " " + t.zh + " " + t.note).toLowerCase().includes(q)));
      list.textContent = "";
      if (!items.length) { list.appendChild(el("p", { class: "empty", text: tui.weak ? "還沒有標成不熟的術語。按術語左邊的 ★ 就會收進這裡。" : "找不到符合的術語。" })); return; }
      DATA.termGroups.forEach(gr => {
        const rows = items.filter(t => t.g === gr.g);
        if (!rows.length) return;
        const sec = el("section", { class: "tgroup" }, [el("h2", { text: gr.name + "（" + rows.length + "）" })]);
        rows.forEach(t => {
          const st = el("button", { type: "button", class: "star", "aria-pressed": String(!!weak[t.id]), title: "標成不熟", "aria-label": "標成不熟：" + t.en, text: "★" });
          st.addEventListener("click", () => { toggleWeak(t.id); st.setAttribute("aria-pressed", String(!!weakSet()[t.id])); weakBtn.textContent = "只看不熟（" + Object.keys(weakSet()).length + "）"; });
          const refs = el("div", { class: "refs" });
          const addRefs = arr => arr.forEach(r => refs.appendChild(el("a", { href: "#" + r.h, text: r.l })));
          if (!t.refs.length) refs.appendChild(el("span", { class: "none", text: "考卷上沒有直接出現，是這章的基本詞彙" }));
          else {
            addRefs(t.refs.slice(0, 8));
            if (t.refs.length > 8) {
              const more = el("button", { type: "button", text: "還有 " + (t.refs.length - 8) + " 處" });
              more.addEventListener("click", () => { more.remove(); addRefs(t.refs.slice(8)); });
              refs.appendChild(more);
            }
          }
          sec.appendChild(el("div", { class: "term" }, [st, el("span", { class: "en", lang: "en", text: t.en }), el("span", null, [el("span", { class: "zh", text: t.zh }), "　", el("span", { class: "nt", text: t.note })]), refs]));
        });
        list.appendChild(sec);
      });
    }
    let tmr;
    qi.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => { tui.q = qi.value; draw(); }, 200); });
    weakBtn.addEventListener("click", () => { tui.weak = !tui.weak; weakBtn.setAttribute("aria-pressed", String(tui.weak)); draw(); });
    box.append(bar, chips, el("p", { class: "legend", text: "共 " + DATA.terms.length + " 個術語，依讀書章節分組；點題號會跳到那一題。★ 標成不熟，會跟作答紀錄一起存到你的帳號。" }), list);
    draw();
    main.textContent = ""; main.appendChild(box);
  }

  function renderWrong() {
    const box = el("div", { class: "wrongview" });
    const list = QINDEX.filter(({ p, q }) => { const s = qState(paperId(p), q.id).s; return s === "bad" || s === "idk"; });
    if (!list.length) {
      box.appendChild(el("p", { class: "empty", text: "還沒有錯題。做題時按「錯」或「不會」，題目就會收進這裡，依章節排好，方便考前重做。" }));
    } else {
      const groups = {};
      list.forEach(x => { const k = x.p.s + ":" + x.q.c; (groups[k] = groups[k] || []).push(x); });
      [...DATA.cs.map(k => "cs:" + k.c), ...DATA.mis.map(k => "mis:" + k.c)].forEach(k => {
        if (!groups[k]) return;
        box.appendChild(el("h2", { text: SUBJ[KEYS[k].subj] + "｜" + KEYS[k].name + "（" + groups[k].length + "）" }));
        groups[k].forEach(({ p, q }) => {
          const qs = qState(paperId(p), q.id);
          box.appendChild(el("div", { class: "row" }, [
            el("span", { class: "qid", text: q.id }),
            el("span", null, [q.t + " ", el("span", { class: "pill " + qs.s, text: ST[qs.s] })]),
            el("a", { href: "#y" + paperId(p) + "-p" + q.p + "-" + q.id.replace(/\s/g, ""), text: "重做" }),
            qs.a ? el("span", { class: "mine", text: qs.a }) : null]));
        });
      });
    }
    main.textContent = ""; main.appendChild(box);
  }

  // ---------- routing
  function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }
  function route(opts) {
    const keep = !!(opts && opts.keepScroll), y = window.scrollY;
    const h = (location.hash || "#year").slice(1);
    let view = "year", focus = null;
    if (h === "chapters") view = "chapters";
    else if (h === "terms") view = document.documentElement.classList.contains("in-dt") ? "year" : "terms";
    else if (h === "wrong") view = "wrong";
    else {
      const m = /^y(cs|mis)(\d{2,3})(?:-p(\d+)(?:-(.+))?)?$/.exec(h);
      if (m && PAPERS[m[1] + m[2]]) {
        curPaper = m[1] + m[2];
        if (m[3]) {
          const qid = m[4] ? (PAPERS[curPaper].qs.find(q => q.id.replace(/\s/g, "") === m[4]) || {}).id : null;
          focus = { page: Number(m[3]), q: qid };
        }
      }
    }
    document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.v === view ? "page" : "false"));
    if (view === "chapters") renderChapters(); else if (view === "wrong") renderWrong(); else if (view === "terms") renderTerms(); else renderYear(keep ? null : focus, keep);
    if (keep) window.scrollTo(0, y);
  }
  window.addEventListener("hashchange", () => route());
  renderStats();
  route();

  // ---------- account sync (private per viewer)
  (async function () {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      dbCol = db.collection("data/users/" + uid);
      let first = true;
      const timer = setTimeout(() => setSync(false, "暫時連不到帳號，先存在這個瀏覽器"), 10000);
      dbCol.onSnapshot(snap => {
        if (!snap.metadata.fromCache) clearTimeout(timer);
        let touched = false;
        snap.docs.forEach(d => {
          if (!d.exists || dirty[d.id]) return;
          const body = d.data();
          if (!body || JSON.stringify(body) === JSON.stringify(state[d.id] || null)) return;
          state[d.id] = JSON.parse(JSON.stringify(body));
          touched = true;
        });
        if (first) {
          first = false;
          // upload anything only this browser had
          Object.keys(state).forEach(pid => { if (!snap.docs.some(d => d.id === pid) && (PAPERS[pid] || pid === "terms")) changed(pid); });
        }
        setSync(true, "作答紀錄已存到你的帳號，換裝置也看得到");
        if (touched) { saveLocal(); renderStats(); const a = document.activeElement; if (!a || a.tagName !== "TEXTAREA") route({ keepScroll: true }); }
      }, () => { clearTimeout(timer); dbCol = null; setSync(false, "無法存到帳號，先存在這個瀏覽器"); });
    } catch (e) { /* stay local */ }
  })();
})();
</script>
