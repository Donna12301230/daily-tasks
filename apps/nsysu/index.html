 ",false],["A. Apache Spark is often used as the engines of the in-database computing.",true]],"items":[[["題目",true],["：下列關於資料庫內分析（in-database analytics）的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：",false],["資料庫內分析",true],["是把分析運算（統計、機器學習）直接放在資料庫裡面執行，不用先把大量資料搬出來，省下傳輸時間。通常以 ",false],["SQL",true],[" 為主要語言，處理的是資料庫裡的",false],["關聯式資料",true],["；",false],["大規模平行處理（MPP）資料庫",true],["（例如 Teradata、Greenplum）就是常見的實作，把資料和運算分散到很多節點同時處理。",false],["Apache Spark",true],[" 則是獨立在資料庫之外的分散式記憶體運算引擎，會從 HDFS、資料庫等來源讀資料再處理，屬於另一種路線。",false]],[["同主題考古題",true],["：109-6 Apache Spark、108-25 MPP。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Apache Spark is often used as the engines of the in-database computing（Spark 常作為資料庫內運算的引擎）— 錯誤（正確答案）",true]],"x":[[["Spark 是資料庫外部的運算引擎，把資料讀進自己的叢集記憶體處理，不是在資料庫內部運算。",false]]]},{"h":[["B. SQL is the primary data processing language of the in-database analytics（SQL 是資料庫內分析的主要語言）— 正確",true]],"x":[[["分析函數通常以 SQL 呼叫，例如在 SELECT 裡直接執行迴歸或分群。",false]]]},{"h":[["C. MPP database system is a kind of implementation of the in-database analytics（MPP 資料庫是資料庫內分析的一種實作）— 正確",true]],"x":[[["MPP 資料庫把資料分散到很多節點，每個節點就地平行運算。",false]]]},{"h":[["D. In-database analytics focuses more on processing relational data（資料庫內分析偏重處理關聯式資料）— 正確",true]],"x":[[["因為資料就在關聯式資料庫裡。",false]]]}],"videos":["https://www.youtube.com/watch?v=yRerKDM1h74"]},"cs:109-5":{"answer":[["這題的正確答案是 ",false],["A",true],["（出題者想要的答案；正確的翻譯其實是 ∀x(H(x) → M(x))，詳見下方）。",false]],"items":[[["題目",true],["：H(x) 表示「x 是人」、M(x) 表示「x 會死」，「所有人都會死」的邏輯翻譯是哪一個？（選項 A ∀x(H(x)^M(x))、B ∃x(H(x)^¬M(x))、C ∀x(¬H(x)^¬M(x))、D ∃x(H(x)^M(x))）",false]],[["核心觀念",true],["：述詞邏輯的兩個量詞：",false],["∀（全稱，for all）",true],["和 ",false],["∃（存在，there exists）",true],["。標準翻譯公式：「所有 A 都是 B」→ ",false],["∀x(A(x) → B(x))",true],["，用「如果⋯就⋯」；「有些 A 是 B」→ ",false],["∃x(A(x) ∧ B(x))",true],["，用「而且」。所以「所有人都會死」= ∀x(H(x) → M(x))：對任何東西，如果它是人，它就會死。",false]],[["延伸陷阱",true],["：選項中間的符號印成「^」。如果把 ^ 當成 ∧（而且），A 的意思變成「所有東西都是人而且都會死」，比原句強太多（連桌子都要是人），嚴格來說是錯的；四個選項都不是標準答案，應是原本的 → 被排版成 ^。依出題意圖，唯一用「∀」且 H、M 都是肯定的只有 A，所以選 A。B 剛好是原句的否定（有人不會死）。學校沒有公布答案。",false]],[["同主題考古題",true],["：113-11 恆真式、113-12 邏輯推論。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. ∀x(H(x) ^ M(x)) — 出題者的答案",true]],"x":[[["把 ^ 讀成 → 就是正確的 ∀x(H(x) → M(x))；讀成 ∧ 則是「每個東西都是人且會死」，意思不對。",false]]]},{"h":[["B. ∃x(H(x) ^ ¬M(x)) — 錯",true]],"x":[[["「存在一個人不會死」，剛好是原句的否定。",false]]]},{"h":[["C. ∀x(¬H(x) ^ ¬M(x)) — 錯",true]],"x":[[["「所有東西都不是人、也都不會死」，完全不同的意思。",false]]]},{"h":[["D. ∃x(H(x) ^ M(x)) — 錯",true]],"x":[[["「有些人會死」，只說了存在，不是「所有」。",false]]]}],"videos":["https://www.youtube.com/watch?v=StDR94_qgog","https://www.youtube.com/watch?v=BNLkIrPgBBs"]},"cs:109-6":{"answer":[["這題的正確答案是 ",false],["C. Function filter() is an action of the RDD.",true]],"items":[[["題目",true],["：下列關於 Apache Spark 的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：Spark 是",false],["記憶體內（in-memory）",true],["的分散式運算引擎，比 Hadoop MapReduce 每一步都寫回硬碟快很多。核心資料結構 ",false],["RDD（Resilient Distributed Dataset，彈性分散式資料集）",true],["有兩種操作：",false],["轉換（transformation）",true],["例如 map、filter、flatMap、reduceByKey，產生新的 RDD，而且是",false],["惰性求值（lazy）",true],["，只記錄要做什麼、不馬上算；",false],["動作（action）",true],["例如 count、collect、reduce、saveAsTextFile，才真正觸發計算並回傳結果。RDD 記得自己是怎麼從其他 RDD 算出來的（lineage），節點壞掉時可以重算，所以有",false],["容錯",true],["能力。",false]],[["同主題考古題",true],["：109-4 資料庫內分析、107-6 MapReduce、110-33 函數式語言（惰性求值）。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Spark is commonly considered an in-memory processing engine（Spark 被視為記憶體內處理引擎）— 正確",true]],"x":[[["中間結果盡量放在記憶體，適合需要反覆運算的機器學習。",false]]]},{"h":[["B. Spark RDD provides a kind of fault tolerant mechanism（RDD 提供容錯機制）— 正確",true]],"x":[[["Resilient（彈性）就是指可以從 lineage 重算遺失的分區。",false]]]},{"h":[["C. Function filter() is an action of the RDD（filter() 是 RDD 的動作）— 錯誤（正確答案）",true]],"x":[[["filter() 是轉換：從 RDD 篩選出符合條件的元素，產生新的 RDD，不會馬上執行。",false]]]},{"h":[["D. A transformation of the RDD is usually lazy-evaluated（RDD 的轉換通常是惰性求值）— 正確",true]],"x":[[["等到 action 出現，Spark 才把整串轉換最佳化後一起執行。",false]]]}],"videos": e],["B. 2 rows and 4 columns",true],["。",false]],"items":[[["題目",true],["：資料表 A(ID, V1) 有 (1, A)、(3, X)、(5, C)；B(ID, V2) 有 (3, X)、(5, Y)、(6, Z)。執行 SELECT * FROM A INNER JOIN B ON A.ID = B.ID 後，輸出有幾列幾欄？",false]],[["核心觀念",true],["：",false],["INNER JOIN",true],[" 只保留兩邊都對得上的列。",false],["SELECT ",true],["* 會把兩個表格的所有欄位都列出來，連 A.ID 和 B.ID 也各算一欄（雖然值一樣）。",false]],[["逐步追蹤",true],["：A 的 ID 是 1、3、5，B 的 ID 是 3、5、6，兩邊都有的是 3 和 5 → ",false],["2 列",true],["。欄位：A.ID、V1、B.ID、V2 → ",false],["4 欄",true],["。結果：(3, X, 3, X)、(5, C, 5, Y)。",false]],[["同主題考古題",true],["：110-37 SQL 合併（同樣的兩個表格）、108-39 SQL 結果列數。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 3 rows and 3 columns — 錯",true]],"x":[[["3 列是 LEFT JOIN（保留 A 全部）的列數；3 欄是用 USING 或 NATURAL JOIN 合併 ID 欄時的欄數。",false]]]},{"h":[["B. 2 rows and 4 columns — 對（正確答案）",true]],"x":[[["ID 3、5 兩列；SELECT * 保留兩個 ID 欄。",false]]]},{"h":[["C. 2 rows and 3 columns — 錯",true]],"x":[[["列數對，但 ON 條件的 JOIN 不會自動合併兩個 ID 欄。",false]]]},{"h":[["D. 2 rows and 2 columns — 錯",true]],"x":[[["少算了欄位。",false]]]}],"videos":["https://www.youtube.com/watch?v=dPYHNsZEuuQ"]},"cs:109-14":{"answer":[["這題的正確答案是 ",false],["A. List",true],["。",false]],"items":[[["題目",true],["：在 Python 3 中，下列哪一種資料型態被視為可以存放各種型態資料的彈性容器？",false]],[["核心觀念",true],["：Python 四種常用容器：",false],["list（串列）",true],["[1, \"a\", 3.5]，有順序、可修改、可重複，最通用；",false],["tuple（元組）",true],["(1, \"a\")，有順序但不能修改；",false],["set（集合）",true],["{1, 2}，沒有順序、不能重複；",false],["dict（字典）",true],["{\"name\": \"Amy\"}，鍵值對。四種其實都能放不同型態的資料，但「彈性容器」最常指 list：可以任意新增、刪除、修改、排序。",false]],[["延伸陷阱",true],["：tuple、set、dict 也能放混合型態，所以這題考的是 list 的「彈性」（可變、有序、允許重複），學校沒有公布答案，依一般教材選 A。",false]],[["同主題考古題",true],["：110-28 Python 區塊。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. List（串列）— 對（正確答案）",true]],"x":[[["可以放任何型態，而且可以 append、insert、remove、排序，最有彈性。",false]]]},{"h":[["B. Dictionary（字典）— 錯",true]],"x":[[["存鍵值對，用鍵查值；鍵必須是不可變的型態。",false]]]},{"h":[["C. Tuple（元組）— 錯",true]],"x":[[["建立後不能修改（immutable），彈性較低。",false]]]},{"h":[["D. Set（集合）— 錯",true]],"x":[[["元素不 ":[["B. Tabular data in relational databases（關聯式資料庫的表格資料）— 結構化",true]],"x":[[["欄位、型態都事先定義好。",false]]]},{"h":[["C. XML files — 半結構化",true]],"x":[[["用 <tag> 標籤標示資料的意義與層次。",false]]]},{"h":[["D. Video files（影片檔）— 非結構化（正確答案）",true]],"x":[[["內容是一連串影像和聲音，沒有可以直接查詢的欄位，要用電腦視覺等技術才能分析。",false]]]}],"videos":["https://www.youtube.com/watch?v=ps7NgQma0aw"]},"cs:109-17":{"answer":[["這題的正確答案是 ",false],["C. X->Z",true],["。",false]],"items":[[["題目",true],["：關聯 R(X, Y, Z) 的資料是 (3, 2, 8)、(8, 9, 2)、(8, 2, 8)、(5, 3, 5)。下列哪一個函數相依在 R 上",false],["不成立",true],["？",false]],[["核心觀念",true],["：",false],["函數相依 A → B",true],[" 表示「只要 A 的值相同，B 的值就一定相同」。從資料檢查的方法：找 A 值相同的列，看它們的 B 值是否都一樣；只要有一組 A 相同、B 不同，相依就不成立（反例）。",false]],[["逐步追蹤",true],["：Y → Z：Y = 2 的兩列，Z 都是 8 ✓。Z → Y：Z = 8 的兩列，Y 都是 2 ✓。X → Z：X = 8 的兩列，Z 一個是 2、一個是 8 ✗，不成立。XY → Z：四列的 (X, Y) 組合都不同，沒有反例 ✓。",false]],[["延伸陷阱",true],["：從資料只能證明某個相依「不成立」（找到反例），不能證明它一定成立（以後新增的資料可能破壞它）；題目問的就是哪個不成立。",false]],[["同主題考古題",true],["：111-27 函數相依找鍵、109-18 3NF。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Y->Z — 成立",true]],"x":[[["Y 相同（2）的列 Z 都是 8。",false]]]},{"h":[["B. Z->Y — 成立",true]],"x":[[["Z 相同（8）的列 Y 都是 2。",false]]]},{"h":[["C. X->Z — 不成立（正確答案）",true]],"x":[[["(8, 9, 2) 和 (8, 2, 8)：X 都是 8，Z 卻是 2 和 8。",false]]]},{"h":[["D. XY->Z — 成立",true]],"x":[[["每一列的 (X, Y) 都不一樣，不會有反例。",false]]]}],"videos":["https://www.youtube.com/watch?v=hgM-J93DaiM"]},"cs:109-18":{"answer":[["這題的正確答案是 ",false],["A、D 都不符合 3NF",true],["（題目是單選，卻有兩個正確選項，屬於題目瑕疵，詳見下方）。",false]],"items":[[["題目",true],["：關聯 R(A, B, C, D)，下列哪一組函數相依下的關聯綱要",false],["不符合",true],["第三正規化（3NF）？",false]],[["核心觀念",true],["：",false],["3NF",true],["：對每個函數相依 X → Y（Y 不在 X 裡），",false],["X 是超鍵",true],["，或 ",false],["Y 是主屬性",true],["（屬於某個候選鍵）。違反 3NF 的典型情況是",false],["遞移相依",true],["：鍵 → 非鍵屬性 → 另一個非鍵屬性。",false],["BCNF",true],[" 更嚴格：每個 X 都必須是超鍵（見 110-36）。",false]],[["逐步追蹤",true],["：A {A→BC, C→D}：候選鍵只有 A；C→D 中 C 不是超鍵、D 不是主屬性（A → C → D 遞移相依）→ ",false],["不是 3NF",true],["。B {AB→CD, C→B}：候選鍵 AB、AC；C→B 中 C 不是超鍵，但 B 是主屬性（屬於鍵 AB）→ 是 3NF（但不是 BCNF）。C {C→AB, B→CD}：候選鍵 B、C，兩個相依左邊都是超鍵 → BCNF，當然是 3NF。D {A→BCD, B→D}：候選鍵 A；B→D 中 B 不是超鍵、D 不是主屬性（A → B → D 遞移相依）→ ",false],["不是 3NF",true],["。",false]],[["延伸陷阱",true],["：照定義 A 和 D 都違反 3NF，題目卻是單選，可能是出題疏失（也許原本想考 BCNF，但那樣 A、B、D 都不符合，同樣不只一個答案）。B 是「符合 3NF 但不符合 BCNF」的經典例子，最常被拿來考兩者的差別，一定要會判斷。作答時選 A 或 D 都說得通；學校沒有公布答案。",false]],[["同主題考古題",true],["：110-36 3NF、111-30 BCNF 一定是 3NF、109-17 函數相依。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. { A->BC, C->D } — 不是 3NF",true]],"x":[[["A → C → D 遞移相依。",false]]]},{"h":[["B. { AB->CD, C->B } — 是 3NF（但不是 BCNF）",true]],"x":[[["C 不是超鍵，但 B 是候選鍵 AB 的一部分，3NF 允許。",false]]]},{"h":[["C. { C->AB, B->CD } — 是 BCNF",true]],"x":[[["B、C 都是候選鍵，所有相依左邊都是超鍵。",false]]]},{"h":[["D. { A->BCD, B->D } — 不是 3NF",true]],"x":[[["A → B → D 遞移相依。",false]]]}],"videos":["https://www.youtube.com/watch?v=GFQaEYEc8_8"]},"cs:109-19":{"answer":[["這題的正確答案是 ",false],["B. It can be assigned to other pointers of different types.",true]],"items":[[["題目",true],["：下列關於 C/C++ 指標的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：",false],["指標",true],["是存放記憶體位址的變數，而且有型態：int * 只該指向 int、char * 指向 char，型態決定解參考時要讀幾個位元組。",false],["不同型態的指標不能直接互相指定",true],["（C++ 直接編譯錯誤，C 會警告），一定要強制轉型；唯一的例外是 ",false],["void ",true],["*（通用指標），任何物件指標都能指定給它。陣列名稱代表第一個元素的位址，所以可以把陣列指定給指標（int *p = arr;）。",false]],[["延伸陷阱",true],["：C、D 的英文寫得很簡略：C「assigned to void」應理解為「指定給 void 指標」；D「assigned to an array」應理解為「指標可以指向陣列」。如果照字面把 D 理解成「把指標指定給陣列變數」（arr = p;），那是不合法的，因為陣列名稱不能被指定。出題者的意思應是 B 錯誤。學校沒有公布答案。",false]],[["同主題考古題",true],["：110-25 void 指標、110-24 const 指標、109-7 const 指標。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. It is used to represent memory address（指標用來表示記憶體位址）— 正確",true]],"x":[[["指標的值就是位址。",false]]]},{"h":[["B. It can be assigned to other pointers of different types（可以指定給不同型態的指標）— 錯誤（正確答案）",true]],"x":[[["例如 int *ip; double *dp = ip; 不合法，型態不相容，必須寫 (double *)ip 強制轉型。",false]]]},{"h":[["C. It can be assigned to void（可以指定給 void 指標）— 正確",true]],"x":[[["void *vp = ip; 合法，void * 可以接任何物件指標（見 110-25）。",false]]]},{"h":[["D. It can be assigned to an array（可以指向陣列）— 正確",true]],"x":[[["int arr[5]; int *p = arr; 陣列名稱就是第一個元素的位址。",false]]]}],"videos":["https://www.youtube.com/watch?v=1LO4XONZVjY","https://www.youtube.com/watch?v=MIL2BK02X8A"]},"cs:109-20":{"answer":[["這題的正確答案是 ",false],["D. The call stack stores dynamically allocated program objects.",true]],"items":[[["題目",true],["：下列敘述何者",false],["錯誤",true],["？（關於呼叫堆疊）",false]],[["核心觀念",true],["：程式執行時記憶體分成幾區：",false],["程式碼區",true],["、",false],["資料區",true],["（全域變數、static 變數）、",false],["堆疊（stack）",true],["和",false],["堆積（heap）",true],["。",false],["呼叫堆疊",true],["存放函數呼叫的",false],["堆疊框架（stack frame）",true],["：參數、區域變數、返回位址；呼叫函數時 push 一個框架、函數結束時 pop，由系統自動管理。",false],["動態配置",true],["的記憶體（C 的 malloc、C++ 的 new）放在",false],["堆積",true],["，要自己 free／delete。",false]],[["同主題考古題",true],["：111-26 遞迴（堆疊溢位）、106-3 遞迴耗記憶體、115-11 malloc／realloc。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 呼叫函數時呼叫堆疊變大，函數結束時變小 — 正確",true]],"x":[[["每次呼叫 push 一個框架，返回時 pop。",false]]]},{"h":[["B. 電腦記憶體有限，太多函數呼叫會造成堆疊溢位 — 正確",true]],"x":[[["例如無限遞迴（見 111-26）。",false]]]},{"h":[["C. 堆疊框架存放執行中函數的參數、區域變數與返回位址 — 正確",true]],"x":[[["這就是 stack frame 的內容。",false]]]},{"h":[["D. The call stack stores dynamically allocated program objects（呼叫堆疊存放動態配置的物件）— 錯誤（正確答案）",true]],"x":[[["動態配置的物件在堆積（heap）；堆疊上頂多存著指向它的指標變數。",false]]]}],"videos":["https://www.youtube.com/watch?v=5OJRqkYbK-4","https://www.youtube.com/watch?v=0Bs3cDpCIKc"]},"cs:109-21":{"answer":[["這題的正確答案是 ",false],["C. packets",true],["。",false]],"items":[[["題目",true],["：TCP/IP 是一種網路協定，規定如何把訊息切割成 ______，作為網路通訊的基本單位。",false]],[["核心觀念",true],["：網際網路採用",false],["分封交換",true],["（見 115-1）：TCP 把要傳送的資料切成一段一段，加上標頭（來源、目的、序號），IP 再包成",false],["封包（packet）",true],["交給路由器一站一站轉送；接收端依序號重組，遺失的請對方重傳。",false]],[["同主題考古題",true],["：115-1 packet switching、109-39 TCP/IP 模型、113-2 網路協定。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. pages（頁）— 錯",true]],"x":[[["頁是虛擬記憶體管理的單位（見 111-4）。",false]]]},{"h":[["B. bytes（位元組）— 錯",true]],"x":[[["是資料量的單位，不是網路傳輸的基本單位。",false]]]},{"h":[["C. packets（封包）— 對（正確答案）",true]],"x":[[["每個封包獨立在網路上傳送。",false]]]},{"h":[["D. bits（位元）— 錯",true]],"x":[[["是最小的資料單位，實體層傳的是位元，但 TCP/IP 規定的通訊單位是封包。",false]]]}],"videos":["https://www.youtube.com/watch?v=AYdF7b3nMto"]},"cs:109-22":{"answer":[["這題的正確答案是 ",false],["B. A cycle in a resource-allocation graph is a necessary and sufficient condition for deadlock in the case that each resource has multiple instances.",true]],"items":[[["題目",true],["：下列關於死結（deadlock）的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：",false],["資源配置圖",true],["用圓圈表示行程、方框表示資源（方框裡的點是資源的個數），畫出誰持有、誰在等。判斷規則：",false],["沒有環 → 一定沒有死結",true],["；有環時：",false],["每種資源只有一個時，環 = 一定死結",true],["（必要且充分）；",false],["資源有多個時，環只是必要條件",true],["，不一定死結，因為環上的行程可能等到其他行程釋放的另一個資源。處理死結的方法：預防（破壞四條件之一，見 115-4）、避免（銀行家演算法）、偵測與復原、忽略（鴕鳥演算法）。",false]],[["同主題考古題",true],["：115-4 deadlock 必要條件、108-9、106-14 deadlock。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Deadlock prevention ensures that the system will never enter deadlocked state（死結預防保證系統不會進入死結）— 正確",true]],"x":[[["破壞四個必要條件之一，死結就不可能發生。",false]]]},{"h":[["B. 資源有多個實例時，資源配置圖有環是死結的必要且充分條件 — 錯誤（正確答案）",true]],"x":[[["把「單一實例」和「多個實例」講反了：多個實例時，環只是必要條件、不充分。",false]]]},{"h":[["C. Deadlock avoidance ... determine if allowing a particular resource allocation will cause deadlock（死結避免會判斷某個配置是否會導致死結）— 正確",true]],"x":[[["例如銀行家演算法：只有配置後系統仍處於安全狀態才答應。",false]]]},{"h":[["D. Most operating systems, including UNIX and Windows, choose to ignore deadlocks（多數作業系統選擇忽略死結）— 正確",true]],"x":[[["死結很少發生、處理成本高，所以一般作業系統採用鴕鳥演算法，交給使用者或程式設計師處理。",false]]]}],"videos":["https://www.youtube.com/watch?v=qPuf5B5xPCs","https://www.youtube.com/watch?v=KrbjE6IRrM4"]},"cs:109-23":{"answer":[["這題的正確答案是 ",false],["A. Facial recognition technology can be applied to diagnose patients in healthcare without considering ethical issues.",true]],"items":[[["題目",true],["：下列關於人工智慧（AI）的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：AI 應用越來越廣，但臉部辨識、醫療診斷這類牽涉個人隱私與健康的應用，必須考慮",false],["倫理議題",true],["：隱私（臉部是生物特徵資料）、偏見（訓練資料不足的族群辨識率較低）、知情同意、出錯時的責任歸屬。題目 A 說「不用考慮倫理議題」，是典型的錯誤說法。",false]],[["同主題考古題",true],["：115-17 Agent 攻擊（隱私攻擊）、112-25 差分隱私、111-28 深度學習。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 臉部辨識可以用於醫療診斷而不用考慮倫理議題 — 錯誤（正確答案）",true]],"x":[[["技術上可以輔助診斷（例如從臉部特徵篩檢某些遺傳疾病），但絕不能不考慮隱私、同意與偏見。",false]]]},{"h":[["B. Deepfake algorithms can create fake images and videos using neural networks（深偽演算法用神經網路製作假圖片和影片）— 正確",true]],"x":[[["常用 GAN 或自動編碼器換臉、合成聲音。",false]]]},{"h":[["C. 深度學習是機器學習的子領域，演算法受大腦結構與功能啟發 — 正確",true]],"x":[[["AI ⊃ 機器學習 ⊃ 深度學習（見 111-28）。",false]]]},{"h":[["D. AI algorithms can help companies to make business predictions better（AI 可以幫公司做更好的商業預測）— 正確",true]],"x":[[["例如需求預測、顧客流失預測。",false]]]}],"videos":["https://www.youtube.com/watch?v=FcYcGQJE2HA"]},"cs:109-24":{"answer":[["這題的正確答案是 ",false],["D. The paging technique that swaps data between memory and storage increases the memory utilization and system performance.",true]],"items":[[["題目",true],["：下列關於虛擬記憶體的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：虛擬記憶體把一部分硬碟當成記憶體的延伸，這塊硬碟空間叫 ",false],["swap file（置換檔）",true],["（Windows 叫 pagefile）。程式不必全部載入記憶體就能執行，用到的頁才搬進來（見 111-4、115-5）。好處是記憶體可以容納更多程式、",false],["使用率提高",true],["；但硬碟比記憶體慢上萬倍，",false],["頁在記憶體和硬碟之間搬來搬去會拖慢系統",true],["，搬得太頻繁時系統大部分時間都在換頁，叫",false],["輾轉（thrashing）",true],["。所以好的頁替換演算法要盡量減少分頁錯誤。",false]],[["延伸陷阱",true],["：D 的前半句（提高記憶體使用率）是對的，錯在後半句「提升系統效能」：換頁本身是效能的負擔，不會讓系統更快。這題用語和 111-4 出自同一類教材（例如 Discovering Computers），A 的「swap file」就是該書的用詞。學校沒有公布答案。",false]],[["同主題考古題",true],["：111-4 paging、115-5 page fault、112-14 LRU、106-15 thrashing。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. The area of the hard drive used for virtual memory is called a swap file（虛擬記憶體使用的硬碟區域叫 swap file）— 正確",true]],"x":[[["因為它在記憶體和硬碟之間「交換」資料。",false]]]},{"h":[["B. With virtual memory, processes can run without being fully loaded into memory（行程不必完全載入記憶體就能執行）— 正確",true]],"x":[[["只載入正在用的頁（需求分頁）。",false]]]},{"h":[["C. A good page replacement algorithm can reduce page faults and improve performance（好的頁替換演算法能減少分頁錯誤、提升效能）— 正確",true]],"x":[[["例如 LRU 比 FIFO 通常更少分頁錯誤（見 112-14）。",false]]]},{"h":[["D. 在記憶體與儲存裝置之間交換資料的分頁技術，會提升記憶體使用率與系統效能 — 錯誤（正確答案）",true]],"x":[[["換頁要存取慢很多的硬碟，會降低效能；換頁過度還會造成 thrashing。",false]]]}],"videos":["https://www.youtube.com/watch?v=qlH4-oHnBb8"]},"cs:109-25":{"answer":[["這題的正確答案是 ",false],["A. Streaming",true],["。",false]],"items":[[["題目",true],["：______ 是一種在網際網路上以連續資料流傳送資料（通常是影音）的技術，讓使用者可以邊傳邊看。",false]],[["核心觀念",true],["：",false],["串流（streaming）",true],["把影音切成很多小片段依序傳送，播放器先暫存（緩衝 buffering）一點就開始播放，不必等整個檔案下載完，例如 YouTube、Netflix、Spotify。現代串流還會依網速自動切換畫質（自適應串流，例如 HLS、DASH）。",false]],[["同主題考古題",true],["：113-2 網路協定（UDP 適合即時影音）。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Streaming（串流）— 對（正確答案）",true]],"x":[[["邊下載邊播放。",false]]]},{"h":[["B. Broadcasting（廣播）— 錯",true]],"x":[[["一對多同時發送（例如電視廣播、網路廣播封包），不是指邊傳邊看的技術。",false]]]},{"h":[["C. Spooling（排存）— 錯",true]],"x":[[["把要給慢速裝置（例如印表機）的工作先暫存在磁碟佇列，再依序送出。",false]]]},{"h":[["D. Multitasking（多工）— 錯",true]],"x":[[["作業系統同時執行多個程式。",false]]]}],"videos":["https://www.youtube.com/watch?v=f6Zcmbg1xdM"]},"cs:109-26":{"answer":[["這題的正確答案是 ",false],["B. Merge sort takes O(n²) time in the worst case to sort an array of n elements.",true]],"items":[[["題目",true],["：下列關於排序法的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：常見排序法的最差時間複雜度：",false],["快速排序 O(n²)",true],["（平均 O(n log n)）、",false],["合併排序 O(n log n)",true],["（最好、平均、最差都一樣）、",false],["選擇排序 O(n²)",true],["、",false],["插入排序 O(n²)",true],["、氣泡排序 O(n²)、堆積排序 O(n log n)。",false]],[["同主題考古題",true],["：112-29 排序、109-12 氣泡排序、106-9 quicksort 平均。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Quick sort takes O(n²) time in the worst case（快速排序最差 O(n²)）— 正確",true]],"x":[[["基準每次選到最大或最小值時。",false]]]},{"h":[["B. Merge sort takes O(n²) time in the worst case（合併排序最差 O(n²)）— 錯誤（正確答案）",true]],"x":[[["合併排序每次都對半切、合併 O(n)，共 log n 層，最差也是 O(n log n)。",false]]]},{"h":[["C. Selection sort takes O(n²) time in the worst case（選擇排序最差 O(n²)）— 正確",true]]," "：−11.5：11.5 = 1011.1₂ = 1.0111 × 2³。符號 = 1（負數）；指數欄位 = 3 + 127 = 130 = ",false],["10000010",true],["；尾數 = 0111 後面補 0 到 23 位元。所以 B 說指數欄位是 00000011（直接寫 3）是錯的，忘了加偏移量 127。",false]],[["同主題考古題",true],["：114 填4 IEEE 浮點數、112-17 1 補數與 2 補數。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. −11.5 的符號位元是 1 — 正確",true]],"x":[[["負數的符號位元是 1。",false]]]},{"h":[["B. −11.5 的指數欄位是 00000011 — 錯誤（正確答案）",true]],"x":[[["實際指數 3 要加上偏移量 127，存 130 = 10000010。",false]]]},{"h":[["C. Twenty three bits are allocated for the significand（尾數占 23 位元）— 正確",true]],"x":[[["1 + 8 + 23 = 32。",false]]]},{"h":[["D. 正規化的二進位數一定以 1 開頭，尾數以隱藏的 1 編碼 — 正確",true]],"x":[[["既然一定是 1，就不用存，多省一個位元的精度。",false]]]}],"videos":["https://www.youtube.com/watch?v=PZRI1IfStY0"]},"cs:109-38":{"answer":[["這題的正確答案是 ",false],["D. Computer vision",true],["。",false]],"items":[[["題目",true],["：Amazon Go 是 Amazon 推出的免結帳便利商店，它的核心技術是什麼？",false]],[["核心觀念",true],["：Amazon Go 的「Just Walk Out」技術：顧客進門掃 App，店內天花板的大量攝影機用",false],["電腦視覺（computer vision）",true],["辨識顧客、追蹤他拿起或放回了哪些商品，再結合貨架的重量感測器（感測器融合）和深度學習判斷；顧客直接走出店門，系統自動從帳戶扣款。",false]],[["同主題考古題",true],["：112-23 CNN（影像辨識）、111-28 深度學習。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. AI planning（AI 規劃）— 錯",true]],"x":[[["讓 AI 規劃達成目標的行動步驟（例如機器人路徑規劃），不是免結帳的核心。",false]]]},{"h":[["B. Natural language processing（自然語言處理）— 錯",true]],"x":[[["處理文字與語言，例如翻譯、聊天機器人。",false]]]},{"h":[["C. Speech recognition（語音辨識）— 錯",true]],"x":[[["把聲音轉成文字，例如語音助理。",false]]]},{"h":[["D. Computer vision（電腦視覺）— 對（正確答案）",true]],"x":[[["讓電腦看懂影像：辨識人、商品和動作。",false]]]}],"videos":["https://www.youtube.com/watch?v=Sn256ijswus"]},"cs:109-39":{"answer":[["這題的正確答案是 ",false],["A. The TCP/IP model is a scalable, client-server architecture.",true]],"items":[[["題目",true],["：下列關於 TCP/IP 模型的敘述，何者正確？",false]],[["核心觀念",true],["：",false],["TCP/IP = Transmission Control Protocol / Internet Protocol",true],["，分四層：應用層（最靠近使用者，HTTP、DNS）、傳輸層（TCP、UDP）、網際網路層（IP）、網路介面層（Ethernet、Wi-Fi）（見 115-2）。網際網路的服務普遍採用主從式架構，而且能從小網路擴充到全球規模。",false]],[["同主題考古題",true],["：115-2 應用層協定、113-2 網路協定、108-6 TCP/IP 分層。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. The TCP/IP model is a scalable, client-server architecture（TCP/IP 模型是可擴充的主從式架構）— 正確（正確答案）",true]],"x":[[["網際網路就是建立在 TCP/IP 上、規模最大的主從式網路。",false]]]},{"h":[["B. TCP/IP stands for Transaction-centered Protocol/Internet Protocol and it contains 4 layers — 錯",true]],"x":[[["4 層是對的，但 TCP 是 Transmission Control Protocol（傳輸控制協定）。",false]]]},{"h":[["C. The transport layer is closest to the end user（傳輸層最靠近使用者）— 錯",true]],"x":[[["最靠近使用者的是應用層。",false]]]},{"h":[["D. UDP is a connection-oriented protocol that reliably transmits data（UDP 是可靠的連線導向協定）— 錯",true]],"x":[[["那是 TCP；UDP 是不可靠的非連線導向協定（見 113-2）。",false]]]}],"videos":["https://www.youtube.com/watch?v=2QGgEk20RXM"]},"cs:108-1":{"answer":[["這題的正確答案是 ",false],["B.",true],[" n^(log n / log log n)。",false]],"items":[[["題目",true],["：當 n 趨近無限大時，下列哪一個最大？（A. n log n　B. n^(log n / log log n)　C. n^√(log n)　D. n¹⁰⁰）",false]],[["核心觀念",true],["：比較成長速度時，把每個函數都寫成 ",false],["n 的某次方",true],["，看「指數」誰長得快。A：n log n = n^(1 + log log n / log n)，指數趨近 1。D：指數固定是 100。C：指數是 √(log n)，會無限變大。B：指數是 log n / log log n，也會無限變大，而且比 √(log n) 更快。只要指數會無限變大，n 夠大時一定會超過任何固定次方（例如 100），所以 B、C 都比 D 大，再比 B 和 C。",false]],[["逐步追蹤",true],["：令 L = log n。比較 B 的 L / log L 和 C 的 √L：兩者相除 = √L / log L，L 越大比值越大（√L 長得比 log L 快），所以 B 的指數最後一定贏過 C。例如 L = 1024 時，B 的指數約 102、C 約 32、D 是 100。",false]],[["同主題考古題",true],["：115-9 Big-O、113-13 時間複雜度。",false]]],"opts_title":"各選項解析（都寫成 n 的次方來比）","opts":[{"h":[["A. n log n — 錯",true]],"x":[[["指數只比 1 多一點點，四個裡面最小。",false]]]},{"h":[["B. n^(log n / log log n) — 對（正確答案）",true]],"x":[[["指數 log n / log log n 會無限增長，而且比 √(log n) 快，最後超過所有其他選項。",false]]]},{"h":[["C. n^√(log n) — 錯",true]],"x":[[["會超過 n¹⁰⁰，但長得比 B 慢。",false]]]},{"h":[["D. n¹⁰⁰ — 錯",true]],"x":[[["多項式，次方再大也是固定的；n 夠大時會被 B、C 這種「次方會變大」的函數超過。",false]]]}],"videos":["https://www.youtube.com/watch?v=g2o22C3CRfU"]},"cs:108-2":{"answer":[["這題的正確答案是 ",false],["D. Browsing URLs will not get infected by malware",true],["。",false]],"items":[[["題目",true],["：下列關於惡意程式的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：和 113-8 幾乎一樣：惡意程式可以透過 USB、文件、網頁等各種管道感染；在區域網路中，蠕蟲還能自己掃描並感染同網段的其他電腦。「瀏覽網頁不會中毒」是錯的（路過式下載、惡意廣告）。",false]],[["同主題考古題",true],["：113-8 惡意程式、109-35 網路攻擊。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. A computer might be infected without connecting to a network（沒連網也可能中毒）— 正確",true]],"x":[[["例如插入有毒的 USB 隨身碟。",false]]]},{"h":[["B. Malware might not be an executable file（惡意程式不一定是執行檔）— 正確",true]],"x":[[["Office 文件的巨集、PDF 內嵌的 JavaScript、網頁腳本都可能是惡意程式。",false]]]},{"h":[["C. 區域網路中一台機器中毒，同網段的其他機器也可能被感染 — 正確",true]],"x":[[["蠕蟲（worm）會利用網路漏洞自動散播，例如 WannaCry 勒索蠕蟲。",false]]]},{"h":[["D. Browsing URLs will not get infected by malware（瀏覽網址不會被惡意程式感染）— 錯誤（正確答案）",true]],"x":[[["打開惡意網頁就可能透過瀏覽器漏洞被植入程式（路過式下載）。",false]]]}],"videos":["https://www.youtube.com/watch?v=n8mbzU0X2nQ"]},"cs:108-3":{"answer":[["這題的正確答案是 ",false],["B. ALU",true],["。",false]],"items":[[["題目",true],["：CPU 透過「擷取－解碼－執行－儲存」週期執行指令，哪一個元件負責執行指令？",false]],[["核心觀念",true],["：和 113-1 是同一題（113-1 有你自己寫的完整解析）：控制單元（CU）負責擷取與解碼，",false],["算術邏輯單元（ALU）負責執行",true],["運算。",false]],[["同主題考古題",true],["：113-1 fetch-decode-execute、111-21 CPU 組成。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. CU（控制單元）— 錯",true]],"x":[[["負責擷取、解碼指令並發出控制訊號。",false]]]},{"h":[["B. ALU（算術邏輯單元）— 對（正確答案）",true]],"x":[[["真正執行加減、邏輯、比較運算。",false]]]},{"h":[["C. IR（指令暫存器）— 錯",true]],"x":[[["暫存目前正在處理的指令。",false]]]},{"h":[["D. MAR（記憶體位址暫存器）— 錯",true]],"x":[[["Memory Address Register，存放 CPU 要讀寫的記憶體位址（113-1 的選項是 RAM，這裡換成 MAR）。",false]]]}],"videos":["https://www.youtube.com/watch?v=Z5JC9Ve1sfI"]},"cs:108-4":{"answer":[["這題的正確答案是 ",false],["D. Symmetric encryption system can provide digital signature functionality",true],["。",false]],"items":[[["題目",true],["：下列關於密碼學的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：",false],["對稱式加密",true],["加解密用同一把祕密金鑰；",false],["非對稱式加密",true],["用一對公鑰／私鑰，由公鑰很難推出私鑰（見 114-10）。",false],["數位簽章",true],["要用私鑰簽、公鑰驗：因為只有本人有私鑰，才能證明「是本人簽的」且本人無法否認（不可否認性）。對稱式加密雙方共用同一把金鑰，任何一方都能產生同樣的結果，無法分辨是誰做的，所以不能提供數位簽章。",false]],[["同主題考古題",true],["：114-10 公開金鑰、111-23 對稱式加密、112-2 加密。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 對稱式加密用一把祕密金鑰加密和解密 — 正確",true]],"x":[[["例如 AES。",false]]]},{"h":[["B. 非對稱式加密用一對金鑰加密和解密 — 正確",true]],"x":[[["公鑰加密、私鑰解密（或私鑰簽章、公鑰驗證）。",false]]]},{"h":[["C. 知道公鑰，很難推出對應的私鑰 — 正確",true]],"x":[[["這是公開金鑰密碼系統安全的基礎（例如 RSA 靠大數因數分解的困難）。",false]]]},{"h":[["D. 對稱式加密可以提供數位簽章功能 — 錯誤（正確答案）",true]],"x":[[["數位簽章需要只有本人持有的私鑰；對稱式頂多提供訊息驗證碼（MAC），能驗證完整性但無法證明是誰發的。",false]]]}],"videos":["https://www.youtube.com/watch?v=AQDCe585Lnc"]},"cs:108-5":{"answer":[["這題的正確答案是 ",false],["A. ARP is used for finding the MAC address of an IP address, so ARP is a protocol over IP",true],["。",false]],"items":[[["題目",true],["：下列敘述何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：ARP 的功能確實是由 IP 位址查 MAC 位址（見 113-7），但它",false],["不是跑在 IP 上面的協定",true],["：ARP 封包直接裝在乙太網路訊框裡傳送（乙太網路類型欄位 0x0806，IP 是 0x0800），不需要 IP 標頭。因為要先知道 MAC 才能送 IP 封包，ARP 自然不能依賴 IP。B、C、D 和 113-2 的選項一樣都是正確的。",false]],[["同主題考古題",true],["：113-7 ARP、113-2 網路協定、112-10 ARP。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. ARP 用來找 IP 位址的 MAC 位址，所以 ARP 是 IP 之上的協定 — 錯誤（正確答案）",true]],"x":[[["前半句對、推論錯：ARP 直接封裝在資料鏈結層訊框中，和 IP 是平行的，不在 IP 之上。",false]]]},{"h":[["B. DNS queries are transmitted through UDP（DNS 查詢透過 UDP）— 正確",true]],"x":[[["UDP port 53。",false]]]},{"h":[["C. FTP responses are transmitted through TCP（FTP 回應透過 TCP）— 正確",true]],"x":[[["FTP 用 TCP port 21／20。",false]]]},{"h":[["D. HTTP requests and responses are transmitted through TCP（HTTP 透過 TCP）— 正確",true]],"x":[[["port 80／443。",false]]]}],"videos":["https://www.youtube.com/watch?v=cn8Zxh9bPio"]},"cs:108-6":{"answer":[["這題的正確答案是 ",false],["D. Presentation layer",true],["。",false]],"items":[[["題目",true],["：下列哪一層",false],["不屬於",true],[" TCP/IP 協定堆疊？",false]],[["核心觀念",true],["：",false],["OSI 七層",true],["：實體、資料鏈結、網路、傳輸、會議（session）、",false],["表現（presentation）",true],["、應用。",false],["TCP/IP",true],[" 比較精簡，把 OSI 的會議層、表現層、應用層合併成一個",false],["應用層",true],["，常見的五層說法是實體、資料鏈結、網路、傳輸、應用（四層說法則把實體和資料鏈結合成網路介面層）。所以表現層只存在於 OSI 模型。",false]],[["同主題考古題",true],["：109-39 TCP/IP 模型、115-2 應用層協定。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Data link layer（資料鏈結層）— 屬於",true]],"x":[[["例如乙太網路、Wi-Fi、ARP（五層 TCP/IP 模型的第二層）。",false]]]},{"h":[["B. Network layer（網路層）— 屬於",true]],"x":[[["IP、ICMP。",false]]]},{"h":[["C. Transport layer（傳輸層）— 屬於",true]],"x":[[["TCP、UDP。",false]]]},{"h":[["D. Presentation layer（表現層）— 不屬於（正確答案）",true]],"x":[[["OSI 第六層，負責資料格式轉換、加密、壓縮；在 TCP/IP 中由應用程式自己處理。",false]]]}],"videos":["https://www.youtube.com/watch?v=2QGgEk20RXM"]},"cs:108-7":{"answer":[["這題的正確答案是 ",false],["B. The lowest bit of a network mask must be 0",true],["（出題者最可能的答案，詳見下方）。",false]],"items":[[["題目",true],["：下列關於網路遮罩（network mask）的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：網路遮罩由",false],["左邊連續的 1、右邊連續的 0",true],[" 組成，1 的部分是網路位址、0 的部分是主機位址（見 115-19）。遮罩長度可以依需要的子網路數量調整（借主機位元切子網路），C 級網路的預設遮罩是 255.255.255.0。",false]],[["延伸陷阱",true],["：B 說最低位元一定是 0：大多數網路的遮罩確實如此，但 ",false],["255.255.255.255（/32）",true],["的最低位元是 1，它代表「單一主機」，常用在路由表的主機路由、loopback 介面，所以「一定是 0」不成立。A 也有邊界情況：0.0.0.0（/0）用在預設路由，第一個位元是 0；但一般說的網路遮罩都至少有網路位元，出題者應該是要考 B。學校沒有公布答案。",false]],[["同主題考古題",true],["：115-19 子網路遮罩、112-7 子網路號碼、111-12 網路號碼。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. The first bit of a network mask must be 1（遮罩第一個位元一定是 1）— 大致正確",true]],"x":[[["遮罩從左邊開始是連續的 1，只要至少有 1 位元的網路部分，第一位就是 1。",false]]]},{"h":[["B. The lowest bit of a network mask must be 0（遮罩最低位元一定是 0）— 錯誤（正確答案）",true]],"x":[[["/32 遮罩 255.255.255.255 全部是 1，最低位元也是 1。",false]]]},{"h":[["C. 遮罩長度可以依子網路數量而不同 — 正確",true]],"x":[[["例如把 /24 切成 4 個子網路，遮罩就變成 /26（255.255.255.192）。",false]]]},{"h":[["D. The default network subnet mask of a class C network address is 255.255.255.0（C 級預設遮罩 255.255.255.0）— 正確",true]],"x":[[["A 級 255.0.0.0、B 級 255.255.0.0、C 級 255.255.255.0。",false]]]}],"videos":["https://www.youtube.com/watch?v=s_Ntt6eTn94"]},"cs:108-8":{"answer":[["這題的正確答案是 ",false],["B. 10",true],["。",false]],"items":[[["題目",true],["：系統有 3 個實體頁框，參考字串為 a b c g a b a d b c a b a c d，使用 LRU 會產生幾次分頁錯誤？（一開始頁框都是空的）",false]],[["核心觀念",true],["：LRU 替換「最久沒被用到」的頁（見 112-14）。",false]],[["逐步追蹤",true],["：a、b、c 錯（3 次）〔a b c〕；g 錯，換掉最久沒用的 a →〔b c g〕；a 錯，換 b →〔c g a〕；b 錯，換 c →〔g a b〕；a 命中；d 錯，換 g →〔a b d〕；b 命中；c 錯，換 a →〔b d c〕；a 錯，換 d →〔b c a〕；b、a、c 命中；d 錯，換 b →〔c a d〕。共 3 + 7 = ",false],["10 次",true],["。",false]],[["同主題考古題",true],["：112-14 LRU 分頁錯誤次數、110-11 最佳頁替換次數。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 9 — 錯",true]],"x":[[["少算一次，常見錯誤是把 g 進來後的 a 當成命中。",false]]]},{"h":[["B. 10 — 對（正確答案）",true]],"x":[[["3 次填滿 + 7 次替換（g、a、b、d、c、a、d）。",false]]]},{"h":[["C. 11 — 錯",true]],"x":[[["多算了一次命中。",false]]]},{"h":[["D. 12 — 錯",true]],"x":[[["同上。",false]]]}],"videos":["https://www.youtube.com/watch?v=4wVp97-uqr0"]},"cs:108-9":{"answer":[["這題的正確答案是 ",false],["C. A circle in a resource allocation graph indicates deadlock",true],["。",false]],"items":[[["題目",true],["：下列關於死結的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：資源配置圖有環",false],["不一定",true],["死結：每種資源只有一個時，環 = 死結；資源有多個時，環只是必要條件（見 109-22）。資源若都可以搶奪（preemptive），就破壞了「不可搶奪」這個必要條件，死結不會發生（見 115-4）。",false]],[["同主題考古題",true],["：109-22 資源配置圖、115-4 deadlock 必要條件、106-14 deadlock。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Deadlock will not happen if all the resources can be preemptive（所有資源都能被搶奪就不會死結）— 正確",true]],"x":[[["死結的四個必要條件之一是不可搶奪。",false]]]},{"h":[["B. Resource allocation graph is used to represent the system state（資源配置圖用來表示系統狀態）— 正確",true]],"x":[[["畫出誰持有、誰在等哪些資源。",false]]]},{"h":[["C. A circle in a resource allocation graph indicates deadlock（資源配置圖有環就表示死結）— 錯誤（正確答案）",true]],"x":[[["資源有多個實例時，有環也可能沒有死結。",false]]]},{"h":[["D. Deadlock will slow down the system performance（死結會拖慢系統效能）— 正確",true]],"x":[[["卡住的行程佔著資源不放，其他行程也拿不到，系統吞吐量下降。",false]]]}],"videos":["https://www.youtube.com/watch?v=qPuf5B5xPCs"]},"cs:108-10":{"answer":[["這題的正確答案是 ",false],["B. The receiver side of a TCP connection maintains a buffer storing the data received; the sender side has a buffer, too.",true]],"items":[[["題目",true],["：下列關於 TCP 的敘述，何者正確？",false]],[["核心觀念",true],["：",false],["流量控制（flow control）",true],["：接收端告訴傳送端自己的緩衝區還剩多少（接收視窗 rwnd），避免接收端被塞爆，保護的是",false],["接收端",true],["。",false],["壅塞控制（congestion control）",true],["：傳送端依網路狀況（遺失、延遲）調整壅塞視窗 cwnd，避免把",false],["網路",true],["塞爆。",false],["RTT（來回時間）",true],["是量測封包送出到收到 ACK 的時間；",false],["RTO（重傳逾時）",true],["依 RTT 計算，RTT 大（網路慢）RTO 就長。",false]],[["同主題考古題",true],["：115-3 TCP 三向交握、113-2 網路協定、106-7 TCP 序號。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 壅塞控制確保傳送端不會傳太多太快而塞爆接收端緩衝區 — 錯",true]],"x":[[["那是流量控制的目的；壅塞控制是避免塞爆網路。",false]]]},{"h":[["B. TCP 接收端有緩衝區存放收到的資料，傳送端也有緩衝區 — 正確（正確答案）",true]],"x":[[["接收端緩衝區暫存還沒交給應用程式的資料；傳送端緩衝區保留已送出但還沒收到 ACK 的資料，以便重傳。",false]]]},{"h":[["C. Round-trip time (RTT) is computed based on the size of sliding window（RTT 依滑動視窗大小計算）— 錯",true]],"x":[[["RTT 是實際量測出來的時間；視窗大小反而是依 RTT 等資訊調整。",false]]]},{"h":[["D. Long retransmission timeout (RTO) indicates high transmission rate（RTO 長表示傳輸速率高）— 錯",true]],"x":[[["RTO 長通常代表網路延遲大，傳輸速度反而慢。",false]]]}],"videos":["https://www.youtube.com/watch?v=RzaPIZLRISc"]},"cs:108-11":{"answer":[["這題的正確答案是 ",false],["A. This operation is associative",true],["。",false]],"items":[[["題目",true],["：定義一種二進位字串的運算 s ¤ s'：把 s 的最後一個符號換成 s' 的最後一個符號。例如 01001 ¤ 110 = 01000。下列何者正確？",false]],[["核心觀念",true],["：",false],["結合律（associative）",true],["：(a ¤ b) ¤ c = a ¤ (b ¤ c)，括號怎麼加結果都一樣；",false],["交換律（commutative）",true],["：a ¤ b = b ¤ a，左右對調結果一樣。",false]],[["逐步追蹤",true],["：結合律：(a ¤ b) ¤ c = a 的最後一個換成 b 的、再換成 c 的 → a 的最後一個換成 c 的最後一個；a ¤ (b ¤ c)：b ¤ c 的最後一個就是 c 的最後一個 → 同樣是 a 的最後一個換成 c 的最後一個。兩邊相等 ✓。交換律：0 ¤ 11 = 1，11 ¤ 0 = 10，不相等 ✗。C：010010 ¤ 1111110 = 01001 加上 0 = ",false],["010010",true],["（長度不變，還是 6 位），選項寫 0100010（7 位）是錯的。",false]],[["同主題考古題",true],["：113-11 恆真式。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. This operation is associative（這個運算有結合律）— 對（正確答案）",true]],"x":[[["結果永遠是「第一個字串去掉最後一位 + 最右邊那個字串的最後一位」，和怎麼分組無關。",false]]]},{"h":[["B. This operation is commutative（這個運算有交換律）— 錯",true]],"x":[[["結果的長度跟著左邊的字串，對調後長度就變了。",false]]]},{"h":[["C. 010010 ¤ 1111110 = 0100010 — 錯",true]],"x":[[["正確結果是 010010。",false]]]},{"h":[["D. None of the above — 錯",true]],"x":[[["A 正確。",false]]]}],"videos":["https://www.youtube.com/watch?v=VpCsKWHbJIA"]},"cs:108-12":{"answer":[["這題的正確答案是 ",false],["D. IaaS is the most inefficient business model",true],["。",false]],"items":[[["題目",true],["：下列關於雲端運算的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：雲端運算是分散式的網路運算環境；IaaS、PaaS、SaaS 是三種服務（商業）模式（見 112-19、110-10），各有適合的情境，沒有哪一種是「最沒效率」的：IaaS 給最大的彈性和控制權，SaaS 最省事。",false]],[["同主題考古題",true],["：112-19 雲端運算、110-10 IaaS（EC2）。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Cloud computing is a type of distributed network environments（雲端是一種分散式網路環境）— 正確",true]],"x":[[["資源分散在資料中心的大量機器上，透過網路提供。",false]]]},{"h":[["B. SaaS is a type of business models in cloud computing（SaaS 是雲端的一種商業模式）— 正確",true]],"x":[[["使用者訂閱軟體服務，不必自己安裝維護。",false]]]},{"h":[["C. Google's Gmail is an example of SaaS（Gmail 是 SaaS 的例子）— 正確",true]],"x":[[["打開瀏覽器就能用的郵件軟體。",false]]]},{"h":[["D. IaaS is the most inefficient business model（IaaS 是最沒效率的商業模式）— 錯誤（正確答案）",true]],"x":[[["沒有這種說法；IaaS 讓企業不用自建機房、按需租用，是最基礎也最有彈性的雲端服務。",false]]]}],"videos":["https://www.youtube.com/watch?v=3V67iunYN1I"]},"cs:108-13":{"answer":[["這題的正確答案是 ",false],["C. TLS/SSL applies asymmetric cryptography to encrypt transmitted data",true],["。",false]],"items":[[["題目",true],["：下列關於 TLS/SSL 的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：TLS（前身是 SSL）在 TCP 之上提供端對端的加密通訊，",false],["HTTPS = HTTP over TLS",true],["。它同時用兩種加密：交握階段用",false],["非對稱加密",true],["驗證伺服器憑證（身分驗證）、協商出一把工作階段金鑰；之後真正傳送的資料用",false],["對稱加密",true],["（例如 AES），因為對稱加密快很多（見 114-10）。",false]],[["同主題考古題",true],["：114-10 公開金鑰、108-4 密碼學、107-11 憑證機構。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. TLS/SSL 是在 TCP 之上提供端對端安全通訊的協定 — 正確",true]],"x":[[["位於應用層和傳輸層之間。",false]]]},{"h":[["B. TLS/SSL applies asymmetric cryptography to ensure user authentica  控制器、顯示卡、網路卡；作業系統再透過對應的",false],["驅動程式（device driver）",true],["和控制器溝通。I/O 裝置屬於",false],["周邊設備（peripherals）",true],["，透過",false],["連接埠（port）",true],["接到電腦；CPU、RAM 是電腦的核心元件，不算周邊。",false]],[["同主題考古題",true],["：114 填2 中斷驅動 I/O、110-9 SSD 優點。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 所有 I/O 裝置都用同一個共用的裝置控制器和作業系統溝通 — 錯誤（正確答案）",true]],"x":[[["不同裝置的訊號、速度、資料格式差很多，各有專屬的控制器。",false]]]},{"h":[["B. I/O devices are peripherals of a computer system（I/O 裝置是電腦的周邊）— 正確",true]],"x":[[["鍵盤、滑鼠、螢幕、印表機、外接硬碟。",false]]]},{"h":[["C. Port is a pathway for an external device to go into or out of the computer（連接埠是外部裝置進出電腦的通道）— 正確",true]],"x":[[["例如 USB、HDMI、乙太網路埠。",false]]]},{"h":[["D. RAM is not a peripheral device for a computer（RAM 不是周邊設備）— 正確",true]],"x":[[["RAM 是主記憶體，和 CPU 一起構成電腦的核心。",false]]]}],"videos":["https://www.youtube.com/watch?v=IUgBnRuz_gU"]},"cs:108-16":{"answer":[["這題的正確答案是 ",false],["A. Two's complement of 36 is 1011011",true],["。",false]],"items":[[["題目",true],["：下列關於二進位數字系統的敘述，何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：補數表示法（見 112-17、111-3）：1 補數 = 每個位元反轉；2 補數 = 1 補數再加 1。k 位元 1 補數能表示 −(2^(k−1) − 1) ～ 2^(k−1) − 1；k 位元 2 補數能表示 −2^(k−1) ～ 2^(k−1) − 1。",false]],[["逐步追蹤",true],["：A：36 = 0100100（7 位元）→ 反轉 1011011（這是 1 補數）→ 加 1 = ",false],["1011100",true],["，所以 A 寫的 1011011 少加了 1。B：1 補數要表示 −2^N，需要 2^(k−1) − 1 ≥ 2^N，最小的 k 是 N + 2（例如 −2 = −2¹ 要 3 位元：101），正確。",false]],[["同主題考古題",true],["：112-17 1 補數與 2 補數、111-3 −5 的 2 補數、110-12 2 補數加法。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Two's complement of 36 is 1011011（36 的 2 補數是 1011011）— 錯誤（正確答案）",true]],"x":[[["那是 1 補數；2 補數要再加 1，是 1011100。",false]]]},{"h":[["B. It requires N+2 bits to represent −2^N in one's complement（1 補數表示 −2^N 需要 N + 2 位元）— 正確",true]],"x":[[["N + 1 位元的 1 補數最小只到 −(2^N − 1)，不夠；要 N + 2 位元。",false]]]},{"h":[["C. N 位元 2 補數可表示 −2^(N−1) 到 2^(N−1) − 1 — 正確",true]],"x":[[["例如 8 位元是 −128～127。",false]]]},{"h":[["D. Two's complement is adding one to one's complement（2 補數 = 1 補數加 1）— 正確",true]],"x":[[["這是求 2 補數的標準方法。",false]]]}],"videos":["https://www.youtube.com/watch?v=4qH4unVtJkE"]},"cs:108-17":{"answer":[["這題的正確答案是 ",false],["C. A computer system with a single CPU cannot achieve multiprogramming ability",true],["。",false]],"items":[[["題目",true],["：下列敘述何者",false],["錯誤",true],["？",false]],[["核心觀念",true],["：",false],["多元程式（multiprogramming）",true],["：記憶體中同時放好幾個程式，一個程式在等 I/O 時，CPU 就切去執行另一個，讓 CPU 不閒著，",false],["單一 CPU 就能做到",true],["（這也是它的目的：提高 CPU 使用率）。",false],["多處理器系統（multiprocessing）",true],["：一台電腦有多顆 CPU（或多核心），可以真正同時執行多個程式。",false]],[["同主題考古題",true],["：115-8 多執行緒 vs 多行程、113-9 process 排程。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Multiprogramming indicates that there are multiple processes residing in memory（多元程式是指記憶體中有多個行程）— 正確",true]],"x":[[["這是多元程式的定義。",false]]]},{"h":[["B. Multiprocessing system refers that there are multiple CPUs within a computer system（多處理器系統指有多顆 CPU）— 正確",true]],"x":[[["例如多核心處理器、伺服器的多顆 CPU。",false]]]},{"h":[["C. 單一 CPU 的電腦無法達成多元程式 — 錯誤（正確答案）",true]],"x":[[["多元程式本來就是為單一 CPU 設計的：靠快速切換讓多個程式輪流使用 CPU。",false]]]},{"h":[["D. Multiprogramming can improve CPU utilization（多元程式能提升 CPU 使用率）— 正確",true]],"x":[[["程式等 I/O 時 CPU 不會閒置。",false]]]}],"videos":["https://www.youtube.com/watch?v=qU1I1CDu0Tk"]},"cs:108-18":{"answer":[["這題的正確答案是 ",false],["B. O(|V|³)",true],["。",false]],"items":[[["題目",true],["：有向圖 G(V, E) 用矩陣表示，找出",false],["所有點對",true],["之間最短路徑的時間複雜度是多少？",false]],[["核心觀念",true],["：所有點對最短路徑用 ",false],["Floyd-Warshall 演算法",true],["：依序讓每個頂點 k 當中繼點，檢查每一對 (i, j) 經過 k 會不會更短：dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])。三層迴圈各跑 |V| 次，所以是 ",false],["O(|V|³)",true],["（見 112-28 的 B 選項）。",false]],[["同主題考古題",true],["：112-28 圖的相鄰矩陣、110-13 BFS／DFS。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. O(|V|²) — 錯",true]],"x":[[["這是用相鄰矩陣跑一次 Dijkstra（單一起點）的時間。",false]]]},{"h":[["B. O(|V|³) — 對（正確答案）",true]],"x":[[["Floyd-Warshall 的三層迴圈。",false]]]},{"h":[["C. O(|E|³) — 錯",true]],"x":[[["複雜度和頂點數有關，不是邊數的三次方。",false]]]},{"h":[["D. O(|V|) — 錯",true]],"x":[[["連把整 數式語言沒有會改變的迴圈計數器，重複執行靠遞迴，常搭配尾遞迴最佳化避免堆疊爆掉。",false]]]}],"videos":["https://www.youtube.com/watch?v=nkRI8mu8jes","https://www.youtube.com/watch?v=y9vr99qmlOg"]},"cs:107-2":{"answer":[["這題的正確答案是 ",false],["D. Pandas",true],["。",false]],"items":[[["題目",true],["：下列哪一個軟體框架／套件",false],["不常",true],["用來處理比主記憶體還大的巨量資料？",false]],[["核心觀念",true],["：資料比記憶體大時，要把資料切塊分散到很多台機器（叢集）上平行處理，或分批從磁碟讀進來。Spark、Hadoop、H2O 都是",false],["分散式",true],["平台；",false],["Pandas",true],[" 是 Python 的",false],["單機",true],["資料分析套件，會把整份 DataFrame 載入記憶體，資料超過 RAM 就會 MemoryError。",false]],[["延伸陷阱",true],["：Pandas 可以用 chunksize 分批讀檔，或改用 Dask、Polars 這類相容的工具處理大資料，但 Pandas 本身的設計是單機、全部放記憶體，所以答它。",false]],[["同主題考古題",true],["：109-6 Apache Spark、108-21 HDFS、107-6 MapReduce。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Apache Spark — 常用",true]],"x":[[["叢集上的記憶體內運算框架，記憶體放不下時會寫到磁碟；比 Hadoop MapReduce 快很多。",false]]]},{"h":[["B. Apache Hadoop — 常用",true]],"x":[[["HDFS 分散式儲存＋MapReduce 批次運算，把資料切成區塊分散在多台機器。",false]]]},{"h":[["C. H2O — 常用",true]],"x":[[["H2O.ai 的開源分散式機器學習平台，可以在叢集上或搭配 Spark（Sparkling Water）訓練模型。",false]]]},{"h":[["D. Pandas — 不常用（正確答案）",true]],"x":[[["單機、整份資料載入記憶體，適合放得進 RAM 的資料。",false]]]}],"videos":["https://www.youtube.com/watch?v=9MeMWdILl5Q","https://www.youtube.com/watch?v=gStEmfREaVQ"]},"cs:107-3":{"answer":[["這題的正確答案是 ",false],["A. JSON",true],["。",false]],"items":[[["題目",true],["：下列何者通常被視為半結構化資料（semi-structured data）？",false]],[["核心觀念",true],["：",false],["結構化",true],["資料有固定的欄位和型態，可以直接放進表格（關聯式資料庫）。",false],["半結構化",true],["資料沒有固定的表格綱要，但資料本身帶有標籤或鍵來描述結構（JSON、XML、HTML）。",false],["非結構化",true],["資料沒有預先定義的結構（自由文字、影像、影音）。",false]],[["延伸陷阱",true],["：整封 Email 常被歸為半結構化（標頭有 From、To、Subject 等欄位），但題目特別寫「body text」（內文），內文是自由書寫的文字，屬於非結構化。",false]],[["同主題考古題",true],["：109-16 非結構化資料、108-34 結構化資料、109-2 Data Lake。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. JSON — 半結構化（正確答案）",true]],"x":[[["用「鍵：值」和巢狀結構描述資料，例如 {\"name\": \"Amy\", \"tags\": [\"a\", \"b\"]}；每筆資料的欄位可以不一樣，不必先定義綱要。",false]]]},{"h":[["B. Email body text（Email 內文）— 非結構化",true]],"x":[[["沒有欄位的自由文字。",false]]]},{"h":[["C. Video file（影片檔）— 非結構化",true]],"x":[[["影音、圖片都是非結構化資料。",false]]]},{"h":[["D. Table data in relational databases（關聯式資料庫的表格）— 結構化",true]],"x":[[["欄位和型態都由綱要（schema）事先定好。",false]]]}],"videos":["https://www.youtube.com/watch?v=ps7NgQma0aw"]},"cs:107-4":{"answer":[["這題的正確答案是 ",false],["D. &ary[3]",true],["。",false]],"items":[[["題目",true],["：ary 是 C 陣列、aryPtr 是指向這個陣列的指標，哪一個運算式代表",false],["元素 3 的位址",true],["？",false]],[["核心觀念",true],["：如果 aryPtr = ary（指向 ary[0]），那麼 aryPtr + 3、ary + 3、&ary[3]、&aryPtr[3] 都是元素 3 的",false],["位址",true],["；前面加 * 或後面加 [ ] 就變成「取值」：*(aryPtr + 3)、aryPtr[3]、ary[3] 都是元素 3 的",false],["值",true],["。指標加 3 不是位址加 3 個位元組，而是往後跳 3 個元素（3 × sizeof(int)）。",false]],[["延伸陷阱",true],["：「element 3」指索引 3，也就是第 4 個元素（C 陣列從 0 開始編號）。",false]],[["同主題考古題",true],["：106 問4 指標運算 P+5、108-38 陣列傳參考、109-19 C 指標、108-40 指標存位址。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. *(aryPtr + 3) — 錯",true]],"x":[[["aryPtr + 3 是位址，前面加 * 解參考，得到的是元素 3 的值。",false]]]},{"h":[["B. aryPtr[3] — 錯",true]],"x":[[["指標也可以用下標，aryPtr[3] 就等於 *(aryPtr + 3)，是值。",false]]]},{"h":[["C. ary(t + 3) — 錯",true]],"x":[[["語法錯誤：C 的陣列不能用小括號存取，這樣寫會被當成呼叫一個叫 ary 的函數。",false]]]},{"h":[["D. &ary[3] — 對（正確答案）",true]],"x":[[["ary[3] 是元素 3，& 取它的位址，等於 ary + 3。",false]]]}],"videos":["https://www.youtube.com/watch?v=1LO4XONZVjY","https://www.youtube.com/watch?v=MIL2BK02X8A"]},"cs:107-5":{"answer":[["這題的正確答案是 ",false],["C. The memory address saved in xPtr cannot be modified",true],["。",false]],"items":[[["題目",true],["：const int * const xPtr = &x; 下列敘述何者",false],["正確",true],["？",false]],[["核心觀念",true],["：從右往左讀：xPtr 是一個 ",false],["const 指標",true],["（指標本身不能改），指向 ",false],["const int",true],["（不能透過它改值）。規則：const 在 * ",false],["左邊",true],[" → 指向的資料唯讀；const 在 * ",false],["右邊",true],[" → 指標本身唯讀。四種組合：int *p（都能改）、const int *p（不能改 *p，可以改 p）、int * const p（可以改 *p，不能改 p）、const int * const p（兩個都不能改，就是本題）。",false]],[["延伸陷阱",true],["：A 的說法不精確：xPtr 本身是常數，不是可以改值的「指標變數」；而且它指向的型態是 const int，「type const」不是完整的型態。四個選項裡最明確正確的是 C（學校沒有公布答案）。",false]],[["同主題考古題",true],["：110-24 const 指標、109-7 C 指標變數。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. xPtr is a pointer variable that points to an object of type const — 不精確",true]],"x":[[["xPtr 是常數指標，指向的型態是 const int（透過 xPtr 唯讀）；x 本身也不一定是 const。",false]]]},{"h":[["B. xPtr 指向的物件的值可以被修改 — 錯",true]],"x":[[["const int 讓 *xPtr = 10 編譯錯誤。",false]]]},{"h":[["C. xPtr 存的記憶體位址不能被修改 — 對（正確答案）",true]],"x":[[["* 右邊的 const 讓指標本身唯讀，宣告時就要初始化，之後不能再指向別處。",false]]]},{"h":[["D. xPtr = &y 是合法的 — 錯",true]],"x":[[["這就是在改 xPtr 存的位址，和 C 矛盾，會編譯錯誤。",false]]]}],"videos":["https://www.youtube.com/watch?v=egvGq3WSF9Y"]},"cs:107-6":{"answer":[["這題的正確答案是 ",false],["D. Combiners in MapReduce may help reduce data transmission among multiple data nodes",true],["。",false]],"items":[[["題目",true],["：下列關於 MapReduce 程式模型的敘述，何者",false],["正確",true],["？",false]],[["核心觀念",true],["：MapReduce 是 Google 在 2004 年提出的分散式批次運算模型，Hadoop 是它的開源實作。三個階段：",false],["Map",true],[" 把每筆輸入轉成 (key, value)；",false],["Shuffle",true],[" 依 key 分組，同一個 key 送到同一台機器；",false],["Reduce",true],[" 把同一個 key 的所有值合併。",false],["Combiner",true],[" 是在 Map 所在的節點上先做一次局部的 Reduce，減少要送過網路的資料量。",false]],[["逐步追蹤",true],["：字數統計：某台機器的 Map 輸出 500 個 (\"the\", 1)。沒有 Combiner 要送 500 筆給 Reducer；有 Combiner 先在本機加總成 (\"the\", 500)，只送 1 筆。",false]],[["延伸陷阱",true],["：map、reduce 這兩個名稱來自函數式語言（見 107-1），不是物件導向。",false]],[["同主題考古題",true],["：107-1 函數式語言、109-6 Apache Spark、108-21 HDFS、107-2 大資料處理框架。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. MapReduce 常用於迭代式資料處理 — 錯",true]],"x":[[["每一輪 MapReduce 都要把中間結果寫回 HDFS 磁碟，需要反覆迭代的工作（機器學習訓練、PageRank）會很慢；這正是 Spark 用記憶體內運算改善的地方。",false]]]},{"h":[["B. MapReduce 是 Apache Spark 實作的常見程式模型 — 錯",true]],"x":[[["MapReduce 是 Hadoop 的運算引擎。Spark 是另一套引擎（RDD、DataFrame），雖然也有 map、reduce 操作，但它是為了取代 MapReduce 而設計的。",false]]]},{"h":[["C. MapReduce 的概念源自物件導向程式設計 — 錯",true]],"x":[[["源自函數式程式設計（Lisp 的 map 和 reduce）。",false]]]},{"h":[["D. Combiner 可以減少資料節點之間的資料傳輸 — 對（正確答案）",true]],"x":[[["先在本機局部合併，再把較少的資料送去 Shuffle。",false]]]}],"videos":["https://www.youtube.com/watch?v=cHGaQz0E7AU","https://www.youtube.com/watch?v=58hEW-GA96g"]},"cs:107-7":{"answer":[["這題的正確答案是 ",false],["A. 3 rows and 2 columns",true],["。",false]],"items":[[["題目",true],["：資料表 A(id, val) = {(1, A), (3, X), (5, C)}，B(id, val) = {(3, X), (5, Y), (6, Z)}。執行 SELECT A.* from A LEFT JOIN B ON A.id = B.id 後，結果有幾列幾欄？",false]],[["核心觀念",true],["：",false],["LEFT JOIN",true],[" 保留左表的每一列：右表找得到配對就接上，找不到就補 NULL。B 的 id 沒有重複，A 的每一列最多配到一列，所以結果列數＝A 的列數 3。SELECT A.* ",false],["只取 A 的欄位",true],["（id、val），所以是 2 欄。",false]],[["逐步追蹤",true],["：id = 1 → B 沒有 → (1, A, NULL, NULL)；id = 3 → (3, X, 3, X)；id = 5 → (5, C, 5, Y)。完整結果 3 列 4 欄，只取 A.* → 3 列 2 欄。",false]],[["延伸陷阱",true],["：改成 INNER JOIN 只剩 id 3、5 兩列（C 的陷阱）；改成 SELECT * 就是 4 欄（B 的陷阱）。如果右表有重複的 key，LEFT JOIN 的列數可能比左表還多。",false]],[["同主題考古題",true],["：110-37 SQL 合併、109-13 SQL 結果列數、108-39 SQL 結果列數。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 3 rows and 2 columns — 對（正確答案）",true]],"x":[[["左表 3 列全部保留，只取 A 的 2 個欄位。",false]]]},{"h":[["B. 3 rows and 4 columns — 錯",true]],"x":[[["SELECT * 才會有 A、B 兩邊共 4 欄。",false]]]},{"h":[["C. 2 rows and 2 columns — 錯",true]],"x":[[["INNER JOIN 才會丟掉 id = 1 那列。",false]]]},{"h":[["D. 2 rows and 4 columns — 錯",true]],"x":[[["SELECT * from A INNER JOIN B 的結果。",false]]]}],"videos":["https://www.youtube.com/watch?v=dPYHNsZEuuQ"]},"cs:107-8":{"answer":[["這題的正確答案是 ",false],["A. 8",true],["。",false]],"items":[[["題目",true],["：整數 5 以",false],["字元",true],["形式存在電腦記憶體中，一般占 ______ 位元（bit）。",false]],[["核心觀念",true],["：存成字元時，存的是字元 '5' 的",false],["編碼",true],["，不是數值 5。ASCII 中 '5' = 53 = 0x35 = 00110101，一個字元用 1 個位元組（byte）＝ ",false],["8 bits",true],[" 存。",false]],[["延伸陷阱",true],["：注意單位是 bit 不是 byte；110-22 問的是位元組（每個數字 1 byte）。用 UTF-16（Java 的 char）是 16 bits，但題目說「typically（一般）」，指 ASCII／UTF-8 的 8 bits。如果存成 int，通常是 32 bits。",false]],[["同主題考古題",true],["：110-22 整數存成字元幾個位元組、111-11 偶同位元與 ASCII。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 8 — 對（正確答案）",true]],"x": 機器學習方法 — 對（正確答案）",true]],"x":[[["透過與環境互動、根據獎勵調整行為。",false]]]}],"videos":["https://www.youtube.com/watch?v=Mgsgj-Wcmvo"]},"cs:107-13":{"answer":[["這題的正確答案是 ",false],["D. Merge sort",true],["。",false]],"items":[[["題目",true],["：下列哪一個排序演算法在時間複雜度上是最佳解？",false]],[["核心觀念",true],["：以「比較」為基礎的排序，最壞情況至少要 ",false],["Ω(n log n)",true],[" 次比較（n 個元素有 n! 種排列，每次比較最多把可能性砍半，需要 log₂(n!) ≈ n log n 次）。",false],["合併排序",true],["最好、平均、最壞都是 O(n log n)，達到這個下界，所以是最佳解。插入、氣泡、選擇排序最壞都是 O(n²)。",false]],[["延伸陷阱",true],["：插入排序（以及有提早結束旗標的氣泡排序）在資料已經排好時是 O(n)，但這是最好情況，題目問的是一般情況。合併排序的代價是需要 O(n) 的額外空間。",false]],[["同主題考古題",true],["：112-29 排序、109-26 排序法複雜度、109-12 氣泡排序、106-9 quicksort 平均。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Insertion sort（插入排序）— 錯",true]],"x":[[["平均、最壞 O(n²)。",false]]]},{"h":[["B. Bubble sort（氣泡排序）— 錯",true]],"x":[[["平均、最壞 O(n²)。",false]]]},{"h":[["C. Selection sort（選擇排序）— 錯",true]],"x":[[["不管資料怎麼排都是 O(n²)。",false]]]},{"h":[["D. Merge sort（合併排序）— 對（正確答案）",true]],"x":[[["一律 O(n log n)：切成兩半各自排好（log n 層），每層合併共花 O(n)。",false]]]}],"videos":["https://www.youtube.com/watch?v=kPRA0W1kECg"]},"cs:107-14":{"answer":[["這題的正確答案是 ",false],["C. 15",true],["。",false]],"items":[[["題目",true],["：如果二元樹中最長的路徑包含 4 個節點，整棵樹最多有幾個節點？",false]],[["核心觀念",true],["：最長路徑（從根到最深的葉）有 4 個節點，代表樹有 4 層。節點最多的情況是每一層都填滿（完滿二元樹）：第 k 層最多 2^(k−1) 個節點，1 + 2 + 4 + 8 = ",false],["2⁴ − 1 = 15",true],["。",false]],[["延伸陷阱",true],["：「路徑包含 4 個節點」等於有 3 條邊。如果題目改用邊數定義高度 h，最多節點是 2^(h+1) − 1，結果一樣是 15。最少的情況是 4 個節點排成一直線（A 的陷阱）。",false]],[["同主題考古題",true],["：111-13 完全二元樹高度、113-10 陣列表示二元樹。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 4 — 錯",true]],"x":[[["這是最少節點數（每層只有一個節點的歪斜樹）。",false]]]},{"h":[["B. 7 — 錯",true]],"x":[[["3 層的滿樹 2³ − 1，少算一層。",false]]]},{"h":[["C. 15 — 對（正確答案）",true]],"x":[[["4 層全部填滿：1 + 2 + 4 + 8。",false]]]},{"h":[["D. 31 — 錯",true]],"x":[[["5 層的滿樹 2⁵ − 1，多算一層。",false]]]}],"videos":["https://www.youtube.com/watch?v=xx-i7pieLqU"]},"cs:107-15":{"answer":[["這題的正確答案是 ",false],["C. Semaphore",true],["。",false]],"items":[[["題目",true],["：下列哪一個是控制臨界區間（critical section）存取的技術？",false]],[["核心觀念",true],["：",false],["臨界區間",true],["是存取共享資源（共用變數、檔案）的程式片段，同一時間只能讓一個行程進入（互斥，mutual exclusion），否則會出現競爭條件（race condition）。",false],["號誌（semaphore）",true],["是 Dijkstra 提出的整數變數，只能用兩個不可分割（atomic）的操作存取：",false],["wait（P）",true],["把 S 減 1，如果結果小於 0 就等待；",false],["signal（V）",true],["把 S 加 1，並喚醒一個等待中的行程。初值為 1 的二元號誌就是一把互斥鎖。",false]],[["逐步追蹤",true],["：S 初值 1。行程 A 執行 wait → S = 0，進入臨界區間；行程 B 執行 wait → S = −1，被擋下等待；A 離開時 signal → S = 0，喚醒 B 進入。",false]],[["同主題考古題",true],["：109-22 deadlock、106-14 deadlock、108-9 deadlock、113-9 process 排程。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Spooling（排存）— 錯",true]],"x":[[["把要給慢速裝置（印表機）的資料先暫存在磁碟排隊，例如列印佇列。",false]]]},{"h":[["B. Time sharing（分時）— 錯",true]],"x":[[["把 CPU 時間切成小片，輪流分給多個使用者或行程。",false]]]},{"h":[["C. Semaphore（號誌）— 對（正確答案）",true]],"x":[[["用 wait／signal 控制同時能進入臨界區間的行程數。",false]]]},{"h":[["D. Booting（開機）— 錯",true]],"x":[[["載入作業系統的過程（見 108-14）。",false]]]}],"videos":["https://www.youtube.com/watch?v=eoGkJWgxurQ","https://www.youtube.com/watch?v=-GnLLXPjLN4"]},"cs:107-16":{"answer":[["這題的正確答案是 ",false],["A. P(X|Y) = P(Y|X) P(X) / P(Y)",true],["。",false]],"items":[[["題目",true],["：下列哪一個等式正確？",false]],[["核心觀念",true],["：這是",false],["貝氏定理",true],["。條件機率的定義 P(X|Y) = P(X∩Y) / P(Y)；同理 P(Y|X) = P(X∩Y) / P(X)，所以 P(X∩Y) = P(Y|X) P(X)。代回第一式就得到 P(X|Y) = P(Y|X) P(X) / P(Y)。用途是「反推」：已知「原因 → 結果」的機率，算出「看到結果時，原因成立」的機率。機器學習的單純貝氏分類器（Naive Bayes）就是用它。",false]],[["逐步追蹤",true],["：某疾病盛行率 1%，檢驗對病人有 99% 會呈陽性，對健康的人有 5% 會誤判陽性。P(陽性) = 0.99 × 0.01 + 0.05 × 0.99 = 0.0594；P(有病｜陽性) = 0.0099 / 0.0594 ≈ 16.7%。陽性不代表大概有病，因為健康的人太多了。",false]],[["延伸陷阱",true],["：P(X|Y) 和 P(Y|X) 一般不相等，要乘上 P(X)、除以 P(Y) 才能互換。",false]],[["同主題考古題",true],["：112-21 監督式學習、107-12 強化學習。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. P(Y|X) P(X) / P(Y) — 對（正確答案）",true]],"x":[[["分子 P(Y|X) P(X) 就是 P(X∩Y)，再除以 P(Y)，符合條件機率的定義。",false]]]},{"h":[["B. P(Y|X) P(X) — 錯",true]],"x":[[["這只是 P(X∩Y)（聯合機率），還沒除以 P(Y)。",false]]]},{"h":[["C. P(Y|X) / P(Y) — 錯",true]],"x":[[["少乘了事前機率 P(X)。",false]]]},{"h":[["D. P(Y|X) P(X) P(Y) — 錯",true]],"x":[[["P(Y) 應該是除，不是乘。",false]]]}],"videos":["https://www.youtube.com/watch?v=Dftab3JSz8U","https://www.youtube.com/watch?v=HZGCoVF3YvM"]},"cs:107 問1":{"answer":[["這題的正確答案是 ",false],["先印出 n % 10（個位數），如果 n ≥ 10 再遞迴呼叫 reverse(n / 10)",true],["（參考程式見下方）。",false]],"items":[[["題目",true],["：（問答，10 分）請寫一個遞迴的 C/C++ 函數 reverse(n)，把正整數 n 反過來印出。例如 reverse(9876); 會印出 6789。",false]],[["核心觀念",true],["：",false],["n % 10",true],[" 取出個位數，",false],["n / 10",true],["（整數除法）去掉個位數。遞迴的想法：先印個位數，剩下的數字交給 reverse(n / 10) 處理；終止條件是 n 只剩一位數（n < 10），印完就不再呼叫。",false]],[["逐步追蹤",true],["：reverse(9876) 印 6 → reverse(987) 印 7 → reverse(98) 印 8 → reverse(9) 印 9，9 < 10 停止。輸出 6789。",false]],[["延伸陷阱",true],["：「先印再遞迴」會反過來印；如果把 printf 放到遞迴呼叫之後（先遞迴再印），就會照原順序印出 9876。結尾有 0 的數字（例如 1200）會印出 0021，題目只要求印出反過來的數字，這樣是對的；如果要回傳反轉後的整數，就要另外累加 rev = rev * 10 + n % 10。",false]],[["同主題考古題",true],["：113-15 C 遞迴判讀、111-26、110-27 遞迴、113-17 用 C 寫河內塔遞迴。",false]]],"opts_title":"參考答案（C 程式）","opts":[{"h":[["遞迴函數 reverse",true]],"x":[[["```\n#include <stdio.h>\n\n/* 把正整數 n 的各位數字反過來印出 */\nvoid reverse(int n) {\n    printf(\"%d\", n % 10);     /* 先印個位數 */\n    if (n >= 10)              /* 還有其他位數 */\n        reverse(n / 10);      /* 去掉個位數，處理剩下的部分 */\n}\n\nint main(void) {\n    reverse(9876);            /* 印出 6789 */\n    printf(\"\\n\");\n    return 0;\n}",false]]]},{"h":[["程式重點",true]],"x":[[["每次呼叫只處理一位數，遞迴深度等於位數 d，時間 O(d)。",false]],[["終止條件也可以寫在最前面：if (n < 10) { printf(\"%d\", n); return; }，結果一樣。",false]]]}],"videos":["https://www.youtube.com/watch?v=rf60MejMz3E","https://www.youtube.com/watch?v=iWQ5rGWmkXw"]},"cs:107 問2":{"answer":[["這題的正確答案是 ",false],["比較排序好陣列的中間元素：相等就回傳索引；key 比較小就遞迴搜尋左半，比較大就遞迴搜尋右半；範圍空了回傳 −1",true],["（參考程式見下方）。",false]],"items":[[["題目",true],["：（問答，10 分）請用 C/C++ 寫一個遞迴的二分搜尋（binary search）函數。",false]],[["核心觀念",true],["：二分搜尋的前提是",false],["陣列已經排序",true],["。每次看範圍 [low, high] 的中間位置 mid：a[mid] == key 就找到了；key < a[mid] 答案只可能在左半 [low, mid − 1]；否則在右半 [mid + 1, high]。每次範圍砍半，最多比較 ⌊log₂ n⌋ + 1 次，時間 O(log n)。",false]],[["逐步追蹤",true],["：a = {2, 5, 8, 12, 16, 23, 38, 56, 72, 91}，找 23：[0, 9] 的 mid = 4，a[4] = 16 < 23 → 右半 [5, 9]；mid = 7，a[7] = 56 > 23 → 左半 [5, 6]；mid = 5，a[5] = 23，找到，回傳 5，共比較 3 次。",false]],[["延伸陷阱",true],["：mid 寫成 low + (high − low) / 2，而不是 (low + high) / 2，可以避免 low + high 超過 int 範圍而溢位。終止條件 low > high 一定要寫，否則找不到時會無窮遞迴。遞迴呼叫前面要加 return，結果才會一路傳回最外層。",false]],[["同主題考古題",true],["：111-8 二分搜尋複雜度、110-3 二分搜尋、109-34 大型排序陣列搜尋（二分搜尋）、106-4 二分搜尋比較次數。",false]]],"opts_title":"參考答案（C 程式）","opts":[{"h":[["遞迴函數 binarySearch",true]],"x":[[["```\n#include <stdio.h>\n\n/* 在排序好的 a[low..high] 中找 key：找到回傳索引，找不到回傳 -1 */\nint binarySearch(int a[], int low, int high, int key) {\n    if (low > high)                                  /* 範圍是空的：找不到 */\n        return -1;\n    int mid = low + (high - low) / 2;                /* 避免 low + high 溢位 */\n    if (a[mid] == key)\n        return mid;\n    else if (key < a[mid])\n        return binarySearch(a, low, mid - 1, key);   /* 搜尋左半 */\n    else\n        return binarySearch(a, mid + 1, high, key);  /* 搜尋右半 */\n}\n\nint main(void) {\n    int a[] = {2, 5, 8, 12, 16, 23, 38, 56, 72, 91};\n    int n = sizeof(a) / sizeof(a[0]);\n    printf(\"%d\\n\", binarySearch(a, 0, n - 1, 23));   /* 印出 5 */\n    printf(\"%d\\n\", binarySearch(a, 0, n - 1, 7));    /* 印出 -1 */\n    return 0;\n}",false]]]},{"h":[["程式重點",true]],"x":[[["遞迴深度是 O(log n)，每一層占一個堆疊框架；改寫成迴圈版本（while (low <= high)）只需要 O(1) 額外空間。",false]],[["呼叫時範圍是 0 到 n − 1，不是 0 到 n。",false]]]}],"videos":["https://www.youtube.com/watch?v=MFhxShGxHWc"]},"cs:106-1":{"answer":[["這題的正確答案是 ",false],["C. interpreter",true],["。",false]],"items":[[["題目",true],["：______ 一次處理一行原始碼：讀進來、翻譯成機器層級的指令、執行，然後再處理下一行。",false]],[["核心觀念",true],["：",false],["直譯器（interpreter）",true],["邊翻譯邊執行，一次一行；",false],["編譯器（compiler）",true],["先把整個程式翻譯成機器碼（目的檔），連結後才執行。直譯的好處是改完馬上能跑、方便除錯；缺點是每次執行都要重新翻譯，速度較慢。",false]],[["同主題考古題",true],["：112-24 直譯式語言、106-10 編譯步驟、112-8 連結（linking）。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. compiler（編譯器）— 錯",true]],"x":[[["先把整份程式翻譯完，不會邊翻譯邊執行。",false]]]},{"h":[["B. non-procedural language（非程序式語言）— 錯",true]],"x":[[["一種語言類型（例如 SQL、Prolog：只說要什麼，不說怎麼做），不是翻譯程式。",false]]]},{"h":[["C. interpreter（直譯器）— 對（正確答案）",true]],"x":[[["Python、JavaScript 常見的執行方式。",false]]]},{"h":[["D. none of the above — 錯",true]],"x":[[["C 就是答案。",false]]]}],"videos":["https://www.youtube.com/watch?v=zn86PlkH8Zg"]},"cs:106-2":{"answer":[["這題的正確答案是 ",false],["D. Execution time",true],["。",false]],"items":[[["題目",true],["：動態繫結（dynamic binding）是在 ______ 才決定要呼叫哪一個函數的機制。",false]],[["核心觀念",true],["：",false],["靜態繫結",true],["在編譯時就決定呼叫哪個函數（一般函數呼叫、函數多載）。",false],["動態繫結",true],["（late binding）等到",false],["執行時",true],["才依物件的實際型態決定，例如 C++ 的 virtual 函數、Java 的覆寫方法，這是多型（polymorphism）的基礎。",false]],[["逐步追蹤",true],["：Shape *s = new Circle(); s->area(); 如果 area 是 virtual，編譯時只知道 s 是 Shape 指標，執行時才查出它指向 Circle，呼叫 Circle::area()；如果不是 virtual，編譯時就固定呼叫 Shape::area()。",false]],[["延伸陷阱",true],["：函數多載（overloading）在編譯時就依參數型態決定，屬於靜態繫結；覆寫（overriding）加上 virtual 才是動態繫結。",false]],[["同主題考古題",true],["：114-3 C++ 多型、多載、樣板、111-22 物件導向原則、110-32 物件導向特性。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Compile time（編譯時）— 錯",true]],"x":[[["編譯時決定的是靜態繫結。",false]]]},{"h":[["B. Link time（連結時）— 錯",true]],"x":[[["連結時解決的是外部函數的位址（靜態連結），不是依物件型態選函數。",false]]]},{"h":[["C. Load time（載入時）— 錯",true]],"x":[[["載入時做位址重定位、載入動態函式庫，同樣不是依物件型態選函數。",false]]]},{"h":[["D. Execution time（執行時）— 對（正確答案）",true]],"x":[[["程式跑到那一行，看物件實際是哪個類別才決定。",false]]]}],"videos":["https://www.youtube.com/watch?v=-FUhG98hdLI","https://www.youtube.com/watch?v=mS9755gF66w"]},"cs:106-3":{"answer":[["這題的正確答案是 ",false],["B.",true],[" previous function calls are still open when the function calls itself and the arguments of these previous calls still occupy space on the call stack。",false]],"items":[[["題目",true],["：為什麼遞迴很耗記憶體？",false]],[["核心觀念",true],["：每呼叫一次函數，就在",false],["呼叫堆疊（call stack）",true],["上推入一個堆疊框架（stack frame），存放參數、區域變數和返回位址。遞迴時，前面的呼叫都還沒結束，它們的框架全部留在堆疊上，直到最深的那層返回才一層層釋放。遞迴深度 n → 需要 O(n) 的堆疊空間；太深就會堆疊溢位（stack overflow）。",false]],[["逐步追蹤",true],["：factorial(4) → factorial(3) → factorial(2) → factorial(1)：最深時堆疊上同時有 4 個框架；改成迴圈只需要固定幾個變數。",false]],[["同主題考古題",true],["：109-20 呼叫堆疊（call stack）、113-17 用 C 寫河內塔遞迴、111-26、110-27 遞迴。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 必須執行很多次才會結束 — 錯",true]],"x":[[["次數多只會花時間；迴圈也會重複很多次，但不會越用越多記憶體。關鍵是那些呼叫「同時」存在。",false]]]},{"h":[["B. 先前的呼叫還沒結束，它們的參數仍占用呼叫堆疊的空間 — 對（正確答案）",true]],"x":[[["每一層的堆疊框架要等到該層返回才釋放。",false]]]},{"h":[["C. 會產生很多份函數程式碼 — 錯",true]],"x":[[["程式碼只有一份（在程式碼區段），每次呼叫多出來的只有堆疊框架。",false]]]},{"h":[["D. 需要很大的資料值 — 錯",true]],"x":[[["和資料大小無關。",false]]]}],"videos":["https://www.youtube.com/watch?v=5OJRqkYbK-4","https://www.youtube.com/watch?v=0Bs3cDpCIKc"]},"cs:106-4":{"answer":[["這題的正確答案是 ",false],["C. 11",true],["。",false]],"items":[[["題目",true],["：對 2000 個元素的陣列做二分搜尋，最多需要比較幾次？（A. 9　B. 15　C. 11　D. 14　E. 10）",false]],[["核心觀念",true],["：二分搜尋每比較一次，剩下的範圍至少砍半。n 個元素最多比較 ",false],["⌊log₂ n⌋ + 1",true],[" 次。2¹⁰ = 1024 ≤ 2000 < 2048 = 2¹¹，所以 ⌊log₂ 2000⌋ = 10，最多 11 次。",false]],[["逐步追蹤",true],["：最壞情況每次都留下較大的那一半：2000 → 1000 → 500 → 250 → 125 → 62 → 31 → 15 → 7 → 3 → 1，共 11 個範圍，每個範圍比較一次，11 次。",false]],[["延伸陷阱",true],["：E 的 10 是 log₂ 2000 ≈ 10.97 無條件捨去，忘了最後剩一個元素時還要比較一次。",false]],[["同主題考古題",true],["：111-8 二分搜尋複雜度、110-3 二分搜尋、109-34 大型排序陣列搜尋（二分搜尋）、107 問2 C 遞迴二分搜尋。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 9 — 錯",true]],"x":[[["2⁹ = 512，只夠應付 511 個元素。",false]]]},{"h":[["B. 15 — 錯",true]],"x":[[["太多，15 次可以搜尋到 32767 個元素。",false]]]},{"h":[["C. 11 — 對（正確答案）",true]],"x":[[["⌊log₂ 2000⌋ + 1 = 10 + 1。",false]]]},{"h":[["D. 14 — 錯",true]],"x":[[["沒有依據的干擾選項。",false]]]},{"h":[["E. 10 — 錯",true]],"x":[[["少算最後一次比較。",false]]]}],"videos":["https://www.youtube.com/watch?v=MFhxShGxHWc"]},"cs:106-5":{"answer":[["這題的正確答案是 ",false],["C. 140.117.17.128",true],["。",false]],"items":[[["題目",true],["：IP 位址 140.117.17.224、子網路遮罩 255.255.255.128，子網路號碼是什麼？",false]],[["核心觀念",true],["：子網路號碼＝IP 位址和遮罩做",false],["逐位元 AND",true],["。遮罩前三段是 255（全 1），原樣保留 140.117.17；只要算最後一段：224 AND 128。",false]],[["逐步追蹤",true],["：224 = 11100000，128 = 10000000，AND → 10000000 = 128。所以子網路是 140.117.17.128/25，可用主機 .129～.254，廣播位址 .255。",false]],[["同主題考古題",true],["：112-7 子網路號碼、111-12 網路號碼、108-7 網路遮罩。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 140.117.0.0 — 錯",true]],"x":[[["遮罩 255.255.0.0 時的網路號碼。",false]]]},{"h":[["B. 140.117.17.0 — 錯",true]],"x":[[["這是 .0～.127 那一個子網路，224 不在裡面。",false]]]},{"h":[["C. 140.117.17.128 — 對（正確答案）",true]],"x":[[["224 AND 128 = 128。",false]]]},{"h":[["D. 140.117.17.224 — 錯",true]],"x":[[["原本的主機位址。",false]]]},{"h":[["E. 140.117.17.255 — 錯",true]],"x":[[["這個子網路的廣播位址（主機位元全 1）。",false]]]}],"videos":["https://www.youtube.com/watch?v=s_Ntt6eTn94"]},"cs:106-6":{"answer":[["這題的正確答案是 ",false],["B. which application layer process the packet is from",true],["。",false]],"items":[[["題目",true],["：來源埠號（source port）告訴目的端什麼？",false]],[["核心觀念",true],["：",false],["IP 位址",true],["識別哪一台主機，",false],["埠號（port）",true],["識別主機上的哪一個程式（行程）。來源埠號告訴目的端：封包來自來源主機上的哪個應用程式，回應時就送回那個埠號，才會交給正確的程式。IP 位址＋埠號＝socket。",false]],[["同主題考古題",true],["：112-9 port 決定交給哪個程式、106-7 TCP 序號。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 哪一台電腦送出 TCP 封包 — 錯",true]],"x":[[["由 IP 標頭的來源 IP 位址判斷。",false]]]},{"h":[["B. 封包來自哪一個應用層行程 — 對（正確答案）",true]],"x":[[["例如瀏覽器開了好幾個分頁，每個連線用不同的來源埠號。",false]]]},{"h":[["C. 來源電腦的 IP 位址 — 錯",true]],"x":[[["IP 位址在網路層的 IP 標頭裡，不是 TCP 的埠號欄位。",false]]]},{"h":[["D. 目的電腦的 IP 位址 — 錯",true]],"x":[[["同樣在 IP 標頭。",false]]]}],"videos":["https://www.youtube.com/watch?v=VZeF0jPHJdM"]},"cs:106-7":{"answer":[["這題的正確答案是 ",false],["B. sequence numbers",true],["。",false]],"items":[[["題目",true],["：TCP 使用 ______，讓目的端能把封包重組回正確的順序。",false]],[["核心觀念",true],["：TCP 把資料切成區段（segment），每個區段帶一個",false],["序號",true],["（這段資料第一個位元組的編號）。封包可能走不同路徑、亂序到達或遺失，接收端依序號排回正確順序，並用 ACK 回報收到哪裡，缺的部分由傳送端重送。",false]],[["同主題考古題",true],["：108-10 TCP、106-6 來源 port、109-21 TCP/IP 封包。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A tch?v=btNp7BRiUxE","https://www.youtube.com/watch?v=v6rjvd6isdI"]},"cs:106-10":{"answer":[["這題的正確答案是 ",false],["C. Executing the program",true],["。",false]],"items":[[["題目",true],["：下列何者",false],["不是",true],["編譯程式的步驟？",false]],[["核心觀念",true],["：編譯的流程：",false],["詞彙分析",true],["（把原始碼切成 token，例如關鍵字、變數名、運算子）→ ",false],["語法分析",true],["（parsing，依文法建出語法樹）→ ",false],["語意分析",true],["（型態檢查等）→ 中間碼產生與最佳化 → ",false],["目的碼產生",true],["。執行程式是編譯、連結、載入完成",false],["之後",true],["的事。",false]],[["同主題考古題",true],["：106-1 直譯器、112-24 直譯式語言、112-8 連結（linking）。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Lexical analysis（詞彙分析）— 是編譯步驟",true]],"x":[[["第一步，產生 token 串。",false]]]},{"h":[["B. Parsing the program（語法分析）— 是編譯步驟",true]],"x":[[["檢查語法、建立語法樹。",false]]]},{"h":[["C. Executing the program（執行程式）— 不是（正確答案）",true]],"x":[[["編譯器只翻譯不執行；邊翻譯邊執行的是直譯器（106-1）。",false]]]},{"h":[["D. Code generation（產生程式碼）— 是編譯步驟",true]],"x":[[["最後一步，產生目的碼。",false]]]}],"videos":["https://www.youtube.com/watch?v=l5rvyS7qt4o"]},"cs:106-11":{"answer":[["這題的正確答案是 ",false],["C. Queue",true],["。",false]],"items":[[["題目",true],["：下列何者是先進先出（FIFO）的結構？",false]],[["核心觀念",true],["：",false],["佇列（queue）",true],["先進先出，從尾端加入、從前端取出，像排隊買票；",false],["堆疊（stack）",true],["後進先出（LIFO），只從頂端放入和取出，像疊盤子。佇列的應用：印表機排隊、作業系統排程、BFS（廣度優先搜尋）。",false]],[["同主題考古題",true],["：110-21 LIFO、109-27 BFS 用 queue、109-10 用 C 實作 stack。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Array（陣列）— 錯",true]],"x":[[["可以用索引隨機存取任何位置，沒有固定的進出順序。",false]]]},{"h":[["B. Stack（堆疊）— 錯",true]],"x":[[["後進先出。",false]]]},{"h":[["C. Queue（佇列）— 對（正確答案）",true]],"x":[[["先進先出。",false]]]},{"h":[["D. Tree（樹）— 錯",true]],"x":[[["階層式結構，沒有進出順序的規定。",false]]]}],"videos":["https://www.youtube.com/watch?v=5jAQKW_9aoM","https://www.youtube.com/watch?v=hbg2A9Nd6Hg"]},"cs:106-12":{"answer":[["這題的正確答案是 ",false],["D. memory protection",true],["。",false]],"items":[[["題目",true],["：如果程式試圖修改不屬於它的記憶體位置，作業系統的 ______ 程序會介入並終止該程式。",false]],[["核心觀念",true],["：",false],["記憶體保護",true],["：作業系統配合硬體（MMU、基底暫存器與界限暫存器）檢查每一次記憶體存取是否在該程式分配到的範圍內；越界時硬體產生例外（trap），作業系統終止程式。常見的訊息：Linux 的 Segmentation fault、Windows 的存取違規（Access Violation）。這樣一個程式出錯，才不會破壞其他程式或作業系統本身。",false]],[["同主題考古題",true],["：111-10 作業系統、108-29 陣列越界、110-2 最小權限。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. reliability（可靠性）— 錯",true]],"x":[[["系統的整體特性，不是一個特定的處理程序。",false]]]},{"h":[["B. security（安全性）— 錯",true]],"x":[[["範圍太廣（身分驗證、權限控管都算）；題目描述的是記憶體保護這個具體機制。",false]]]},{"h":[["C. processor management（處理器管理）— 錯",true]],"x":[[["負責排程，決定哪個行程使用 CPU。",false]]]},{"h":[["D. memory protection（記憶體保護）— 對（正確答案）",true]],"x":[[["檢查並阻止越界的記憶體存取。",false]]]}],"videos":["https://www.youtube.com/watch?v=QZxk-lb01Es"]},"cs:106-13":{"answer":[["這題的正確答案是 ",false],["B. page fault",true],["。",false]],"items":[[["題目",true],["：當虛擬位址指到一個不在實體記憶體中的頁面時，會產生 ______，接著開始把頁面換入（swap in）。",false]],[["核心觀念",true],["：虛擬記憶體讓程式的頁面不必全部放在實體記憶體。存取的頁不在記憶體中時，MMU 產生",false],["分頁錯誤（page fault）",true],["，作業系統從磁碟把該頁載入；如果記憶體滿了，就用頁替換演算法（FIFO、LRU、OPT）挑一頁換出，最後重新執行剛才那個指令。",false]],[["延伸陷阱",true],["：page fault 本質上是一種中斷（trap），所以 A 不算完全錯，但題目要的是這種事件的專有名稱。",false]],[["同主題考古題",true],["：111-4 paging、109-24 虛擬記憶體、112-14 LRU 分頁錯誤次數、110-11 最佳頁替換次數。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. interrupt（中斷）— 錯（不精確）",true]],"x":[[["中斷是總稱，不是這個事件的名稱。",false]]]},{"h":[["B. page fault（分頁錯誤）— 對（正確答案）",true]],"x":[[["頁不在記憶體 → 觸發換入。",false]]]},{"h":[["C. polling signal（輪詢訊號）— 錯",true]],"x":[[["輪詢是 CPU 主動反覆檢查裝置狀態，不是記憶體事件。",false]]]},{"h":[["D. page interrupt — 錯",true]],"x":[[["不是標準術語，是拿來混淆的。",false]]]}],"videos":["https://www.youtube.com/watch?v=qlH4-oHnBb8","https://www.youtube.com/watch?v=4wVp97-uqr0"]},"cs:106-14":{"answer":[["這題的正確答案是 ",false],["C. Deadlock",true],["。",false]],"items":[[["題目",true],["：當兩個以上的程式各自握有對方需要的資源時，會發生 ______。",false]],[["核心觀念",true],["：",false],["死結（deadlock）",true],["：每個程式都握著資源不放，又等著別人手上的資源，結果大家都卡住。四個必要條件同時成立才會死結：",false],["互斥",true],["（資源一次只能一個人用）、",false],["持有並等待",true],["、",false],["不可搶奪",true],["、",false],["循環等待",true],["；破壞任何一個就能預防。",false]],[["同主題考古題",true],["：109-22 deadlock、108-9 deadlock、107-15 臨界區間。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Polling（輪詢）— 錯",true]],"x":[[["CPU 反覆檢查裝置是否就緒。",false]]]},{"h":[["B. An interrupt（中斷）— 錯",true]],"x":[[["硬體或軟體通知 CPU 有事件需要處理。",false]]]},{"h":[["C. Deadlock（死結）— 對（正確答案）",true]],"x":[[["互相等待對方的資源。",false]]]},{"h":[["D. Spooling（排存）— 錯",true]],"x":[[["先把資料暫存在磁碟，排隊給慢速裝置（例如列印佇列）。",false]]]}],"videos":["https://www.youtube.com/watch?v=qPuf5B5xPCs"]},"cs:106-15":{"answer":[["這題的正確答案是 ",false],["B. Thrashing",true],["。",false]],"items":[[["題目",true],["：當系統花太多時間把頁面換進換出記憶體，幾乎沒有時間做有用的工作時，稱為 ______。",false]],[["核心觀念",true],["：",false],["輾轉現象（thrashing）",true],["：行程分到的頁框太少，放不下它正在使用的頁面（工作集合，working set），於是不斷發生分頁錯誤、換頁，CPU 大部分時間在等磁碟。作業系統看到 CPU 使用率低，以為工作不夠，又加入更多行程，每個行程分到的頁框更少，惡性循環。",false]],[["延伸陷阱",true],["：解法是減少同時執行的行程數（降低多元程式的程度）、依工作集合模型或分頁錯誤頻率分配頁框，或是加記憶體；把 CPU 換快沒有幫助。",false]],[["同主題考古題",true],["：106-13 分頁錯誤、109-24 虛擬記憶體、108-17 多元程式與多處理器。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Spooling（排存）— 錯",true]],"x":[[["給慢速 I/O 裝置的暫存排隊機制。",false]]]},{"h":[["B. Thrashing（輾轉現象）— 對（正確答案）",true]],"x":[[["忙著換頁，沒空做事。",false]]]},{"h":[["C. An interrupt（中斷）— 錯",true]],"x":[[["通知 CPU 處理事件的機制。",false]]]},{"h":[["D. A polling signal（輪詢訊號）— 錯",true]],"x":[[["CPU 主動檢查裝置狀態。",false]]]}],"videos":["https://www.youtube.com/watch?v=W3FSmttB6wU"]},"cs:106-16":{"answer":[["這題的正確答案是 ",false],["B. 3",true],["。",false]],"items":[[["題目",true],["：關聯 X(A, B, C) = {(2, 5, 7), (3, 3, 3), (4, 4, 2), (5, 2, 8)}。執行 TEMP ← SELECT from X where B = C；RESULT ← PROJECT B from TEMP，會得到什麼值？",false]],[["核心觀念",true],["：關聯代數的 ",false],["SELECT（σ）",true],["選出符合條件的「列」，",false],["PROJECT（π）",true],["取出指定的「欄」。先 σ_{B=C}(X)：只有 (3, 3, 3) 這一列 B 等於 C；再 π_B 取 B 欄 → 3。",false]],[["延伸陷阱",true],["：關聯代數的 SELECT 是選列，和 SQL 的 SELECT（選欄）意思不一樣。這題寫成 SQL 是 SELECT B FROM X WHERE B = C：SQL 的 WHERE 對應 σ，SQL 的 SELECT 對應 π。",false]],[["同主題考古題",true],["：111-7 SQL 查詢、108-39 SQL 結果列數、107-7 SQL LEFT JOIN。",false]]],"opts_title":"各選項解析（逐列檢查 B = C）","opts":[{"h":[["A. 2 — 錯",true]],"x":[[["(5, 2, 8) 的 B 是 2，但 C 是 8，不相等。",false]]]},{"h":[["B. 3 — 對（正確答案）",true]],"x":[[["(3, 3, 3)：B = C = 3，是唯一符合的一列。",false]]]},{"h":[["C. 4 — 錯",true]],"x":[[["(4, 4, 2) 是 A = B = 4，但 C 是 2。",false]]]},{"h":[["D. 5 — 錯",true]],"x":[[["(2, 5, 7) 的 B 是 5，C 是 7。",false]]]}],"videos":["https://www.youtube.com/watch?v=Givp56x6vbg","https://www.youtube.com/watch?v=QY2X_TlLkqo"]},"cs:106 問1":{"answer":[["這題的正確答案是 ",false],["a) In-memory 運算把資料放在記憶體裡算，重點是「資料放哪裡」；In-database 運算把分析搬進資料庫裡做，重點是「在哪裡算」。b) NoSQL 放棄關聯模型換取擴充性；NewSQL 保留 SQL 和 ACID，同時能水平擴充",true],["（說明見下方）。",false]],"items":[[["題目",true],["：（問答，6 分）請簡要定義下列名詞並說明它們的差異，可以舉例：a) In-memory Computing vs. In-database Computing；b) NoSQL databases vs. NewSQL databases。",false]],[["核心觀念",true],["：兩組名詞都是為了解決大數據的效能問題。傳統做法是把資料存在磁碟上的關聯式資料庫，分析時再把資料搬到分析工具。瓶頸有三個：磁碟讀寫慢（→ In-memory 運算）、大量資料搬移慢（→ In-database 運算）、關聯式資料庫很難分散到多台機器擴充（→ NoSQL、NewSQL）。",false]],[["延伸陷阱",true],["：兩種運算可以合在一起，例如 SAP HANA 是記憶體內資料庫，也支援在資料庫內做分析。另外，硬體領域的 in-memory computing（processing-in-memory，在記憶體晶片裡直接運算）是不同的概念，這題講的是資料處理。",false]],[["同主題考古題",true],["：109-4 資料庫內分析、110-38 NoSQL 種類、112-18 ACID、109-6 Apache Spark。",false]]],"opts_title":"參考答案","opts":[{"h":[["a) In-memory Computing（記憶體內運算）",true]],"x":[[["把要處理的資料放在主記憶體（RAM）中直接運算，通常把資料分散在叢集多台機器的記憶體裡，避免反覆讀寫磁碟。記憶體存取比磁碟快好幾個數量級，適合即時分析和需要反覆迭代的運算（例如機器學習）。例子：Apache Spark、SAP HANA、Redis。缺點是記憶體較貴、斷電會遺失，需要另外做持久化。",false]]]},{"h":[["a) In-database Computing（資料庫內運算）",true]],"x":[[["把分析運算（統計、資料探勘、機器學習模型）搬到資料庫內部執行，例如用 SQL 函數、預存程序或資料庫內建的機器學習，不必把大量資料匯出到外部分析工具。好處是省下資料搬移的時間與網路成本，資料不離開資料庫也比較安全。例子：Oracle 的資料庫內分析、Teradata、BigQuery ML。",false]]]},{"h":[["a) 差異",true]],"x":[[["In-memory 解決「磁碟 I/O 慢」，關心的是",false],["資料放在哪裡",true],["；In-database 解決「資料搬移慢」，關心的是",false],["運算在哪裡做",true],["（把運算移到資料旁邊）。",false]]]},{"h":[["b) NoSQL databases",true]],"x":[[["Not only SQL：非關聯式資料庫，不需要固定綱要，容易水平擴充（加機器）。為了擴充性與可用性，通常放寬一致性（BASE、最終一致性），不完整支援 ACID 交易。四大類：鍵值（Redis）、文件（MongoDB）、欄族（Cassandra、HBase）、圖形（Neo4j）。",false]]]},{"h":[["b) NewSQL databases",true]],"x":[[["保留關聯式模型、SQL 語言和 ACID 交易，同時像 NoSQL 一樣能分散到多台機器水平擴充，適合需要強一致性又有大量交易的系統（金融、電商訂單）。例子：Google Spanner、CockroachDB、TiDB、VoltDB。",false]]]},{"h":[["b) 差異",true]],"x":[[["NoSQL 用「放棄關聯模型與強一致性」換取擴充性和彈性；NewSQL 想要兩者兼得。資料格式多變、能接受最終一致性就選 NoSQL；需要交易正確性又要大規模擴充就選 NewSQL。",false]]]}],"videos":["https://www.youtube.com/watch?v=Q0OZr7DcYW4","https://www.youtube.com/watch?v=tT37mu6Kx-A","https://www.youtube.com/watch?v=9MeMWdILl5Q"]},"cs:106 問2":{"answer":[["這題的正確答案是 ",false],["a) 高階函數：可以把函數當參數，或把函數當回傳值的函數。b) 閉包：函數連同它被定義時所在環境的變數一起打包，外層函數結束後仍然能使用那些變數",true],["（說明與範例見下方）。",false]],"items":[[["題目",true],["：（問答，6 分）請簡要定義函數式程式語言中的下列名詞，可以舉例：a) Higher-order functions；b) Closure。",false]],[["核心觀念",true],["：函數式語言把函數當成一等公民（first-class）：函數和整數、字串一樣可以傳來傳去。有了這個性質才有高階函數；而函數被傳到別處執行時，還要記得它定義時用到的外部變數，這就是閉包。",false]],[["延伸陷阱",true],["：107-1 的選擇題考過同樣兩個名詞，還考了 map 和 reduce 的差別：map 是一對一轉換，reduce 是合併成一個值。",false]],[["同主題考古題",true],["：107-1 函數式語言、110-33 函數式語言特性、108-33 函數式語言。",false]]],"opts_title":"參考答案","opts":[{"h":[["a) Higher-order functions（高階函數）",true]],"x":[[["至少符合一項：接受函數當參數，或回傳一個函數。常見例子：map(f, list) 把 f 套用到每個元素；filter(p, list) 留下 p 為真的元素；reduce(f, list) 把元素合併成一個值；sorted(list, key=f) 依 f 的結果排序。",false]]]},{"h":[["b) Closure（閉包）",true]],"x":[[["一個函數加上它被建立時所在環境（外層函數）的變數。即使外層函數已經執行完，內層函數仍然可以讀取那些變數。常用來產生「客製化」的函數，或保存私有狀態（例如計數器）。",false]]]},{"h":[["範例（Python）",true]],"x":[[["```\ndef apply_twice(f, x):          # 高階函數：參數 f 是函數\n    return f(f(x))\n\ndef make_adder(n):              # 高階函數：回傳一個函數\n    def add(x):\n        return x + n            # add 用到外層的 n → 形成閉包\n    return add\n\nadd5 = make_adder(5)            # make_adder 已經結束，n = 5 仍被 add5 記住\nprint(add5(10))                 # 15\nprint(apply_twice(add5, 1))     # 11\nprint(list(map(lambda x: x * x, [1, 2, 3])))   # [1, 4, 9]",false]]]}],"videos":["https://www.youtube.com/watch?v=nkRI8mu8jes","https://www.youtube.com/watch?v=y9vr99qmlOg"]},"cs:106 問3":{"answer":[["這題的正確答案是 ",false],["1 2 − 3 + 8 4 2 / + ×",true],["。",false]],"items":[[["題目",true],["：（問答，6 分）下面這棵樹的後序走訪（post-order traversal）輸出是什麼？樹：根是 ×；左子樹的根是 +，它的左子是 −（子節點 1、2）、右子是 3；右子樹的根是 +，它的左子是 8、右子是 /（子節點 4、2）。",false]],[["核心觀念",true],["：後序走訪的順序是「",false],["左子樹 → 右子樹 → 根",true],["」，每個子樹也照同樣規則遞迴。運算式樹的後序走訪結果就是後序式（逆波蘭表示法），可以直接用堆疊計算。",false]],[["逐步追蹤",true],["：左子樹 +：先走 −（1 2 −），再走 3，最後是 + → 1 2 − 3 +。右子樹 +：先走 8，再走 /（4 2 /），最後是 + → 8 4 2 / +。最後是根 × → 1 2 − 3 + 8 4 2 / + ×。",false]],[["延伸陷阱",true],["：可以用值來驗算：這棵樹代表 ((1 − 2) + 3) × (8 + 4 / 2) = 2 × 10 = 20。用堆疊算後序式：1 2 − → −1；−1 3 + → 2；8 4 2 / → 8 2；8 2 + → 10；2 10 × → 20，結果相同，表示順序沒寫錯。",false]],[["同主題考古題",true],["：111-14 運算式樹轉後序、110-39 後序表示式、108-19 前序表示式、110-40 BST 後序走訪。",false]]],"opts_title":"參考答案（三種走訪對照）","opts":[{"h":[["後序（左 → 右 → 根）— 本題答案",true]],"x":[[["1 2 − 3 + 8 4 2 / + ×",false]]]},{"h":[["前序（根 → 左 → 右）",true]],"x":[[["× + − 1 2 3 + 8 / 4 2",false]]]},{"h":[["中序（左 → 根 → 右）",true]],"x":[[["1 − 2 + 3 × 8 + 4 / 2（中序式要加括號才能表示原本的計算順序：((1 − 2) + 3) × (8 + 4 / 2)）",false]]]}],"videos":["https://www.youtube.com/watch?v=OXy4pLq_XZs","https://www.youtube.com/watch?v=hFbhDWbaFz8"]},"cs:106 問4":{"answer":[["這題的正確答案是 ",false],["5040",true],["。",false]],"items":[[["題目",true],["：（問答，6 分）k 是從記憶體位址 5000 開始的整數陣列，kPtr 是指向 k 的指標，每個整數占 8 個位元組。kPtr + 5 指向哪個位址？",false]],[["核心觀念",true],["：指標運算以「",false],["元素",true],["」為單位，不是以位元組為單位：kPtr + n 的位址＝kPtr 的位址＋n × sizeof(元素)。kPtr 指向 k[0]，kPtr + n 就指向 k[n]。",false]],[["延伸陷阱",true],["：不是 5005（把 +5 當成 5 個位元組）。一般系統的 int 是 4 個位元組，這題特別假設 8 個。kPtr + 5 只是位址，*(kPtr + 5) 才是 k[5] 的值（見 107-4）。",false]],[["同主題考古題",true],["：107-4 陣列與指標、109-19 C 指標、108-40 指標存位址。",false]]],"opts_title":"參考答案","opts":[{"h":[["計算",true]],"x":[[["kPtr + 5 = 5000 + 5 × 8 = 5040，也就是 &k[5]。",false]]]}],"videos":["https://www.youtube.com/watch?v=1LO4XONZVjY"]},"cs:106 問5":{"answer":[["這題的正確答案是 ",false],["用兩個迴圈逐字元複製：先把 str1 複製到 out，再把 str2 接在後面，最後補上 '\\0'",true],["（參考程式見下方）。",false]],"items":[[["題目",true],["：（問答，6 分）請寫一個 C 函數 concat(str1, str2, out)，把兩個字串 str1、str2 串接起來，結果存到 out。例如 concat(\"foo\", \"bar\", out); 之後 out 是 \"foobar\"。不可以使用 C 標準函式庫中的任何字串處理函數。",false]],[["核心觀念",true],["：C 的字串是以 ",false],["'\\0'",true],["（空字元）結尾的字元陣列，本身沒有記錄長度。不能用 strcat、strcpy、strlen，就要自己用迴圈一個字元一個字元處理，遇到 '\\0' 就知道字串結束了。",false]],[["逐步追蹤",true],["：str1 = \"foo\"：out[0..2] = 'f' 'o' 'o'，此時 i = 3；str2 = \"bar\"：out[3..5] = 'b' 'a' 'r'，j = 3；out[6] = '\\0'。out = \"foobar\"，共用 7 個 char。",false]],[["延伸陷阱",true],["：一定要補上結尾的 '\\0'，否則 printf(\"%s\") 會一直印到記憶體裡碰巧出現 0 為止。out 的空間要由呼叫端準備，至少 str1 長度＋str2 長度＋1 個字元；如果要在函數裡自己配置，就要先數長度再用 malloc，並傳回指標（用完記得 free）。",false]],[["同主題考古題",true],["：113-15 C 遞迴判讀、108-29 陣列越界、108-38 陣列傳參考。",false]]],"opts_title":"參考答案（C 程式）","opts":[{"h":[["函數 concat",true]],"x":[[["```\n#include <stdio.h>\n\n/* 把 str1 和 str2 接起來存到 out（out 的空間要夠大） */\nvoid concat(const char *str1, const char *str2, char *out) {\n    int i = 0, j = 0;\n    while (str1[i] != '\\0') {      /* 先複製 str1 */\n        out[i] = str1[i];\n        i++;\n    }\n    while (str2[j] != '\\0') {      /* 接著複製 str2 */\n        out[i + j] = str2[j];\n        j++;\n    }\n    out[i + j] = '\\0';             /* 最後補上字串結尾 */\n}\n\nint main(void) {\n    char out[100];\n    concat(\"foo\", \"bar\", out);\n    printf(\"%s\\n\", out);           /* 印出 foobar */\n    return 0;\n}",false]]]},{"h":[["程式重點",true]],"x":[[["str1、str2 宣告成 const char *，表示函數不會修改它們，可以直接傳字串常值 \"foo\"。",false]],[["也可以用指標寫得更精簡：while (*str1) *out++ = *str1++; while (*str2) *out++ = *str2++; *out = '\\0';",false]],[["printf 是輸出函數，不是字串處理函數，只在 main 裡用來顯示結果。",false]]]}],"videos":["https://www.youtube.com/watch?v=fJW0FeE0Di8"]},"cs:106 問6":{"answer":[["這題的正確答案是 ",false],["a) 候選鍵是 A、B、C、F（寫出任兩個即可）。b) A→C、C→B 遞移得 A→B，再和 B→F 遞移得 A→F，合併得 A→BF",true],["（推導見下方）。",false]],"items":[[["題目",true],["：（問答，6 分）關聯 R(A, B, C, D, E, F) 上成立函數相依 FD = {A→CD, C→BE, B→F, F→A}。a) 找出至少兩個候選鍵；b) 用 Armstrong 公理證明 A→BF 也成立。",false]],[["核心觀念",true],["：",false],["屬性閉包",true],[" X⁺：從 X 出發，反覆套用函數相依所能推得的所有屬性。X⁺ 包含全部屬性 → X 是超鍵；超鍵拿掉任何一個屬性就不再是超鍵 → ",false],["候選鍵",true],["（最小超鍵）。",false],["Armstrong 公理",true],["有三條基本規則：",false],["反身律",true],["（Y ⊆ X 則 X→Y）、",false],["增補律",true],["（X→Y 則 XZ→YZ）、",false],["遞移律",true],["（X→Y 且 Y→Z 則 X→Z）；由它們可以推出分解律（X→YZ 則 X→Y）和合併律（X→Y 且 X→Z 則 X→YZ）。",false]],[["延伸陷阱",true],["：四個相依形成循環 A → C → B → F → A，所以循環上的每個屬性都能決定全部屬性。作答時要附上閉包的計算過程，只寫答案會被扣分。",false]],[["同主題考古題",true],["：111-27 函數相依、109-17 函數相依、110-36 3NF、109-18 BCNF。",false]]],"opts_title":"參考答案","opts":[{"h":[["a) 候選鍵：A、B、C、F",true]],"x":[[["A⁺：A →（A→CD）ACD →（C→BE）ABCDE →（B→F）ABCDEF，包含全部屬性。",false]],[["B⁺：B →（B→F）BF →（F→A）ABF →（A→CD）ABCDF →（C→BE）ABCDEF。C⁺：C → BCE → BCEF → ABCEF → ABCDEF。F⁺：F → AF → ACDF → ABCDEF。",false]],[["D、E 不在任何相依的左邊：D⁺ = {D}、E⁺ = {E}、{D, E}⁺ = {D, E}，都不是超鍵。A、B、C、F 都是只有一個屬性的超鍵，不能再縮小，所以都是候選鍵。",false]]]},{"h":[["b) 用 Armstrong 公理證明 A→BF",true]],"x":[[["1. A→CD（已知）；CD→C（反身律）；由遞移律得 A→C。",false]],[["2. C→BE（已知）；BE→B（反身律）；由遞移律得 C→B。",false]],[["3. 由 1、2 遞移律得 A→B。",false]],[["4. B→F（已知），和 3 遞移得 A→F。",false]],[["5. A→B 兩邊增補 A，得 A→AB；A→F 兩邊增補 B，得 AB→BF；兩式遞移得 A→BF。",false]],[["第 5 步就是合併律的證明；如果可以直接用合併律，由 A→B 和 A→F 就能得到 A→BF。",false]]]}],"videos":["https://www.youtube.com/watch?v=HE_1BDeGpSA","https://www.youtube.com/watch?v=l3Mh4dap-Ok","https://www.youtube.com/watch?v=hgM-J93DaiM"]},"cs:94-1":{"answer":[["這題的正確答案是 ",false],["(B) Presentation 部份",true],["。",false]],"items":[[["題目",true],["：在多層式（Multi-Tiers）架構裡，客戶端電腦上放的是哪一部分的程式？（單複選）",false]],[["核心觀念",true],["：典型的",false],["三層式架構（3-tier）",true],["把系統分成三層：",false],["表現層（Presentation）",true],["負責畫面與使用者互動，放在客戶端（瀏覽器、桌面程式）；",false],["邏輯層（Logic／Business）",true],["處理商業規則，放在應用伺服器；",false],["資料層（Data）",true],["負責存取資料庫，放在資料庫伺服器。分層的好處是各層可以獨立修改、擴充，客戶端只要負責顯示（thin client）。",false]],[["延伸",true],["：兩層式（client-server）常把邏輯也放在客戶端（fat client）；多層式把邏輯抽到中間層，所以客戶端只剩 Presentation。",false]]],"opts_title":"各選項解析","opts":[{"h":[["(A) Interrupt — 錯",true]],"x":[[["中斷是作業系統／硬體的機制，不是多層式架構的一層。",false]]]},{"h":[["(B) Presentation — 對（正確答案）",true]],"x":[[["使用者介面放在客戶端，例如網頁前端。",false]]]},{"h":[["(C) Logic — 錯",true]],"x":[[["商業邏輯放在中間的應用伺服器。",fals
