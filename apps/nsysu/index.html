{"h":[["相同之處",true]],"x":[[["都是",false],["重複（repetition）",true],["的控制方式，可以解同一類問題。",false]],[["都需要",false],["終止條件",true],["：遞迴要有 base case，迴圈要有結束條件，否則會無窮遞迴（stack overflow）或無窮迴圈。",false]],[["能力相同",true],["：任何遞迴都能改寫成迴圈（必要時自己用堆疊模擬），任何迴圈也能改寫成遞迴。",false]]]},{"h":[["相異之處",true]],"x":[[["機制",true],["：遞迴靠函數呼叫，每呼叫一次就在呼叫堆疊推入一個框架（參數、區域變數、返回位址）；迴圈在同一個框架裡更新變數。",false]],[["空間",true],["：遞迴深度 n 需要 O(n) 堆疊空間；迴圈通常 O(1)。（尾遞迴可被編譯器最佳化成迴圈。）",false]],[["時間",true],["：遞迴有函數呼叫的額外負擔，通常比迴圈慢；某些遞迴（例如直接寫的費氏數列）還會重複計算子問題。",false]],[["可讀性",true],["：本質是遞迴的問題（樹的走訪、河內塔、分治法如合併排序、快速排序）用遞迴寫比較簡潔直覺；簡單的計數、累加用迴圈比較清楚。",false]]]},{"h":[["例子：n!",true]],"x":[[["```\nint fact_r(int n) { return n <= 1 ? 1 : n * fact_r(n - 1); }   // 遞迴\nint fact_l(int n) { int r = 1; for (int i = 2; i <= n; i++) r *= i; return r; }  // 迴圈",false]]]}],"dt":1},"cs:94 問2":{"answer":[["這題的正確答案是 ",false],["結構化程式設計是只用循序、選擇、重複三種控制結構（不用任意的 goto），由上而下逐步細分、模組化來寫程式的方法",true],["（說明見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，6 分）什麼是結構化程式設計（Structured Programming）？",false]],[["背景",true],["：1960 年代程式大量使用 goto，流程像一團麵（spaghetti code），難以閱讀和除錯。Dijkstra 在 1968 年發表〈Go To Statement Considered Harmful〉；Böhm 與 Jacopini 證明任何程式都只需要三種基本結構就能寫出來。",false]]],"opts_title":"參考答案","opts":[{"h":[["三種基本控制結構",true]],"x":[[["循序（sequence）",true],["：一行接一行執行。",false]],[["選擇（selection）",true],["：if-else、switch。",false]],[["重複（repetition）",true],["：while、for。",false]],[["每個結構都是",false],["單一入口、單一出口",true],["，可以像積木一樣巢狀組合；",false],["避免使用 goto",true],["。",false]]]},{"h":[["設計方法",true]],"x":[[["由上而下（top-down）、逐步精煉（stepwise refinement）",true],["：先寫出大步驟，再把每一步細分成更小的步驟。",false]],[["模組化",true],["：把程式拆成功能單一的函數／副程式。",false]]]},{"h":[["優點",true]],"x":[[["程式流程清楚、容易閱讀、測試、除錯和維護，也方便多人分工。代表語言：Pascal、C。",false]]]}],"dt":1},"cs:94 問3":{"answer":[["這題的正確答案是 ",false],["結構化系統開發方法以系統開發生命週期（SDLC）為骨架，依序做規劃、分析、設計、實作、維護，用資料流程圖等工具由上而下拆解系統；缺點是太僵化、需求要一開始就確定、開發時間長、使用者參與少",true],["（說明見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，7 分）什麼是結構化系統開發方法（Structured System Development Methodology）？它有什麼缺點？",false]],[["核心觀念",true],["：把結構化程式設計的想法擴大到整個系統開發：以",false],["流程（功能）為中心",true],["，把系統由上而下拆成較小的處理程序，開發過程照 ",false],["SDLC（瀑布式）",true],[" 一個階段做完、產出文件，再進下一個階段。",false]]],"opts_title":"參考答案","opts":[{"h":[["定義與步驟",true]],"x":[[["階段",true],["：系統規劃（可行性研究）→ 系統分析（需求）→ 系統設計 → 系統實作（寫程式、測試、轉換）→ 系統維護。每階段有明確的產出文件與審核點。",false]],[["工具",true],["：",false],["資料流程圖（DFD）",true],["、資料字典、結構化英文、決策表／決策樹、結構圖（structure chart）。",false]],[["特點",true],["：由上而下、功能分解，",false],["資料與處理分開",true],["描述。",false]]]},{"h":[["缺點",true]],"x":[[["需求必須一開始就定清楚",true],["，後面階段才發現錯誤或需求改變時，回頭修改成本很高。",false]],[["開發時程長",true],["，使用者要等到最後才看到系統，可能已經不符需求。",false]],[["使用者參與少",true],["，主要靠文件溝通，文件量大、維護負擔重。",false]],[["資料與處理分開",true],["，不易重用，系統變動時常要大改（這也是後來發展物件導向方法的原因）。",false]],[["不適合需求不明確、變動快的系統（改用雛型法、螺旋模型、敏捷開發）。",false]]]}],"dt":1},"cs:94 問4":{"answer":[["這題的正確答案是 ",false],["可以把資料看成集合中的元素（定義域、對應域），軟體（程式）看成函數：程式把輸入資料對應到輸出資料，f: Input → Output",true],["（說明見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，7 分）請用數學的觀念解釋資料（Data）與軟體（Software）之間的關係。",false]],[["答題方向",true],["：開放題，重點是用",false],["集合、函數（對應）、代數結構",true],["的觀念來描述，言之有理即可。",false]]],"opts_title":"參考答案","opts":[{"h":[["1. 程式是函數",true]],"x":[[["資料是集合裡的元素，所有合法的輸入構成",false],["定義域（domain）",true],["，可能的輸出構成",false],["對應域（codomain）",true],["。程式就是一個",false],["函數 f: D → R",true],["，給定輸入 x 產生唯一的輸出 f(x)（確定性的程式）。多個程式串接就是",false],["函數合成",true],[" g(f(x))。",false]]]},{"h":[["2. 資料型態是集合＋運算（代數結構）",true]],"x":[[["一個資料型態＝",false],["值的集合＋定義在上面的運算",true],["。例如 int 是有限整數集合配上 +、−、×、÷；堆疊是元素序列配上 push、pop 等運算，並滿足 pop(push(s,x)) = s 這類公理（",false],["抽象資料型態 ADT",true],[" 就是代數規格）。",false]]]},{"h":[["3. 結論",true]],"x":[[["資料是被處理的對象（運算元），軟體是處理的規則（運算子／函數）；兩者缺一不可，正如 Wirth 所說：",false],["Algorithms + Data Structures = Programs",true],["。",false]]]}],"dt":1},"cs:94 問5":{"answer":[["這題的正確答案是 ",false],["p->prev->next = p->next; p->next->prev = p->prev; 若 L 指向 p 就改成 L = p->next; 最後 free(p)",true],["（程式見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，10 分）給一個長度大於 2 的",false],["雙向環狀鏈結串列",true],[" L，p 指向串列中的某個節點，請寫出刪除 p 所指節點的程式碼。",false]],[["核心觀念",true],["：雙向環狀串列每個節點有 prev、next 兩個指標，而且頭尾相連，所以",false],["每個節點一定有前一個和後一個節點",true],["（長度 > 2 保證刪掉後還有節點，也不必處理 NULL）。刪除時只要讓 p 的前一個節點和後一個節點互相指向對方，就把 p 跳過了。",false]],[["要注意",true],["：如果串列的入口指標 L 剛好指向 p，要把 L 移到別的節點，否則 L 會變成懸置指標（dangling pointer）。",false]]],"opts_title":"參考答案","opts":[{"h":[["程式碼（C）",true]],"x":[[["```\nstruct node { int data; struct node *prev, *next; };\n\nvoid delete_node(struct node **L, struct node *p) {\n    p->prev->next = p->next;   /* 前一個節點跳過 p */\n    p->next->prev = p->prev;   /* 後一個節點跳過 p */\n    if (*L == p)               /* 入口剛好是 p */\n        *L = p->next;\n    free(p);\n}",false]]]},{"h":[["圖解",true]],"x":[[["刪除前：A ⇄ p ⇄ B；執行第一行後 A.next = B，第二行後 B.prev = A，變成 A ⇄ B，p 不再被串列指到，可以釋放。兩行的順序可以對調，因為都只讀 p 的欄位。",false]]]}],"dt":1},"cs:94 問6":{"answer":[["這題的正確答案是 ",false],["Mirroring RAID（RAID 1）把資料完整複製到另一顆磁碟；Parity RAID（RAID 3／4／5）存同位元資訊，壞一顆時用其他磁碟算回來。鏡像可靠、讀快、重建快但容量只剩一半；同位元省空間但寫入要多算同位元、比較慢",true],["（說明見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，10 分）說明 mirroring RAID 與 parity RAID，並比較兩者的優缺點。",false]],[["核心觀念",true],["：RAID 把多顆磁碟組成一個邏輯磁碟，用",false],["等量分割（striping）",true],["提升效能，用",false],["備援（redundancy）",true],["提升可靠度。備援有兩種做法：存完整副本（鏡像）或存同位元（parity，通常用 XOR）。",false]]],"opts_title":"參考答案","opts":[{"h":[["Mirroring RAID（RAID 1，鏡像）",true]],"x":[[["每筆資料同時寫到兩顆（或以上）磁碟，兩顆內容完全相同。",false]],[["優點",true],["：可靠度高，任一顆壞掉另一顆直接接手；",false],["讀取可以兩顆同時讀",true],["，速度快；重建只要複製，簡單快速；寫入不用計算。",false]],[["缺點",true],["：",false],["空間使用率只有 50%",true],["，成本高；每次寫入要寫兩份。",false]]]},{"h":[["Parity RAID（RAID 3、4、5；RAID 6 用兩組同位元）",true]],"x":[[["資料分散在 N−1 顆磁碟，另外存同位元 P = D1 ⊕ D2 ⊕ … ⊕ Dn−1（RAID 4 集中在一顆，RAID 5 分散在各顆）。壞一顆時，把其他磁碟的資料 XOR 就能算回遺失的內容。",false]],[["優點",true],["：",false],["空間使用率高",true],["（N 顆只花 1 顆存同位元，(N−1)/N）；讀取可平行，效能好。",false]],[["缺點",true],["：",false],["小量寫入很慢",true],["（read-modify-write：要讀舊資料、舊同位元，算出新同位元再寫回，寫一次變四次 I/O）；壞一顆時效能大降，重建要讀全部磁碟、時間長，重建期間再壞一顆就會遺失資料（RAID 5 只能容忍一顆）。",false]]]},{"h":[["怎麼選",true]],"x":[[["重視可靠度與寫入效能、資料量不大（例如系統碟、資料庫日誌）→ 鏡像；重視容量成本、讀多寫少（檔案伺服器）→ 同位元。兩者也能合用，例如 RAID 10（先鏡像再等量）。",false]]]}],"dt":1},"cs:94 問7":{"answer":[["這題的正確答案是 ",false],["最壞情況是三個行程各拿到 1 個資源，這時還剩 1 個，一定有行程能拿到第 2 個而執行完、釋放資源，所以不會死結",true],["（證明見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，10 分）系統有 4 個同類型資源，由 3 個行程共用，每個行程最多需要 2 個資源。證明系統不會發生死結（deadlock）。",false]],[["核心觀念",true],["：死結需要「所有行程都在等待別人手上的資源」。用",false],["反證法",true],["：假設死結，推出矛盾。",false]],[["通則",true],["：n 個行程、每個最多需要 m 個同類資源、共有 R 個資源，只要 ",false],["n(m−1) + 1 ≤ R",true],[" 就一定不會死結。這題 3×(2−1)+1 = 4 ≤ 4。",false]]],"opts_title":"參考證明","opts":[{"h":[["反證法",true]],"x":[[["假設發生死結，則 3 個行程都在等待，且每個行程都還沒拿滿 2 個資源 → 每個行程最多只持有 1 個資源 → 3 個行程共持有 ≤ 3 個資源。",false]],[["但系統有 4 個資源，所以至少有 1 個資源是空閒的。既然有空閒資源，正在等待的行程就能拿到它，不可能所有行程都在等待，",false],["矛盾",true],["。所以不會死結。",false]]]},{"h":[["直觀說法",true]],"x":[[["最壞情況：每個行程各拿 1 個（用掉 3 個），還剩 1 個 → 分給任一行程，它湊滿 2 個就能執行完並釋放 2 個資源 → 剩下的行程也都能湊滿。永遠有人能前進。",false]]]}],"dt":1},"cs:94 問8":{"answer":[["這題的正確答案是 ",false],["先比 a、b，再比較大的那個和 c，有兩種排列可以直接確定，其餘再比一次；最佳 2 次、最差 3 次、平均 8/3 ≈ 2.67 次",true],["（演算法見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，20 分）設計一個排序三個數的演算法，使平均情況下的比較次數最少；並說明最佳、最差、平均各需要幾次比較。",false]],[["核心觀念",true],["：三個數有 3! = 6 種排列，比較式排序的決策樹至少要有 6 片葉子，所以",false],["最差情況至少 ⌈log₂6⌉ = 3 次",true],["。用兩次比較最多只能分出 4 種結果，所以不可能每種排列都 2 次就決定，但可以讓",false],["其中 2 種排列只用 2 次",true],["。",false]]],"opts_title":"參考答案","opts":[{"h":[["演算法（輸入 a, b, c）",true]],"x":[[["```\nif (a <= b) {\n    if (b <= c)       output(a, b, c);              // 2 次\n    else if (a <= c)  output(a, c, b);              // 3 次\n    else              output(c, a, b);              // 3 次\n} else {               /* b < a */\n    if (a <= c)       output(b, a, c);              // 2 次\n    else if (b <= c)  output(b, c, a);              // 3 次\n    else              output(c, b, a);              // 3 次\n}",false]]]},{"h":[["比較次數",true]],"x":[[["最佳",true],["：2 次（a≤b≤c 或 b<a≤c）。",false]],[["最差",true],["：3 次，已經達到下限 ⌈log₂ 3!⌉ = 3。",false]],[["平均",true],["（6 種排列機率相同）：(2×2 + 4×3) / 6 = 16/6 = ",false],["8/3 ≈ 2.67 次",true],["。",false]],[["決策樹有 6 片葉子，2 片深度 2、4 片深度 3，這是 6 片葉子的二元樹能達到的最小外部路徑長，所以平均次數也是最少。",false]]]}],"dt":1},"cs:95-1":{"answer":[["這題的正確答案是 ",false],["B. MS Internet Explorer、D. FreeBSD、E. MySQL",true],["。",false]],"items":[[["題目",true],["：下列哪些",false],["不是",true],[" Web 伺服器軟體？（複選）",false]],[["核心觀念",true],["：Web 伺服器是接收 HTTP 請求、回傳網頁的軟體，例如 ",false],["Apache",true],["、",false],["Microsoft IIS",true],["、Nginx。要分清楚四種軟體角色：",false],["瀏覽器",true],["（用戶端，送出請求）、",false],["Web 伺服器",true],["（回應請求）、",false],["作業系統",true],["（伺服器跑在上面）、",false],["資料庫管理系統",true],["（Web 應用程式在背後存資料）。典型的 LAMP 架構：Linux（OS）＋ Apache（Web 伺服器）＋ MySQL（資料庫）＋ PHP（程式語言）。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. MS IIS — 是 Web 伺服器（不選）",true]],"x":[[["Internet Information Services，微軟的 Web 伺服器。",false]]]},{"h":[["B. MS Internet Explorer — 不是（選）",true]],"x":[[["瀏覽器，屬於用戶端。",false]]]},{"h":[["C. Apache — 是 Web 伺服器（不選）",true]],"x":[[["最常見的開放原始碼 Web 伺服器。",false]]]},{"h":[["D. FreeBSD — 不是（選）",true]],"x":[[["類 Unix 作業系統，可以在上面架 Web 伺服器，但它本身是 OS。",false]]]},{"h":[["E. MySQL — 不是（選）",true]],"x":[[["關聯式資料庫管理系統。",false]]]}],"dt":1},"cs:95-2":{"answer":[["這題的正確答案是 ",false],["A. SQL statements processing、B. Schema definition、D. Access control",true],["。",false]],"items":[[["題目",true],["：下列哪些是資料庫管理系統（DBMS）的核心功能？（複選）",false]],[["核心觀念",true],["：DBMS 負責",false],["定義、存取、保護",true],["資料：",false]],[["資料定義（DDL）",true],["：定義綱要（schema），例如 CREATE TABLE。",false]],[["資料處理（DML）",true],["：處理查詢與更新，也就是",false],["處理 SQL 敘述",true],["（解析、最佳化、執行）。",false]],[["資料控制（DCL）",true],["：",false],["存取控制",true],["（GRANT／REVOKE 權限）、安全性。",false]],[["另外還有交易管理（並行控制、復原）、完整性限制、備份等。",false]],[["易混淆",true],["：程式開發環境、網頁設計是應用程式或開發工具的事，DBMS 可以搭配這些工具，但不是它的核心功能。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. SQL statements processing — 對",true]],"x":[[["查詢處理器負責解析、最佳化與執行 SQL。",false]]]},{"h":[["B. Schema definition — 對",true]],"x":[[["DDL 定義資料庫結構，存在資料字典（catalog）。",false]]]},{"h":[["C. Software development environment — 錯",true]],"x":[[["IDE 等開發工具不是 DBMS 的核心功能。",false]]]},{"h":[["D. Access control — 對",true]],"x":[[["誰能讀、寫哪些資料表，由 DBMS 控管。",false]]]},{"h":[["E. Web page Design — 錯",true]],"x":[[["網頁設計和 DBMS 無關。",false]]]},{"h":[["F. None of the above — 錯",true]],"x":[[["A、B、D 都是。",false]]]}],"dt":1},"cs:95-3":{"answer":[["這題的正確答案是 ",false],["E. None of the above",true],["。",false]],"items":[[["題目",true],["：下列關於主從式（client-server）架構的敘述，哪些正確？（複選）",false]],[["核心觀念",true],["：主從式架構把應用程式（用戶端）和 DBMS（伺服器）分開放在",false],["不同機器",true],["，透過網路溝通（例如用 SQL 經 ODBC／JDBC 存取）。只要遵守共同的通訊協定，兩邊的",false],["作業系統可以不同",true],["（Windows 用戶端連 Linux 上的資料庫很常見）。在典型的兩層式主從架構裡，應用程式安裝在",false],["每一台用戶端",true],["上，所以升級時要更新所有用戶端，這正是它的缺點（後來的三層式／Web 架構才只要更新伺服器）。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 應用程式和 DBMS 必須在同一台機器 — 錯",true]],"x":[[["主從式的重點就是分開放，當然也「可以」在同一台，但不是「必須」。",false]]]},{"h":[["B. 兩邊的作業系統必須相同 — 錯",true]],"x":[[["透過網路協定溝通，平台可以不同（異質性）。",false]]]},{"h":[["C. 升級應用程式只要更新一台機器 — 錯",true]],"x":[[["應用程式裝在每台用戶端，要逐台更新；只更新一台是 Web（瀏覽器／伺服器）架構的優點。",false]]]},{"h":[["D. 應用程式必須是 Web-based — 錯",true]],"x":[[["主從式用戶端可以是一般桌面程式；Web 只是其中一種。",false]]]},{"h":[["E. None of the above — 對（正確答案）",true]],"x":[[["A～D 都不成立。",false]]]}],"dt":1},"cs:95-4":{"answer":[["這題的正確答案是 ",false],["B. DVD ROM、C. iPod",true],["。",false]],"items":[[["題目",true],["：下列哪些裝置可以用來儲存資訊？（複選）",false]],[["核心觀念",true],["：區分",false],["儲存裝置",true],["和",false],["輸入輸出／通訊裝置",true],["。DVD-ROM 是光碟儲存媒體；iPod 內有硬碟或快閃記憶體，可以存音樂和檔案（也能當隨身碟用）。耳機是輸出裝置，Cable modem 是把數位訊號調變到有線電視纜線上的通訊裝置，兩者都不是用來存資料的。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Ear phone — 錯",true]],"x":[[["輸出裝置（聲音）。",false]]]},{"h":[["B. DVD ROM — 對",true]],"x":[[["光學儲存媒體（唯讀）。",false]]]},{"h":[["C. iPod — 對",true]],"x":[[["內建硬碟／快閃記憶體的播放器，可以儲存資料。",false]]]},{"h":[["D. Cable modem — 錯",true]],"x":[[["通訊（調變／解調）裝置。",false]]]},{"h":[["E. None of the above — 錯",true]],"x":[[["B、C 可以。",false]]]}],"dt":1},"cs:95-5":{"answer":[["這題的正確答案是 ",false],["A. ALU、B. Cache",true],["。",false]],"items":[[["題目",true],["：下列哪些元件可以放在 CPU 晶片裡？（複選）",false]],[["核心觀念",true],["：CPU 晶片內有",false],["控制單元（CU）",true],["、",false],["算術邏輯單元（ALU）",true],["、",false],["暫存器",true],["，現代 CPU 還把 ",false],["L1／L2／L3 快取（SRAM）",true],[" 做在同一顆晶片上，以縮短存取時間。",false],["主記憶體（DRAM）",true],["是 CPU 外面的記憶體模組；",false],["RFID",true],[" 是無線射頻辨識標籤，和 CPU 無關。",false]],[["補充",true],["：快取用 SRAM（快、貴、不用刷新）；主記憶體用 DRAM（便宜、密度高、要刷新）。少數高階處理器有內嵌 DRAM（eDRAM）當快取，但考題的標準答案是 ALU 和 Cache。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. ALU — 對",true]],"x":[[["負責算術與邏輯運算，CPU 的核心。",false]]]},{"h":[["B. Cache — 對",true]],"x":[[["L1、L2（甚至 L3）快取都整合在 CPU 晶片上。",false]]]},{"h":[["C. RFID — 錯",true]],"x":[[["無線射頻辨識，用在門禁卡、物流標籤。",false]]]},{"h":[["D. DRAM — 錯",true]],"x":[[["主記憶體，位於 CPU 晶片外。",false]]]},{"h":[["E. None of the above — 錯",true]],"x":[[["A、B 可以。",false]]]}],"dt":1},"cs:95-6":{"answer":[["這題的正確答案是 ",false],["D. 4",true],["。",false]],"items":[[["題目",true],["：Ackermann 函數 A(0,n)=n+1；A(m,0)=A(m−1,1)；A(m,n)=A(m−1, A(m,n−1))。求 A(1,2)。",false]],[["核心觀念",true],["：Ackermann 函數是",false],["非原始遞迴",true],["的經典例子，成長得極快。考試時記住小 m 的公式最快：",false],["A(0,n)=n+1、A(1,n)=n+2、A(2,n)=2n+3、A(3,n)=2^(n+3)−3",true],["。",false]],[["逐步展開",true],["：A(1,2) = A(0, A(1,1))；A(1,1) = A(0, A(1,0))；A(1,0) = A(0,1) = 2 → A(1,1) = A(0,2) = 3 → A(1,2) = A(0,3) = ",false],["4",true],["（符合 A(1,n)=n+2）。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 1、B. 2、C. 3 — 錯",true]],"x":[[["A(1,1)=3，A(1,2) 還要再加 1。",false]]]},{"h":[["D. 4 — 對（正確答案）",true]],"x":[[["A(1,2) = 2 + 2 = 4。",false]]]},{"h":[["E. 5、F. None of the above — 錯",true]],"x":[[["5 是下一題 A(2,1) 的答案。",false]]]}],"dt":1},"cs:95-7":{"answer":[["這題的正確答案是 ",false],["E. 5",true],["。",false]],"items":[[["題目",true],["：同上題的 Ackermann 函數，求 A(2,1)。",false]],[["逐步展開",true],["：A(2,1) = A(1, A(2,0))；A(2,0) = A(1,1) = 3（上一題算過）→ A(2,1) = A(1,3) = 3 + 2 = ",false],["5",true],["。",false]],[["公式驗證",true],["：A(2,n) = 2n + 3 → A(2,1) = 5。推導：A(2,n) = A(1, A(2,n−1)) = A(2,n−1) + 2，且 A(2,0) = 3，所以每多 1 就加 2。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A～D（1、2、3、4）— 錯",true]],"x":[[["3 是 A(2,0)，4 是 A(1,2)，容易抄錯。",false]]]},{"h":[["E. 5 — 對（正確答案）",true]],"x":[[["A(2,1) = 2×1 + 3 = 5。",false]]]},{"h":[["F. None of the above — 錯",true]],"x":[]}],"dt":1},"cs:95-8":{"answer":[["這題的正確答案是 ",false],["B. All elements in a set must be distinct",true],["。",false]],"items":[[["題目",true],["：下列關於集合（set）的敘述哪些正確？（複選）",false]],[["核心觀念",true],["：集合的兩個基本特性：",false],["元素沒有順序",true],["（{1,2} = {2,1}）、",false],["元素不重複",true],["（{1,1,2} 就是 {1,2}）。要有順序用序列（tuple），可重複用多重集合（multiset／bag）。",false]],[["集合定律",true],["：分配律 A∩(B∪C) = (A∩B)∪(A∩C)；笛摩根定律的差集版 A−(B∪C) = (A−B)∩(A−C)、A−(B∩C) = (A−B)∪(A−C)。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. 集合中的元素有順序 — 錯",true]],"x":[[["集合沒有順序。",false]]]},{"h":[["B. 集合中的元素必須相異 — 對",true]],"x":[[["重複的元素只算一個。",false]]]},{"h":[["C. A∩(B∪C) = (A∩B)∪C — 錯",true]],"x":[[["正確的分配律是 (A∩B)∪(A∩C)。反例：A=∅、C={1}，左邊 ∅，右邊 {1}。",false]]]},{"h":[["D. A−(B∪C) = (A−B)∪(A−C) — 錯",true]],"x":[[["應該是交集：(A−B)∩(A−C)（不在 B「而且」不在 C）。反例：A={1,2}、B={1}、C={2}，左邊 ∅，右邊 {1,2}。",false]]]},{"h":[["E. None of the above — 錯",true]],"x":[[["B 正確。",false]]]}],"dt":1},"cs:95-9":{"answer":[["這題的正確答案是 ",false],["A、B、C（Pr(Z ≤ 0) = 21/36 ≈ 0.583）",true],["。",false]],"items":[[["題目",true],["：X、Y 是獨立、在 {1,…,6} 上均勻分布的隨機變數（擲兩顆骰子）。令 Z = X − Y，下列哪些正確？",false]],[["核心觀念",true],["：Z ≤ 0 就是 X ≤ Y。36 種等機率結果中：X = Y 有 6 種；X < Y 和 X > Y 對稱，各 (36 − 6)/2 = 15 種。所以 Pr(X ≤ Y) = (6 + 15)/36 = ",false],["21/36 = 7/12 ≈ 0.583",true],["。",false]],[["判斷",true],["：0.583 ≥ 0.3、≥ 0.4、≥ 0.5 都成立；≤ 0.3、≤ 0.4、≤ 0.5 都不成立。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. Pr(Z≤0) ≥ 0.3 — 對",true]],"x":[]},{"h":[["B. Pr(Z≤0) ≥ 0.4 — 對",true]],"x":[]},{"h":[["C. Pr(Z≤0) ≥ 0.5 — 對",true]],"x":[[["因為還包含相等的 6 種，所以超過一半。",false]]]},{"h":[["D、E、F（≤ 0.3、≤ 0.4、≤ 0.5）— 錯",true]],"x":[[["0.583 比它們都大。",false]]]}],"dt":1},"cs:95-10":{"answer":[["這題的正確答案是 ",false],["A、B、F（Pr(Z ≤ 6) = 15/36 ≈ 0.417）",true],["。",false]],"items":[[["題目",true],["：同上，令 Z = X + Y，下列哪些正確？",false]],[["核心觀念",true],["：兩顆骰子點數和為 s 的組合數：s = 2,3,4,5,6 分別有 1,2,3,4,5 種（s ≤ 7 時是 s − 1 種）。所以 Pr(Z ≤ 6) = (1+2+3+4+5)/36 = ",false],["15/36 ≈ 0.417",true],["。",false]],[["判斷",true],["：0.417 ≥ 0.3 ✓、≥ 0.4 ✓、≥ 0.5 ✗；≤ 0.3 ✗、≤ 0.4 ✗、≤ 0.5 ✓。",false]]],"opts_title":"各選項解析","opts":[{"h":[["A. ≥ 0.3 — 對",true]],"x":[]},{"h":[["B. ≥ 0.4 — 對",true]],"x":[[["0.417 略大於 0.4，要算精確，不能估。",false]]]},{"h":[["C. ≥ 0.5 — 錯",true]],"x":[[["和 7 最常出現（6/36），Z ≤ 6 不到一半。",false]]]},{"h":[["D. ≤ 0.3、E. ≤ 0.4 — 錯",true]],"x":[]},{"h":[["F. ≤ 0.5 — 對",true]],"x":[]}],"dt":1},"cs:95 問1":{"answer":[["這題的正確答案是 ",false],["A. {9, 8, 7, 6, 5, 4, 3, 2, 1}；B. 把內層迴圈改成 for (j = 0; j < n-1-i; j++)",true],["（說明見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，10 分）給一個 C 風格的 Sort 函數（兩層迴圈，若 A[j] < A[j+1] 就交換）。A. A = {1,3,5,7,9,2,4,6,8}，執行後 A 的內容？B. 只改一行讓它快一倍且結果相同，要改哪一行？",false]],[["核心觀念",true],["：這是",false],["氣泡排序（bubble sort）",true],["。條件是 A[j] < A[j+1] 就交換，也就是把",false],["小的往後推",true],["，所以排成",false],["由大到小（遞減）",true],["。每跑完一輪外層迴圈，這一輪最小的值會「沉」到最後面的正確位置。",false]]],"opts_title":"參考答案","opts":[{"h":[["A. 執行結果",true]],"x":[[["遞減排序：",false],["{9, 8, 7, 6, 5, 4, 3, 2, 1}",true],["。（注意題目是 < 才交換，結果是由大到小，別寫成由小到大。）",false]]]},{"h":[["B. 改內層迴圈",true]],"x":[[["```\nfor (j = 0; j < n-1-i; j++) {",false]],[["第 i 輪結束後，最後 i+1 個位置已經排好，不必再比。原本每輪都比 n−1 次，共 (n−1)² 次；改完後共 (n−1)+(n−2)+…+1 = n(n−1)/2 次，大約是原本的一半，所以快一倍，結果不變。",false]],[["（另一種常見改良是加旗標，某一輪沒有交換就提早結束；但那要加好幾行，而且最壞情況不會快一倍，不符合「只改一行」。）",false]]]}],"dt":1},"cs:95 問2":{"answer":[["這題的正確答案是 ",false],["0.75",true],["（說明見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，10 分）每個行程的位址空間有 1024 頁，分頁表放在記憶體中，從分頁表讀一個字要 500 ns。電腦有一個可放 64 組（虛擬頁、實體頁框）的 TLB，查詢一次 100 ns。要把平均額外負擔降到 200 ns，TLB 命中率至少要多少？",false]],[["核心觀念",true],["：TLB（轉譯後備緩衝區）是分頁表的快取。命中（hit）時只要查 TLB（100 ns）；沒命中（miss）時要去記憶體讀分頁表（500 ns）。設命中率為 h：",false]],[["計算",true],["：平均負擔 = 100h + 500(1 − h) = 200 → 500 − 400h = 200 → h = 300/400 = ",false],["0.75",true],["。",false]],[["另一種假設",true],["：如果認為 miss 時「先查 TLB 沒找到，再讀分頁表」，也就是 miss 要 100 + 500 = 600 ns，則 100h + 600(1 − h) = 200 → h = ",false],["0.8",true],["。這題原型出自 Tanenbaum《Modern Operating Systems》，解答用的是第一種（0.75）；作答時寫出你採用的假設最保險。",false]]],"opts_title":"參考答案","opts":[{"h":[["答案：命中率 h ≥ 0.75",true]],"x":[[["100h + 500(1−h) ≤ 200 ⇒ h ≥ 0.75。1024 頁、64 組這些數字是干擾資訊，計算用不到。",false]]]}],"dt":1},"cs:95 問3":{"answer":[["這題的正確答案是 ",false],["12,000 個使用者",true],["（說明見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，10 分）城市行動通訊總頻寬 40 MHz，每位使用者的雙工語音通道要 20 kHz。全市分成 24 個區域（細胞），每區一個基地台；頻帶分成 4 組，每個細胞分一組，相鄰細胞用不同組（頻率重用）。系統同時最多能服務幾位使用者？",false]],[["核心觀念",true],["：",false],["蜂巢式網路（cellular）",true],["靠",false],["頻率重用（frequency reuse）",true],["提高容量：距離夠遠、不相鄰的細胞可以用同一組頻率。重用因子 N = 4 表示頻帶分成 4 組，每個細胞只能用總頻寬的 1/4，但這 1/4 在很多細胞裡重複使用。",false]]],"opts_title":"參考答案","opts":[{"h":[["計算",true]],"x":[[["總通道數：40 MHz ÷ 20 kHz = 40,000 kHz ÷ 20 kHz = ",false],["2,000 個通道",true],["。",false]],[["每個細胞：2,000 ÷ 4 = ",false],["500 個通道",true],["（同時 500 人）。",false]],[["全系統：500 × 24 個細胞 = ",false],["12,000 人",true],["。",false]]]},{"h":[["對照",true]],"x":[[["如果不做頻率重用（整個城市一個大基地台），只能服務 2,000 人；切成 24 個細胞並重用頻率後容量變成 6 倍（24 ÷ 4）。細胞切得越小、重用次數越多，容量越大。",false]]]}],"dt":1},"cs:95 問4":{"answer":[["這題的正確答案是 ",false],["A. FIFO 換掉第 3 頁；B. LRU 換掉第 2 頁",true],["（說明見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，15 分）有 4 個頁框，表中列出各頁的載入時間、最後存取時間、R（參考位元）、M（修改位元）。A. FIFO 會換掉哪一頁？B. LRU 會換掉哪一頁？",false]],[["表格內容",true],["（載入時間／最後存取時間／R／M）：第 1 頁 126／279／0／0；第 2 頁 240／260／1／0；第 3 頁 110／271／1／1；第 4 頁 150／290／1／1。",false]],[["核心觀念",true],["：",false],["FIFO",true],[" 看「",false],["誰最早進來",true],["」（載入時間最小）；",false],["LRU",true],[" 看「",false],["誰最久沒被用",true],["」（最後存取時間最小）。R、M 位元是給 NRU、Second Chance（Clock）用的，這兩小題用不到，屬於干擾資訊。",false]]],"opts_title":"參考答案","opts":[{"h":[["A. FIFO → 第 3 頁",true]],"x":[[["載入時間 110 最早。",false]]]},{"h":[["B. LRU → 第 2 頁",true]],"x":[[["最後存取時間 260 最早（雖然它是最晚載入的）。",false]]]},{"h":[["延伸：其他演算法會選誰",true]],"x":[[["NRU",true],["（依 R、M 分類，選類別最低的）：第 1 頁是 (R=0, M=0) 第 0 類 → 換第 1 頁。",false]],[["Second Chance",true],["：依 FIFO 順序 3(R=1) → 清 R 移到尾端，4(R=1) → 清 R，1(R=0) → 換掉第 1 頁。",false]]]}],"dt":1},"cs:95 問5":{"answer":[["這題的正確答案是 ",false],["A. 不用慢啟動約 3.8 Mbps；B. 用慢啟動約 3.1 Mbps",true],["（假設與計算見下方）",false],["。",false]],"items":[[["題目",true],["：（問答，15 分）4 Mbps 乙太網路連線，MTU = 10 Kbits，來回延遲（RTT）4 ms，封包都用 MTU 大小。計算送出前 32 個封包的傳輸量（throughput）：A. 不用慢啟動；B. 用慢啟動。",false]],[["核心觀念",true],["：",false],["TCP 慢啟動（slow start）",true],["：壅塞視窗從 1 個封包開始，每收到一輪確認（每個 RTT）就加倍：1、2、4、8、16…。開頭要等好幾個 RTT 才能把線路填滿，所以短連線的傳輸量會被拖慢。",false]],[["基本數字",true],["：每個封包的傳送時間 = 10 Kbits ÷ 4 Mbps = ",false],["2.5 ms",true],["；32 個封包共 320 Kbits，光是傳送就要 32 × 2.5 = ",false],["80 ms",true],["。",false]],[["計算模型（作答時要寫出來）",true],["：每一輪先把視窗內的封包連續送出，再等一個 RTT 收到確認才開始下一輪。",false]]],"opts_title":"參考答案","opts":[{"h":[["A. 不用慢啟動",true]],"x":[[["視窗夠大，32 個封包一次連續送出，最後再等一個 RTT 收確認：總時間 = 80 + 4 = 84 ms。",false]],[["傳輸量 = 320 Kbits ÷ 84 ms ≈ ",false],["3.81 Mbps",true],["（若不計最後的 RTT，就是線路速率 4 Mbps）。",false]]]},{"h":[["B. 用慢啟動",true]],"x":[[["視窗依序是 1、2、4、8、16（共 31 個），第 6 輪再送剩下的 1 個 → 共 ",false],["6 輪",true],["，要等 6 個 RTT。",false]],[["總時間 = 傳送 80 ms + 6 × 4 ms = 104 ms。",false]],[["傳輸量 = 320 Kbits ÷ 104 ms ≈ ",false],["3.08 Mbps",true],["，約是不用慢啟動的 81%。",false]]]},{"h":[["觀念重點",true]],"x":[[["慢啟動多花的是「等確認」的 RTT 次數（這裡多了 5 個 RTT）。RTT 越長、頻寬越大（頻寬延遲積越大），慢啟動對短傳輸的影響越明顯；傳輸越久，影響就越被攤平。",false]]]}],"dt":1}}}</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const KEYS = {};
  DATA.cs.forEach(k => KEYS["cs:" + k.c] = Object.assign({ subj: "cs" }, k));
  DATA.mis.forEach(k => KEYS["mis:" + k.c] = Object.assign({ subj: "mis" }, k));
  const SUBJ = { cs: "計算機概論", mis: "管理資訊系統" };
  const CODE = { cs: "442001", mis: "442003" };
  // 作答狀態 s：O、X、已讀過三選一；「重要」是另外的標記 m，可以和 s 同時存在
  const ST = { ok: "O", bad: "X", read: "已讀過" };
  const IMP = "重要";
  const paperId = p => p.s + p.y;
  const PAPERS = {};
  DATA.papers.forEach(p => PAPERS[paperId(p)] = p);
  const QINDEX = [];
  DATA.papers.forEach(p => p.qs.forEach(q => QINDEX.push({ p, q })));
  { const nq = document.getElementById("nq"); if (nq) nq.textContent = QINDEX.length; }

  // ---------- state: { "<subj><year>": { q: { "<qid>": {s, m, a} }, pg: { "<n>": {s, m, n} } } }
  let state = {};
  const LS = "nsysu-pq-v1";
  try { state = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { state = {}; }
  // 舊版的「不會」（idk）併進 X，一樣留在錯題本；回傳有沒有改到
  function migrate(ps) {
    let n = 0;
    if (ps) ["q", "pg"].forEach(k => Object.values(ps[k] || {}).forEach(x => { if (x && x.s === "idk") { x.s = "bad"; n++; } }));
    return n > 0;
  }
  if (Object.keys(state).map(pid => migrate(state[pid])).some(Boolean)) try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  let dbCol = null;
  const pending = {}, chains = {}, dirty = {};

  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
  function paperState(pid) { return state[pid] || (state[pid] = { q: {}, pg: {} }); }
  function qState(pid, qid) { const ps = state[pid]; return (ps && ps.q && ps.q[qid]) || {}; }
  function setQ(pid, qid, patch) {
    const ps = paperState(pid); ps.q = ps.q || {};
    const cur = Object.assign({}, ps.q[qid] || {}, patch);
    if (!cur.m) delete cur.m;
    if (!cur.s && !cur.a && !cur.m) delete ps.q[qid]; else ps.q[qid] = cur;
    changed(pid);
  }
  function setPg(pid, n, patch) {
    const ps = paperState(pid); ps.pg = ps.pg || {};
    const cur = Object.assign({}, ps.pg[n] || {}, patch);
    if (!cur.m) delete cur.m;
    if (!cur.s && !cur.n && !cur.m) delete ps.pg[n]; else ps.pg[n] = cur;
    changed(pid);
  }
  function changed(pid) {
    saveLocal(); renderStats();
    if (!dbCol) return;
    dirty[pid] = (dirty[pid] || 0) + 1;
    const mark = dirty[pid];
    clearTimeout(pending[pid]);
    pending[pid] = setTimeout(() => {
      const body = JSON.parse(JSON.stringify(state[pid] || { q: {}, pg: {} }));
      chains[pid] = (chains[pid] || Promise.resolve()).then(() => dbCol && dbCol.doc(pid).set(body)).then(() => {
        if (dirty[pid] === mark) dirty[pid] = 0;

      const img = el("img", { src: pg.img, alt: alt, loading: "lazy" });
      img.style.transform = "translateY(" + (-y0 * 100).toFixed(3) + "%)";   // 百分比以圖片本身高度計算
      box.appendChild(img);
      return box;
    });
    return el("div", { class: "cropwrap" }, boxes);   // 外層可以左右捲動，放大時用
  }
  function renderYear(focus, keepScroll) {
    const p = PAPERS[curPaper];
    const pid = paperId(p);
    const body = el("div");
    body.appendChild(el("div", { class: "paperhead" }, [
      el("h2", { text: p.y + " 學年度　" + SUBJ[p.s] }),
      el("span", { class: "code", text: "科目代碼 " + CODE[p.s] + "・共 " + p.pages.length + " 頁" + (p.qs.length ? "・" + p.qs.length + " 題已標章節" : "") })
    ]));
    p.pages.forEach((pg, i) => {
      const n = i + 1;
      const card = el("section", { class: "page", id: "pg-" + pid + "-" + n });
      const seg = el("span", { class: "seg", role: "group", "aria-label": "顯示方式" });
      const bImg = el("button", { type: "button", "aria-pressed": "false", text: "整頁原卷" });
      const bText = el("button", { type: "button", "aria-pressed": "false", text: "整頁文字" });
      seg.append(bImg, bText);
      card.appendChild(el("div", { class: "pagebar" }, [el("strong", { text: "第 " + n + " 頁" }), seg]));
      const ps = (state[pid] && state[pid].pg && state[pid].pg[n]) || {};
      // 94–105 年原本只能逐頁寫筆記；改成逐題後，以前寫過的頁筆記照樣留在這頁最上面
      if (!p.qs.length || ps.s || ps.n || ps.m) {
        const ta = el("textarea", { id: "n-" + pid + "-" + n, rows: "2", placeholder: "這頁哪幾題會、哪幾題要回去讀" });
        ta.value = ps.n || "";
        let t; ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => setPg(pid, n, { n: ta.value.trim() }), 500); });
        card.appendChild(el("div", { class: "pnote" }, [
          el("div", { style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap" }, [el("label", { for: "n-" + pid + "-" + n, text: p.qs.length ? "以前寫的這頁筆記（現在每題都能各自寫）" : "這頁的練習筆記" }), statusButtons(ps.s, ps.m, v => setPg(pid, n, { s: v }), on => setPg(pid, n, { m: on ? 1 : 0 }))]),
          ta]));
      }
      const qs = p.qs.filter(q => q.p === n);
      if (qs.length) {
        const list = el("div", { class: "qlist" });
        qs.forEach(q => list.appendChild(questionRow(p, q, focus && focus.q === q.id)));
        card.appendChild(list);
      }
      const pre = el("pre", { class: "ocr", text: pg.txt || "（這頁辨識不到文字，請看原卷）" });
      const note = el("p", { class: "note", text: "文字由掃描檔自動辨識，數字、符號、程式碼可能有錯，作答前請對照「原卷」。" });
      const scan = el("div", { class: "scan" });
      const show = m => {
        if (m === "img" && !scan.firstChild) scan.appendChild(el("img", { src: pg.img, alt: p.y + " 學年度" + SUBJ[p.s] + "第 " + n + " 頁原卷", loading: "lazy" }));
        scan.hidden = m !== "img"; pre.hidden = m !== "txt"; note.hidden = m !== "txt";
        bImg.setAttribute("aria-pressed", String(m === "img")); bText.setAttribute("aria-pressed", String(m === "txt"));
      };
      let mode = p.qs.length ? "none" : "img";
      bImg.addEventListener("click", () => { mode = mode === "img" && p.qs.length ? "none" : "img"; show(mode); });
      bText.addEventListener("click", () => { mode = mode === "txt" && p.qs.length ? "none" : "txt"; show(mode); });
      show(mode);
      card.append(scan, pre, note);
      body.appendChild(card);
    });
    main.textContent = "";
    main.appendChild(el("div", { class: "yearview" }, [rail(), body]));
    if (focus) {
      const target = document.getElementById("pg-" + pid + "-" + focus.page);
      if (target) {
        requestAnimationFrame(() => {
          target.scrollIntoView({ block: "start" });
          target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 1600);
        });
      }
    } else if (!keepScroll) window.scrollTo(0, 0);
  }

  // ---------- chapter view
  const open = new Set();
  function renderChapters() {
    const wrap = el("div", { class: "chapview" });
    [["cs", "計算機概論", "依每日進度的讀書順序排列：計概(一)、C 語言，最後是課本沒有、要另外補的主題。"],
     ["mis", "管理資訊系統", "對應林東清《資訊管理》第 3 版；課本太舊、沒教的新議題列在最後。"]].forEach(([s, title, desc]) => {
      const sec = el("section", null, [el("h2", { text: title }), el("p", { text: desc })]);
      DATA[s].forEach(k => {
        const items = QINDEX.filter(x => x.p.s === s && x.q.c === k.c).sort((a, b) => b.p.y - a.p.y);
        if (!items.length) return;
        const c = counts(items), total = items.length;
        const card = el("div", { class: "ck" });
        const bar = el("span", { class: "bar" });
        ["ok", "bad", "read"].forEach(v => { if (c[v]) bar.appendChild(el("span", { class: "b-" + v, style: "width:" + (100 * c[v] / total) + "%" })); });
        const head = el("button", { type: "button", class: "head", "aria-expanded": String(open.has(s + k.c)) }, [
          el("span", { class: "nm" }, [k.name, k.book ? null : el("span", { class: "tag", text: "課本沒有" })]),
          el("span", { class: "src", text: k.src }),
          el("span", { class: "cnt", text: c.done + " / " + total }),
          bar]);
        card.appendChild(head);
        const rows = el("div", { class: "rows" });
        rows.hidden = !open.has(s + k.c);
        items.forEach(({ p, q }) => {
          const st = qState(paperId(p), q.id);
          rows.appendChild(el("div", { class: "row" }, [
            el("span", { class: "qid", text: q.id }),
            el("span", null, [q.t + " ", ...pills(st, true), (DATA.notes || {})[p.s + ":" + q.id] ? el("span", { class: "hasnote", text: "有解析" }) : null]),
            el("a", { href: "#y" + paperId(p) + "-p" + q.p + "-" + q.id.replace(/\s/g, ""), text: "看題目" })]));
        });
        head.addEventListener("click", () => {
          rows.hidden = !rows.hidden; head.setAttribute("aria-expanded", String(!rows.hidden));
          if (rows.hidden) open.delete(s + k.c); else open.add(s + k.c);
        });
        card.appendChild(rows);
        sec.appendChild(card);
      });
      wrap.appendChild(sec);
    });
    main.textContent = ""; main.appendChild(wrap);
  }

  // ---------- wrong book
  // ---------- English terms
  const tui = { q: "", g: "all", weak: false };
  function weakSet() { return ((state.terms || {}).t) || {}; }
  function toggleWeak(id) {
    state.terms = state.terms || { t: {} }; state.terms.t = state.terms.t || {};
    if (state.terms.t[id]) delete state.terms.t[id]; else state.terms.t[id] = 1;
    changed("terms");
  }
  function renderTerms() {
    const box = el("div");
    const bar = el("div", { class: "termbar" });
    const qi = el("input", { type: "search", id: "term-q", placeholder: "搜尋英文或中文，例如 deadlock、子網路", "aria-label": "搜尋術語" });
    qi.value = tui.q;
    const weakBtn = el("button", { type: "button", class: "fbtn", "aria-pressed": String(tui.weak) });
    bar.append(qi, weakBtn);
    const chips = el("div", { class: "gchips", role: "group", "aria-label": "主題" });
    const list = el("div");
    const groups = [{ g: "all", name: "全部" }, { g: "cs", name: "計概全部" }, { g: "mis", name: "MIS 全部" }].concat(DATA.termGroups);
    groups.forEach(gr => {
      const b = el("button", { type: "button", "aria-pressed": String(tui.g === gr.g), text: gr.name.replace("MIS｜", "") });
      b.addEventListener("click", () => { tui.g = gr.g; chips.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); draw(); });
      chips.appendChild(b);
    });
    function draw() {
      const weak = weakSet();
      weakBtn.textContent = "只看不熟（" + Object.keys(weak).length + "）";
      const q = tui.q.trim().toLowerCase();
      const items = DATA.terms.filter(t =>
        (tui.g === "all" || t.g === tui.g || (tui.g === "cs" && !t.g.startsWith("m-")) || (tui.g === "mis" && t.g.startsWith("m-"))) &&
        (!tui.weak || weak[t.id]) &&
        (!q || (t.en + " " + t.zh + " " + t.note).toLowerCase().includes(q)));
      list.textContent = "";
      if (!items.length) { list.appendChild(el("p", { class: "empty", text: tui.weak ? "還沒有標成不熟的術語。按術語左邊的 ★ 就會收進這裡。" : "找不到符合的術語。" })); return; }
      DATA.termGroups.forEach(gr => {
        const rows = items.filter(t => t.g === gr.g);
        if (!rows.length) return;
        const sec = el("section", { class: "tgroup" }, [el("h2", { text: gr.name + "（" + rows.length + "）" })]);
        rows.forEach(t => {
          const st = el("button", { type: "button", class: "star", "aria-pressed": String(!!weak[t.id]), title: "標成不熟", "aria-label": "標成不熟：" + t.en, text: "★" });
          st.addEventListener("click", () => { toggleWeak(t.id); st.setAttribute("aria-pressed", String(!!weakSet()[t.id])); weakBtn.textContent = "只看不熟（" + Object.keys(weakSet()).length + "）"; });
          const refs = el("div", { class: "refs" });
          const addRefs = arr => arr.forEach(r => refs.appendChild(el("a", { href: "#" + r.h, text: r.l })));
          if (!t.refs.length) refs.appendChild(el("span", { class: "none", text: "考卷上沒有直接出現，是這章的基本詞彙" }));
          else {
            addRefs(t.refs.slice(0, 8));
            if (t.refs.length > 8) {
              const more = el("button", { type: "button", text: "還有 " + (t.refs.length - 8) + " 處" });
              more.addEventListener("click", () => { more.remove(); addRefs(t.refs.slice(8)); });
              refs.appendChild(more);
            }
          }
          sec.appendChild(el("div", { class: "term" }, [st, el("span", { class: "en", lang: "en", text: t.en }), el("span", null, [el("span", { class: "zh", text: t.zh }), "　", el("span", { class: "nt", text: t.note })]), refs]));
        });
        list.appendChild(sec);
      });
    }
    let tmr;
    qi.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => { tui.q = qi.value; draw(); }, 200); });
    weakBtn.addEventListener("click", () => { tui.weak = !tui.weak; weakBtn.setAttribute("aria-pressed", String(tui.weak)); draw(); });
    box.append(bar, chips, el("p", { class: "legend", text: "共 " + DATA.terms.length + " 個術語，依讀書章節分組；點題號會跳到那一題。★ 標成不熟，會跟作答紀錄一起存到你的帳號。" }), list);
    draw();
    main.textContent = ""; main.appendChild(box);
  }

  function renderWrong() {
    const box = el("div", { class: "wrongview" });
    const list = QINDEX.filter(({ p, q }) => { const st = qState(paperId(p), q.id); return st.s === "bad" || st.m; });
    if (!list.length) {
      box.appendChild(el("p", { class: "empty", text: "還沒有錯題。做題時按「X」或「重要」，題目就會收進這裡，依章節排好，方便考前重做。" }));
    } else {
      const groups = {};
      list.forEach(x => { const k = x.p.s + ":" + x.q.c; (groups[k] = groups[k] || []).push(x); });
      [...DATA.cs.map(k => "cs:" + k.c), ...DATA.mis.map(k => "mis:" + k.c)].forEach(k => {
        if (!groups[k]) return;
        box.appendChild(el("h2", { text: SUBJ[KEYS[k].subj] + "｜" + KEYS[k].name + "（" + groups[k].length + "）" }));
        groups[k].forEach(({ p, q }) => {
          const qs = qState(paperId(p), q.id);
          box.appendChild(el("div", { class: "row" }, [
            el("span", { class: "qid", text: q.id }),
            el("span", null, [q.t + " ", ...pills(qs, false)]),
            el("a", { href: "#y" + paperId(p) + "-p" + q.p + "-" + q.id.replace(/\s/g, ""), text: "重做" }),
            qs.a ? (() => { const m = el("div", { class: "mine notev" }); m.innerHTML = noteHTML(qs.a); return m; })() : null]));
        });
      });
    }
    main.textContent = ""; main.appendChild(box);
  }

  // ---------- routing
  function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }
  function route(opts) {
    const keep = !!(opts && opts.keepScroll), y = window.scrollY;
    let h = (location.hash || "#year").slice(1);
    try { h = decodeURIComponent(h); } catch (e) {}   // 題號含中文（問、填、申）時瀏覽器會把 hash 編碼
    let view = "year", focus = null;
    if (h === "chapters") view = "chapters";
    else if (h === "terms") view = document.documentElement.classList.contains("in-dt") ? "year" : "terms";
    else if (h === "wrong") view = "wrong";
    else {
      const m = /^y(cs|mis)(\d{2,3})(?:-p(\d+)(?:-(.+))?)?$/.exec(h);
      if (m && PAPERS[m[1] + m[2]]) {
        curPaper = m[1] + m[2];
        if (m[3]) {
          const qid = m[4] ? (PAPERS[curPaper].qs.find(q => q.id.replace(/\s/g, "") === m[4]) || {}).id : null;
          focus = { page: Number(m[3]), q: qid };
        }
      }
    }
    document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.v === view ? "page" : "false"));
    if (view === "chapters") renderChapters(); else if (view === "wrong") renderWrong(); else if (view === "terms") renderTerms(); else renderYear(keep ? null : focus, keep);
    if (keep) window.scrollTo(0, y);
  }
  window.addEventListener("hashchange", () => route());
  renderStats();
  route();

  // ---------- account sync (private per viewer)
  (async function () {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      dbCol = db.collection("data/users/" + uid);
      let first = true;
      const migrated = [];
      const timer = setTimeout(() => setSync(false, "暫時連不到帳號，先存在這個瀏覽器"), 10000);
      dbCol.onSnapshot(snap => {
        if (!snap.metadata.fromCache) clearTimeout(timer);
        let touched = false;
        snap.docs.forEach(d => {
          if (!d.exists || dirty[d.id]) return;
          const body = d.data();
          if (!body || JSON.stringify(body) === JSON.stringify(state[d.id] || null)) return;
          state[d.id] = JSON.parse(JSON.stringify(body));
          if (migrate(state[d.id])) migrated.push(d.id);   // 帳號裡的舊「不會」也改成 X，並存回去
          touched = true;
        });
        migrated.splice(0).forEach(pid => changed(pid));
        if (first) {
          first = false;
          // upload anything only this browser had
          Object.keys(state).forEach(pid => { if (!snap.docs.some(d => d.id === pid) && (PAPERS[pid] || pid === "terms")) changed(pid); });
        }
        setSync(true, "作答紀錄已存到你的帳號，換裝置也看得到");
        if (touched) { saveLocal(); renderStats(); const a = document.activeElement; if (!a || a.tagName !== "TEXTAREA") route({ keepScroll: true }); }
      }, () => { clearTimeout(timer); dbCol = null; setSync(false, "無法存到帳號，先存在這個瀏覽器"); });
    } catch (e) { /* stay local */ }
  })();
})();
</script>
