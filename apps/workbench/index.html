<title>赫滋與羊工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a studio planner — sticky tab bar, one working surface per tab; tag colours carried over from the Excel sheet (★ red, 交 brown, 課 blue, 讀 purple, IG green) */
:root {
  --bg: #f3f5f1; --surface: #ffffff; --ink: #1f2a22; --muted: #66726a; --line: #d9dfd6; --soft: #e9eee6;
  --accent: #3f6b4a; --accent-ink: #ffffff;
  --t-star: #c0262d; --t-due: #8a4a12; --t-class: #1f4e79; --t-study: #6b35a3; --t-ig: #2f7d52;
  --pp: #fbe7ee; --rest: #eceeea; --warn: #b26a00; --warn-soft: #fbefd9; --bad: #b3263e; --bad-soft: #f8e1e5; --ok: #2f7d52; --ok-soft: #e1f2e7;
  --load-g: #dcefd9; --load-y: #fbe3a3; --load-r: #f6b3b8;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141815; --surface: #1c221e; --ink: #e4ebe5; --muted: #9aa69d; --line: #2e3831; --soft: #232b25;
  --accent: #7fbf8f; --accent-ink: #10180f;
  --t-star: #f07b80; --t-due: #e0a46b; --t-class: #82b4e6; --t-study: #c29cf0; --t-ig: #78cf9c;
  --pp: #3a2430; --rest: #222823; --warn: #e8b45f; --warn-soft: #3a2d14; --bad: #f08a9b; --bad-soft: #3a1c23; --ok: #78cf9c; --ok-soft: #173426;
  --load-g: #1f3a24; --load-y: #4a3d14; --load-r: #4d2227; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141815; --surface: #1c221e; --ink: #e4ebe5; --muted: #9aa69d; --line: #2e3831; --soft: #232b25;
  --accent: #7fbf8f; --accent-ink: #10180f;
  --t-star: #f07b80; --t-due: #e0a46b; --t-class: #82b4e6; --t-study: #c29cf0; --t-ig: #78cf9c;
  --pp: #3a2430; --rest: #222823; --warn: #e8b45f; --warn-soft: #3a2d14; --bad: #f08a9b; --bad-soft: #3a1c23; --ok: #78cf9c; --ok-soft: #173426;
  --load-g: #1f3a24; --load-y: #4a3d14; --load-r: #4d2227; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg) }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding-block: 18px 6px }
h1 { margin: 0; font-size: 1.45rem; letter-spacing: .03em }
.status { font-size: .8rem; color: var(--muted) }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); display: flex; gap: 4px; padding-block: 8px; border-bottom: 1px solid var(--line); overflow-x: auto }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 6px 13px; border-radius: 999px; font-weight: 500; white-space: nowrap }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink) }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 11px; font-size: .85rem }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted) }
.btn:disabled { opacity: .5; cursor: default }
input[type="date"], input[type="number"], input[type="text"], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 8px; font-size: .88rem; max-width: 100% }
textarea { width: 100%; resize: vertical; min-height: 44px }
.view { padding-top: 16px }
.empty { color: var(--muted); padding: 30px 0; text-align: center }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums }

/* tags */
.tag { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 20px; padding: 0 6px; border-radius: 5px; font-size: .74rem; font-weight: 700; color: #fff; flex: none }
.tag.s { background: var(--t-star) } .tag.d { background: var(--t-due) } .tag.c { background: var(--t-class) } .tag.r { background: var(--t-study) } .tag.i { background: var(--t-ig) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag { color: #111 } }
:root[data-theme="dark"] .tag { color: #111 }
.chip { font-size: .74rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; white-space: nowrap }
.chip.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft) }
.chip.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-soft) }

/* today */
.dayhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px }
.dayhead h2 { margin: 0; font-size: 1.35rem }
.dayhead .nav { display: flex; gap: 4px; align-items: center }
.badges { display: flex; flex-wrap: wrap; gap: 6px }
.notes { margin: 0 0 12px; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: .88rem }
.notes p { margin: 0 }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden }
.panel > h3 { margin: 0; padding: 10px 14px; font-size: .95rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line) }
.panel > h3 .sum { margin-left: auto; font-weight: 400; font-size: .8rem; color: var(--muted) }
.panel.overdue > h3 { color: var(--bad) }
.it { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 8px; padding: 9px 14px; border-top: 1px solid var(--line); align-items: start }
.panel > h3 + .it, .panel > h3 + div > .it:first-child { border-top: 0 }
.it input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent) }
.it .tt { min-width: 0 }
.it .tt b { font-weight: 500 }
.it.done .tt b { text-decoration: line-through; color: var(--muted) }
.it .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; align-items: center }
.it .detail { grid-column: 2 / -1; font-size: .84rem; color: var(--muted); white-space: pre-wrap; margin-top: 4px }
.it .acts { display: flex; gap: 2px }
.pp { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; margin-top: 6px; background: var(--soft); border-radius: 8px; font-size: .85rem }
.pp .sep { width: 100%; height: 0 }
.addrow { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line) }
.addrow input[type="text"] { flex: 1 1 180px }
.track-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .86rem; padding: 8px 14px 0; color: var(--t-study) }
.habit { display: flex; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); align-items: start }
.habit:first-of-type { border-top: 0 }
.habit small { display: block; color: var(--muted) }

/* calendar */
.calhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px }
.calhead h2 { margin: 0 8px 0 0; font-size: 1.3rem }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .78rem; color: var(--muted); margin-left: auto }
.legend span { display: inline-flex; align-items: center; gap: 4px }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px }
.cal .wd { text-align: center; font-size: .78rem; color: var(--muted); padding: 2px 0 }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-height: 108px; padding: 5px 6px; display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer; min-width: 0 }
.cell.out { opacity: .38 }
.cell.ppd { background: var(--pp) }
.cell.rest { background: var(--rest) }
.cell.today { outline: 2px solid var(--accent); outline-offset: -1px }
.cell .dn { font: 600 .82rem var(--font-mono); display: flex; justify-content: space-between; color: var(--ink) }
.cell .dn i { font-style: normal; color: var(--bad); font-family: var(--font-body); font-weight: 500; font-size: .72rem }
.ln { display: flex; gap: 4px; align-items: baseline; font-size: .74rem; line-height: 1.35; min-width: 0 }
.ln::before { content: ""; width: 6px; height: 6px; border-radius: 50%; flex: none; transform: translateY(-1px); background: var(--c) }
.ln span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.ln.done span { text-decoration: line-through; color: var(--muted) }
.more { font-size: .72rem; color: var(--muted) }
.more .short { display: none }
.cell .lns { display: grid; gap: 2px; min-width: 0 }
/* 手機版月曆下方的逐天清單（電腦版格子裡已經有文字，不顯示） */
.agenda { display: none; margin-top: 16px; gap: 10px }
.agday { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; scroll-margin-top: 12px }
.agday.past { opacity: .7 }
.agday.today { border-color: var(--accent) }
.agday.flash { box-shadow: 0 0 0 3px var(--accent) }
.agh { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--soft); border: 0; border-bottom: 1px solid var(--line); text-align: left; font: 600 .95rem var(--font-body); color: var(--ink) }
.agh .go { margin-left: auto; font: 500 .8rem var(--font-body); color: var(--accent); white-space: nowrap }
.agln { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-top: 1px solid var(--line); font-size: .92rem; line-height: 1.45 }
.agh + .agln { border-top: 0 }
.agln .tag { margin-top: 1px }
.agln > span { min-width: 0; overflow-wrap: anywhere }
.agln small { display: block; color: var(--muted); font-size: .78rem }
.agln.done > span { text-decoration: line-through; color: var(--muted) }

/* gantt */
.gctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px }
.gctl .chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: .82rem }
.gctl .chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.gwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
table.g { border-collapse: separate; border-spacing: 0; font-size: .8rem }
table.g th, table.g td { border-bottom: 1px solid var(--line); padding: 0; height: 30px; white-space: nowrap }
table.g thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; font-weight: 500; color: var(--muted) }
table.g .nm { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 300px; max-width: 300px; padding: 0 10px; text-align: left; border-right: 1px solid var(--line) }
table.g thead .nm { z-index: 3 }
table.g .nm .w { display: block; overflow: hidden; text-overflow: ellipsis; cursor: pointer }
table.g .nm small { color: var(--muted) }
table.g .wk { min-width: 26px; max-width: 26px; text-align: center; font-family: var(--font-mono); font-size: .68rem; border-left: 1px solid var(--soft) }
table.g .wk.now { background: var(--soft) }
table.g td.wk.bar { background: var(--bar) }
table.g td.wk.bar.done { opacity: .45 }
table.g tr.grp td { background: var(--soft); font-weight: 700; color: var(--ink) }
table.g tr.grp td.nm { background: var(--soft) }
table.g tr.load td.wk { font-weight: 600 }
table.g tr.edit td { height: auto; white-space: normal; padding: 8px 10px; background: var(--soft) }
.gform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .85rem }

/* IG */
.igsum { overflow-x: auto; margin-bottom: 14px }
table.t { border-collapse: collapse; width: 100%; font-size: .84rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
table.t th, table.t td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap }
table.t th { color: var(--muted); font-weight: 500; background: var(--soft) }
table.t td.n { text-align: right; font-family: var(--font-mono) }
.post { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 14px; padding: 12px 14px; border-top: 1px solid var(--line) }
.post:first-child { border-top: 0 }
.post .when { font-family: var(--font-mono); font-size: .85rem }
.post .when small { display: block; color: var(--muted); font-family: var(--font-body) }
.post h4 { margin: 0; font-size: .98rem; display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.post .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; font-size: .84rem }
.post dl { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 3px 10px; margin: 8px 0 0; font-size: .84rem }
.post dt { color: var(--muted) }
.post dd { margin: 0 }
.post input[type="number"] { width: 70px }
.st-pub { color: var(--ok) } .st-late { color: var(--bad) }

/* study */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px }
.card h3 { margin: 0 0 6px; font-size: 1.05rem; color: var(--t-study) }
.stat { display: flex; gap: 16px; margin: 6px 0 10px }
.stat div { display: grid }
.stat b { font: 600 1.25rem var(--font-mono) }
.stat small { color: var(--muted); font-size: .76rem }
.prog { height: 7px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-bottom: 10px }
.prog span { display: block; height: 100%; background: var(--t-study) }
.card ol { margin: 0; padding-left: 18px; font-size: .84rem; display: grid; gap: 4px }
.card ol li span { color: var(--muted); font-family: var(--font-mono); margin-right: 6px }
.shift { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: .84rem }
.shift input[type="number"] { width: 64px }
.card[data-act="sline"] { cursor: pointer }
.card[data-act="sline"]:hover { border-color: var(--t-study) }
.card.on { border-color: var(--t-study); box-shadow: 0 0 0 1px var(--t-study) }
.card .more { margin: 8px 0 0; font-size: .8rem; color: var(--t-study) }
.allprog { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px }
.allprog header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px }
.allprog header h3 { margin: 0; flex: 1; font-size: 1.05rem; color: var(--t-study) }
.allprog h4 { margin: 14px 0 4px; font-size: .86rem; color: var(--muted) }
.allprog ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.allprog li { display: flex; align-items: center; gap: 8px; padding: 4px 2px; border-bottom: 1px solid var(--line); font-size: .86rem; flex-wrap: wrap }
.allprog li .d { font-family: var(--font-mono); color: var(--muted); min-width: 5.6em }
.allprog li.done .t { color: var(--muted); text-decoration: line-through }
.allprog li.late .d { color: var(--bad); font-weight: 600 }
.allprog li.today { background: var(--soft) }
.allprog li .btn { padding: 1px 8px }

/* lists */
.lists { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start }
.ms { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 8px; padding: 7px 14px; border-top: 1px solid var(--line); font-size: .88rem; align-items: center }
.ms.past { opacity: .5 }
button.ms { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; font: inherit; color: inherit; cursor: pointer }
button.ms:hover, button.ms:focus-visible { background: var(--soft) }
button.ms:hover > span:nth-child(2) { text-decoration: underline; text-underline-offset: 3px }
.ms .mono { font-size: .82rem }
.q { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 4px }
.q small { color: var(--muted) }
.refsec { padding: 10px 14px; font-size: .88rem }
.refsec dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; margin: 0 }
.refsec dt { font-weight: 600 }
.refsec dd { margin: 0 }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: .88rem; z-index: 30 }

@media (max-width: 900px) {
  .grid2, .lists { grid-template-columns: minmax(0, 1fr) }
  .cards { grid-template-columns: minmax(0, 1fr) }
}
@media (max-width: 640px) {
  .cell { min-height: 64px; padding: 4px }
  .ln span { display: none }
  .ln { display: inline-flex }
  .cell .lns { display: flex; flex-wrap: wrap; gap: 3px }
  .cell .dn i { font-size: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); align-self: center; flex: none }
  .more { font-size: .68rem; line-height: 1 }
  .more .full { display: none }
  .more .short { display: inline }
  .agenda { display: grid }
  .legend { margin-left: 0 }
  table.g .nm { min-width: 190px; max-width: 190px }
  /* 名稱欄窄：第二行的日期・狀態・負責人截斷，不要壓到右邊的時間條 */
  table.g .nm small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .ms { grid-template-columns: 74px minmax(0, 1fr) auto; gap: 6px; padding: 8px 12px }
  .ms .mono { font-size: .76rem }
  .post { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: no-preference) { .it, .cell { transition: background-color .15s } }
/* 放在每日任務平台裡：平台的「今天」已經整合工作台的今天，標題和同步狀態也在平台上方，這裡不重複 */
html.in-dt header.top, html.in-dt nav.tabs { display: none }
html.in-dt .wrap { max-width: 1200px }
html.in-dt .view { padding-top: 20px }
/* 專案顏色（跟平台同一組） */
:root { --p1: #2f6fb0; --p2: #7d4cb8; --p3: #2a8259; --p4: #b9651c; --p5: #be3a5b; --p6: #4a5b72 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --p1: #7fb0e6; --p2: #b996ec; --p3: #74c99c; --p4: #e6a15f; --p5: #ef8ba3; --p6: #a3b1c6 } }
:root[data-theme="dark"] { --p1: #7fb0e6; --p2: #b996ec; --p3: #74c99c; --p4: #e6a15f; --p5: #ef8ba3; --p6: #a3b1c6 }
table.g tr.grp td.nm { box-shadow: inset 4px 0 0 var(--gc, transparent) }
</style>

<div class="wrap">
  <header class="top">
    <h1>赫滋與羊工作台</h1>
    <span class="status" id="status">連線中…</span>

  const examRestOf = sub => { const offs = (((S.docs.meta || {}).examOff || {})[sub] || []).map(r => String(r).split("~")); return s => isRest(s) || offs.some(r => s >= r[0] && s <= r[1]); };

          + '<button class="agh" data-act="openday" data-to="' + d + '"><span>' + esc(mdw(d)) + "</span>" + (d === t ? '<span class="chip">今天</span>' : "") + (late ? '<span class="chip bad">有未完成</span>' : "") + '<span class="go">打開這天 ›</span></button>'
          + lines.map(l => '<div class="agln' + (l.done ? " done" : "") + '">' + tagChip(l.tag) + "<span>" + esc(l.text) + (l.sub ? "<small>" + esc(l.sub) + "</small>" : "") + "</span></div>").join("")
          + "</section>";
      }
    }
    return h + "</div>" + '<div class="agenda">' + (ag || '<p class="empty">這個月沒有排事項。</p>') + "</div>";
  }

  // ---------------- 看板資料：甘特圖以平台的「專案管理」看板和「學習規劃」為主，工作台只留不屬於專案的排程
  const B = { tasks: {}, projects: {}, goals: {}, exams: {}, cfg: null, seen: new Set(), ready: false };
  let bdb = null, linking = false;
  const BST = { todo: "待辦", doing: "進行中", wait: "等待中", done: "完成" };
  const isD = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
  const bArr = c => Object.keys(B[c]).map(id => Object.assign({ id }, B[c][id]));
  const gEditing = () => { const a = document.activeElement; return !!(a && a.closest && a.closest(".gform")); };
  async function boardBoot() {
    try { bdb = window.DT && window.DT.dbFor ? await window.DT.dbFor("daily") : null; } catch (e) { bdb = null; }
    if (!bdb) return;
    ["tasks", "projects", "goals", "exams"].forEach(c => bdb.collection(c).onSnapshot(qs => {
      const m = {}; qs.docs.forEach(d => { m[d.id] = d.data(); }); B[c] = m;
      if (!qs.metadata || !qs.metadata.fromCache) B.seen.add(c);   // 只認雲端確認過的資料，離線快取不算
      B.ready = B.seen.size >= 4;
      rev++; linkBoard();
      if (!gEditing()) render();
    }, () => {}));
    bdb.doc("cfg/main").onSnapshot(s => { B.cfg = s.exists ? s.data() : null; }, () => {});
  }
  function bPatch(id, p, fromItem) {
    const before = B.tasks[id] || {};
    B.tasks[id] = Object.assign({}, before, p); rev++; render();
    if (bdb) bdb.collection("tasks").doc(id).update(p).catch(() => toast("看板沒有存到，稍後再試一次"));
    if (fromItem) return;
    derive().items.filter(it => it.link === "t:" + id).forEach(it => {
      const q = {};
      if ("st" in p && (p.st === "done") !== !!it.done) { q.done = p.st === "done"; q.doneAt = q.done ? today() : null; }
      if (p.due && p.due !== it.date) { q.date = p.due; q.moved = (it.moved || 0) + 1; q.orig = it.orig || it.date; }
      if (Object.keys(q).length) setItem(it, q);
    });
  }
  // 名稱比對（跟平台今天頁同一套規則）
  function normT(s) {
    s = String(s || "").toLowerCase();
    const t = s.replace(/[（(][^）)]*[）)]/g, "");
    return (t.trim() ? t : s).replace(/[^0-9a-z㐀-鿿]/g, "");
  }
  function simT(a, b) {
    const x = normT(a), y = normT(b);
    if (x.length < 2 || y.length < 2) return 0;
    if (x.includes(y) || y.includes(x)) return 1;
    const bg = s => { const o = {}; for (let i = 0; i < s.length - 1; i++) { const k = s.slice(i, i + 2); o[k] = (o[k] || 0) + 1; } return o; };
    const A = bg(x), Bg = bg(y); let n = 0;
    Object.keys(A).forEach(k => { if (Bg[k]) n += Math.min(A[k], Bg[k]); });
    return (2 * n) / (x.length - 1 + y.length - 1);
  }
  // 一次性：把工作台的工作接到看板上的同一筆（工時、負責人搬過去），看板沒有的專案工作補進看板，考試接到「考試」
  function linkBoard() {
    if (linking || !S.loaded || !S.server || !B.ready || !bdb || !col) return;
    const doc = S.docs.tasks || {};
    if (doc.boardLink || !Object.keys(doc.tasks || {}).length) return;
    const all = bArr("tasks"); if (!all.length) return;
    linking = true;
    const projByName = {}; bArr("projects").forEach(p => { projByName[normT(p.name)] = p; });
    const boardMod = area => (((B.cfg && B.cfg.mods) || []).find(m => m.type === "projectBoard" && m.area === area && !m.hidden) || {}).id || "proj-board";
    const used = new Set(), wbPatch = {}, bWrites = [];
    derive().tasks.forEach(t => { if (t.board) used.add(t.board); });
    derive().tasks.forEach(t => {
      if (t.board || t.exam) return;
      const p = projByName[normT(t.item)];
      const cands = p ? all.filter(x => x.proj === p.id) : t.cat === "學業" ? all.filter(x => x.goal) : [];
      let best = null, bs = 0;
      cands.forEach(x => {
        if (used.has(x.id)) return;
        let s = simT(t.work, x.t);
        if (!p) s = Math.max(s, simT(String(t.item || "").split("｜").pop() + t.work, x.t));
        const same = x.due === t.end;
        if ((s >= 0.45 && same) || s >= 0.7) { const sc = s + (same ? 0.5 : 0); if (sc > bs) { bs = sc; best = x; } }
      });
      if (best) {
        used.add(best.id); wbPatch[t.id] = { board: best.id };
        const bp = {};
        if (best.hours == null && t.hours != null && t.hours !== "") bp.hours = Number(t.hours);
        if (!isD(best.start) && isD(t.start) && t.start < best.due && t.end === best.due) bp.start = t.start;   // 工時才能照原本的期間攤開
        if (!best.owner && t.owner && t.owner !== "雅婷") bp.owner = t.owner;
        if (t.status === "完成" && best.st !== "done") { bp.st = "done"; bp.done = today(); }
        else if (t.status === "進行中" && (best.st || "todo") === "todo") bp.st = "doing";
        if (Object.keys(bp).length) bWrites.push([best.id, bp, false]);
        return;
      }
      const ex = t.cat === "學業" ? bArr("exams").find(e => e.date === t.start) : null;
      if (ex) { wbPatch[t.id] = { exam: ex.id }; return; }
      if (p && isD(t.end)) {
        const id = "t-wb-" + t.id, st = t.status === "完成" ? "done" : t.status === "進行中" ? "doing" : "todo";
        const d = { t: t.work, st, start: isD(t.start) ? t.start : t.end, due: t.end, pri: 0, proj: p.id, mod: boardMod(p.area), at: today(), from: "workbench" };
        if (t.hours != null && t.hours !== "") d.hours = Number(t.hours);
        if (t.owner && t.owner !== "雅婷") d.owner = t.owner;
        if (st === "done") d.done = today();
        bWrites.push([id, d, true]); wbPatch[t.id] = { board: id };
      }
    });
    if (bWrites.filter(w => w[2]).length > 20) { linking = false; toast("甘特圖對看板時要新增的工作太多，先暫停，沒有動資料"); return; }
    bWrites.forEach(([id, d, isNew]) => {
      const ref = bdb.collection("tasks").doc(id);
      (isNew ? ref.set(d) : ref.update(d)).catch(() => {});
      B.tasks[id] = Object.assign({}, B.tasks[id], d);
    });
    write("tasks", { boardLink: 1, tasks: wbPatch });
    const nLink = Object.values(wbPatch).filter(x => x.board).length, nNew = bWrites.filter(w => w[2]).length;
    toast("甘特圖改讀看板：對上 " + (nLink - nNew) + " 件" + (nNew ? "，補進看板 " + nNew + " 件" : ""));
  }

  function boardOn(d) {
    if (!B.ready) return [];
    const wb = (derive().byDate[d] || []).map(it => it.title), dup = t => wb.some(x => simT(x, t) >= 0.45), out = [];
    const proj = id => (B.projects[id] || {}).name || "", goal = id => (B.goals[id] || {}).name || "";
    bArr("exams").filter(e => e.date === d).forEach(e => { if (!dup(e.name)) out.push({ tag: "★", text: "考試・" + e.name, done: false, sub: goal(e.goal), kind: "exam", id: e.id }); });
    bArr("projects").forEach(p => (p.ms || []).forEach(m => { if (m.date === d && !dup(m.t)) out.push({ tag: "★", text: m.t, done: !!m.done, sub: p.name, kind: "ms" }); }));
    bArr("tasks").filter(t => t.key && t.due === d).forEach(t => { if (!dup(t.t)) out.push({ tag: "★", text: t.t, done: t.st === "done", sub: proj(t.proj) || goal(t.goal), kind: "task", id: t.id }); });
    // 其他（沒標 ★ 的）看板任務期限不放進月曆：工作台的「交」已經排了大部分截止，名稱常不一樣，放進來容易重複（任務在今天頁和甘特圖看）
    return out;
  }
  const catColor = cat => /學業|讀書/.test(cat) ? "var(--t-study)" : /商品/.test(cat) ? "var(--t-star)" : /IG|社群/.test(cat) ? "var(--t-ig)" : /課程|行程/.test(cat) ? "var(--t-class)" : "var(--t-due)";
  function ganttRows() {
    const c = derive(), rows = [];
    const wbRow = (t, kind, grp) => ({ src: "wb", id: t.id, kind, grp, label: t.work, sub: t.item, start: t.start, end: t.end, st: t.status || "未開始", done: t.status === "完成", doing: t.status === "進行中" || t.status === "延後", hours: t.hours, owner: t.owner, color: catColor(t.cat), raw: t });
    if (!B.ready) { c.tasks.forEach(t => rows.push(wbRow(t, t.cat, t.cat))); return rows; }
    const byStart = (a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : a.end < b.end ? -1 : 1);
    const tasks = bArr("tasks").filter(t => isD(t.due)).map(t => Object.assign(t, { start: isD(t.start) && t.start <= t.due ? t.start : t.due }));
    const bRow = (t, kind, grp, color) => ({ src: "board", id: t.id, kind, grp, label: (t.key ? "★ " : "") + t.t, start: t.start, end: t.due, st: BST[t.st] || "待辦", done: t.st === "done", doing: t.st === "doing", hours: t.hours, owner: t.owner, color, raw: t });
    bArr("projects").sort((a, b) => ((a.start || "9") < (b.start || "9") ? -1 : 1))
      .forEach(p => tasks.filter(t => t.proj === p.id).sort(byStart).forEach(t => rows.push(bRow(t, "專案", p.name, "var(--p" + (Number(p.c) >= 1 && Number(p.c) <= 6 ? Number(p.c) : 1) + ")"))));
    bArr("goals").sort((a, b) => ((a.target || "9") < (b.target || "9") ? -1 : 1))
      .forEach(g => tasks.filter(t => t.goal === g.id && !t.proj).sort(byStart).forEach(t => rows.push(bRow(t, "學習", g.name, "var(--t-study)"))));
    bArr("exams").filter(e => isD(e.date)).sort((a, b) => (a.date < b.date ? -1 : 1)).forEach(e => {
      const end = isD(e.end) && e.end >= e.date ? e.end : e.date;
      rows.push({ src: "exam", id: e.id, kind: "學習", grp: "考試", label: e.name, start: e.date, end, st: e.kind || "考試", done: end < today(), color: "var(--t-star)", raw: e });
    });
    c.tasks.filter(t => !t.board && !t.exam).forEach(t => rows.push(wbRow(t, t.cat === "學業" ? "學習" : t.cat, t.cat === "學業" ? "其他學習行程" : t.cat)));
    return rows;
  }

  function viewGantt() {
    const c = derive(), rows = ganttRows();

    let minD = rows.reduce((a, r) => (r.start < a ? r.start : a), rows[0].start), maxD = rows.reduce((a, r) => (r.end > a ? r.end : a), rows[0].end);
    const w0 = mondayOf(minD), weeks = [];

      + '<span class="status">' + (B.ready ? "專案和學習的工作來自看板與學習規劃，在這裡改日期、狀態會同步過去" : "點工作名稱可以改日期、狀態或整段延後") + "</span></div>";

      weeks.forEach(w => {
        const we = addDays(w, 6), on = r.start <= we && r.end >= w;
        h += '<td class="wk' + (w === nowW ? " now" : "") + (on ? " bar" + (r.done ? " done" : "") : "") + '"' + (on ? ' style="--bar:' + color + '"' : "") + ">" + (on && r.start === r.end ? "◆" : "") + "</td>";

          + '<label>狀態 <select id="g-status">' + (board ? Object.keys(BST).map(s => '<option value="' + s + '"' + (s === (t.st || "todo") ? " selected" : "") + ">" + BST[s] + "</option>").join("")
            : TASK_ST.map(s => "<option" + (s === (t.status || "未開始") ? " selected" : "") + ">" + s + "</option>").join("")) + "</select></label>"
          + '<label>工時 <input type="number" id="g-hours" min="0" step="0.5" value="' + esc(t.hours == null ? "" : t.hours) + '" style="width:80px"></label>'
          + (board ? '<label>負責 <input type="text" id="g-owner" value="' + esc(t.owner || "") + '" placeholder="雅婷" style="width:120px"></label>' : "")
          + '<button class="btn primary" data-act="gsave" data-key="' + esc(key) + '">儲存</button>'
          + '<span>整段延後</span>' + [1, 3, 7, 14].map(n => '<button class="btn" data-act="gshift" data-key="' + esc(key) + '" data-n="' + n + '">' + n + " 天</button>").join("")
          + (board ? '<button class="btn ghost" data-act="gboard" data-k="' + (r.kind === "專案" ? "projectBoard" : "studyPlan") + '">到' + (r.kind === "專案" ? "看板" : "學習規劃") + "</button>" : "")
          + '<button class="btn ghost" data-act="gclose">關閉</button></div></td></tr>';
      }
    });
    // 每週負載：看板工作的工時＋工作台自己的工時（接到考試的工作台工作也算），平均攤到每一天
    const load = weeks.map(() => 0);
    const spread = (hrs, s, e) => {
      hrs = Number(hrs) || 0; if (!hrs || !s || !e) return;

    };
    if (B.ready) {
      bArr("tasks").filter(t => isD(t.due)).forEach(t => spread(t.hours, isD(t.start) && t.start <= t.due ? t.start : t.due, t.due));
      c.tasks.filter(t => !t.board).forEach(t => spread(t.hours, t.start, t.end));
    } else c.tasks.forEach(t => spread(t.hours, t.start, t.end));

      + load.map((v, i) => { const r = Math.round(v); return '<td class="wk' + (weeks[i] === nowW ? " now" : "") + '" style="background:var(' + (r < 20 ? "--load-g" : r < 30 ? "--load-y" : "--load-r") + ')">' + r + "</td>"; }).join("") + "</tr>";

  }

        + '<label>讚 <input type="number" min="0" data-act="postnum" data-k="likes" data-id="' + esc(p.id) + '" value="' + esc(p.likes == null ? "" : p.likes) + '"></label>'
        + '<label>留言 <input type="number" min="0" data-act="postnum" data-k="comments" data-id="' + esc(p.id) + '" value="' + esc(p.comments == null ? "" : p.comments) + '"></label></div>'
        + "<dl>" + [["內容角度", p.angle], ["開頭第一句", p.hook], ["留言設計", p.cta], ["當天限動", p.story], ["備註", p.note]].filter(x => x[1]).map(x => "<dt>" + x[0] + "</dt><dd>" + esc(x[1]) + "</dd>").join("") + "</dl>"
        + "</div></article>";
    });
    if (!shown.length) h += '<p class="empty">沒有符合的發文。</p>';
    return h + "</section>";
  }

  function viewStudy() {
    const c = derive(), t = today();
    let h = '<p class="status">中山計概、MIS 和 iPAS 依章節每天做考古題、多益官方題一天一個 Part（點題號直接打開那一題），其他照每日進度表。落後了就在這裡把整條線往後挪（跳過週日與假日），或在「今天」逐項延後。</p><div class="cards">';
    LINES.forEach((tr, li) => {
      const all = c.items.filter(it => it.tag === "讀" && lineOf(it) === tr && !it.review);
      if (!all.length) return;
      const done = all.filter(it => it.done).length;
      const behind = all.filter(it => !it.done && it.date < t);
      const upcoming = all.filter(it => !it.done && it.date >= t).slice(0, 6);
      const last = all.length ? all[all.length - 1].date : null;
      const ex = all.some(it => it.qs && it.qs.length), unit = all[0].src === "exam" ? "天" : "項";
      const qn = ex ? all.reduce((a, it) => a + ((it.qs || []).length), 0) : 0, qd = ex ? all.filter(it => it.done).reduce((a, it) => a + ((it.qs || []).length), 0) : 0;
      h += '<section class="card' + (ui.sline === tr ? " on" : "") + '" data-act="sline" data-k="' + esc(tr) + '" title="點一下看這條線的全部進度"><h3>' + esc(LINE_NAME[tr] || tr) + "</h3>"
        + '<div class="stat"><div><b>' + (ex ? qd : done) + "</b><small>" + (ex ? "已做題數" : "已完成") + "</small></div><div><b" + (behind.length ? ' style="color:var(--bad)"' : "") + ">" + behind.length + "</b><small>落後" + unit + "數</small></div><div><b>" + (ex ? qn : all.length) + "</b><small>" + (ex ? "總題數" : "總項數") + "</small></div></div>"
        + '<div class="prog"><span style="width:' + (all.length ? (100 * done / all.length).toFixed(1) : 0) + '%"></span></div>'
        + (last ? '<p class="status">目前排到 ' + esc(mdw(last)) + "</p>" : "")
        + "<ol>" + upcoming.map(it => "<li><span>" + md(it.date) + "</span>" + (it.qs && it.qs.length ? it.qs.map(q => qBtn(it, q)).join(" ") : esc(it.title)) + "</li>").join("") + "</ol>"
        + (upcoming.length ? "" : '<p class="status">沒有未完成的進度。</p>')
        + '<p class="more">' + (ui.sline === tr ? "▲ 收起全部進度" : "▼ 點卡片看全部 " + all.length + " " + unit) + "</p>"
        + '<div class="shift"><label>從 <input type="date" id="sf-' + li + '" value="' + (behind.length ? behind[0].date : t) + '"></label><label>起往後挪 <input type="number" min="1" max="60" id="sn-' + li + '" value="' + Math.max(1, Math.min(60, behind.length || 1)) + '"> 天</label>'
        + '<button class="btn primary" data-act="shifttrack" data-k="' + tr + '">整條線往後挪</button></div></section>';
    });
    h += "</div>";
    const all = ui.sline ? c.items.filter(it => it.tag === "讀" && lineOf(it) === ui.sline && !it.review) : [];
    if (all.length) {
      h += '<section class="allprog" id="allprog"><header><h3>' + esc(LINE_NAME[ui.sline] || ui.sline) + "：全部進度（" + all.filter(it => it.done).length + "／" + all.length + "）</h3>"
        + '<button class="btn ghost" data-act="sline" data-k="' + esc(ui.sline) + '">收起</button></header>';
      let mon = "";
      all.forEach(it => {
        const m = it.date.slice(0, 7);
        if (m !== mon) { h += (mon ? "</ul>" : "") + "<h4>" + Number(m.slice(0, 4)) + " 年 " + Number(m.slice(5)) + " 月</h4><ul>"; mon = m; }
        const cls = it.done ? "done" : it.date < t ? "late" : it.date === t ? "today" : "";
        h += '<li class="' + cls + '"><input type="checkbox" data-act="toggle" data-id="' + esc(it.id) + '"' + (it.done ? " checked" : "") + ' aria-label="完成：' + esc(it.title) + '">'
          + '<span class="d">' + esc(mdw(it.date)) + "</span>"
          + (it.qs && it.qs.length ? it.qs.map(q => qBtn(it, q)).join("") : '<span class="t">' + esc(it.title) + "</span>")
          + "</li>";
      });
      h += "</ul></section>";
    }
    return h;
  }

  function viewLists() {
    const c = derive(), t = today(), ref = S.docs.ref || {};
    const goTask = t => (t.proj ? "p:" + t.proj + ":t:" + t.id : t.goal ? "g:" + t.goal + ":t:" + t.id : "");
    const goLink = link => {
      const [k, a, b] = String(link || "").split(":");
      if (k === "t" && B.tasks[a]) return goTask(Object.assign({ id: a }, B.tasks[a]));
      if (k === "m" && B.projects[a]) return "p:" + a + ":m:" + b;
      if (k === "e" && B.exams[a]) return "g:" + (B.exams[a].goal || "") + ":e:" + a;
      return "";
    };
    const ms = c.items.filter(it => it.important).map(x => Object.assign({}, x, { src: "", go: goLink(x.link) || "day:" + x.date }));
    if (B.ready) {
      const add = x => { if (!ms.some(y => y.date === x.date && simT(y.title, x.title) >= 0.45)) ms.push(x); };
      bArr("exams").filter(e => isD(e.date)).forEach(e => add({ date: e.date, tag: "★", title: "考試・" + e.name, done: false, src: (B.goals[e.goal] || {}).name || "", go: "g:" + (e.goal || "") + ":e:" + e.id }));
      bArr("projects").forEach(p => (p.ms || []).filter(m => isD(m.date)).forEach(m => add({ date: m.date, tag: "★", title: m.t, done: !!m.done, src: p.name, go: "p:" + p.id + ":m:" + m.id })));
      bArr("tasks").filter(t => t.key && isD(t.due)).forEach(t => add({ date: t.due, tag: "★", title: t.t, done: t.st === "done", src: (B.projects[t.proj] || {}).name || (B.goals[t.goal] || {}).name || "", go: goTask(t) || "day:" + t.due }));
      bArr("goals").filter(g => isD(g.target)).forEach(g => add({ date: g.target, tag: "★", title: "目標日・" + g.name, done: false, src: "", go: "g:" + g.id }));
      ms.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    }
    const up = ms.filter(x => x.date >= t), past = ms.filter(x => x.date < t);
    let h = '<div class="lists"><div><section class="panel"><h3>重要日期<span class="sum">里程碑、考試、目標日和標記為重要的事項</span></h3>';
    const where = go => (go.startsWith("p:") ? "打開專案編輯" : go.startsWith("g:") ? "打開學習目標編輯" : "打開月曆的這一天");
    up.forEach(x => { const n = diffDays(t, x.date); h += '<button class="ms msgo" data-act="dopen" data-k="' + esc(x.go) + '" title="' + where(x.go) + '"><span class="mono">' + esc(mdw(x.date)) + "</span><span>" + tagChip(x.tag) + " " + esc(x.title) + (x.done ? "（已完成）" : "") + (x.src ? '<small class="status">・' + esc(x.src) + "</small>" : "") + '</span><span class="chip' + (n <= 7 ? " warn" : "") + '">' + (n === 0 ? "今天" : "還有 " + n + " 天") + "</span></button>"; });
    if (past.length) {
      h += '<div class="ms"><span></span><span class="status">已經過去的 ' + past.length + " 項</span><span></span></div>";
      past.slice(-8).forEach(x => { h += '<button class="ms msgo past" data-act="dopen" data-k="' + esc(x.go) + '" title="' + where(x.go) + '"><span class="mono">' + esc(mdw(x.date)) + "</span><span>" + tagChip(x.tag) + " " + esc(x.title) + "</span><span></span></button>"; });
    }
    h += "</section>";
    h += '<section class="panel"><h3>每天固定與寫稿原則</h3><div class="refsec"><dl>'
      + (ref.habits || []).map(x => "<dt>" + esc(x.name) + "</dt><dd>" + esc(x.desc) + "</dd>").join("")
      + (ref.principles || []).map(x => "<dt>" + esc(x.k) + "</dt><dd>" + esc(x.v) + "</dd>").join("") + "</dl></div></section></div><div>";
    // 「待確認」已經都處理完，不再顯示（答案仍保留在工作台資料裡）
    h += '<section class="panel"><h3>2026/11～2027/12 路線圖</h3><div class="igsum" style="margin:0"><table class="t"><thead><tr><th>時間</th><th>主系列</th><th>產品檔期</th><th>重點</th></tr></thead><tbody>'
      + (ref.roadmap || []).map(r => "<tr><td>" + esc(r.time) + '</td><td style="white-space:normal">' + esc(r.main) + '</td><td style="white-space:normal">' + esc(r.product) + '</td><td style="white-space:normal">' + esc(r.focus) + "</td></tr>").join("")
      + "</tbody></table></div></section></div></div>";
    return h;
  }

  // ---------------- routing & render
  function route() {
    const inDt = document.documentElement.classList.contains("in-dt");
    let h = (location.hash || (inDt ? "#cal" : "#today")).slice(1);
    if (inDt && (h === "today" || h === "day-" + today())) {
      parent.postMessage({ dt: "nav", type: "today" }, location.origin);
      h = "cal"; history.replaceState(null, "", "#cal");
    }
    let v = "today";
    const md_ = /^day-(\d{4}-\d{2}-\d{2})$/.exec(h), mm = /^cal-(\d{4}-\d{2})$/.exec(h);
    if (md_) { v = "today"; ui.day = md_[1]; }
    else if (mm) { v = "cal"; ui.month = mm[1]; }
    else if (["today", "cal", "gantt", "ig", "study", "lists"].includes(h)) { v = h; if (h === "today") ui.day = null; }
    return v;
  }
  let curView = "today";
  function render() {
    document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.v === curView ? "page" : "false"));
    if (!S.loaded) return;
    const y = window.scrollY, gx = document.querySelector(".gwrap") ? document.querySelector(".gwrap").scrollLeft : null;
    const f = { today: viewToday, cal: viewCal, gantt: viewGantt, ig: viewIG, study: viewStudy, lists: viewLists }[curView];
    const act = document.activeElement && document.activeElement.id;
    $main.innerHTML = f();
    if (act && document.getElementById(act) && document.getElementById(act).tagName !== "TEXTAREA") document.getElementById(act).focus({ preventScroll: true });
    window.scrollTo(0, y);
    const g = document.querySelector(".gwrap");
    if (g) {
      if (gx != null) g.scrollLeft = gx;
      else { const now = g.querySelector("th.now"); if (now) g.scrollLeft = Math.max(0, now.offsetLeft - 360); }
    }
  }
  function go() { curView = route(); window.scrollTo(0, 0); render(); }
  window.addEventListener("hashchange", go);

  // ---------------- events
  $main.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act, id = b.dataset.id;
    if (a === "toggle") { toggleItem(id); return; }
    if (a === "btoggle") { const t = B.tasks[id]; if (t) bPatch(id, t.st === "done" ? { st: "todo", done: null } : { st: "done", done: today() }); return; }
    if (a === "habit") { toggleHabit(ui.day || today(), Number(b.dataset.i)); return; }
    if (b.tagName === "SELECT" || b.tagName === "INPUT" || b.tagName === "TEXTAREA") return;
    if (a === "det") { ui.det.has(id) ? ui.det.delete(id) : ui.det.add(id); render(); }
    else if (a === "pp") { ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id); render(); }
    else if (a === "move") moveItem(id, b.dataset.to);
    else if (a === "movepick") { const v = document.getElementById("dt-" + id).value; if (v) moveItem(id, v); }
    else if (a === "shiftfrom") { const it = itemById(id); if (it) { ui.open.delete(id); shiftTrack(lineOf(it), it.date, document.getElementById("sh-" + id).value); } }
    else if (a === "del") delItem(id);
    else if (a === "day") location.hash = "day-" + b.dataset.to;
    else if (a === "openday") {
      // 手機版點月曆格子：捲到下方清單的那一天；那天沒有事項（清單裡沒有）才打開當天頁面
      const ag = b.classList.contains("cell") && window.matchMedia("(max-width: 640px)").matches && document.getElementById("ag-" + b.dataset.to);
      if (ag) { ag.scrollIntoView({ block: "start" }); ag.classList.add("flash"); setTimeout(() => ag.classList.remove("flash"), 1400); }
      else location.hash = "day-" + b.dataset.to;
    }
    else if (a === "month") location.hash = "cal-" + b.dataset.to;
    else if (a === "add") { const day = ui.day || today(); addItem(day, document.getElementById("addtag").value, document.getElementById("addtitle").value); }
    else if (a === "gcat") { ui.gcat = b.dataset.k; ui.gedit = null; render(); }
    else if (a === "gedit") { const k = b.dataset.key; ui.gedit = ui.gedit === k ? null : k; render(); }
    else if (a === "gexam") { if (window.DTNav) window.DTNav("exams"); }
    else if (a === "sline") {
      if (e.target.closest(".shift")) return;   // 卡片裡挪動進度的欄位不算點卡片
      ui.sline = ui.sline === b.dataset.k ? null : b.dataset.k; render();
      if (ui.sline) { const el = document.getElementById("allprog"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
    }
    else if (a === "qgo") { const app = b.dataset.app || "nsysuApp"; if (window.parent !== window) parent.postMessage({ dt: "nav", type: app, sub: b.dataset.k }, location.origin); else window.open("../" + (app === "ipasApp" ? "ipas" : "nsysu") + "/index.html#" + b.dataset.k, "_blank"); }
    else if (a === "dopen") {
      const k = b.dataset.k || "";
      if (k.startsWith("day:")) location.hash = "day-" + k.slice(4);
      else if (window.parent !== window) parent.postMessage({ dt: "open", target: k }, location.origin);
    }
    else if (a === "gboard") { if (window.DTNav) window.DTNav(b.dataset.k); }
    else if (a === "gclose") { ui.gedit = null; render(); }
    else if (a === "gsave") {
      const s = document.getElementById("g-start").value, en = document.getElementById("g-end").value;
      if (!s || !en || en < s) { toast("結束日要在開始日之後"); return; }
      const hv = document.getElementById("g-hours").value, hours = hv === "" ? null : Number(hv);
      const [src, tid] = splitKey(b.dataset.key), stv = document.getElementById("g-status").value;
      if (src === "board") {
        const t = B.tasks[tid] || {}, p = { start: s, due: en, hours, owner: document.getElementById("g-owner").value.trim() };
        if (stv !== (t.st || "todo")) { p.st = stv; p.done = stv === "done" ? today() : null; }
        bPatch(tid, p);
      } else setTask(tid, { start: s, end: en, status: stv, hours });
      toast("已儲存");
    }
    else if (a === "gshift") {
      const [src, tid] = splitKey(b.dataset.key), n = Number(b.dataset.n);
      if (src === "board") { const t = B.tasks[tid]; if (t && isD(t.due)) { const st = isD(t.start) && t.start <= t.due ? t.start : t.due; bPatch(tid, { start: addDays(st, n), due: addDays(t.due, n) }); toast("整段延後 " + n + " 天"); } }
      else { const t = derive().tasks.find(x => x.id === tid); if (t) { setTask(tid, { start: addDays(t.start, n), end: addDays(t.end, n), moved: (t.moved || 0) + 1 }); toast("整段延後 " + n + " 天"); } }
    }
    else if (a === "igall") { ui.igShowAll = !ui.igShowAll; render(); }
    else if (a === "shifttrack") { const k = b.dataset.k, i = LINES.indexOf(k); shiftTrack(k, document.getElementById("sf-" + i).value || today(), document.getElementById("sn-" + i).value); }
  });
  $main.addEventListener("change", e => {
    const b = e.target; const a = b.dataset && b.dataset.act, id = b.dataset && b.dataset.id;
    if (b.id === "jump" && b.value) { location.hash = "day-" + b.value; return; }
    if (a === "poststatus") setPost(id, { status: b.value });
    else if (a === "postdate" && b.value) { const p = derive().posts.find(x => x.id === id); if (p && p.date !== b.value) { setPost(id, { date: b.value, moved: (p.moved || 0) + 1, orig: p.orig || p.date }); toast("發文移到 " + mdw(b.value)); } }
    else if (a === "postnum") setPost(id, { [b.dataset.k]: b.value === "" ? null : Number(b.value) });
  });
  const qTimers = {};
  $main.addEventListener("input", e => {
    const b = e.target;
    if (b.dataset && b.dataset.act === "qans") { const id = b.dataset.id; clearTimeout(qTimers[id]); qTimers[id] = setTimeout(() => setQ(id, { answer: b.value.trim() }), 700); }
  });
  $main.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "addtitle") document.querySelector('[data-act="add"]').click(); });

  // ---------------- boot
  curView = route();
  render();
  const status = document.getElementById("status");
  (async function () {
    if (!window.claude || !window.claude.use) { status.textContent = "沒有連上資料庫"; $main.innerHTML = '<p class="empty">請從每日任務平台開啟工作台。</p>'; return; }
    db = await window.claude.use("db");
    if (!db) { status.textContent = "還沒登入"; $main.innerHTML = '<p class="empty">在平台右上角用 Google 登入後，就能看到工作台的資料。</p>'; return; }
    col = db.collection("plan");
    boardBoot();
    const timer = setTimeout(() => { if (!S.loaded) status.textContent = "資料庫暫時連不上，稍後會自動重試"; }, 10000);
    col.onSnapshot(snap => {
      let touched = false;
      snap.docs.forEach(d => {
        if (!d.exists) return;
        S.exists[d.id] = true;
        if (pending[d.id] > 0) return;
        const body = d.data();
        if (JSON.stringify(body) === JSON.stringify(S.docs[d.id])) return;
        S.docs[d.id] = clone(body); touched = true;
      });
      if (!snap.metadata.fromCache) { S.server = true; clearTimeout(timer); status.textContent = "已同步・" + derive().items.length + " 個事項"; }
      if (!S.loaded && (snap.size || !snap.metadata.fromCache)) {
        S.loaded = true; touched = true;
        if (!snap.size) { $main.innerHTML = '<p class="empty">工作台還沒有資料。到平台的「擴充」頁按「匯入資料」，把工作台的資料匯進來。</p>'; return; }
      }
      if (touched) { rev++; const a = document.activeElement; if (!a || (a.tagName !== "TEXTAREA" && a.type !== "text" && a.type !== "number")) render(); else status.textContent = "有新資料，離開輸入框後更新"; }
      linkBoard();
    }, err => { clearTimeout(timer); status.textContent = "資料庫連線中斷：" + (err && err.code || ""); });
  })();
})();
</script>
