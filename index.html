<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>鍾雅婷每日任務</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 手帳式工作台。頂部日期抬頭＋黏住的分頁（今天｜各區域｜擴充），區域裡再用模組分頁切換。「今天」是兩欄：左邊任務流，右邊學習時段、單字、倒數。螢光筆黃只拿來標「今天」。 */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --sunk: #e9edf3; --ink: #1c2333; --muted: #5b6678; --line: #d8dee8;
  --accent: #2b3f7a; --accent-ink: #ffffff; --accent-soft: #e2e7f5;
  --mark: #f2c230; --mark-soft: #fcf0c4; --mark-ink: #5a4300;
  --ok: #23774f; --ok-soft: #dcf0e5; --warn: #9a5b00; --warn-soft: #fbecd2; --bad: #b42a3c; --bad-soft: #f8e0e4;
  --c1: #2f6fb0; --c2: #7d4cb8; --c3: #2a8259; --c4: #b9651c; --c5: #be3a5b; --c6: #4a5b72;
  --font-display: "LXGW WenKai TC", "Noto Sans TC", "Microsoft JhengHei", serif;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151c; --surface: #1a1f29; --sunk: #232a37; --ink: #e3e7ef; --muted: #98a2b4; --line: #2e3544;
  --accent: #9fb4f0; --accent-ink: #10162a; --accent-soft: #263055;
  --mark: #e8bb3a; --mark-soft: #3a3115; --mark-ink: #f6d77a;
  --ok: #6fcf9c; --ok-soft: #173427; --warn: #e8b25f; --warn-soft: #3a2c14; --bad: #f08a99; --bad-soft: #3d1d24;
  --c1: #7fb0e6; --c2: #b996ec; --c3: #74c99c; --c4: #e6a15f; --c5: #ef8ba3; --c6: #a3b1c6;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1f29; --sunk: #232a37; --ink: #e3e7ef; --muted: #98a2b4; --line: #2e3544;
  --accent: #9fb4f0; --accent-ink: #10162a; --accent-soft: #263055;
  --mark: #e8bb3a; --mark-soft: #3a3115; --mark-ink: #f6d77a;
  --ok: #6fcf9c; --ok-soft: #173427; --warn: #e8b25f; --warn-soft: #3a2c14; --bad: #f08a99; --bad-soft: #3d1d24;
  --c1: #7fb0e6; --c2: #b996ec; --c3: #74c99c; --c4: #e6a15f; --c5: #ef8ba3; --c6: #a3b1c6;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg) }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
h2, h3, h4 { text-wrap: balance }

/* header + nav */
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-block: 18px 6px }
.brand { display: flex; align-items: baseline; gap: 10px }
.brand-name { font: 700 1.55rem/1.2 var(--font-display); letter-spacing: .05em }
.brand-sub { color: var(--muted); font-size: .88rem; letter-spacing: .14em }
.status { font-size: .8rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line) }
.status[data-s="live"]::before { background: var(--ok) }
.status[data-s="warn"]::before { background: var(--warn) }
.status[data-s="off"]::before { background: var(--bad) }
.navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line) }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none }
.tabs a { position: relative; text-decoration: none; color: var(--muted); padding: 9px 14px 11px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px }
.tabs a:hover { color: var(--ink) }
.tabs a .sw { width: 8px; height: 8px; border-radius: 2px; background: var(--ac, var(--accent)) }
.tabs a[aria-current="page"] { color: var(--ink) }
.tabs a[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--ac, var(--accent)) }
.tabs .spacer { flex: 1 }
.subtabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 0 10px; scrollbar-width: none }
.subtabs a { text-decoration: none; color: var(--muted); padding: 3px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; font-size: .88rem }
.subtabs a:hover { color: var(--ink); border-color: var(--ac) }
.subtabs a[aria-current="page"] { background: var(--ac); border-color: var(--ac); color: var(--surface) }
main.view { padding-block: 20px 72px }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: .86rem; line-height: 1.35; text-decoration: none; color: var(--ink); white-space: nowrap }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted) }
.btn.ghost:hover { color: var(--ink); background: var(--sunk) }
.btn.danger { color: var(--bad); border-color: var(--bad); background: var(--surface) }
.btn.sm { padding: 2px 9px; font-size: .8rem }
.btn:disabled { opacity: .45; cursor: default }
input[type="text"], input[type="url"], input[type="date"], input[type="number"], input[type="search"], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 9px; font-size: .9rem; max-width: 100%; min-width: 0 }
textarea { width: 100%; resize: vertical; line-height: 1.65 }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); outline-offset: 0; border-color: var(--accent) }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none }
label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; color: var(--muted); flex-wrap: wrap }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: .82rem }
.grow { flex: 1 1 auto; min-width: 0 }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.empty { color: var(--muted); padding: 22px 16px; text-align: center; font-size: .9rem }
.empty b { color: var(--ink); display: block; font-weight: 500; margin-bottom: 2px }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .84rem }

/* panels & rows */
.stack { display: grid; gap: 14px; align-content: start; min-width: 0 }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0 }
.ph { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 11px 14px; border-bottom: 1px solid var(--line) }
.ph h3 { margin: 0; font-size: .98rem; font-weight: 700 }
.ph .sum { margin-left: auto; color: var(--muted); font-size: .8rem }
.ph.bad h3 { color: var(--bad) }
.pb { padding: 12px 14px }
h3.sec { margin: 0; font: 700 1.18rem/1.3 var(--font-display) }
.row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line) }
.rows > .row:first-child, .rows > .check:first-child { border-top: 0 }
.row > input[type="checkbox"] { margin-top: 3px }
.row-main { flex: 1 1 auto; min-width: 0; cursor: pointer }
.row-title { display: block; overflow-wrap: anywhere }
.row-note { display: block; color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.is-done .row-title { text-decoration: line-through; color: var(--muted) }
.row-meta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 3px }
.row-acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px; flex: none }
.row-edit { padding: 0 14px 12px 42px }
.ms-dot { width: 18px; text-align: center; color: var(--ac, var(--accent)); flex: none; font-weight: 700 }
.dgroup { padding: 9px 14px 3px; font-size: .78rem; color: var(--muted); font-weight: 500; letter-spacing: .04em; border-top: 1px solid var(--line) }
.rows > .dgroup:first-child { border-top: 0 }
.check { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-top: 1px solid var(--line) }
.check .grow { overflow-wrap: anywhere; cursor: pointer }
.check.is-done .grow { text-decoration: line-through; color: var(--muted) }
.addline { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: center }
.addline input[type="text"] { flex: 1 1 180px }
.fold { margin: 6px 10px 8px }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; line-height: 1.55; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis }
.chip.ctx { border-color: transparent; color: var(--ac, var(--accent)); background: color-mix(in srgb, var(--ac, var(--accent)) 13%, transparent) }
.chip.bad { color: var(--bad); border-color: transparent; background: var(--bad-soft) }
.chip.warn { color: var(--warn); border-color: transparent; background: var(--warn-soft) }
.chip.mark { color: var(--mark-ink); border-color: transparent; background: var(--mark-soft) }
.chip.ok { color: var(--ok); border-color: transparent; background: var(--ok-soft) }
.chip.doing { color: var(--accent); border-color: transparent; background: var(--accent-soft) }
.pill { font-size: .72rem; padding: 1px 8px; border-radius: 999px; white-space: nowrap; flex: none }
.st-plan { background: var(--sunk); color: var(--muted) }
.st-active { background: var(--accent-soft); color: var(--accent) }
.st-hold { background: var(--warn-soft); color: var(--warn) }
.st-done { background: var(--ok-soft); color: var(--ok) }
.meter { display: block; height: 7px; border-radius: 4px; background: var(--sunk); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--ac, var(--accent)); border-radius: 4px }
.meter.full i { background: var(--ok) }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--pc, var(--ac)); flex: none }

/* today */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 24px; align-items: end; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px dashed var(--line) }
.hero-date { font-family: var(--font-display); line-height: 1.1 }
.hero-date .d { font-size: 2.6rem; font-weight: 700; background: linear-gradient(transparent 60%, var(--mark-soft) 60%); padding: 0 4px }
.hero-date .w { font-size: 1.1rem; color: var(--muted); margin-left: 8px }
.hero-sum { color: var(--muted); font-size: .9rem; margin-top: 8px }
.hero-sum b { color: var(--ink); font-family: var(--font-mono); font-weight: 600 }
.countdowns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end }
.cd { display: grid; grid-template-columns: auto minmax(0, auto); align-items: center; gap: 0 8px; padding: 6px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); max-width: 260px }
.cd b { font: 600 1.4rem/1 var(--font-mono); grid-row: span 2 }
.cd span { font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cd small { color: var(--muted); font-size: .72rem }
.cd.soon b { color: var(--bad) }
.today-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 18px; align-items: start }
.qadd { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line) }
.qadd input[type="text"] { flex: 1 1 220px }
.qadd select { flex: 0 1 230px }
.vbig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px }
.vbig b { font: 600 2rem/1 var(--font-mono) }
.prow { display: grid; gap: 6px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 14px; color: var(--ink) }
.rows > .prow:first-child { border-top: 0 }
.prow:hover { background: var(--sunk) }
.pr-top { display: flex; align-items: center; gap: 8px }
.pr-next { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--muted); font-size: .8rem; overflow-wrap: anywhere }
.pr-top b { flex: 1 1 auto; min-width: 0; font-weight: 500; overflow-wrap: anywhere }

/* module header & links */
.mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 18px }
.mhead h2 { margin: 0; font: 700 1.65rem/1.2 var(--font-display) }
.type { font-size: .76rem; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; white-space: nowrap }
.mlinks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto }
.lk { display: inline-flex; align-items: center; gap: 4px; font-size: .84rem; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); max-width: 100% }
.lk:hover { border-color: var(--ac, var(--accent)) }
.lk::after { content: "↗"; color: var(--muted); font-size: .8em }
.ledit { display: grid; gap: 6px; padding: 12px 14px }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 6px; align-items: center }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px }
.lcard { display: grid; gap: 4px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0 }
.lcard:hover { border-color: var(--ac) }
.lcard b { font-weight: 500; overflow-wrap: anywhere }
.lcard span { color: var(--muted); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lcard.kid span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: .82rem; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.fields { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; align-items: center; font-size: .88rem }
.fields > span { color: var(--muted) }
.swatches { display: flex; gap: 6px; flex-wrap: wrap }
.swatches button { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--surface); background: var(--sc); box-shadow: 0 0 0 1px var(--line) }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink) }
.title-input { font: 700 1.4rem/1.3 var(--font-display) !important; border-color: transparent !important; background: transparent !important; padding: 2px 6px !important; flex: 1 1 200px }
.title-input:hover { border-color: var(--line) !important }

/* timeline */
.tl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 16px }
.tl { position: relative }
.tl-row { display: grid; grid-template-columns: 180px minmax(0, 1fr); border-top: 1px solid var(--line); min-height: 36px }
.tl-row.head { border-top: 0; min-height: 30px }
.tl-name { position: sticky; left: 0; z-index: 2; background: var(--surface); padding: 7px 12px; font-size: .84rem; border: 0; border-right: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; color: var(--ink) }
button.tl-name:hover { color: var(--accent) }
.tl-track { position: relative; overflow: hidden }
.tl-months { display: flex; height: 100% }
.tl-months span, .tl-grid span { flex: none; border-left: 1px solid var(--line) }
.tl-months span { font: .72rem var(--font-mono); color: var(--muted); padding: 7px 0 0 6px; white-space: nowrap; overflow: hidden }
.tl-grid { position: absolute; inset: 0; display: flex; pointer-events: none }
.tl-grid span { border-left-color: var(--sunk) }
.tl-bar { position: absolute; top: 10px; height: 16px; border-radius: 5px; background: var(--pc); min-width: 4px }
.tl-bar.done { opacity: .35 }
.tl-ms { position: absolute; top: 12px; width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg); background: var(--surface); border: 2px solid var(--ink); border-radius: 2px; z-index: 1 }
.tl-ms.done { background: var(--ink) }
.tl-today { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--mark); z-index: 1; pointer-events: none }

/* projects */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px }
.pcard { display: grid; gap: 8px; align-content: start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; color: var(--ink); min-width: 0 }
.pcard:hover { border-color: var(--pc) }
.pc-top { display: flex; align-items: center; gap: 8px }
.pc-top b { flex: 1 1 auto; min-width: 0; font-weight: 700; overflow-wrap: anywhere }
.pc-line { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--muted) }
.pc-line > span:first-child { min-width: 0; overflow-wrap: anywhere }
.pd { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 14px; align-items: start }

/* board */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start }
.col { background: var(--sunk); border-radius: 12px; padding: 8px; min-height: 140px; display: grid; gap: 8px; align-content: start; min-width: 0 }
.col.over { outline: 2px dashed var(--accent); outline-offset: -2px }
.col-h { display: flex; align-items: center; gap: 6px; padding: 3px 6px; font-weight: 700; font-size: .9rem }
.col-h .n { font: .78rem var(--font-mono); color: var(--muted); font-weight: 400 }
.colpick { display: none; margin-bottom: 10px }
.col-empty { margin: 0; padding: 14px 6px; text-align: center; color: var(--muted); font-size: .8rem }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: grid; gap: 6px; min-width: 0 }
.card[draggable="true"] { cursor: grab }
.card.dragging { opacity: .45 }
.card-t { font-size: .9rem; overflow-wrap: anywhere; text-align: left; background: none; border: 0; padding: 0; color: var(--ink); display: flex; gap: 6px; align-items: baseline }
.card-t:hover { color: var(--accent) }
.card-b { display: flex; flex-wrap: wrap; gap: 4px; align-items: center }
.card-b .mv { margin-left: auto; display: flex; gap: 2px }
.pri { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; transform: translateY(-1px) }
.cedit { display: grid; gap: 7px; padding-top: 8px; border-top: 1px dashed var(--line) }
.cedit .r2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px }

/* study plan */
.goals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start }
.goal-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line) }
.goal-h h3 { margin: 0; font: 700 1.14rem/1.35 var(--font-display) }
.goal-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; grid-column: 1 / -1 }
.goal-note { grid-column: 1 / -1; margin: 0; font-size: .84rem; color: var(--muted) }
.ring { --p: 0; width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--ac) calc(var(--p) * 1%), var(--sunk) 0); display: grid; place-items: center }
.ring span { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font: 600 .7rem var(--font-mono) }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) }
.wday { border-left: 1px solid var(--line); padding: 8px; min-width: 0; display: grid; gap: 6px; align-content: start; min-height: 110px }
.wday:first-child { border-left: 0 }
.wday.is-today { background: var(--mark-soft) }

.ngrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px }

/* vocab */

.flash .w { font: 700 2.4rem/1.2 var(--font-display); overflow-wrap: anywhere }
.flash .m { font-size: 1.15rem }
.flash .ex { color: var(--muted); font-size: .92rem; max-width: 52ch }

  .hero-date .d { font-size: 2.1rem }

  /* 手機：考試倒數排成一排三格，讓「今天」清單早一點出現 */
  .countdowns { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 6px }

  .cd small { display: none }
}

<script>
(function () {
  "use strict";

  /* ═════════ 基本工具 ═════════ */
  const main = document.getElementById("main");
  const tabsEl = document.getElementById("tabs");
  const subEl = document.getElementById("subtabs");
  const statusEl = document.getElementById("status");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const fmt = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = s => { const p = String(s).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
  const firstOfNext = s => { const d = parse(s); return fmt(new Date(d.getFullYear(), d.getMonth() + 1, 1)); };
  const dow = s => parse(s).getDay();
  const WD = "日一二三四五六";
  const today = () => fmt(new Date());
  const md = s => { const d = parse(s); return (d.getMonth() + 1) + "/" + d.getDate(); };
  const mdy = s => { const d = parse(s); return (d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + "/" : "") + md(s); };
  const mdw = s => mdy(s) + "（" + WD[dow(s)] + "）";
  const ymd = s => String(s).replace(/-/g, "/");
  const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const mondayOf = s => addDays(s, -((dow(s) + 6) % 7));
  const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const clone = o => JSON.parse(JSON.stringify(o == null ? {} : o));
  function merge(t, p) {
    for (const k in p) {
      const v = p[k];
      if (v && typeof v === "object" && !Array.isArray(v)) { if (!t[k] || typeof t[k] !== "object" || Array.isArray(t[k])) t[k] = {}; merge(t[k], v); }
      else t[k] = v;
    }
    return t;
  }
  const safeUrl = u => { u = String(u || "").trim(); return /^https?:\/\/[^\s"'<>]+$/i.test(u) ? u : ""; };
  const host = u => { try { return new URL(u).host.replace(/^www\./, ""); } catch (e) { return String(u || ""); } };
  const val = id => { const el = document.getElementById(id); return el ? String(el.value || "").trim() : ""; };
  const isChecked = id => { const el = document.getElementById(id); return !!(el && el.checked); };
  const cur = b => ' aria-current="' + (b ? "page" : "false") + '"';
  const prs = b => ' aria-pressed="' + (b ? "true" : "false") + '"';
  const sel = b => (b ? " selected" : "");
  const chk = b => (b ? " checked" : "");
  const byDue = (a, b) => { const x = a.due || "9999", y = b.due || "9999"; return x < y ? -1 : x > y ? 1 : (b.pri || 0) - (a.pri || 0) || String(a.t || "").localeCompare(String(b.t || ""), "zh-Hant"); };
  const byDate = (a, b) => ((a.date || "9999") < (b.date || "9999") ? -1 : (a.date || "9999") > (b.date || "9999") ? 1 : 0);
  const byDoneDesc = (a, b) => ((b.done || "") > (a.done || "") ? 1 : (b.done || "") < (a.done || "") ? -1 : 0);
  function toast(msg, undo) {
    document.querySelectorAll(".toast").forEach(t => t.remove());
    const t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status");
    const s = document.createElement("span"); s.textContent = msg; t.appendChild(s);
    if (undo) { const b = document.createElement("button"); b.type = "button"; b.textContent = "復原"; b.addEventListener("click", () => { undo(); t.remove(); render(true); }); t.appendChild(b); }
    document.body.appendChild(t);
    setTimeout(() => t.remove(), undo ? 6000 : 2600);
  }

  /* ═════════ 模組類型（要擴充新類型，就在這裡加一個） ═════════
     每個類型 = { label, desc, view(mod) }。view 回傳 HTML 字串，
     互動用 data-act 交給下面的 CLICK / CHANGE 處理。
     類型自己的設定與小清單放在 mods/{模組id}，大量資料各自一個集合。 */
  const TYPES = {
    projectPlan: { label: "專案計畫", desc: "每個專案的目標、範圍、里程碑，加上跨專案的時程總覽。", view: vProjectPlan },
    projectBoard: { label: "專案管理", desc: "看板：待辦、進行中、等待中、完成，可以拖拉或用箭頭移動。", view: vBoard },
    studyPlan: { label: "學習規劃", desc: "把學習目標拆成有期限的步驟，再排每週固定讀書時段。", view: vStudyPlan },
    notes: { label: "筆記", desc: "可以搜尋、依課程分類的筆記，支援簡單排版與螢光筆。", view: vNotes },
    exams: { label: "考試", desc: "考試倒數、準備清單，考完記下成績。", view: vExams },
    vocab: { label: "單字", desc: "每日單字目標、14 天紀錄、生字本與翻卡複習。", view: vVocab },
    tasks: { label: "任務清單", desc: "最簡單的待辦清單，適合生活雜事或任何新領域。", view: vTasks },
    links: { label: "連結集", desc: "常用網站與工具的入口。", view: vLinks },
    // 內建網站：程式碼放在 apps/，由 tools/build.py 從原本的 repo 複製進來（工作台直接在 apps/workbench 維護）
    workbenchApp: { label: "工作台", desc: "月曆、甘特圖、IG 發文、讀書進度與清單（原本的赫滋與羊工作台）。", src: "apps/workbench/index.html" },
    vocabApp: { label: "單字練習", desc: "閃卡、不熟清單、每天 10 個今日複習、考試和發音。", src: "apps/vocab/index.html" },
    nsysuApp: { label: "考古題練習", desc: "中山資管 94–115 學年度考古題：依年度、依章節、錯題本、英文術語。", src: "apps/nsysu/index.html" },
    // group：預設收進同一區的這種模組頁裡（不佔分頁），可在「擴充」改成獨立分頁
    osNotesApp: { label: "作業系統筆記", desc: "空大作業系統的白話筆記、考試重點、小測驗和互動示範。", src: "apps/os-notes/index.html", group: "notes" },
    genaiApp: { label: "生成式 AI 講義", desc: "一講一頁的課程講義、名詞對照和自我檢核。", src: "apps/genai/index.html", group: "notes" },
  };
  const DEFAULT_CFG = {
    areas: [{ id: "work", name: "工作", color: 1 }, { id: "learn", name: "學習", color: 2 }],
    mods: [
      { id: "proj-plan", area: "work", type: "projectPlan", name: "專案計畫" },
      { id: "proj-board", area: "work", type: "projectBoard", name: "專案管理" },
      { id: "workbench", area: "work", type: "workbenchApp", name: "工作台" },
      { id: "study-plan", area: "learn", type: "studyPlan", name: "規劃" },
      { id: "notes", area: "learn", type: "notes", name: "筆記" },
      { id: "os-notes", area: "learn", type: "osNotesApp", name: "作業系統" },
      { id: "genai", area: "learn", type: "genaiApp", name: "生成式 AI" },
      { id: "exams", area: "learn", type: "exams", name: "考試" },
      { id: "nsysu", area: "learn", type: "nsysuApp", name: "考古題" },
      { id: "vocab", area: "learn", type: "vocabApp", name: "單字" },
    ],
  };
  const TASK_ST = { todo: "待辦", doing: "進行中", wait: "等待中", done: "完成" };
  const ST_ORDER = ["todo", "doing", "wait", "done"];
  const PROJ_ST = { plan: "規劃中", active: "進行中", hold: "暫停", done: "完成" };
  const EXAM_KINDS = ["期中考", "期末考", "檢定", "入學考", "面試", "其他"];
  const INTERVALS = [0, 1, 2, 4, 7, 15, 30];

  /* ═════════ 狀態 ═════════ */
  const COLS = ["mods", "tasks", "projects", "goals", "notes", "exams", "words", "days"];
  const S = { cfg: null, mods: {}, tasks: {}, projects: {}, goals: {}, notes: {}, exams: {}, words: {}, days: {} };
  const ui = { proj: null, pstat: "all", pnew: false, tedit: null, bproj: {}, showDone: {}, showLater: {}, bcol: {}, gedit: null, gnew: false, gopen: {}, gmore: {}, rnew: false,
    note: null, nq: "", ncourse: "", nreview: false, exam: null, enew: false, wfilter: "all", wq: "", review: null, ledit: null, confirm: null,
    qaTo: null, exportText: null, openDone: {} };
  let db = null, canWrite = true, live = false, warnedNoDb = false, signedOut = false, wbDb = null;

  const cfg = () => (S.cfg && Array.isArray(S.cfg.areas) && Array.isArray(S.cfg.mods) ? S.cfg : DEFAULT_CFG);
  const areaOf = id => cfg().areas.find(a => a.id === id);
  const modById = id => cfg().mods.find(m => m.id === id);
  const modsOfArea = aid => cfg().mods.filter(m => m.area === aid && !m.hidden);
  // 收在別的模組頁裡的模組（例如課程講義收在「筆記」）：m.parent 有設就照設定，"" 代表獨立分頁
  function parentOf(m) {
    if (!m) return null;
    const ok = id => { const p = id && modById(id); return p && !p.hidden && p.area === m.area && p.id !== m.id ? p.id : null; };
    if (m.parent !== undefined) return ok(m.parent);
    const g = (TYPES[m.type] || {}).group;
    return g ? ok((cfg().mods.find(x => x.area === m.area && x.type === g && !x.hidden) || {}).id) : null;
  }
  const topModsOfArea = aid => modsOfArea(aid).filter(m => !parentOf(m));
  // 可以收進哪個模組頁（類型有 group 時才有）
  const nestTarget = m => { const g = (TYPES[m.type] || {}).group; return g ? (cfg().mods.find(x => x.area === m.area && x.type === g && !x.hidden && x.id !== m.id) || {}).id || null : null; };
  const acol = a => "var(--c" + ((a && a.color) || 6) + ")";
  const acolByArea = aid => acol(areaOf(aid));
  const pcol = p => "var(--c" + ((p && p.c) || 1) + ")";
  const modDoc = mid => S.mods[mid] || {};
  const modLinks = mid => (Array.isArray(modDoc(mid).links) ? modDoc(mid).links : []);
  const modOfType = (area, type) => (cfg().mods.find(m => m.area === area && m.type === type) || {}).id;
  const arr = col => Object.keys(S[col] || {}).map(id => Object.assign({ id }, S[col][id]));
  const dayLog = d => { const m = S.days[d.slice(0, 7)]; return (m && m.d && m.d[d]) || {}; };

  /* ═════════ 寫入：本機先更新，再排隊存進資料庫（同一份文件一次只寫一筆） ═════════ */
  const chains = {}, known = new Set(), firstSeen = new Set(), confirmed = new Set();
  function queue(path, fn) {
    chains[path] = (chains[path] || Promise.resolve()).then(fn).catch(err => {
      const code = err && err.code;

  /* ═════════ 工作台資料（今天頁直接讀，不再另外列一份） ═════════ */
  let wbMemo = null;

  const wbSetDone = (it, done) => wbWrite(it.bucket, { items: { [it.id]: { done, doneAt: done ? today() : null } } });

  // 同一天、名稱相近的工作台事項和平台任務／里程碑＝同一件事：只顯示平台那一列，勾一次兩邊都完成
  function normT(s) {
    s = String(s || "").toLowerCase();
    const t = s.replace(/[（(][^）)]*[）)]/g, "");
    return (t.trim() ? t : s).replace(/[^0-9a-z㐀-鿿]/g, "");
  }
  function similarT(a, b) {
    const x = normT(a), y = normT(b);
    if (x.length < 2 || y.length < 2) return false;
    if (x.includes(y) || y.includes(x)) return true;
    const bg = s => { const o = {}; for (let i = 0; i < s.length - 1; i++) { const k = s.slice(i, i + 2); o[k] = (o[k] || 0) + 1; } return o; };

    Object.keys(A).forEach(k => { if (B[k]) n += Math.min(A[k], B[k]); });

  let twinMemo = { k: null, m: {} };

  // 某一天要做的所有事：平台任務、里程碑、考試、工作台事項、固定時段、每天固定、IG 發文

  function postRow(p, wbMod, late) {
    return '<div class="row' + (p.status === "已發布" ? " is-done" : "") + '"><span class="ms-dot" aria-hidden="true">IG</span><a class="row-main" href="#m-' + esc(wbMod) + "/ig" + '" style="text-decoration:none;color:inherit"><span class="row-title">' + esc(p.title || "IG 發文") + '</span><span class="row-meta"><span class="chip' + (p.status === "已發布" ? " ok" : "") + '">' + esc(p.status || "未開始") + "</span>"
      + (p.time || p.fmt ? '<span class="chip">' + esc([p.time, p.fmt].filter(Boolean).join(" ")) + "</span>" : "") + (late ? '<span class="chip bad">過了發文日・' + mdw(p.date) + "</span>" : "") + "</span></a></div>";
  }

  /* ═════════ 今天 ═════════ */
  function vToday() {
    const t0 = today(), W = wbData(), wbMod = wbModId();
    const tasks = arr("tasks"), P = dayPlan(t0), tl = P.links;
    // 逾期：平台任務＋工作台的截止與讀書進度＋過了發文日的 IG（工作台那邊勾掉的就不算）
    const overdue = tasks.filter(t => t.st !== "done" && isDate(t.due) && t.due < t0).map(effTask).filter(t => t.st !== "done").sort(byDue);
    const wbLate = W ? W.items.filter(it => it.date < t0 && !it.done && (it.tag === "交" || it.tag === "讀") && !twinsOn(it.date).has(it.id)).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)) : [];
    const postLate = W ? W.posts.filter(p => p.date < t0 && p.status !== "已發布" && p.status !== "取消") : [];
    const lateN = overdue.length + wbLate.length + postLate.length;
    // 接下來 7 天：只列有日期的承諾（考試、里程碑、截止、課程、任務、發文）；讀書進度太細，留在工作台
    const exams = upcomingExams();
    let up = "", upCount = 0;
    for (let i = 1; i <= 7; i++) {
      const dd = addDays(t0, i), tw = twinsOn(dd);
      const ex = exams.filter(e => e.date === dd);
      const msd = milestones().filter(m => m.date === dd).map(effMs).filter(m => !m.done);
      const td = tasks.filter(t => t.due === dd && t.st !== "done" && t.st !== "doing").map(effTask).filter(t => t.st !== "done").sort(byDue);
      const wd = W ? (W.byDate[dd] || []).filter(it => it.tag !== "讀" && !it.done && !tw.has(it.id)) : [];
      const pd = W ? W.posts.filter(p => p.date === dd && p.status !== "已發布" && p.status !== "取消") : [];
      const n = ex.length + msd.length + td.length + wd.length + pd.length;
      if (!n) continue;
      upCount += n;
      up += '<div class="dgroup">' + mdw(dd) + (i === 1 ? "・明天" : "") + "</div>" + ex.map(examRow).join("")
        + wd.filter(it => it.tag === "課").map(it => wbRow(it, { k: "-u", tag: true })).join("") + msd.map(msRow).join("")
        + wd.filter(it => it.tag !== "課").map(it => wbRow(it, { k: "-u", tag: true })).join("")
        + td.map(t => taskRow(t, { k: "-u", noDue: true })).join("") + pd.map(p => postRow(p, wbMod)).join("");
    }
    const doing = tasks.filter(t => t.st === "doing" && !(isDate(t.due) && t.due <= t0)).sort(byDue);

    const d = parse(t0), M = P.meta || {};
    const badges = [M.ph, M.pp ? "休養期・讀書減半" : "", M.rest ? "複習日" : "", M.nou ? "空大 " + M.nou + " 小時" : ""].filter(Boolean);
    let h = '<section class="hero"><div><div class="hero-date"><span class="d">' + (d.getMonth() + 1) + "月" + d.getDate() + '日</span><span class="w">星期' + WD[d.getDay()] + "</span></div>"
      + '<div class="hero-sum">今天還有 <b>' + (P.total - P.done) + "</b> 件" + (lateN ? "・逾期 <b>" + lateN + "</b> 件" : "") + "・接下來 7 天 <b>" + upCount + "</b> 件</div>"
      + (badges.length ? '<div class="btnrow" style="margin-top:8px">' + badges.map(b => '<span class="chip">' + esc(b) + "</span>").join("") + "</div>" : "")
      + (M.notes && M.notes.length ? M.notes.map(n => '<p class="muted small" style="margin:6px 0 0">' + esc(n) + "</p>").join("") : "") + "</div>"
      + '<div class="countdowns">' + exams.slice(0, 3).map(e => {
        const n = Math.max(0, diff(t0, e.date));
        return '<a class="cd' + (n <= 14 ? " soon" : "") + '" href="#m-' + esc(e.mod) + '"><b>' + n + "</b><span>" + esc(e.name) + "</span><small>" + (n === 0 ? "就是今天" : "天後・" + mdw(e.date)) + "</small></a>";
      }).join("") + "</div></section>";

    h += '<div class="today-grid"><div class="stack">';
    if (lateN) {
      const LIM = 8, wl = wbLate.slice(-LIM);
      h += '<section class="panel"><div class="ph bad"><h3>逾期還沒完成</h3><span class="sum">勾掉，或改到今天、明天</span></div><div class="rows">'
        + overdue.map(t => taskRow(t, { k: "-o", acts: '<button class="btn sm" data-act="tmove" data-id="' + esc(t.id) + '" data-to="' + t0 + '">移到今天</button><button class="btn ghost sm" data-act="tmove" data-id="' + esc(t.id) + '" data-to="' + addDays(t0, 1) + '">明天</button>' })).join("")
        + wl.map(it => wbRow(it, { k: "-o", late: true, tag: true, acts: wbMoveBtns(it, t0) })).join("")
        + (wbLate.length > LIM ? '<div class="empty small">還有 ' + (wbLate.length - LIM) + ' 項更早的工作台進度沒勾，<a href="#m-' + esc(wbMod) + '/study">到工作台把整條讀書線往後挪</a></div>' : "")
        + postLate.map(p => postRow(p, wbMod, true)).join("")
        + "</div></section>";
    }
    const grp = (title, rows) => (rows ? '<div class="dgroup">' + title + "</div>" + rows : "");
    const mv = it => (it.done ? "" : wbMoveBtns(it, t0));
    const trackOrder = it => { const i = ["碩班", "多益", "iPAS"].indexOf(it.track); return i < 0 ? 9 : i; };
    const body = grp("行程", P.exams.map(examRow).join("") + P.wb.filter(it => it.tag === "課").map(it => wbRow(it, { link: tl[it.id] })).join("") + P.routines.filter(r => r.time).map(r => routineRow(r, t0)).join(""))
      + grp("要交・里程碑", P.wb.filter(it => it.tag !== "課" && it.tag !== "讀").map(it => wbRow(it, { link: tl[it.id], acts: mv(it) })).join("") + P.ms.map(msRow).join("")
        + P.tasks.slice().sort((a, b) => (a.st === "done") - (b.st === "done") || (b.pri || 0) - (a.pri || 0)).map(t => taskRow(t, { noDue: true })).join("") + P.posts.map(p => postRow(p, wbMod)).join(""))
      + grp("讀書", P.wb.filter(it => it.tag === "讀").sort((a, b) => trackOrder(a) - trackOrder(b)).map(it => wbRow(it, { link: tl[it.id], acts: mv(it) })).join("") + P.routines.filter(r => !r.time).map(r => routineRow(r, t0)).join(""))
      + grp("每天固定", P.habits.map(x => habitRow(x, t0)).join(""));
    h += '<section class="panel"><div class="ph"><h3>今天</h3><span class="sum">完成 ' + P.done + " / " + P.total + (wbMod ? '・<a href="#m-' + esc(wbMod) + "/day-" + t0 + '">在工作台看這天</a>' : "") + "</span></div>"
      + '<div class="rows">' + (body || '<div class="empty"><b>今天沒有排事情</b>在下面新增一件，或到各模組排日期。</div>') + "</div>" + quickAdd() + "</section>";
    if (doing.length) h += '<section class="panel"><div class="ph"><h3>進行中</h3><span class="sum">' + doing.length + " 件，還沒到期</span></div><div class=\"rows\">" + doing.map(t => taskRow(t, { k: "-g", noSt: true })).join("") + "</div></section>";
    h += '<section class="panel"><div class="ph"><h3>接下來 7 天</h3><span class="sum">' + upCount + ' 件</span></div><div class="rows">' + (up || '<div class="empty">這週後面還沒有排到期的事。</div>') + "</div></section>";
    h += '</div><div class="stack">' + sideProjects() + sideApps() + sideVocab() + sideLinks() + "</div></div>";
    return (signedOut ? '<div class="signin"><p>用 Google 登入後，任務、專案和工作台會存到你的帳號，手機和電腦會同步。</p><button class="btn primary" data-act="signin">用 Google 登入</button></div>' : "") + h;
  }
  /* 今天頁：直接讀內建網站的進度（同一個網域，資料在這台裝置的瀏覽器裡） */
  const readLS = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  function vocabProgress() {
    const s = readLS("vocab-trainer-v2"); if (!s || !s.banks) return null;
    const P = s.banks[s.cur] || {}, log = P.dailyLog || {}, t0 = today();
    const d = P.daily && P.daily.date === t0 ? P.daily : null;
    let n = 0, x = log[t0] ? t0 : addDays(t0, -1);
    while (log[x] && n < 999) { n++; x = addDays(x, -1); }
    return { started: !!d, total: d ? d.ids.length : 0, done: d ? d.done.filter(id => d.ids.includes(id)).length : 0, complete: !!log[t0], streak: n, stars: Object.keys(P.star || {}).length };
  }
  function nsysuProgress() {
    const s = readLS("nsysu-pq-v1"); if (!s) return null;
    const c = { ok: 0, bad: 0, idk: 0 };
    Object.keys(s).forEach(pid => Object.values((s[pid] && s[pid].q) || {}).forEach(q => { if (q && c[q.s] != null) c[q.s]++; }));
    return c;
  }
  // 單字、考古題：只在有東西要做（或有紀錄可看）時出現；沒紀錄就不佔位置
  function sideApps() {
    let h = "";
    const vm = cfg().mods.find(x => x.type === "vocabApp" && !x.hidden), v = vm ? vocabProgress() : null;
    if (vm && v && ((v.started && v.total) || v.stars)) {
      const pct = v.total ? Math.round(v.done / v.total * 100) : 0, going = v.started && v.total;
      h += '<section class="panel" style="--ac:' + acolByArea(vm.area) + '"><div class="ph"><h3>單字・今日複習</h3><span class="sum">' + (v.streak ? "連續 " + v.streak + " 天" : "") + '</span></div><div class="pb stack" style="gap:10px">'
        + (going ? '<div class="vbig"><b>' + v.done + '</b><span class="muted">/ ' + v.total + " 個</span>" + (v.complete ? '<span class="chip ok">今天完成</span>' : "") + '</div><span class="meter' + (v.complete ? " full" : "") + '"><i style="width:' + pct + '%"></i></span>'
          : '<p class="muted small" style="margin:0">不熟清單 ' + v.stars + " 個，今天還沒開始複習。</p>")
        + (v.complete ? "" : '<div><a class="btn" href="#m-' + esc(vm.id) + '">' + (going ? "繼續複習" : "開始複習") + "</a></div>") + "</div></section>";
    }
    const em = cfg().mods.find(x => x.type === "nsysuApp" && !x.hidden), q = em ? nsysuProgress() : null;
    if (em && q && q.ok + q.bad + q.idk) {
      h += '<section class="panel" style="--ac:' + acolByArea(em.area) + '"><div class="ph"><h3>考古題</h3><span class="sum"><a href="#m-' + esc(em.id) + '">練習</a></span></div><div class="pb">'
        + '<div class="btnrow"><span class="chip ok">會 ' + q.ok + '</span><span class="chip bad">錯 ' + q.bad + '</span><span class="chip warn">不會 ' + q.idk + "</span></div></div></section>";
    }
    return h;
  }
  function addTargets() {
    let h = "";
    cfg().areas.forEach(a => {
      let g = "";
      modsOfArea(a.id).forEach(m => {
        if (m.type === "projectBoard") {
          g += '<option value="m:' + esc(m.id) + '"' + sel(ui.qaTo === "m:" + m.id) + ">" + esc(m.name) + "（不分專案）</option>";
          arr("projects").filter(p => p.area === a.id && p.st !== "done").sort((x, y) => String(x.name).localeCompare(String(y.name), "zh-Hant"))
            .forEach(p => { g += '<option value="p:' + esc(p.id) + '"' + sel(ui.qaTo === "p:" + p.id) + ">專案・" + esc(p.name) + "</option>"; });
        } else if (m.type === "studyPlan") {
          arr("goals").filter(x => x.mod === m.id).forEach(x => { g += '<option value="g:' + esc(x.id) + '"' + sel(ui.qaTo === "g:" + x.id) + ">目標・" + esc(x.name) + "</option>"; });
        } else if (m.type === "tasks") g += '<option value="m:' + esc(m.id) + '"' + sel(ui.qaTo === "m:" + m.id) + ">" + esc(m.name) + "</option>";
      });
      if (g) h += '<optgroup label="' + esc(a.name) + '">' + g + "</optgroup>";
    });
    return h;
  }
  function quickAdd() {
    const opts = addTargets();
    if (!opts) return '<div class="qadd muted small">到「擴充」加一個任務清單或專案管理模組，就能在這裡快速新增。</div>';
    return '<div class="qadd" data-form><input type="text" id="qa-t" placeholder="新增一件事…" data-enter="qadd" aria-label="任務名稱"><select id="qa-to" aria-label="放到哪裡">' + opts + '</select><input type="date" id="qa-d" value="' + today() + '" aria-label="期限"><button class="btn primary" data-act="qadd">加入</button></div>';
  }
  const vTarget = mid => Number(modDoc(mid).target) || 50;
  const vCount = (mid, d) => Number((dayLog(d).vc || {})[mid]) || 0;
  const dueWords = mid => { const t0 = today(); return arr("words").filter(w => w.mod === mid && (!w.due || w.due <= t0)); };
  function streak(mid) {
    const tgt = vTarget(mid); let d = today(), n = 0;
    if (vCount(mid, d) < tgt) d = addDays(d, -1);
    while (n < 999 && vCount(mid, d) >= tgt) { n++; d = addDays(d, -1); }
    return n;
  }
  function vAddBtns(mid) {
    return [10, 25, 50].map(k => '<button class="btn sm" data-act="vadd" data-mod="' + esc(mid) + '" data-n="' + k + '">+' + k + "</button>").join("");
  }
  function sideVocab() {
    return cfg().mods.filter(m => m.type === "vocab" && !m.hidden).map(m => {
      const tgt = vTarget(m.id), n = vCount(m.id, today()), due = dueWords(m.id).length, pct = Math.min(100, Math.round(n / tgt * 100)), sk = streak(m.id);
      return '<section class="panel" style="--ac:' + acolByArea(m.area) + '"><div class="ph"><h3>' + esc(m.name) + '</h3><span class="sum"><a href="#m-' + esc(m.id) + '">打開</a></span></div><div class="pb stack" style="gap:10px">'
        + '<div class="vbig"><b>' + n + '</b><span class="muted">/ ' + tgt + " 個</span>" + (sk ? '<span class="chip ok">連續達標 ' + sk + " 天</span>" : "") + "</div>"
        + '<span class="meter' + (n >= tgt ? " full" : "") + '"><i style="width:' + pct + '%"></i></span>'
        + '<div class="btnrow">' + vAddBtns(m.id) + modLinks(m.id).map(l => linkChip(l)).join("") + "</div>"
        + (due ? '<div><button class="btn" data-act="vreview" data-mod="' + esc(m.id) + '">複習生字本 ' + due + " 個</button></div>" : "")
        + "</div></section>";
    }).join("");
  }
  // 進行中的專案：專案經理每天要看的是「下一個里程碑」和「有沒有逾期」
  function sideProjects() {
    const ps = arr("projects").filter(p => p.st === "active").sort((a, b) => ((a.end || "9") < (b.end || "9") ? -1 : 1));
    if (!ps.length) return "";
    const tasks = arr("tasks"), t0 = today();
    return '<section class="panel"><div class="ph"><h3>進行中的專案</h3><span class="sum">' + ps.length + ' 個</span></div><div class="rows">' + ps.slice(0, 6).map(p => {
      const ts = tasks.filter(t => t.proj === p.id).map(effTask), dn = ts.filter(t => t.st === "done").length, pct = ts.length ? Math.round(dn / ts.length * 100) : 0;
      const late = ts.filter(t => t.st !== "done" && isDate(t.due) && t.due < t0).length;
      const next = (p.ms || []).map(x => effMs(Object.assign({ pid: p.id }, x))).filter(x => !x.done && isDate(x.date)).sort(byDate)[0];
      return '<button class="prow" data-act="popen" data-id="' + esc(p.id) + '" style="--pc:' + pcol(p) + ";--ac:" + pcol(p) + '"><span class="pr-top"><span class="dot"></span><b>' + esc(p.name) + '</b><span class="muted mono small">' + dn + "/" + ts.length + '</span></span><span class="meter"><i style="width:' + pct + '%"></i></span>'
        + (next || late ? '<span class="pr-next">' + (next ? "◆ " + esc(next.t) + "・" + mdw(next.date) : "") + (late ? '<span class="chip bad">逾期 ' + late + "</span>" : "") + "</span>" : "") + "</button>";
    }).join("") + "</div></section>";
  }
  function sideLinks() {
    const seen = new Set(), out = [];
    cfg().mods.filter(m => !m.hidden).forEach(m => modLinks(m.id).forEach(l => { const u = safeUrl(l.url); if (u && !seen.has(u)) { seen.add(u); out.push({ l, ac: acolByArea(m.area) }); } }));
    if (!out.length) return "";
    return '<section class="panel"><div class="ph"><h3>快速入口</h3></div><div class="pb btnrow">' + out.slice(0, 12).map(x => linkChip(x.l, x.ac)).join("") + "</div></section>";
  }

  /* ═════════ 模組頁共用：標題與相關網站 ═════════ */
  // 模組頁標題：上方分頁已經標出現在在哪一頁，就不再重複寫一次名稱；相關網站只在有設定時出現（在「擴充」管理）
  function modHead(m) {
    const links = modLinks(m.id), isLinks = m.type === "links", solo = topModsOfArea(m.area).length < 2;
    const chips = isLinks ? "" : links.map(l => linkChip(l)).join("");
    const btn = isLinks ? '<button class="btn ghost sm" data-act="ledit" data-mod="' + esc(m.id) + '" aria-expanded="' + (ui.ledit === m.id) + '">管理連結</button>' : "";
    let h = solo || chips || btn ? '<div class="mhead">' + (solo ? "<h2>" + esc(m.name) + "</h2>" : "") + (chips || btn ? '<div class="mlinks">' + chips + btn + "</div>" : "") + "</div>" : "";
    if (ui.ledit === m.id) h += linkEditor(m);
    return h;
  }
  function linkEditor(m) {
    const links = modLinks(m.id);
    return '<section class="panel" style="margin:8px 0 18px"><div class="ph"><h3>' + (m.type === "links" ? "連結" : "「" + esc(m.name) + "」的相關網站") + '</h3><span class="sum">改完按 Enter 或點別處就會儲存</span></div><div class="ledit">'
      + links.map((l, i) => '<div class="lrow"><input type="text" id="lt-' + i + '" value="' + esc(l.t) + '" data-act="lfield" data-mod="' + esc(m.id) + '" data-i="' + i + '" data-k="t" aria-label="名稱"><input type="url" id="lu-' + i + '" value="' + esc(l.url) + '" data-act="lfield" data-mod="' + esc(m.id) + '" data-i="' + i + '" data-k="url" aria-label="網址"><button class="btn ghost sm" data-act="ldel" data-mod="' + esc(m.id) + '" data-i="' + i + '">移除</button></div>').join("")
      + '<div class="lrow" data-form><input type="text" id="ln-t" placeholder="名稱" data-enter="ladd" aria-label="新連結名稱"><input type="url" id="ln-u" placeholder="https://…" data-enter="ladd" aria-label="新連結網址"><button class="btn primary sm" data-act="ladd" data-mod="' + esc(m.id) + '">加入</button></div>'
      + '<div><button class="btn sm" data-act="ledit" data-mod="' + esc(m.id) + '">完成</button></div></div></section>';
  }

  /* ═════════ 時程條（專案總覽、專案任務共用） ═════════ */
  function timeline(rows, label) {
    rows = rows.filter(r => isDate(r.start) && isDate(r.end));
    if (!rows.length) return "";
    const t0 = today();
    let a = t0, b = t0;
    rows.forEach(r => { if (r.start < a) a = r.start; if (r.end > b) b = r.end; (r.ms || []).forEach(x => { if (x.date < a) a = x.date; if (x.date > b) b = x.date; }); });
    const A = a.slice(0, 7) + "-01", B = firstOfNext(b), total = diff(A, B);
    const months = []; for (let x = A; x < B; x = firstOfNext(x)) months.push(x);
    const pos = s => (diff(A, s) / total) * 100;
    const widths = months.map(x => (diff(x, firstOfNext(x)) / total) * 100);
    const minW = Math.max(680, 180 + months.length * 64);
    const grid = '<div class="tl-grid">' + widths.map(w => '<span style="width:' + w + '%"></span>').join("") + "</div>";
    const tx = pos(t0) + 50 / total;
    let h = '<div class="tl-wrap" data-keepx="tl" data-todayx="' + Math.round(180 + (minW - 180) * tx / 100) + '"><div class="tl" style="min-width:' + minW + 'px">'
      + '<div class="tl-row head"><div class="tl-name muted">' + esc(label) + '</div><div class="tl-track"><div class="tl-months">'
      + months.map((x, i) => { const d = parse(x); return '<span style="width:' + widths[i] + '%">' + (d.getMonth() === 0 || i === 0 ? d.getFullYear() + "/" : "") + (d.getMonth() + 1) + "月</span>"; }).join("")
      + '</div><div class="tl-today" style="left:' + tx + '%"></div></div></div>';
    rows.forEach(r => {
      const l = pos(r.start), w = Math.max(0.5, pos(addDays(r.end, 1)) - l);

  /* ═════════ 筆記 ═════════ */
  function mdInline(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/==([^=]+)==/g, "<mark>$1</mark>")
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function mdRender(src) {
    let out = "", list = null, para = [];
    const flushP = () => { if (para.length) { out += "<p>" + para.map(mdInline).join("<br>") + "</p>"; para = []; } };
    const flushL = () => { if (list) { out += "<" + list.t + ">" + list.items.map(x => "<li>" + mdInline(x) + "</li>").join("") + "</" + list.t + ">"; list = null; } };
    String(src || "").split(/\r?\n/).forEach(line => {
      let mm;
      if (/^\s*$/.test(line)) { flushP(); flushL(); return; }
      if ((mm = /^(#{1,3})\s+(.*)$/.exec(line))) { flushP(); flushL(); out += "<h" + mm[1].length + ">" + mdInline(mm[2]) + "</h" + mm[1].length + ">"; return; }
      if ((mm = /^\s*[-*]\s+(.*)$/.exec(line))) { flushP(); if (!list || list.t !== "ul") { flushL(); list = { t: "ul", items: [] }; } list.items.push(mm[1]); return; }
      if ((mm = /^\s*\d+[.)]\s+(.*)$/.exec(line))) { flushP(); if (!list || list.t !== "ol") { flushL(); list = { t: "ol", items: [] }; } list.items.push(mm[1]); return; }
      if ((mm = /^>\s?(.*)$/.exec(line))) { flushP(); flushL(); out += "<blockquote>" + mdInline(mm[1]) + "</blockquote>"; return; }
      flushL(); para.push(line);
    });
    flushP(); flushL();
    return out || '<p class="muted">（還沒有內容）</p>';
  }
  const snippet = s => String(s || "").replace(/[#>*`=_-]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 140);

  }
  function reviewView(m) {

      + '<div class="w">' + esc(w.w) + "</div>"

        + '<div class="btnrow"><button class="btn" data-act="vans" data-ok="0">不熟 <kbd>1</kbd></button><button class="btn primary" data-act="vans" data-ok="1">記得 <kbd>2</kbd></button></div>'

  /* ═════════ 任務清單、連結集（通用類型） ═════════ */

    return h + "</div></div>";

  /* ═════════ 路由與畫面 ═════════ */
  function route() {
    const h = decodeURIComponent((location.hash || "").slice(1));
    let mm;
    if (h === "manage") return { v: "manage" };
    if ((mm = /^type-([A-Za-z]+)$/.exec(h))) { const m = cfg().mods.find(x => x.type === mm[1]); if (m) return { v: "mod", id: m.id }; }
    if ((mm = /^m-([A-Za-z0-9-]+)(?:\/(.+))?$/.exec(h))) return { v: "mod", id: mm[1], sub: mm[2] || "" };
    if ((mm = /^a-([A-Za-z0-9-]+)$/.exec(h))) return { v: "area", id: mm[1] };
    return { v: "today" };
  }
  function renderNav(r) {
    const c = cfg();
    const curArea = r.v === "mod" ? (modById(r.id) || {}).area : r.v === "area" ? r.id : null;
    let h = '<a href="#today"' + cur(r.v === "today") + ">今天</a>";
    c.areas.forEach(a => { const first = topModsOfArea(a.id)[0]; h += '<a href="#' + (first ? "m-" + esc(first.id) : "a-" + esc(a.id)) + '" style="--ac:' + acol(a) + '"' + cur(curArea === a.id) + '><span class="sw"></span>' + esc(a.name) + "</a>"; });
    h += '<span class="spacer"></span><a href="#manage"' + cur(r.v === "manage") + ">擴充</a>";
    tabsEl.innerHTML = h;
    const ms = curArea ? topModsOfArea(curArea) : [], open = r.v === "mod" ? modById(r.id) : null, top = open ? parentOf(open) || open.id : null;
    subEl.hidden = ms.length < 2;
    subEl.style.setProperty("--ac", acolByArea(curArea));
    subEl.innerHTML = ms.map(m => '<a href="#m-' + esc(m.id) + '"' + cur(top === m.id) + ">" + esc(m.name) + "</a>").join("");
  }
  function view(r) {
    if (r.v === "manage") return vManage();
    if (r.v === "mod") {
      const m = modById(r.id);
      if (!m) return '<div class="empty"><b>找不到這個模組</b>它可能被刪除了。回到 <a href="#today">今天</a>。</div>';
      const T = TYPES[m.type];
      return '<div style="--ac:' + acolByArea(m.area) + '">' + modHead(m) + (T ? T.view(m) : '<div class="empty"><b>這個模組類型（' + esc(m.type) + "）目前不支援</b>請 Claude 在 TYPES 裡補上它。</div>") + "</div>";
    }
    if (r.v === "area") { const a = areaOf(r.id); return a ? '<div class="empty"><b>「' + esc(a.name) + '」還沒有模組</b>到 <a href="#manage">擴充</a> 幫這個區域加一個模組。</div>' : vToday(); }
    return vToday();
  }

  let pending = false, pointerDown = false, dragId = null;
  function busy() {
    if (pointerDown || dragId) return true;
    const ae = document.activeElement;
    return !!(ae && main.contains(ae) && (ae.tagName === "TEXTAREA" || ae.tagName === "SELECT" || (ae.tagName === "INPUT" && /^(text|url|search|number|date)$/.test(ae.type))));
  }
  function render(force) {
    if (!force && busy()) { pending = true; return; }
    pending = false;
    const r = route();
    renderNav(r);
    const am = r.v === "mod" ? modById(r.id) : null;
    if (showApp(am && TYPES[am.type] && TYPES[am.type].src ? am : null, r.sub)) return;
    const ae = document.activeElement, aid = ae && main.contains(ae) ? ae.id : null;
    let range = null;
    try { if (aid && typeof ae.selectionStart === "number") range = [ae.selectionStart, ae.selectionEnd]; } catch (e) { range = null; }
    const y = window.scrollY, xs = {};
    main.querySelectorAll("[data-keepx]").forEach(el => { xs[el.dataset.keepx] = el.scrollLeft; });
    let html;
    try { html = view(r); } catch (e) { console.error(e); html = '<div class="empty"><b>這一頁顯示時出了問題</b>' + esc(e && e.message) + "</div>"; }
    main.innerHTML = html;
    main.querySelectorAll("[data-keepx]").forEach(el => {
      const k = el.dataset.keepx;
      el.scrollLeft = k in xs ? xs[k] : Math.max(0, (Number(el.dataset.todayx) || 0) - 220);
    });
    if (aid) { const el = document.getElementById(aid); if (el && main.contains(el)) { el.focus({ preventScroll: true }); if (range) try { el.setSelectionRange(range[0], range[1]); } catch (e) { /* 日期欄位不支援 */ } } }
    window.scrollTo(0, y);
  }
  function flush() { if (pending && !busy()) render(true); }
  // 內建網站：每個模組一個 iframe，開過就留著（切回來時保留原本的進度與捲動位置）
  const apphost = document.getElementById("apphost");
  const setNavH = () => document.documentElement.style.setProperty("--navh", document.querySelector(".navbar").offsetHeight + "px");
  function showApp(m, sub) {
    const frames = [...apphost.querySelectorAll("iframe")];
    frames.forEach(f => { f.hidden = !m || f.dataset.mod !== m.id; });
    if (!m) { apphost.hidden = true; main.hidden = false; return false; }
    let f = frames.find(x => x.dataset.mod === m.id);
    if (!f) {
      f = document.createElement("iframe");
      f.className = "appframe"; f.dataset.mod = m.id; f.title = m.name; f.src = TYPES[m.type].src + (sub ? "#" + sub : "");
      apphost.appendChild(f);
    } else if (sub) {
      try { f.contentWindow.location.hash = sub; } catch (e) { f.src = TYPES[m.type].src + "#" + sub; }
    }
    // 子頁只套用一次：網址改回模組本身，之後重畫不會把使用者在網站裡的位置拉回來，再點同一個連結也有效
    if (sub) history.replaceState(null, "", "#m-" + m.id);
    apphost.hidden = false; main.hidden = true; setNavH();
    return true;
  }
  window.addEventListener("resize", setNavH);
  let rq = null;
  function schedule() { if (rq) return; rq = setTimeout(() => { rq = null; render(false); }, 30); }

  /* ═════════ 動作 ═════════ */
  function newTask(title, target, due, extra) {
    title = String(title || "").trim();
    if (!title) { toast("先寫下要做什麼"); return false; }
    const i = String(target || "").indexOf(":"), k = target.slice(0, i), id = target.slice(i + 1);
    const d = { t: title, st: "todo", due: isDate(due) ? due : "", pri: 0, at: today() };
    if (k === "p") { const p = S.projects[id]; d.proj = id; d.mod = (p && modOfType(p.area, "projectBoard")) || ""; }
    else if (k === "g") { const g = S.goals[id]; d.goal = id; d.mod = g ? g.mod : ""; }
    else d.mod = id;
    Object.assign(d, extra || {});
    return put("tasks", uid("t"), d);
  }
  function setTaskStatus(id, st) {
    const t = S.tasks[id]; if (!t || !TASK_ST[st] || (t.st || "todo") === st) return;
    patch("tasks", id, { st, done: st === "done" ? today() : null });
  }
  function toggleTask(id) { const t = S.tasks[id]; if (t) setTaskStatus(id, t.st === "done" ? "todo" : "done"); }
  const arrOf = (col, id, f) => clone(((S[col][id] || {})[f]) || []);
  function goModOfType(area, type) { const mid = modOfType(area, type); if (mid && location.hash !== "#m-" + mid) location.hash = "#m-" + mid; }
  function startReview(mid) {
    const q = dueWords(mid).sort((a, b) => ((a.due || "") < (b.due || "") ? -1 : 1)).slice(0, 30).map(w => w.id);
    if (!q.length) { toast("目前沒有要複習的單字"); return false; }
    ui.review = { mod: mid, queue: q, i: 0, flip: false, count: 0, again: {} };
    if (location.hash !== "#m-" + mid) location.hash = "#m-" + mid;
  }
  function answer(ok) {
    const R = ui.review; if (!R) return;
    const id = R.queue[R.i], w = S.words[id]; if (!w) return;
    const lv = ok ? Math.min(INTERVALS.length - 1, (w.lv || 0) + 1) : 0;
    patch("words", id, { lv, due: addDays(today(), ok ? INTERVALS[lv] : 1), seen: today() });
    const d = today(); setDay(d, { vc: { [R.mod]: vCount(R.mod, d) + 1 } });
    if (!ok && (R.again[id] || 0) < 2) { R.again[id] = (R.again[id] || 0) + 1; R.queue.push(id); }
    R.count++; R.i++; R.flip = false;
  }
  function doConfirm(key) {
    const i = key.indexOf(":"), kind = key.slice(0, i), id = key.slice(i + 1);
    ui.confirm = null;
    if (kind === "tdel") { del("tasks", id); ui.tedit = null; }
    else if (kind === "pdel") { arr("tasks").filter(t => t.proj === id).forEach(t => patch("tasks", t.id, { proj: null }, true)); del("projects", id); ui.proj = null; }
    else if (kind === "gdel") { arr("tasks").filter(t => t.goal === id).forEach(t => del("tasks", t.id)); del("goals", id); ui.gedit = null; }
    else if (kind === "ndel") { del("notes", id); ui.note = null; }
    else if (kind === "edel") { del("exams", id); ui.exam = null; }
    else if (kind === "moddel") { const c = clone(cfg()); c.mods = c.mods.filter(m => m.id !== id); setCfg(c); }
    else if (kind === "areadel") { const c = clone(cfg()); c.areas = c.areas.filter(a => a.id !== id); setCfg(c); }
  }
  function moveIn(list, idx, d) { const j = idx + d; if (idx < 0 || j < 0 || j >= list.length) return list; const x = list[idx]; list[idx] = list[j]; list[j] = x; return list; }
  async function doExport() {
    const data = { app: "鍾雅婷每日任務", exported: new Date().toISOString(), cfg: cfg() };
    COLS.forEach(c => { data[c] = S[c]; });
    if (wbDb) {
      try { const qs = await wbDb.collection("plan").get(); data.workbench = { plan: {} }; qs.docs.forEach(d => { data.workbench.plan[d.id] = d.data(); }); }
      catch (e) { toast("工作台的資料沒有一起匯出，請稍後再試"); }
    }
    const json = JSON.stringify(data, null, 2);
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: "每日任務備份-" + today() + ".json", data: json }); return; }
      catch (e) { if (e && (e.code === "cancelled" || e.code === "declined" || e.code === "dismissed")) return; }
    }
    ui.exportText = json; render(true);
  }

  async function doImport(file) {
    if (!db) { toast("請先用 Google 登入，再匯入資料"); return; }
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { toast("這個檔案不是正確的 JSON"); return; }
    const daily = data.daily || (data.tasks || data.projects || data.cfg ? data : null), wb = data.workbench;
    if (!daily && !(wb && wb.plan)) { toast("檔案裡沒有可以匯入的資料"); return; }
    const jobs = [];
    if (daily) {
      const c = daily.cfg && (daily.cfg.main || daily.cfg);
      if (c && Array.isArray(c.areas) && Array.isArray(c.mods)) jobs.push(() => db.doc("cfg/main").set(c));
      COLS.forEach(col => Object.keys(daily[col] || {}).forEach(id => jobs.push(() => db.collection(col).doc(id).set(daily[col][id]))));
    }
    if (wb && wb.plan) {
      const w = await DT.dbFor("workbench");
      if (w) Object.keys(wb.plan).forEach(id => jobs.push(() => w.collection("plan").doc(id).set(wb.plan[id])));
    }
    setStatus("wait", "匯入中… 0 / " + jobs.length);
    let n = 0, bad = 0;
    for (let i = 0; i < jobs.length; i += 20) {
      await Promise.all(jobs.slice(i, i + 20).map(j => j().then(() => n++, () => bad++)));
      setStatus("wait", "匯入中… " + (n + bad) + " / " + jobs.length);

  function editTask(el) {

    else if (k === "pri") patch("tasks", id, { pri: el.checked ? 1 : 0 });
    else if (k === "note") patch("tasks", id, { note: el.value });
    else if (k === "hours") { const n = el.value === "" ? null : Number(el.value); if (n === null || (n >= 0 && n < 10000)) patch("tasks", id, { hours: n }); }
    else if (k === "owner") patch("tasks", id, { owner: el.value.trim() });
    else if (k === "st") setTaskStatus(id, el.value);
    else if (k === "proj") {
      if (el.value) patch("tasks", id, { proj: el.value });

  document.addEventListener("click", e => {

    if (!el || el.disabled || ["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) return;
    const fn = CLICK[el.dataset.act]; if (!fn) return;

    if (fn(el) !== false) render(true);
  });
  document.addEventListener("change", e => {
    const el = e.target, fn = el.dataset && CHANGE[el.dataset.act]; if (!fn) return;
    fn(el);
    if (el.type === "checkbox" || el.tagName === "SELECT") render(true);
  });
  document.addEventListener("input", e => {
    const el = e.target, a = el.dataset && el.dataset.act;
    if (a === "nq") { ui.nq = el.value; render(true); }
    else if (a === "wq") { ui.wq = el.value; render(true); }
    else if (a === "nbody") {
      const pv = document.getElementById("ne-preview"); if (pv) pv.innerHTML = mdRender(el.value);
      clearTimeout(noteTimer); noteTimer = setTimeout(saveNoteBody, 1200);
    }
  });
  document.addEventListener("keydown", e => {
    const el = e.target;
    if (e.key === "Enter" && el.dataset && el.dataset.enter && !e.isComposing) {
      const box = el.closest("[data-form]"), btn = box && box.querySelector('[data-act="' + el.dataset.enter + '"]');
      if (btn) { e.preventDefault(); btn.click(); }
      return;
    }
    if (e.key === "Escape" && (ui.confirm || ui.tedit)) { ui.confirm = null; ui.tedit = null; render(true); return; }
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName);
    if (ui.review && !typing && route().v === "mod" && route().id === ui.review.mod) {
      if ((e.key === " " || e.key === "Enter") && !ui.review.flip) { e.preventDefault(); ui.review.flip = true; render(true); }
      else if (ui.review.flip && (e.key === "1" || e.key === "2")) { e.preventDefault(); answer(e.key === "2"); render(true); }
    }
  });
  document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
  const up = () => { pointerDown = false; setTimeout(flush, 0); };
  document.addEventListener("pointerup", up, true);
  document.addEventListener("pointercancel", up, true);
  main.addEventListener("focusout", () => setTimeout(flush, 0));
  document.addEventListener("dragstart", e => {
    const c = e.target.closest && e.target.closest("[data-drag]"); if (!c) return;
    dragId = c.dataset.drag; pointerDown = false;
    try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (err) { /* 部分瀏覽器限制 */ }
    c.classList.add("dragging");
  });
  document.addEventListener("dragover", e => {
    if (!dragId) return;
    const col = e.target.closest && e.target.closest("[data-drop]"); if (!col) return;
    e.preventDefault();
    document.querySelectorAll(".col.over").forEach(x => { if (x !== col) x.classList.remove("over"); });
    col.classList.add("over");
  });
  document.addEventListener("drop", e => {
    if (!dragId) return;
    const col = e.target.closest && e.target.closest("[data-drop]"); if (!col) return;
    e.preventDefault();
    const id = dragId; dragId = null;
    setTaskStatus(id, col.dataset.drop); render(true);
  });

    if (!live && confirmed.size >= COLS.length + 1) { live = true; clearTimeout(loadTimer); setStatus(canWrite ? "live" : "warn", canWrite ? "已同步" : "唯讀檢視"); }
  }
  function subErr(err) {
    const code = err && err.code;
    setStatus(code === "revoked" ? "off" : "warn", code === "revoked" ? "已經無法讀取資料" : "同步中斷，重新整理頁面可以恢復");
  }
  let loadTimer = null;
  function renderAcct(u) {
    const el = document.getElementById("acct"); if (!el) return;
    el.innerHTML = u ? '<span class="who">' + esc(u.displayName || "已登入") + '</span><button class="btn ghost sm" data-act="signout">登出</button>'
      : '<button class="btn primary sm" data-act="signin">用 Google 登入</button>';
  }
  // 工作台整份讀進來（事項可能被延後到別的月份，所以不能只讀當月那一份）
  let wbUnsub = null;
  function wbSubscribe() {
    if (!wbDb || wbUnsub) return;
    wbUnsub = wbDb.collection("plan").onSnapshot(qs => {
      const m = {}; qs.docs.forEach(x => { m[x.id] = x.data(); });
      S.wbDocs = m; schedule();
    }, () => schedule());
  }
  window.addEventListener("message", e => {
    if (e.origin !== location.origin || !e.data || !e.data.dt) return;
    if (e.data.dt === "nav") {
      const m = cfg().mods.find(x => x.type === e.data.type && !x.hidden) || cfg().mods.find(x => x.type === e.data.type);
      if (m) location.hash = "#m-" + m.id; else toast("平台裡沒有這個模組，可以到「擴充」加回來");
    } else if (e.data.dt === "changed") schedule();
  });
  window.addEventListener("storage", () => schedule());
  async function boot() {
    if (window.DT) DT.user().then(renderAcct, () => renderAcct(null));
    render(true);
    loadTimer = setTimeout(() => { if (!live) setStatus("warn", db ? "資料暫時連不上，畫面可能不是最新" : "沒有連上資料庫"); }, 10000);
    let d = null;
    try { d = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null; } catch (e) { d = null; }
    if (!d) { clearTimeout(loadTimer); signedOut = true; setStatus("off", "還沒登入：修改只會留在這個畫面"); render(false); return; }
    db = d;
    try { const u = await window.claude.use("user"); if (u) { const can = await u.can("data.write"); if (can === false) canWrite = false; } } catch (e) { /* 沒有回答就照常 */ }
    COLS.forEach(c => {
      db.collection(c).onSnapshot(snap => {
        const m = {};
        snap.docs.forEach(x => { m[x.id] = x.data(); known.add(c + "/" + x.id); });
        S[c] = m; noteSnap(c, snap.metadata); schedule();
      }, subErr);
    });
    db.doc("cfg/main").onSnapshot(snap => {
      S.cfg = snap.exists ? snap.data() : null;
      if (snap.exists) known.add("cfg/main");
      noteSnap("cfg", snap.metadata); schedule();
    }, subErr);
    try { wbDb = window.DT ? await DT.dbFor("workbench") : null; } catch (e) { wbDb = null; }
    wbSubscribe(); schedule();
  }
  boot();
})();
</script>
